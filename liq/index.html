<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquidación Minecore</title>
<style>
  body{margin:0;background:#0b1219;color:#e8eef5;font:15px/1.35 system-ui,sans-serif}
  main{max-width:760px;margin:0 auto;padding:12px}
  h1{font-size:20px;margin:0 0 4px}
  .mut{color:#8fa3b8;font-size:12.5px}
  .card{background:#121c28;border:1px solid #243446;border-radius:12px;padding:10px 12px;margin:8px 0}
  .old{color:#8fa3b8;text-decoration:line-through}
  .off{color:#b6f0c4;font-weight:700;font-size:12px}
  button,input{font:inherit}
  button{background:#e6f000;color:#111;border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
  button.sec{background:#1c2a3a;color:#e8eef5}
  button.cat{display:flex;width:100%;align-items:center;gap:8px;background:transparent;color:inherit;text-align:left;padding:2px 0;border-radius:0}
  button.cat b{flex:1;min-width:0}
  .cat .sum{flex:none;text-align:right;font-size:13px}
  .row{display:flex;flex-wrap:nowrap;gap:8px;align-items:flex-start;width:100%;background:transparent;color:inherit;border:0;border-top:1px solid #243446;text-align:left;padding:4px 0;cursor:pointer}
  .phs{width:40px;height:40px;border-radius:6px;background:#fff;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#8fa3b8;font-size:10px}
  .phs img{width:100%;height:100%;object-fit:contain;background:#fff}
  .who{flex:1 1 calc(100% - 70px);min-width:0}
  .who .meta{display:block;margin-top:1px;font-size:11px;color:#8fa3b8}
  .nm,.sname{font-size:13px;font-weight:700;line-height:1.3;display:block;white-space:normal;overflow:visible;text-overflow:clip;-webkit-line-clamp:unset;line-clamp:none;word-break:normal;overflow-wrap:break-word}
  .pxside{display:block;width:100%;min-width:0;margin-top:2px}
  .pxrow{display:flex;flex-wrap:nowrap;align-items:flex-start;justify-content:space-between;gap:8px;width:100%}
  .pxleft{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0;flex:1 1 auto}
  .pxright{flex:none;margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
  .pxside .pvp{font-size:11px;color:#8fa3b8;white-space:nowrap}
  .pxside .off,.sact .off{white-space:nowrap;font-size:12px}
  .pxside .now{font-size:15px;font-weight:800;line-height:1;margin:0;white-space:nowrap}
  .pxside .lin{font-size:11px;line-height:1.15;color:#c5d4e4;white-space:nowrap;text-align:right}
  .pxside .lin .sec{padding:3px 8px;font-size:11px;border-radius:8px;margin:0;white-space:nowrap}
  .pxrow .qty button,.sact .qty button{width:22px;height:22px}
  .sline{display:flex;flex-direction:column;gap:2px;border-top:1px solid #243446;padding:6px 0}
  .shead{display:flex;gap:8px;align-items:flex-start}
  .sbody{flex:1;min-width:0}
  .smeta{font-size:11px;color:#8fa3b8;margin-top:1px}
  .sact{justify-content:space-between;gap:2px;font-size:11px}
  .sact .lab{color:#8fa3b8;white-space:nowrap}
  .sact b{white-space:nowrap}
  .qty input,.pxrow .qty input,.sact .qty input{box-sizing:content-box;width:4.2ch;min-width:4.2ch;height:28px;padding:0 6px;text-align:center;font-size:16px;line-height:28px;-moz-appearance:textfield;appearance:textfield}
  .qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button,.pxrow .qty input::-webkit-outer-spin-button,.pxrow .qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;display:none}
  .sact .sec{padding:3px 5px;font-size:11px;border-radius:8px;margin:0;white-space:nowrap}
  .skv{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;font-size:12.5px}
  .skv span:first-child{color:#8fa3b8}
  .stot{border-top:1px solid #243446;margin-top:8px;padding-top:8px}
  .stot div{display:flex;justify-content:space-between;gap:12px;margin-top:4px}
  .stot .grand{font-size:16px;font-weight:800;margin-top:8px}
  .contado{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:8px;border:1px solid #3d5166;border-radius:10px;font-size:13px;line-height:1.35}
  .contado input{width:18px;height:18px;margin:2px 0 0;flex:none}
  .contado b{display:block}
  .catbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .catbar .cat{flex:1;min-width:0}
  .addcat,.topadd .addcat,.foot .addcat{display:block;width:100%;box-sizing:border-box;background:#e6f000;color:#111;border:0;border-radius:8px;padding:8px 10px;font-weight:700;font-size:13px;cursor:pointer;margin-top:6px}
  #liq-cart{position:fixed;right:16px;bottom:16px;z-index:60;width:56px;height:56px;border-radius:50%;background:#e6f000;color:#14200c;border:0;box-shadow:0 8px 20px rgba(0,0,0,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  #liq-cart .n{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#14200c;color:#e6f000;font-size:11px;font-weight:800;line-height:20px}
  .okb{border-color:#3d6b4a;background:#12261a;color:#d9ffe4}
  .addcat.on{background:#1c2a3a;color:#e6f000}
  .sub{margin:2px 0 2px 10px;padding-left:8px;border-left:2px solid #243446}
  .nums{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin:8px 0}
  .sheet{position:fixed;inset:0;z-index:80;background:rgba(2,6,12,.72);display:flex;align-items:flex-end;justify-content:center}
  .sheet .box{background:#121c28;color:#e8eef5;width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:12px 14px 22px;box-sizing:border-box}
  .sheet .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .sheet .bar button{background:#1c2a3a;color:#e8eef5}
  .phb{width:100%;aspect-ratio:1/1;max-height:72vw;border-radius:12px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#8fa3b8}
  .phb img{width:100%;height:100%;object-fit:contain;background:#fff}
  .sheet h2{font-size:16px;line-height:1.3;margin:10px 0 4px}
  .buy{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
  @media(min-width:700px){.row{gap:8px}.who{flex:1 1 0}.nm{font-size:14px}.phs{width:44px;height:44px}.sheet{align-items:center}.sheet .box{border-radius:16px;max-height:90vh}.phb{max-height:420px}}
  @media(min-width:900px){#liq-sel.sheet{align-items:stretch;justify-content:flex-end;background:rgba(2,6,12,.45)}#liq-sel .box{width:min(440px,100%);max-width:440px;height:100%;max-height:100%;border-radius:0}}
  .qty{display:flex;align-items:center;gap:4px}
  .qty button{width:26px;height:26px;padding:0;border-radius:6px;background:#1c2a3a;color:#fff}
  .qty button:disabled{opacity:.35;cursor:default}
  .qty input{background:#0b1219;color:#fff;border:1px solid #2a3d52;border-radius:6px}
  #liq-volver{position:fixed;top:8px;left:12px;z-index:70;min-height:44px;padding:0 14px;border-radius:10px;background:#16202c;color:#e8eef6;border:1px solid #3d5166;font-weight:800}
  body{padding-top:52px;padding-bottom:88px}
  .foot{border-top:1px solid #243446;margin-top:8px;padding-top:8px;font-size:13px}
  .err{color:#ff8a8a}
  input.nom{width:100%;box-sizing:border-box;background:#0b1219;color:#fff;border:1px solid #2a3d52;border-radius:8px;padding:10px 8px;font-size:16px}
  .nomlab{display:block;margin:8px 0;font-size:12px;color:#8fa3b8}
  .seg{display:flex;gap:4px;background:#0b1219;border:1px solid #243446;border-radius:12px;padding:3px;margin:8px 0}
  .seg button{flex:1;min-width:0;background:transparent;color:#9fb0c3;border-radius:9px;padding:8px 6px;font-size:12px;font-weight:700;line-height:1.25;white-space:normal}
  .seg button.on{background:#e6f000;color:#14200c}
  .recmark{display:inline-block;margin-left:6px;background:#e6f000;color:#14200c;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px;vertical-align:1px}
</style>
</head>
<body>
<button type="button" id="liq-volver">← Volver</button>
<main>
  <h1>Liquidación Minecore</h1>
  <div id="app" class="mut">Cargando…</div>
</main>
<script>
var URL='https://bklbvwpkrdaojbezljsd.supabase.co/functions/v1/liq-pub';
var T=(location.search.match(/[?&]t=([^&]+)/)||[])[1]||'';
var TODOS=false, DATA=null, QT={}, OPEN={};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function money(n){n=Number(n)||0;try{return n.toLocaleString('es-EC',{style:'currency',currency:'USD'});}catch(e){return '$'+n.toFixed(2);}}
function r2(n){return Math.round((Number(n)||0)*100)/100;}
function post(b){b.t=T;return fetch(URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json();});}
function thumb(u){if(!u)return '';var k=String(u).split('?')[0].split('/').pop().replace(/\.[a-z0-9]+$/i,'').replace(/-(large|small|medium)$/i,'');return k?'https://bklbvwpkrdaojbezljsd.supabase.co/storage/v1/object/public/fotos/th160/'+k:u;}
function liqDe(it){var q=Number(it.precio_liq);if(q>0)return q;return Number(it.precio)||0;}
function listaDe(it){return Number(it.precio_lista||it.lista)||0;}
function offDe(it){if(it.origen==='historial')return '−25%';if(it.origen==='liquidacion')return '−30%';var L=listaDe(it),q=liqDe(it);if(!(L>q&&q>0))return '';var d=Math.round((1-q/L)*100);return d===25||d===30?'−'+d+'%':'−'+d+'%';}
function descDe(it,qty,full){var stock=Number(it&&it.stock)||0;return (offDe(it)||'')+(full?' −15%':(qty>=stock&&stock>0?' −5%':''));}
function ivaPct(){return 15;}
function ivaMonto(st){var x=(Number(st)||0)*ivaPct(),a=Number(Math.abs(x).toPrecision(15)),r=Math.floor(a+0.5);return r2((x<0?-r:r)/100);}
function llena(lineas){return !!(lineas&&lineas.length&&lineas.every(function(x){return (QT[x.sku]||0)>=Number(x.stock)&&Number(x.stock)>0;}));}
function unit(it,qty,full){var base=liqDe(it),stock=Number(it.stock),f=full?0.85:(qty>=stock&&stock>0?0.95:1);return r2(base*f);}
function totLista(xs){return r2(xs.reduce(function(a,x){return a+Number(x.stock)*listaDe(x);},0));}
function totCat(xs){return r2(xs.reduce(function(a,x){return a+Number(x.stock)*r2(liqDe(x)*0.85);},0));}
function foto(it,big){
  var cls=big?'phb':'phs';
  if(!it||!it.foto)return '<div class="'+cls+'">Sin foto</div>';
  return '<div class="'+cls+'"><img loading="lazy" decoding="async" alt="" src="'+esc(thumb(it.foto))+'" data-full="'+esc(it.foto)+'" style="opacity:0" onload="this.style.opacity=1" onerror="if(!this.dataset.f){this.dataset.f=\'1\';this.src=this.getAttribute(\'data-full\');}else{var b=this.parentNode;if(b)b.textContent=\'Sin foto\';this.remove();}"></div>';
}
function tamDe(x){
  var s=((x.categoria||'')+' '+(x.nombre||'')).toUpperCase();
  if(/HOVER|HO\s+OVER/.test(s))return 'HO oversize';
  if(/NOVER|NO\s+OVER/.test(s))return 'NO oversize';
  if(/POVER|PO\s+OVER/.test(s))return 'PO oversize';
  if(/HTW3/.test(s))return 'HTW3';
  if(/HTW/.test(s))return 'HTW';
  if(/HWT/.test(s))return 'HWT';
  if(/IEW/.test(s))return 'IEW';
  if(/NTW/.test(s))return 'NTW';
  if(/HO3/.test(s))return 'HO3';
  if(/NO3/.test(s))return 'NO3';
  if(/PO3/.test(s))return 'PO3';
  if(/\bHO\b|\bHQ\b/.test(s))return 'Brocas HQ';
  if(/\bNO\b|\bNQ\b/.test(s))return 'NQ';
  if(/\bPO\b|\bPQ\b/.test(s))return 'PQ';
  if(/\bBO\b|\bBQ\b/.test(s))return 'BQ';
  return 'Otras';
}
function arbol(items){
  var root={hijos:{},items:[]};
  (items||[]).forEach(function(it){
    if(!it||!it.sku)return;
    var rama=(it.rama&&it.rama.length)?it.rama:[{id:it.categoria||it.sku,name:it.categoria||'Otros'}];
    var n=root;
    rama.forEach(function(c){
      var id=String(c.id||c.name||'');
      if(!n.hijos[id])n.hijos[id]={id:id,nombre:c.name||'Otros',hijos:{},items:[]};
      n=n.hijos[id];
    });
    n.items.push(it);
  });
  function contar(n){var c=n.items.length;Object.keys(n.hijos).forEach(function(k){c+=contar(n.hijos[k]);});n.n=c;return c;}
  function hijos(n){return Object.keys(n.hijos).map(function(k){return n.hijos[k];}).filter(function(h){return h.n>0;}).sort(function(a,b){return a.nombre.localeCompare(b.nombre,'es',{numeric:true});});}
  function nodo(n){var hs=hijos(n);return {key:n.id,nombre:n.nombre,n:n.n,lineas:n.items||[],hijos:hs.length?hs.map(nodo):null};}
  contar(root);
  return hijos(root).map(nodo);
}
var GRUPO={};
function descBits(it,qty,full){
  var base=offDe(it)||'', stock=Number(it&&it.stock)||0, extra=full?'−15%':(qty>=stock&&stock>0?'−5%':'');
  return base+(extra?' ('+extra+')':'');
}
function pxLinea(it){
  var full=fullDe(it.sku), qty=QT[it.sku]||0, stock=Number(it.stock)||0, u=unit(it,qty,full);
  var lin=qty>0?'<span class="lin">'+esc(qty)+' × '+money(u)+' = '+money(r2(qty*u))+'</span>':'';
  return '<span class="pxside"><span class="pxrow"><span class="pxleft"><span class="pvp">PVP <span class="old">'+money(listaDe(it))+'</span></span><span class="off">'+esc(descBits(it,qty,full))+'</span><b class="now">'+money(u)+'</b></span>'+
    '<span class="pxright"><span class="qty"><button type="button" data-step="-1" data-sku="'+esc(it.sku)+'" data-max="'+stock+'"'+(qty<=0?' disabled':'')+'>−</button><input data-sku="'+esc(it.sku)+'" type="number" inputmode="numeric" min="0" max="'+stock+'" step="1" value="'+(qty?qty:'')+'" aria-label="Cantidad"><button type="button" data-step="1" data-sku="'+esc(it.sku)+'" data-max="'+stock+'"'+(qty>=stock?' disabled':'')+'>+</button></span>'+lin+'</span></span></span>';
}
var F={nombre:'',email:'',tel:'',empresa:''}, ENVIANDO=false, HECHO=null, CONTADO=false;
function pctContado(){var p=Number(DATA&&DATA.contado_pct);return p>0&&p<=30?p:5;}
function subContado(S){var f=1-pctContado()/100,t=0;S.lines.forEach(function(L){t+=r2(L.q*r2(L.u*f));});return r2(t);}
function tokenSesion(){
  try{var s=JSON.parse(sessionStorage.getItem('mc_sbt')||'null'), u=localStorage.getItem('mc_user_name')||''; if(s&&s.t&&s.u===u&&s.exp>Date.now()/1000+20)return s.t;}catch(e){}
  return '';
}
function nombreSesion(){
  if(!tokenSesion())return '';
  try{
    var u=localStorage.getItem('mc_user_name')||'';
    var map=JSON.parse(localStorage.getItem('mc_nombres')||'{}');
    if(map&&map[u])return String(map[u]).trim();
    var p=JSON.parse(localStorage.getItem('mc_profile')||'null');
    return String(p&&(p.nombreCompleto||p.nombre_completo)||'').trim();
  }catch(e){return '';}
}
function idemClave(){
  try{
    var k=sessionStorage.getItem('liq_idem')||'';
    if(!/^[A-Za-z0-9]{16,40}$/.test(k)){k=(Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)+Date.now().toString(36)).replace(/[^a-z0-9]/gi,'').slice(0,32); sessionStorage.setItem('liq_idem',k);}
    return k+(CONTADO?'c':'n');
  }catch(e){return '';}
}
function leerForm(){
  function v(id){var e=document.getElementById(id);return e?e.value:null;}
  if(document.getElementById('f-nom')){F.nombre=v('f-nom');F.email=v('f-mail');F.tel=v('f-tel');F.empresa=v('f-emp');}
}
function formulario(){
  if(nombreSesion())return '';
  function lab(id,label,type,val,req,ac){return '<label class="nomlab">'+label+(req?'':' (opcional)')+'<input class="nom" id="'+id+'" type="'+type+'" maxlength="160" '+(req?'required ':'')+'autocomplete="'+ac+'" value="'+esc(val||'')+'"></label>';}
  return lab('f-nom','Nombre','text',F.nombre,true,'name')+lab('f-mail','Email','email',F.email,true,'email')+lab('f-tel','Teléfono','tel',F.tel,false,'tel')+lab('f-emp','Empresa','text',F.empresa,false,'organization');
}
function nombreValido(n,cli){
  n=String(n||'').trim();
  if(n.length<2||!/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/.test(n))return false;
  if(cli&&n.toLowerCase()===String(cli).trim().toLowerCase())return false;
  return true;
}
function emailValido(s){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s||'').trim());}
function telValido(s){s=String(s||'').trim();return !s||/^[0-9+().\s-]{6,40}$/.test(s);}
function fila(it){
  var marca=(TODOS&&it.recomendado)?'<span class="recmark">Recomendado</span>':'';
  return '<div class="row" role="button" tabindex="0" data-open="'+esc(it.sku)+'">'+foto(it)+
    '<span class="who"><span class="nm">'+esc(it.nombre||it.sku)+marca+'</span><span class="meta">'+esc(it.sku||'')+' · Disponibles: '+esc(Number(it.stock)||0)+'</span>'+pxLinea(it)+'</span></div>';
}
function fullDe(sku){var L=GRUPO[sku];return L?llena(L):false;}
var DET=null;
function buscar(sku){
  var xs=(DATA&&DATA._todos&&DATA._todos.items)||(DATA&&DATA.items)||[];
  var hit=xs.filter(function(x){return x.sku===sku;})[0];
  if(hit)return hit;
  var ps=(DATA&&DATA.paquetes)||[];
  for(var i=0;i<ps.length;i++){var L=ps[i].lineas||[];for(var j=0;j<L.length;j++)if(L[j].sku===sku)return L[j];}
  return null;
}
function cerrarDet(desdePop){
  DET=null;
  var s=document.getElementById('liq-sheet');if(s)s.remove();
  if(!desdePop&&history.state&&history.state.liq){try{history.back();}catch(e){}}
}
function abrirDet(it,full){
  if(!it)return;
  var y=window.scrollY;
  if(!DET){try{history.pushState({liq:1},'');}catch(e){}}
  if(full==null)full=fullDe(it.sku);
  DET={sku:it.sku,full:!!full};
  var qty=QT[it.sku]||0,u=unit(it,qty,full),extra=full?' −15%':(qty>=Number(it.stock)&&Number(it.stock)>0?' −5%':'');
  var old=document.getElementById('liq-sheet');if(old)old.remove();
  var s=document.createElement('div');s.id='liq-sheet';s.className='sheet';
  s.innerHTML='<div class="box" role="dialog" aria-modal="true"><div class="bar"><button type="button" id="liq-back">← Volver</button><button type="button" id="liq-x" aria-label="Cerrar">✕</button></div>'+
    foto(it,true)+'<h2>'+esc(it.nombre||it.sku)+'</h2><div class="mut">'+esc(it.sku||'')+(it.categoria?' · '+esc(it.categoria):'')+'</div><div class="mut">Disponible '+esc(it.stock)+'</div>'+
    '<div class="nums"><span class="off">'+esc(offDe(it))+(extra?' '+extra:'')+'</span><span class="old">'+money(listaDe(it))+'</span><b>'+money(u)+'</b></div>'+
    '<div class="buy"><div class="qty"><button type="button" data-step="-1" data-sku="'+esc(it.sku)+'" data-max="'+esc(it.stock)+'">−</button><input data-sku="'+esc(it.sku)+'" type="number" inputmode="numeric" min="0" max="'+esc(it.stock)+'" step="1" value="'+(qty?qty:'')+'" aria-label="Cantidad"><button type="button" data-step="1" data-sku="'+esc(it.sku)+'" data-max="'+esc(it.stock)+'">+</button></div>'+
    '<button type="button" id="liq-add">Agregar</button></div></div>';
  document.body.appendChild(s);
  s.addEventListener('click',function(e){if(e.target===s)cerrarDet(false);});
  document.getElementById('liq-back').onclick=function(){cerrarDet(false);};
  document.getElementById('liq-x').onclick=function(){cerrarDet(false);};
  document.getElementById('liq-add').onclick=function(){cerrarDet(false);};
  [].forEach.call(s.querySelectorAll('[data-step]'),function(b){b.onclick=function(){var sku=b.getAttribute('data-sku'),max=Number(b.getAttribute('data-max'))||0;QT[sku]=Math.max(0,Math.min(max,(QT[sku]||0)+Number(b.getAttribute('data-step'))));abrirDet(buscar(sku)||it,full);};});

  window.scrollTo(0,y);
}
function cadaLinea(fn){var seen={};function add(x){if(!x||!x.sku||seen[x.sku])return;seen[x.sku]=1;fn(x);}(DATA&&DATA.paquetes||[]).forEach(function(p){(p.lineas||[]).forEach(add);});(DATA&&DATA.items||[]).forEach(add);}
function seleccion(){var lines=[],tot=0;cadaLinea(function(it){var q=QT[it.sku]||0;if(q<=0)return;var full=fullDe(it.sku),u=unit(it,q,full),sub=r2(q*u);tot+=sub;lines.push({it:it,q:q,u:u,full:full,sub:sub});});return {n:lines.length,tot:r2(tot),lines:lines};}
function lugarBurbuja(){var b=document.getElementById('liq-cart');if(!b)return;var vv=window.visualViewport,kb=0;if(vv)kb=Math.max(0,window.innerHeight-(vv.height+vv.offsetTop));b.style.bottom=(kb>60?kb+12:16)+'px';}
var SEL=false;

function abrirSel(){leerForm();var S=seleccion();if(!S.n){cerrarSel(true);return;}var y=window.scrollY;if(!SEL){try{history.pushState({liqSel:1},'');}catch(e){}}SEL=true;var old=document.getElementById('liq-sel');if(old)old.remove();var s=document.createElement('div');s.id='liq-sel';s.className='sheet';s.style.zIndex='9000';
  var pct=pctContado(), subC=subContado(S), ahorro=r2(S.tot-subC), base=CONTADO?subC:S.tot, iva=ivaMonto(base), tot=r2(base+iva);
  s.innerHTML='<div class="box" role="dialog" aria-modal="true"><div class="bar"><button type="button" id="sel-back">← Volver</button><button type="button" id="sel-x" aria-label="Cerrar">✕</button></div><h2>Tu selección</h2>'+
    S.lines.map(function(L){var stock=Number(L.it.stock)||0;return '<div class="row">'+foto(L.it)+'<span class="who"><span class="nm">'+esc(L.it.nombre||L.it.sku)+'</span><span class="meta">'+esc(L.it.sku)+' · Disponibles: '+esc(stock)+'</span><span class="pxside"><span class="pxrow"><span class="pxleft"><span class="pvp">PVP <span class="old">'+money(listaDe(L.it))+'</span></span><span class="off">'+esc(descBits(L.it,L.q,L.full))+'</span><b class="now">'+money(L.u)+'</b></span><span class="pxright"><span class="qty"><button type="button" data-sel="-1" data-sku="'+esc(L.it.sku)+'" data-max="'+stock+'"'+(L.q<=0?' disabled':'')+'>−</button><input data-selq="'+esc(L.it.sku)+'" type="number" inputmode="numeric" min="0" max="'+stock+'" value="'+L.q+'" aria-label="Cantidad"><button type="button" data-sel="1" data-sku="'+esc(L.it.sku)+'" data-max="'+stock+'"'+(L.q>=stock?' disabled':'')+'>+</button></span><span class="lin">'+esc(L.q)+' × '+money(L.u)+' = '+money(L.sub)+'</span><button type="button" class="sec" data-quitar="'+esc(L.it.sku)+'">Quitar</button></span></span></span></span></div>';}).join('')+
    '<div class="stot"><div><span>Subtotal</span><b>'+money(S.tot)+'</b></div>'+(CONTADO?'<div><span>Pago de contado −'+pct+'%</span><b>−'+money(ahorro)+'</b></div>':'')+'<div><span>IVA '+ivaPct()+'%</span><b>'+money(iva)+'</b></div><label class="contado"><input type="checkbox" id="liq-contado"'+(CONTADO?' checked':'')+'><span><b>Pago de contado</b>Si tu pago es de contado, obtienes un beneficio extra: '+pct+'% de descuento adicional. Te ahorras '+money(ahorro)+'. Nuevo total '+money(r2(subC+ivaMonto(subC)))+'.</span></label><div class="grand"><span>'+(CONTADO?'Nuevo total':'Total')+'</span><b>'+money(tot)+'</b></div>'+formulario()+'<p><button type="button" id="sel-enviar"'+(ENVIANDO?' disabled':'')+'>'+(ENVIANDO?'Enviando…':'Enviar cotización')+'</button></p><div id="sel-msg" class="mut err"></div></div></div>';
  document.body.appendChild(s);
  s.addEventListener('click',function(e){if(e.target===s)cerrarSel(false);});
  document.getElementById('sel-back').onclick=function(){cerrarSel(false);};
  document.getElementById('sel-x').onclick=function(){cerrarSel(false);};
  ['f-nom','f-mail','f-tel','f-emp'].forEach(function(id){var el=document.getElementById(id);if(el)el.oninput=leerForm;});
  var ck=document.getElementById('liq-contado'); if(ck) ck.onchange=function(){CONTADO=ck.checked;abrirSel();};
  var env=document.getElementById('sel-enviar'); if(env) env.onclick=function(){if(window._liqEnviar) window._liqEnviar();};
  [].forEach.call(s.querySelectorAll('[data-sel]'),function(b){b.onclick=function(){var sku=b.getAttribute('data-sku'),max=Number(b.getAttribute('data-max'))||0;QT[sku]=Math.max(0,Math.min(max,(QT[sku]||0)+Number(b.getAttribute('data-sel'))));pintar();abrirSel();};});
  [].forEach.call(s.querySelectorAll('[data-selq]'),function(el){el.oninput=function(){var sku=el.getAttribute('data-selq'),max=Number(el.max)||0;QT[sku]=Math.max(0,Math.min(max,parseFloat(el.value)||0));pintar();abrirSel();var f=document.querySelector('[data-selq="'+sku+'"]');if(f)f.focus();};});
  [].forEach.call(s.querySelectorAll('[data-quitar]'),function(b){b.onclick=function(){QT[b.getAttribute('data-quitar')]=0;pintar();abrirSel();};});
  window.scrollTo(0,y);

function syncSel(){var S=seleccion(),b=document.getElementById('liq-cart');if(!S.n){if(b)b.remove();if(SEL&&!ENVIANDO)cerrarSel(true);return;}if(!b){b=document.createElement('button');b.id='liq-cart';b.type='button';b.setAttribute('aria-label','Ver selección');b.onclick=function(){abrirSel();};document.body.appendChild(b);}b.innerHTML='<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M7 18a2 2 0 1 0 .001 4.001A2 2 0 0 0 7 18zm10 0a2 2 0 1 0 .001 4.001A2 2 0 0 0 17 18zM6.2 6l.8 2H20l-1.5 6.5H8.2L6.2 6zM5.1 4H2V2h3.4l.7 2H22l-2.2 9H8.3l-.5 2H20v2H7.1l.7-3 .6-2.4L6.3 4z"/></svg><span class="n">'+S.n+'</span>';lugarBurbuja();}
if(window.visualViewport){visualViewport.addEventListener('resize',lugarBurbuja);visualViewport.addEventListener('scroll',lugarBurbuja);}
function volverLiq(){if(document.getElementById('liq-sel')){cerrarSel(false);return;}if(document.getElementById('liq-sheet')){cerrarDet(false);return;}if(history.length>1){history.back();return;}location.replace('https://portal.minecore.ec/');}

if(history.length<=1){try{history.replaceState({liqRoot:1},'');history.pushState({liqHere:1},'');}catch(e){}}
window.addEventListener('popstate',function(){if(document.getElementById('liq-sel')){cerrarSel(true);return;}if(document.getElementById('liq-sheet')){cerrarDet(true);return;}if(history.state&&history.state.liqRoot)location.replace('https://portal.minecore.ec/');});
function pintar(){
  leerForm();
  var app=document.getElementById('app');
  if(!DATA||DATA.ok===false){app.innerHTML='<div class="card err">'+(DATA&&DATA.error||'Enlace no válido.')+'</div>';return;}
  var items=DATA.items||[], cli=DATA.cliente&&DATA.cliente.nombre||'';
  var catalogo=(DATA._todos&&DATA._todos.items)||items;
  var h=(HECHO?'<div class="card okb"><b>Cotización enviada ✓ — Ya te responderemos</b>'+(HECHO.num?'<div>'+esc(HECHO.num)+'</div>':'')+'</div>':'')+'<div class="mut">'+(cli?esc(cli)+' · ':'')+'hasta '+esc(String(DATA.expira||'').slice(0,10))+'</div>';
  h+='<div class="seg" role="tablist"><button type="button" id="seg-rec" class="'+(TODOS?'':'on')+'" aria-pressed="'+(TODOS?'false':'true')+'">Recomendado para '+(cli?esc(cli):'ti')+'</button><button type="button" id="seg-all" class="'+(TODOS?'on':'')+'" aria-pressed="'+(TODOS?'true':'false')+'">Todos en liquidación</button></div>';
  h+='<div class="card">'+esc(DATA.instruccion||'')+'</div>';
  if(!TODOS) h+='<div class="card" id="liq-sug">Se sugieren productos según sus tendencias de cotizaciones y compras.</div>';
  if(!items.length)h+='<div class="card">Sin productos en liquidación por ahora.</div>';
  var tree=arbol(items), leaves=[];
  GRUPO={};
  function indexar(n){if(n.lineas&&n.lineas.length)n.lineas.forEach(function(x){GRUPO[x.sku]=n.lineas;});(n.hijos||[]).forEach(indexar);}
  tree.forEach(indexar);
  function nodoHtml(p){
    var abierto=!!OPEN[p.key], hs=p.hijos||[], direct=p.lineas||[];
    var head='<button type="button" class="cat" data-ver="'+esc(p.key)+'" aria-expanded="'+(abierto?'true':'false')+'"><span>'+(abierto?'▾':'▸')+'</span><b>'+esc(p.nombre)+' ('+p.n+')</b></button>';
    if(!abierto)return head;
    var inner=hs.map(function(hija){return '<div class="sub">'+nodoHtml(hija)+'</div>';}).join('');
    if(direct.length){
      var i=leaves.push({key:p.key,lineas:direct})-1, on=llena(direct), lista=totLista(direct), cat=totCat(direct);
      var btn='<button type="button" class="addcat'+(on?' on':'')+'" data-paq="'+i+'">'+(on?'Agregada · Quitar':'Agregar categoría completa (−15%)')+'</button>';
      inner+='<div class="topadd">'+btn+'</div>'+direct.map(fila).join('')+
        '<div class="foot">Compra de categoría completa: −15% adicional sobre el precio ya descontado.'+
        '<div class="nums" style="margin:6px 0"><span class="old">'+money(lista)+'</span><b>'+money(cat)+'</b></div>'+btn+'</div>';
    }
    return head+inner;
  }
  h+=tree.map(function(p){return '<div class="card">'+nodoHtml(p)+'</div>';}).join('');
  var y=window.scrollY;
  app.innerHTML=h;
  app._paq=leaves;
  window.scrollTo(0,y);
  document.getElementById('seg-rec').onclick=function(){if(TODOS){TODOS=false;cargar();}};
  document.getElementById('seg-all').onclick=function(){if(!TODOS){TODOS=true;cargar();}};
  [].forEach.call(app.querySelectorAll('[data-ver]'),function(b){b.onclick=function(){var k=b.getAttribute('data-ver');OPEN[k]=!OPEN[k];pintar();};});
  [].forEach.call(app.querySelectorAll('[data-paq]'),function(b){b.onclick=function(ev){ev.stopPropagation();var p=app._paq[+b.getAttribute('data-paq')];if(!p)return;var on=llena(p.lineas||[]);(p.lineas||[]).forEach(function(x){QT[x.sku]=on?0:(Number(x.stock)||0);});pintar();};});
  [].forEach.call(app.querySelectorAll('[data-open]'),function(b){b.onclick=function(ev){if(ev.target.closest&&ev.target.closest('.qty'))return;abrirDet(buscar(b.getAttribute('data-open')));};});
  syncSel();
  [].forEach.call(app.querySelectorAll('.row [data-step]'),function(b){b.onclick=function(ev){ev.stopPropagation();var sku=b.getAttribute('data-sku'),max=Number(b.getAttribute('data-max'))||0;QT[sku]=Math.max(0,Math.min(max,(QT[sku]||0)+Number(b.getAttribute('data-step'))));pintar();};});
  [].forEach.call(app.querySelectorAll('.row input[data-sku]'),function(el){el.onclick=function(ev){ev.stopPropagation();};el.oninput=function(ev){ev.stopPropagation();var sku=el.getAttribute('data-sku'),max=Number(el.max)||0;QT[sku]=Math.max(0,Math.min(max,parseFloat(el.value)||0));pintar();var f=app.querySelector('.row input[data-sku="'+sku+'"]');if(f)f.focus();};});
  function enviarCot(){
    if(ENVIANDO)return;
    leerForm();
    var lineas=[], visto={};
    (catalogo.length?catalogo:items).forEach(function(it){var q=QT[it.sku]||0;if(q>0){visto[it.sku]=1;lineas.push({sku:it.sku,qty:q});}});
    Object.keys(QT).forEach(function(sku){if(!visto[sku]&&QT[sku]>0)lineas.push({sku:sku,qty:QT[sku]});});
    var msg=document.getElementById('sel-msg');
    function falla(t){if(msg)msg.textContent=t;var b=document.getElementById('sel-enviar');if(b){b.disabled=false;b.textContent='Enviar cotización';}}
    if(!lineas.length){falla('Elige al menos un producto.');return;}
    var quien=nombreSesion()||String(F.nombre||'').trim();
    if(!nombreValido(quien,cli)){falla('Escribe tu nombre.');var fn=document.getElementById('f-nom');if(fn)fn.focus();return;}
    if(!nombreSesion()){
      if(!emailValido(F.email)){falla('Escribe un email válido.');var fe=document.getElementById('f-mail');if(fe)fe.focus();return;}
      if(!telValido(F.tel)){falla('Revisa el teléfono.');var ft=document.getElementById('f-tel');if(ft)ft.focus();return;}
    }
    ENVIANDO=true;
    var btn=document.getElementById('sel-enviar'); if(btn){btn.disabled=true;btn.textContent='Enviando…';}
    if(msg)msg.textContent='Enviando…';
    post({op:'enviar',todos:true,lineas:lineas,contacto:quien,empresa:cli,email:nombreSesion()?'':F.email,telefono:nombreSesion()?'':F.tel,visita:nombreSesion()?'':F.empresa,idem:idemClave(),sesion:tokenSesion(),contado:!!CONTADO}).then(function(r){
      ENVIANDO=false;
      if(!(r&&r.ok)){falla((r&&r.error)||'No se pudo enviar.');return;}
      HECHO={num:r.order_number||(r.precot_id?('#'+r.precot_id):'')};
      QT={}; CONTADO=false; F={nombre:'',email:'',tel:'',empresa:''};
      try{sessionStorage.removeItem('liq_idem');}catch(e){}
      cerrarSel(true);
      pintar();
    }).catch(function(){ENVIANDO=false;falla('Sin conexión.');});
  }
  window._liqEnviar=enviarCot;
}
function cargar(){
  document.getElementById('app').textContent='Cargando…';
  post({op:'ver',todos:TODOS}).then(function(r){
    DATA=r;
    if(!TODOS)return post({op:'ver',todos:true}).then(function(t){if(DATA){DATA.paquetes=(t&&t.paquetes)||[];DATA._todos=t;}pintar();});
    pintar();
  }).catch(function(){DATA={ok:false,error:'Sin conexión.'};pintar();});
}
if(!T)document.getElementById('app').textContent='Enlace no válido.';
else cargar();
