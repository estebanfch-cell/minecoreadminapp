<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquidación Minecore</title>
<style>
  body{margin:0;background:#0b1219;color:#e8eef5;font:15px/1.35 system-ui,sans-serif}
  main{max-width:760px;margin:0 auto;padding:12px}
  h1{font-size:20px;margin:0 0 4px}
  .mut{color:#8fa3b8;font-size:12.5px}
  .card{background:#121c28;border:1px solid #243446;border-radius:12px;padding:10px 12px;margin:8px 0}
  .old{color:#8fa3b8;text-decoration:line-through}
  .off{color:#b6f0c4;font-weight:700;font-size:12px}
  button,input{font:inherit}
  button{background:#e6f000;color:#111;border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
  button.sec{background:#1c2a3a;color:#e8eef5}
  button.cat{display:flex;width:100%;align-items:center;gap:8px;background:transparent;color:inherit;text-align:left;padding:2px 0;border-radius:0}
  button.cat b{flex:1;min-width:0}
  .cat .sum{flex:none;text-align:right;font-size:13px}
  .li{display:flex;gap:8px;align-items:center;height:72px;box-sizing:border-box;border-top:1px solid #243446}
  .ph{width:64px;height:64px;border-radius:8px;background:#1c2a3a;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#8fa3b8;font-size:11px}
  .ph img{width:100%;height:100%;object-fit:contain;background:#fff}
  .mid{flex:1;min-width:0}
  .mid b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .nums{display:flex;gap:6px;align-items:baseline;white-space:nowrap}
  .qty{display:flex;align-items:center;gap:4px}
  .qty button{width:26px;height:26px;padding:0;border-radius:6px;background:#1c2a3a;color:#fff}
  .qty input{width:38px;height:26px;padding:0;text-align:center;background:#0b1219;color:#fff;border:1px solid #2a3d52;border-radius:6px}
  .foot{border-top:1px solid #243446;margin-top:8px;padding-top:8px;font-size:13px}
  .err{color:#ff8a8a}
  input.nom{width:100%;box-sizing:border-box;background:#0b1219;color:#fff;border:1px solid #2a3d52;border-radius:8px;padding:8px}
</style>
</head>
<body>
<main>
  <h1>Liquidación Minecore</h1>
  <div id="app" class="mut">Cargando…</div>
</main>
<script>
var URL='https://bklbvwpkrdaojbezljsd.supabase.co/functions/v1/liq-pub';
var T=(location.search.match(/[?&]t=([^&]+)/)||[])[1]||'';
var TODOS=false, DATA=null, QT={}, OPEN={};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function money(n){n=Number(n)||0;try{return n.toLocaleString('es-EC',{style:'currency',currency:'USD'});}catch(e){return '$'+n.toFixed(2);}}
function r2(n){return Math.round((Number(n)||0)*100)/100;}
function post(b){b.t=T;return fetch(URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json();});}
function thumb(u){if(!u)return '';var k=String(u).split('?')[0].split('/').pop().replace(/\.[a-z0-9]+$/i,'').replace(/-(large|small|medium)$/i,'');return k?'https://bklbvwpkrdaojbezljsd.supabase.co/storage/v1/object/public/fotos/th160/'+k:u;}
function liqDe(it){var q=Number(it.precio_liq);if(q>0)return q;return Number(it.precio)||0;}
function listaDe(it){return Number(it.precio_lista||it.lista)||0;}
function offDe(it){if(it.origen==='historial')return '−25%';if(it.origen==='liquidacion')return '−30%';var L=listaDe(it),q=liqDe(it);if(!(L>q&&q>0))return '';var d=Math.round((1-q/L)*100);return d===25||d===30?'−'+d+'%':'−'+d+'%';}
function llena(lineas){return !!(lineas&&lineas.length&&lineas.every(function(x){return (QT[x.sku]||0)>=Number(x.stock)&&Number(x.stock)>0;}));}
function unit(it,qty,full){var base=liqDe(it),stock=Number(it.stock),f=full?0.85:(qty>=stock&&stock>0?0.95:1);return r2(base*f);}
function totLista(xs){return r2(xs.reduce(function(a,x){return a+Number(x.stock)*listaDe(x);},0));}
function totCat(xs){return r2(xs.reduce(function(a,x){return a+Number(x.stock)*r2(liqDe(x)*0.85);},0));}
function foto(it){
  if(!it||!it.foto)return '<div class="ph">Sin foto</div>';
  return '<div class="ph"><img loading="lazy" decoding="async" alt="" src="'+esc(thumb(it.foto))+'" data-full="'+esc(it.foto)+'" style="opacity:0" onload="this.style.opacity=1" onerror="if(!this.dataset.f){this.dataset.f=\'1\';this.src=this.getAttribute(\'data-full\');}else{var b=this.parentNode;if(b)b.textContent=\'Sin foto\';this.remove();}"></div>';
}
function fila(it,full){
  var qty=QT[it.sku]||0, u=unit(it,qty,full), extra=full?'−15%':(qty>=Number(it.stock)&&Number(it.stock)>0?'−5%':'');
  return '<div class="li">'+foto(it)+'<div class="mid"><b>'+esc(it.nombre||it.sku)+'</b><div class="mut">'+esc(it.sku||'')+' · Disponible '+esc(it.stock)+'</div></div>'+
    '<div class="side"><div class="nums"><span class="old">'+money(listaDe(it))+'</span><span class="off">'+esc(offDe(it))+(extra?' '+extra:'')+'</span><b>'+money(u)+'</b></div>'+
    '<div class="qty"><button type="button" data-step="-1" data-sku="'+esc(it.sku)+'" data-max="'+esc(it.stock)+'">−</button><input data-sku="'+esc(it.sku)+'" type="number" inputmode="numeric" min="0" max="'+esc(it.stock)+'" step="1" value="'+(qty?qty:'')+'" aria-label="Cantidad"><button type="button" data-step="1" data-sku="'+esc(it.sku)+'" data-max="'+esc(it.stock)+'">+</button></div></div></div>';
}
function pintar(){
  var app=document.getElementById('app');
  if(!DATA||DATA.ok===false){app.innerHTML='<div class="card err">'+(DATA&&DATA.error||'Enlace no válido.')+'</div>';return;}
  var items=DATA.items||[], cli=DATA.cliente&&DATA.cliente.nombre||'', nomPrev=(document.getElementById('nom')||{}).value||'';
  var catalogo=(DATA._todos&&DATA._todos.items)||items;
  var sk={};items.forEach(function(it){sk[it.sku]=1;});
  var paq=(DATA.paquetes||[]).filter(function(p){return (p.lineas||[]).length>1;});
  if(DATA.modo!=='todos')paq=paq.filter(function(p){return (p.lineas||[]).some(function(x){return sk[x.sku];});});
  var h='<div class="mut">'+(cli?esc(cli)+' · ':'')+(DATA.modo==='todos'?'Todos los productos':'Sugeridos')+' · hasta '+esc(String(DATA.expira||'').slice(0,10))+'</div>';
  h+='<div class="card">'+esc(DATA.instruccion||'')+'</div>';
  if(DATA.modo!=='todos') h+='<div class="card" id="liq-sug">Se sugieren productos según sus tendencias de cotizaciones y compras.</div>';
  h+='<p><button class="sec" id="todos">'+(TODOS?'Ver sugeridos':'Ver todos los productos')+'</button></p>';
  if(!paq.length&&!items.length)h+='<div class="card">Sin productos en liquidación por ahora.</div>';
  h+=paq.map(function(p,i){
    var xs=p.lineas||[], abierto=!!OPEN[p.nombre], full=llena(xs), lista=totLista(xs), cat=totCat(xs);
    var dentro=abierto?xs.map(function(x){return fila(x,full);}).join('')+
      '<div class="foot">Compra de categoría completa: −15% adicional sobre el precio ya descontado.'+
      '<div class="nums" style="margin:6px 0"><span class="old">'+money(lista)+'</span><b>'+money(cat)+'</b></div>'+
      '<button type="button" data-paq="'+i+'">Agregar categoría completa</button></div>':'';
    return '<div class="card"><button type="button" class="cat" data-ver="'+i+'" aria-expanded="'+(abierto?'true':'false')+'"><span>'+(abierto?'▾':'▸')+'</span><b>'+esc(p.nombre)+'</b><span class="sum"><span class="mut">'+xs.length+'</span><br><span class="old">'+money(lista)+'</span> <b>'+money(cat)+'</b></span></button>'+dentro+'</div>';
  }).join('');
  h+='<div class="card"><label class="mut">Tu nombre<input class="nom" id="nom" maxlength="80" value="'+esc(nomPrev)+'"></label><p><button id="enviar">Enviar pedido</button></p><div id="msg" class="mut"></div></div>';
  app.innerHTML=h;
  app._paq=paq;
  document.getElementById('todos').onclick=function(){TODOS=!TODOS;cargar();};
  [].forEach.call(app.querySelectorAll('[data-ver]'),function(b){b.onclick=function(){var p=app._paq[+b.getAttribute('data-ver')];if(p)OPEN[p.nombre]=!OPEN[p.nombre];pintar();};});
  [].forEach.call(app.querySelectorAll('[data-paq]'),function(b){b.onclick=function(){var p=app._paq[+b.getAttribute('data-paq')];if(!p)return;(p.lineas||[]).forEach(function(x){QT[x.sku]=Number(x.stock)||0;});pintar();};});
  [].forEach.call(app.querySelectorAll('[data-step]'),function(b){b.onclick=function(){var sku=b.getAttribute('data-sku'),max=Number(b.getAttribute('data-max'))||0;QT[sku]=Math.max(0,Math.min(max,(QT[sku]||0)+Number(b.getAttribute('data-step'))));pintar();};});
  app.querySelectorAll('input[data-sku]').forEach(function(el){el.oninput=function(){var sku=el.getAttribute('data-sku'),max=Number(el.max)||0;QT[sku]=Math.max(0,Math.min(max,parseFloat(el.value)||0));pintar();var f=app.querySelector('input[data-sku="'+sku+'"]');if(f)f.focus();};});
  document.getElementById('enviar').onclick=function(){
    var lineas=[], visto={};
    (catalogo.length?catalogo:items).forEach(function(it){var q=QT[it.sku]||0;if(q>0){visto[it.sku]=1;lineas.push({sku:it.sku,qty:q});}});
    Object.keys(QT).forEach(function(sku){if(!visto[sku]&&QT[sku]>0)lineas.push({sku:sku,qty:QT[sku]});});
    var msg=document.getElementById('msg');
    if(!lineas.length){msg.textContent='Elige al menos un producto.';return;}
    msg.textContent='Enviando…';
    post({op:'enviar',todos:true,lineas:lineas,contacto:(document.getElementById('nom')||{}).value||'',empresa:cli}).then(function(r){
      msg.textContent=r&&r.ok?('Pedido recibido. Pre-cotización #'+r.precot_id+'.'):((r&&r.error)||'No se pudo enviar.');
    }).catch(function(){msg.textContent='Sin conexión.';});
  };
}
function cargar(){
  document.getElementById('app').textContent='Cargando…';
  post({op:'ver',todos:TODOS}).then(function(r){
    DATA=r;
    if(!TODOS)return post({op:'ver',todos:true}).then(function(t){if(DATA){DATA.paquetes=(t&&t.paquetes)||[];DATA._todos=t;}pintar();});
    pintar();
  }).catch(function(){DATA={ok:false,error:'Sin conexión.'};pintar();});
}
if(!T)document.getElementById('app').textContent='Enlace no válido.';
else cargar();
</script>
</body>
</html>
