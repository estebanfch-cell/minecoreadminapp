<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquidación Minecore</title>
<style>
  body{margin:0;background:#0b1219;color:#e8eef5;font:15px/1.35 system-ui,sans-serif}
  main{max-width:760px;margin:0 auto;padding:12px}
  h1{font-size:20px;margin:0 0 4px}
  .mut{color:#8fa3b8;font-size:12.5px}
  .card{background:#121c28;border:1px solid #243446;border-radius:12px;padding:10px 12px;margin:8px 0}
  .old{color:#8fa3b8;text-decoration:line-through}
  .off{color:#b6f0c4;font-weight:700;font-size:12px}
  button,input{font:inherit}
  button{background:#e6f000;color:#111;border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
  button.sec{background:#1c2a3a;color:#e8eef5}
  button.cat{display:flex;width:100%;align-items:center;gap:8px;background:transparent;color:inherit;text-align:left;padding:2px 0;border-radius:0}
  button.cat b{flex:1;min-width:0}
  .cat .sum{flex:none;text-align:right;font-size:13px}
  .row{display:flex;gap:10px;align-items:flex-start;width:100%;background:transparent;color:inherit;border:0;border-top:1px solid #243446;text-align:left;padding:8px 0;cursor:pointer}
  .phs{width:56px;height:56px;border-radius:8px;background:#fff;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#8fa3b8;font-size:11px}
  .phs img{width:100%;height:100%;object-fit:contain;background:#fff}
  .who{flex:1;min-width:0}
  .who .mut{display:block;margin-top:2px}
  .nm{font-size:14px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;white-space:normal;overflow-wrap:anywhere}
  .pxside{flex:none;width:42%;max-width:210px;min-width:132px;display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:1px}
  .pxside .pvp{font-size:11px;color:#8fa3b8}
  .pxside .now{font-size:17px;font-weight:800;line-height:1.15;margin:1px 0 2px}
  .pxside .lin{font-size:10.5px;line-height:1.25;margin-top:3px;color:#c5d4e4}
  .sline{display:flex;gap:10px;align-items:flex-start;border-top:1px solid #243446;padding:8px 0}
  .sbody{flex:1;min-width:0}
  .sname{font-size:13px;font-weight:700;line-height:1.35;white-space:normal;overflow:visible;overflow-wrap:anywhere}
  .skv{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;font-size:12.5px}
  .skv span:first-child{color:#8fa3b8}
  .stot{border-top:1px solid #243446;margin-top:8px;padding-top:8px}
  .stot div{display:flex;justify-content:space-between;gap:12px;margin-top:4px}
  .stot .grand{font-size:16px;font-weight:800;margin-top:8px}
  .catbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .catbar .cat{flex:1;min-width:0}
  .addcat,.topadd .addcat,.foot .addcat{display:block;width:100%;box-sizing:border-box;background:#e6f000;color:#111;border:0;border-radius:8px;padding:8px 10px;font-weight:700;font-size:13px;cursor:pointer;margin-top:6px}
  #liq-burbuja{position:fixed;left:12px;right:12px;z-index:7900;background:#e6f000;color:#111;border:0;border-radius:999px;padding:12px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer}
  .addcat.on{background:#1c2a3a;color:#e6f000}
  .sub{margin:2px 0 2px 10px;padding-left:8px;border-left:2px solid #243446}
  .nums{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin:8px 0}
  .sheet{position:fixed;inset:0;z-index:80;background:rgba(2,6,12,.72);display:flex;align-items:flex-end;justify-content:center}
  .sheet .box{background:#121c28;color:#e8eef5;width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:12px 14px 22px;box-sizing:border-box}
  .sheet .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .sheet .bar button{background:#1c2a3a;color:#e8eef5}
  .phb{width:100%;aspect-ratio:1/1;max-height:72vw;border-radius:12px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#8fa3b8}
  .phb img{width:100%;height:100%;object-fit:contain;background:#fff}
  .sheet h2{font-size:16px;line-height:1.3;margin:10px 0 4px}
  .buy{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
  @media(min-width:700px){.phs{width:64px;height:64px}.sheet{align-items:center}.sheet .box{border-radius:16px;max-height:90vh}.phb{max-height:420px}}
  .qty{display:flex;align-items:center;gap:4px}
  .qty button{width:26px;height:26px;padding:0;border-radius:6px;background:#1c2a3a;color:#fff}
  .qty button:disabled{opacity:.35;cursor:default}
  @media(min-width:700px){.pxside .now{font-size:18px}.pxside .lin{font-size:12px}}
  .qty input{width:38px;height:26px;padding:0;text-align:center;background:#0b1219;color:#fff;border:1px solid #2a3d52;border-radius:6px}
  .foot{border-top:1px solid #243446;margin-top:8px;padding-top:8px;font-size:13px}
  .err{color:#ff8a8a}
  input.nom{width:100%;box-sizing:border-box;background:#0b1219;color:#fff;border:1px solid #2a3d52;border-radius:8px;padding:8px}
</style>
</head>
<body>
<main>
  <h1>Liquidación Minecore</h1>
  <div id="app" class="mut">Cargando…</div>
</main>
<script>
var URL='https://bklbvwpkrdaojbezljsd.supabase.co/functions/v1/liq-pub';
var T=(location.search.match(/[?&]t=([^&]+)/)||[])[1]||'';
var TODOS=false, DATA=null, QT={}, OPEN={};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function money(n){n=Number(n)||0;try{return n.toLocaleString('es-EC',{style:'currency',currency:'USD'});}catch(e){return '$'+n.toFixed(2);}}
function r2(n){return Math.round((Number(n)||0)*100)/100;}
function post(b){b.t=T;return fetch(URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json();});}
function thumb(u){if(!u)return '';var k=String(u).split('?')[0].split('/').pop().replace(/\.[a-z0-9]+$/i,'').replace(/-(large|small|medium)$/i,'');return k?'https://bklbvwpkrdaojbezljsd.supabase.co/storage/v1/object/public/fotos/th160/'+k:u;}
function liqDe(it){var q=Number(it.precio_liq);if(q>0)return q;return Number(it.precio)||0;}
function listaDe(it){return Number(it.precio_lista||it.lista)||0;}
function offDe(it){if(it.origen==='historial')return '−25%';if(it.origen==='liquidacion')return '−30%';var L=listaDe(it),q=liqDe(it);if(!(L>q&&q>0))return '';var d=Math.round((1-q/L)*100);return d===25||d===30?'−'+d+'%':'−'+d+'%';}
function descDe(it,qty,full){var stock=Number(it&&it.stock)||0;return (offDe(it)||'')+(full?' −15%':(qty>=stock&&stock>0?' −5%':''));}
function ivaPct(){return 15;}
function ivaMonto(st){var x=(Number(st)||0)*ivaPct(),a=Number(Math.abs(x).toPrecision(15)),r=Math.floor(a+0.5);return r2((x<0?-r:r)/100);}
function llena(lineas){return !!(lineas&&lineas.length&&lineas.every(function(x){return (QT[x.sku]||0)>=Number(x.stock)&&Number(x.stock)>0;}));}
function unit(it,qty,full){var base=liqDe(it),stock=Number(it.stock),f=full?0.85:(qty>=stock&&stock>0?0.95:1);return r2(base*f);}
function totLista(xs){return r2(xs.reduce(function(a,x){return a+Number(x.stock)*listaDe(x);},0));}
function totCat(xs){return r2(xs.reduce(function(a,x){return a+Number(x.stock)*r2(liqDe(x)*0.85);},0));}
function foto(it,big){
  var cls=big?'phb':'phs';
  if(!it||!it.foto)return '<div class="'+cls+'">Sin foto</div>';
  return '<div class="'+cls+'"><img loading="lazy" decoding="async" alt="" src="'+esc(thumb(it.foto))+'" data-full="'+esc(it.foto)+'" style="opacity:0" onload="this.style.opacity=1" onerror="if(!this.dataset.f){this.dataset.f=\'1\';this.src=this.getAttribute(\'data-full\');}else{var b=this.parentNode;if(b)b.textContent=\'Sin foto\';this.remove();}"></div>';
}
function tamDe(x){
  var s=((x.categoria||'')+' '+(x.nombre||'')).toUpperCase();
  if(/HOVER|HO\s+OVER/.test(s))return 'HO oversize';
  if(/NOVER|NO\s+OVER/.test(s))return 'NO oversize';
  if(/POVER|PO\s+OVER/.test(s))return 'PO oversize';
  if(/HTW3/.test(s))return 'HTW3';
  if(/HTW/.test(s))return 'HTW';
  if(/HWT/.test(s))return 'HWT';
  if(/IEW/.test(s))return 'IEW';
  if(/NTW/.test(s))return 'NTW';
  if(/HO3/.test(s))return 'HO3';
  if(/NO3/.test(s))return 'NO3';
  if(/PO3/.test(s))return 'PO3';
  if(/\bHO\b|\bHQ\b/.test(s))return 'Brocas HQ';
  if(/\bNO\b|\bNQ\b/.test(s))return 'NQ';
  if(/\bPO\b|\bPQ\b/.test(s))return 'PQ';
  if(/\bBO\b|\bBQ\b/.test(s))return 'BQ';
  return 'Otras';
}
function armar(paq){
  var out=[], visto={};
  paq.forEach(function(p){
    var fam=/^Brocas/.test(p.nombre)?'Brocas':/^Rimas/.test(p.nombre)?'Rimas':'';
    if(!fam){out.push({key:p.nombre,nombre:p.nombre,lineas:p.lineas||[],hoja:true});return;}
    if(visto[fam])return; visto[fam]=1;
    var hijos={}, all=[];
    paq.forEach(function(q){
      if(!(fam==='Brocas'?/^Brocas/.test(q.nombre):/^Rimas/.test(q.nombre)))return;
      (q.lineas||[]).forEach(function(x){
        var sub=tamDe(x); if(fam==='Rimas'&&sub==='Brocas HQ')sub='HQ';
        if(!hijos[sub])hijos[sub]={key:fam+'|'+sub,nombre:sub,lineas:[],hoja:true};
        hijos[sub].lineas.push(x); all.push(x);
      });
    });
    var ord=['Brocas HQ','HO oversize','HO3','NQ','NO3','NO oversize','PQ','PO oversize','PO3','BQ','HTW','HTW3','IEW','NTW','HWT','HQ','Otras'];
    var hs=Object.keys(hijos).map(function(k){return hijos[k];});
    hs.sort(function(a,b){var ia=ord.indexOf(a.nombre),ib=ord.indexOf(b.nombre);return (ia<0?99:ia)-(ib<0?99:ib);});
    out.push({key:fam,nombre:fam,hijos:hs,lineas:all});
  });
  return out;
}
var GRUPO={};
function pxLinea(it){
  var full=fullDe(it.sku), qty=QT[it.sku]||0, stock=Number(it.stock)||0, u=unit(it,qty,full);
  var lin=qty>0?'<span class="lin">'+esc(qty)+' × '+money(u)+' = '+money(r2(qty*u))+'</span>':'';
  return '<span class="pxside"><span class="pvp">PVP <span class="old">'+money(listaDe(it))+'</span></span><span class="off">'+esc(descDe(it,qty,full))+'</span><b class="now">'+money(u)+'</b>'+
    '<span class="qty"><button type="button" data-step="-1" data-sku="'+esc(it.sku)+'" data-max="'+stock+'"'+(qty<=0?' disabled':'')+'>−</button><input data-sku="'+esc(it.sku)+'" type="number" inputmode="numeric" min="0" max="'+stock+'" step="1" value="'+(qty?qty:'')+'" aria-label="Cantidad"><button type="button" data-step="1" data-sku="'+esc(it.sku)+'" data-max="'+stock+'"'+(qty>=stock?' disabled':'')+'>+</button></span>'+lin+'</span>';
}
function fila(it){
  return '<div class="row" role="button" tabindex="0" data-open="'+esc(it.sku)+'">'+foto(it)+
    '<span class="who"><span class="nm">'+esc(it.nombre||it.sku)+'</span><span class="mut">'+esc(it.sku||'')+(it.categoria?' · '+esc(it.categoria):'')+'</span><span class="mut">Disponibles: '+esc(Number(it.stock)||0)+'</span></span>'+pxLinea(it)+'</div>';
}
function fullDe(sku){var L=GRUPO[sku];return L?llena(L):false;}
var DET=null;
function buscar(sku){
  var xs=(DATA&&DATA._todos&&DATA._todos.items)||(DATA&&DATA.items)||[];
  var hit=xs.filter(function(x){return x.sku===sku;})[0];
  if(hit)return hit;
  var ps=(DATA&&DATA.paquetes)||[];
  for(var i=0;i<ps.length;i++){var L=ps[i].lineas||[];for(var j=0;j<L.length;j++)if(L[j].sku===sku)return L[j];}
  return null;
}
function cerrarDet(desdePop){
  DET=null;
  var s=document.getElementById('liq-sheet');if(s)s.remove();
  if(!desdePop&&history.state&&history.state.liq){try{history.back();}catch(e){}}
}
function abrirDet(it,full){
  if(!it)return;
  var y=window.scrollY;
  if(!DET){try{history.pushState({liq:1},'');}catch(e){}}
  if(full==null)full=fullDe(it.sku);
  DET={sku:it.sku,full:!!full};
  var qty=QT[it.sku]||0,u=unit(it,qty,full),extra=full?' −15%':(qty>=Number(it.stock)&&Number(it.stock)>0?' −5%':'');
  var old=document.getElementById('liq-sheet');if(old)old.remove();
  var s=document.createElement('div');s.id='liq-sheet';s.className='sheet';
  s.innerHTML='<div class="box" role="dialog" aria-modal="true"><div class="bar"><button type="button" id="liq-back">← Volver</button><button type="button" id="liq-x" aria-label="Cerrar">✕</button></div>'+
    foto(it,true)+'<h2>'+esc(it.nombre||it.sku)+'</h2><div class="mut">'+esc(it.sku||'')+(it.categoria?' · '+esc(it.categoria):'')+'</div><div class="mut">Disponible '+esc(it.stock)+'</div>'+
    '<div class="nums"><span class="off">'+esc(offDe(it))+(extra?' '+extra:'')+'</span><span class="old">'+money(listaDe(it))+'</span><b>'+money(u)+'</b></div>'+
    '<div class="buy"><div class="qty"><button type="button" data-step="-1" data-sku="'+esc(it.sku)+'" data-max="'+esc(it.stock)+'">−</button><input data-sku="'+esc(it.sku)+'" type="number" inputmode="numeric" min="0" max="'+esc(it.stock)+'" step="1" value="'+(qty?qty:'')+'" aria-label="Cantidad"><button type="button" data-step="1" data-sku="'+esc(it.sku)+'" data-max="'+esc(it.stock)+'">+</button></div>'+
    '<button type="button" id="liq-add">Agregar</button></div></div>';
  document.body.appendChild(s);
  s.addEventListener('click',function(e){if(e.target===s)cerrarDet(false);});
  document.getElementById('liq-back').onclick=function(){cerrarDet(false);};
  document.getElementById('liq-x').onclick=function(){cerrarDet(false);};
  document.getElementById('liq-add').onclick=function(){cerrarDet(false);};
  [].forEach.call(s.querySelectorAll('[data-step]'),function(b){b.onclick=function(){var sku=b.getAttribute('data-sku'),max=Number(b.getAttribute('data-max'))||0;QT[sku]=Math.max(0,Math.min(max,(QT[sku]||0)+Number(b.getAttribute('data-step'))));abrirDet(buscar(sku)||it,full);};});
  var inp=s.querySelector('input[data-sku]');
  if(inp)inp.oninput=function(){var sku=inp.getAttribute('data-sku'),max=Number(inp.max)||0;QT[sku]=Math.max(0,Math.min(max,parseFloat(inp.value)||0));var nb=s.querySelector('b');if(nb)nb.textContent=money(unit(buscar(sku)||it,QT[sku],full));};
  window.scrollTo(0,y);
}
function cadaLinea(fn){var seen={};function add(x){if(!x||!x.sku||seen[x.sku])return;seen[x.sku]=1;fn(x);}(DATA&&DATA.paquetes||[]).forEach(function(p){(p.lineas||[]).forEach(add);});(DATA&&DATA.items||[]).forEach(add);}
function seleccion(){var lines=[],tot=0;cadaLinea(function(it){var q=QT[it.sku]||0;if(q<=0)return;var full=fullDe(it.sku),u=unit(it,q,full),sub=r2(q*u);tot+=sub;lines.push({it:it,q:q,u:u,full:full,sub:sub});});return {n:lines.length,tot:r2(tot),lines:lines};}
function lugarBurbuja(){var b=document.getElementById('liq-burbuja');if(!b)return;var vv=window.visualViewport,kb=0;if(vv)kb=Math.max(0,window.innerHeight-(vv.height+vv.offsetTop));var nav=document.getElementById('mc-bbar'),navOn=nav&&getComputedStyle(nav).display!=='none'&&!document.documentElement.classList.contains('kb-open');b.style.bottom=(kb>60?kb+8:(navOn?(nav.offsetHeight||62)+8:12))+'px';}
var SEL=false;
function cerrarSel(desdePop){SEL=false;var s=document.getElementById('liq-sel');if(s)s.remove();if(!desdePop&&history.state&&history.state.liqSel){try{history.back();}catch(e){}}}
function abrirSel(){var S=seleccion();if(!S.n){cerrarSel(true);return;}var y=window.scrollY;if(!SEL){try{history.pushState({liqSel:1},'');}catch(e){}}SEL=true;var old=document.getElementById('liq-sel');if(old)old.remove();var s=document.createElement('div');s.id='liq-sel';s.className='sheet';s.style.zIndex='9000';
  s.innerHTML='<div class="box" role="dialog" aria-modal="true"><div class="bar"><button type="button" id="sel-back">← Volver</button><button type="button" id="sel-x" aria-label="Cerrar">✕</button></div><h2>Tu selección</h2>'+
    S.lines.map(function(L){var stock=Number(L.it.stock)||0;return '<div class="sline">'+foto(L.it)+'<div class="sbody"><div class="sname">'+esc(L.it.nombre||L.it.sku)+'</div><div class="mut">'+esc(L.it.sku)+'</div><div class="skv"><span>Cant.</span><span class="qty"><button type="button" data-sel="-1" data-sku="'+esc(L.it.sku)+'" data-max="'+stock+'"'+(L.q<=0?' disabled':'')+'>−</button><input data-selq="'+esc(L.it.sku)+'" type="number" min="0" max="'+stock+'" value="'+L.q+'"><button type="button" data-sel="1" data-sku="'+esc(L.it.sku)+'" data-max="'+stock+'"'+(L.q>=stock?' disabled':'')+'>+</button></span></div><div class="skv"><span>P. unit. con desc.</span><b>'+money(L.u)+'</b></div><div class="skv"><span>Descuento</span><span class="off">'+esc(descDe(L.it,L.q,L.full))+'</span></div><div class="skv"><span>Total línea</span><b>'+money(L.sub)+'</b></div><button type="button" class="sec" data-quitar="'+esc(L.it.sku)+'" style="margin-top:6px">Quitar</button></div></div>';}).join('')+
    '<div class="stot"><div><span>Subtotal</span><b>'+money(S.tot)+'</b></div><div><span>IVA '+ivaPct()+'%</span><b>'+money(ivaMonto(S.tot))+'</b></div><div class="grand"><span>Total</span><b>'+money(r2(S.tot+ivaMonto(S.tot)))+'</b></div></div></div>';
  document.body.appendChild(s);
  s.addEventListener('click',function(e){if(e.target===s)cerrarSel(false);});
  document.getElementById('sel-back').onclick=function(){cerrarSel(false);};
  document.getElementById('sel-x').onclick=function(){cerrarSel(false);};
  [].forEach.call(s.querySelectorAll('[data-sel]'),function(b){b.onclick=function(){var sku=b.getAttribute('data-sku'),max=Number(b.getAttribute('data-max'))||0;QT[sku]=Math.max(0,Math.min(max,(QT[sku]||0)+Number(b.getAttribute('data-sel'))));pintar();abrirSel();};});
  [].forEach.call(s.querySelectorAll('[data-selq]'),function(el){el.oninput=function(){var sku=el.getAttribute('data-selq'),max=Number(el.max)||0;QT[sku]=Math.max(0,Math.min(max,parseFloat(el.value)||0));pintar();abrirSel();var f=document.querySelector('[data-selq="'+sku+'"]');if(f)f.focus();};});
  [].forEach.call(s.querySelectorAll('[data-quitar]'),function(b){b.onclick=function(){QT[b.getAttribute('data-quitar')]=0;pintar();abrirSel();};});
  window.scrollTo(0,y);
}
function syncSel(){var S=seleccion(),b=document.getElementById('liq-burbuja');if(!S.n){if(b)b.remove();if(SEL)cerrarSel(true);return;}if(!b){b=document.createElement('button');b.id='liq-burbuja';b.type='button';b.onclick=function(){abrirSel();};document.body.appendChild(b);}b.textContent='Tu selección: '+S.n+(S.n===1?' producto':' productos')+' · Total '+money(r2(S.tot+ivaMonto(S.tot)));lugarBurbuja();}
if(window.visualViewport){visualViewport.addEventListener('resize',lugarBurbuja);visualViewport.addEventListener('scroll',lugarBurbuja);}
window.addEventListener('popstate',function(){if(document.getElementById('liq-sel'))cerrarSel(true);else if(document.getElementById('liq-sheet'))cerrarDet(true);});
function pintar(){
  var app=document.getElementById('app');
  if(!DATA||DATA.ok===false){app.innerHTML='<div class="card err">'+(DATA&&DATA.error||'Enlace no válido.')+'</div>';return;}
  var items=DATA.items||[], cli=DATA.cliente&&DATA.cliente.nombre||'', nomPrev=(document.getElementById('nom')||{}).value||'';
  var catalogo=(DATA._todos&&DATA._todos.items)||items;
  var sk={};items.forEach(function(it){sk[it.sku]=1;});
  var paq=(DATA.paquetes||[]).filter(function(p){return (p.lineas||[]).length>1;});
  if(DATA.modo!=='todos')paq=paq.filter(function(p){return (p.lineas||[]).some(function(x){return sk[x.sku];});});
  var h='<div class="mut">'+(cli?esc(cli)+' · ':'')+(DATA.modo==='todos'?'Todos los productos':'Sugeridos')+' · hasta '+esc(String(DATA.expira||'').slice(0,10))+'</div>';
  h+='<div class="card">'+esc(DATA.instruccion||'')+'</div>';
  if(DATA.modo!=='todos') h+='<div class="card" id="liq-sug">Se sugieren productos según sus tendencias de cotizaciones y compras.</div>';
  h+='<p><button class="sec" id="todos">'+(TODOS?'Ver sugeridos':'Ver todos los productos')+'</button></p>';
  if(!paq.length&&!items.length)h+='<div class="card">Sin productos en liquidación por ahora.</div>';
  var tree=armar(paq), leaves=[];
  GRUPO={};
  function hoja(p){
    var i=leaves.push(p)-1, abierto=!!OPEN[p.key], xs=p.lineas||[], lista=totLista(xs), cat=totCat(xs);
    xs.forEach(function(x){GRUPO[x.sku]=xs;});
    var on=llena(xs), btn='<button type="button" class="addcat'+(on?' on':'')+'" data-paq="'+i+'">'+(on?'Agregada · Quitar':'Agregar categoría completa (−15%)')+'</button>';
    var dentro=abierto?'<div class="topadd">'+btn+'</div>'+xs.map(fila).join('')+
      '<div class="foot">Compra de categoría completa: −15% adicional sobre el precio ya descontado.'+
      '<div class="nums" style="margin:6px 0"><span class="old">'+money(lista)+'</span><b>'+money(cat)+'</b></div>'+btn+'</div>':'';
    return '<div class="catbar"><button type="button" class="cat" data-ver="'+esc(p.key)+'" aria-expanded="'+(abierto?'true':'false')+'"><span>'+(abierto?'▾':'▸')+'</span><b>'+esc(p.nombre)+'</b></button><span class="sum"><span class="mut">'+xs.length+'</span></span></div>'+dentro;
  }
  h+=tree.map(function(p){
    var abierto=!!OPEN[p.key], n=(p.lineas||[]).length;
    var dentro=abierto&&p.hijos?p.hijos.map(function(hija){return '<div class="sub">'+hoja(hija)+'</div>';}).join(''):'';
    var head=p.hijos?'<button type="button" class="cat" data-ver="'+esc(p.key)+'" aria-expanded="'+(abierto?'true':'false')+'"><span>'+(abierto?'▾':'▸')+'</span><b>'+esc(p.nombre)+'</b><span class="sum"><span class="mut">'+n+'</span></span></button>':hoja(p);
    if(p.hijos) return '<div class="card">'+head+dentro+'</div>';
    return '<div class="card">'+head+'</div>';
  }).join('');
  h+='<div class="card"><label class="mut">Tu nombre<input class="nom" id="nom" maxlength="80" value="'+esc(nomPrev)+'"></label><p><button id="enviar">Enviar pedido</button></p><div id="msg" class="mut"></div></div>';
  var y=window.scrollY;
  app.innerHTML=h;
  app._paq=leaves;
  window.scrollTo(0,y);
  document.getElementById('todos').onclick=function(){TODOS=!TODOS;cargar();};
  [].forEach.call(app.querySelectorAll('[data-ver]'),function(b){b.onclick=function(){var k=b.getAttribute('data-ver');OPEN[k]=!OPEN[k];pintar();};});
  [].forEach.call(app.querySelectorAll('[data-paq]'),function(b){b.onclick=function(ev){ev.stopPropagation();var p=app._paq[+b.getAttribute('data-paq')];if(!p)return;var on=llena(p.lineas||[]);(p.lineas||[]).forEach(function(x){QT[x.sku]=on?0:(Number(x.stock)||0);});pintar();};});
  [].forEach.call(app.querySelectorAll('[data-open]'),function(b){b.onclick=function(ev){if(ev.target.closest&&ev.target.closest('.qty'))return;abrirDet(buscar(b.getAttribute('data-open')));};});
  syncSel();
  [].forEach.call(app.querySelectorAll('.row [data-step]'),function(b){b.onclick=function(ev){ev.stopPropagation();var sku=b.getAttribute('data-sku'),max=Number(b.getAttribute('data-max'))||0;QT[sku]=Math.max(0,Math.min(max,(QT[sku]||0)+Number(b.getAttribute('data-step'))));pintar();};});
  [].forEach.call(app.querySelectorAll('.row input[data-sku]'),function(el){el.onclick=function(ev){ev.stopPropagation();};el.oninput=function(ev){ev.stopPropagation();var sku=el.getAttribute('data-sku'),max=Number(el.max)||0;QT[sku]=Math.max(0,Math.min(max,parseFloat(el.value)||0));pintar();var f=app.querySelector('.row input[data-sku="'+sku+'"]');if(f)f.focus();};});
  document.getElementById('enviar').onclick=function(){
    var lineas=[], visto={};
    (catalogo.length?catalogo:items).forEach(function(it){var q=QT[it.sku]||0;if(q>0){visto[it.sku]=1;lineas.push({sku:it.sku,qty:q});}});
    Object.keys(QT).forEach(function(sku){if(!visto[sku]&&QT[sku]>0)lineas.push({sku:sku,qty:QT[sku]});});
    var msg=document.getElementById('msg');
    if(!lineas.length){msg.textContent='Elige al menos un producto.';return;}
    msg.textContent='Enviando…';
    post({op:'enviar',todos:true,lineas:lineas,contacto:(document.getElementById('nom')||{}).value||'',empresa:cli}).then(function(r){
      msg.textContent=r&&r.ok?('Pedido recibido. Pre-cotización #'+r.precot_id+'.'):((r&&r.error)||'No se pudo enviar.');
    }).catch(function(){msg.textContent='Sin conexión.';});
  };
}
function cargar(){
  document.getElementById('app').textContent='Cargando…';
  post({op:'ver',todos:TODOS}).then(function(r){
    DATA=r;
    if(!TODOS)return post({op:'ver',todos:true}).then(function(t){if(DATA){DATA.paquetes=(t&&t.paquetes)||[];DATA._todos=t;}pintar();});
    pintar();
  }).catch(function(){DATA={ok:false,error:'Sin conexión.'};pintar();});
}
if(!T)document.getElementById('app').textContent='Enlace no válido.';
else cargar();
</script>
</body>
</html>
