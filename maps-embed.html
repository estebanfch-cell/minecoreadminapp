<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minecore Maps</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --brand:#1D9E75;--brand-dark:#085041;--brand-light:#E1F5EE;
  --gold:#BA7517;--gold-light:#FAEEDA;
  --bg:#F5F5F0;--surface:#fff;--surface2:#F1EFE8;
  --text:#1a1a18;--text2:#5F5E5A;--text3:#888780;
  --border:#D3D1C7;--border2:#B4B2A9;
  --err-tx:#A32D2D;
  --radius:10px;
  --mc-dark:#2D3142;--mc-yellow:#E8FF00;
}
html.theme-dark{
  --bg:#1a1a18;--surface:#2C2C2A;--surface2:#3a3a38;
  --text:#F1EFE8;--text2:#B4B2A9;--text3:#888780;
  --border:#3a3a38;--border2:#5F5E5A;
}
html,body{background:transparent;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:15px}
body{padding:0}
.lbl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.btn-gps{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--border2);border-radius:var(--radius);padding:7px 12px;font-size:12px;color:var(--text2);cursor:pointer;width:100%;margin-bottom:8px}
.field-input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;background:var(--bg);color:var(--text);outline:none;margin-bottom:10px}
.field-input:focus{border-color:var(--brand)}
.parada-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.parada-num{width:22px;height:22px;border-radius:50%;background:var(--mc-yellow);color:var(--mc-dark);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.parada-inp{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;background:var(--bg);color:var(--text);outline:none}
.parada-inp:focus{border-color:var(--brand)}
.btn-del{background:none;border:none;color:var(--err-tx);font-size:18px;cursor:pointer;padding:4px}
.btn-add-parada{width:100%;padding:10px;background:rgba(232,255,0,.08);border:1.5px dashed rgba(232,255,0,.3);border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;color:var(--gold);margin-bottom:12px}
.map-wrap{border-radius:var(--radius);overflow:hidden;position:relative;border:1px solid var(--border)}
#map{width:100%;height:220px;background:var(--surface2)}
.map-hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:5px 12px;border-radius:20px;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.boot{font-size:12px;color:var(--text2);padding:10px 0}
.boot.err{color:var(--err-tx)}
.pac-container{z-index:9999!important;font-family:inherit}
</style>
</head>
<body>
  <div class="lbl">Origen</div>
  <button class="btn-gps" type="button" id="btn-gps">
    <svg viewBox="0 0 24 24" fill="none" stroke="#1D9E75" stroke-width="2" stroke-linecap="round" width="16" height="16"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    Usar mi ubicación actual
  </button>
  <input class="field-input" id="inp-origen" value="Minecore S.A.S — Alpallana E7-212, Quito">
  <div class="lbl">Destinos / Paradas</div>
  <div id="paradas-cont"></div>
  <button class="btn-add-parada" type="button" id="btn-add">+ Agregar parada</button>
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-hint" id="map-hint">Toca el mapa para marcar destino</div>
  </div>
  <div class="boot" id="boot">Cargando mapa…</div>

<script>
(function(){
  'use strict';
  var MINECORE_LL={lat:-0.1940519,lng:-78.4841933};
  var MINECORE_ADDR='Minecore S.A.S \u2014 Alpallana E7-212, Quito';
  var ALLOWED={
    'https://portal.minecore.ec':1,
    'https://www.portal.minecore.ec':1,
    'https://estebanfch-cell.github.io':1,
    'http://localhost':1,
    'http://127.0.0.1':1,
    'https://localhost':1
  };
  var q=new URLSearchParams(location.search||'');
  if((q.get('theme')||'')==='dark') document.documentElement.classList.add('theme-dark');

  var parentOrigin='';
  var mReady=false, gmap, dirSvc, dirRen, geocoder, originMarker;
  var originLL=MINECORE_LL, originAddr=MINECORE_ADDR;
  var paradas=[], markers=[], routeKm=0, routeDur='', routeSec=0;
  var focusPad=0;

  function originHost(o){
    try{ return new URL(o).origin; }catch(e){ return o; }
  }
  function isAllowed(origin){
    if(!origin) return false;
    if(ALLOWED[origin]) return true;
    try{
      var u=new URL(origin);
      if(u.hostname==='localhost'||u.hostname==='127.0.0.1') return true;
    }catch(e){}
    return false;
  }
  function post(msg){
    if(!window.parent||window.parent===window) return;
    var payload={};
    Object.keys(msg||{}).forEach(function(k){ payload[k]=msg[k]; });
    payload.source='mc-maps-embed';
    var target=parentOrigin&&isAllowed(parentOrigin)?parentOrigin:'*';
    try{ window.parent.postMessage(payload, target); }catch(e){}
  }
  function statePayload(){
    return {
      origin:{addr:originAddr,ll:originLL},
      stops:paradas.map(function(p){ return {addr:p.addr||'',ll:p.ll||null}; }),
      km:routeKm,
      durationSec:routeSec,
      durationLabel:routeDur
    };
  }
  function postState(extra){
    var s=statePayload();
    if(extra) Object.keys(extra).forEach(function(k){ s[k]=extra[k]; });
    post({type:'state', state:s});
    reportHeight();
  }
  function reportHeight(){
    var h=Math.ceil(document.body.scrollHeight||0)+focusPad+8;
    if(h<360) h=360;
    post({type:'height', px:h});
  }

  function bootMsg(t, err){
    var el=document.getElementById('boot');
    if(!el) return;
    el.textContent=t||'';
    el.className='boot'+(err?' err':'');
    el.style.display=t?'block':'none';
  }

  function shortName(addr){
    addr=String(addr||'');
    return addr.split(' \u2014 ')[0].split(',')[0]||addr;
  }

  function renderStops(){
    var cont=document.getElementById('paradas-cont');
    if(!cont) return;
    cont.innerHTML='';
    paradas.forEach(function(p,i){
      var div=document.createElement('div');
      div.className='parada-row';
      div.id='pr-'+i;
      var shown=p.ll?shortName(p.addr): (p.addr||'');
      div.innerHTML='<div class="parada-num">'+(i+1)+'</div>'+
        '<input class="parada-inp" id="pi-'+i+'" placeholder="Buscar dirección..." value="">'+
        '<button class="btn-del" type="button" data-i="'+i+'">\u00d7</button>';
      cont.appendChild(div);
      var inp=document.getElementById('pi-'+i);
      if(inp) inp.value=shown;
      bindStopInput(i);
    });
    reportHeight();
  }

  function bindStopInput(i){
    var inp=document.getElementById('pi-'+i);
    if(!inp||!mReady||!window.google) return;
    var ac=new google.maps.places.Autocomplete(inp,{componentRestrictions:{country:'ec'},fields:['geometry','formatted_address','name']});
    ac.addListener('place_changed',function(){
      var pl=ac.getPlace(); if(!pl||!pl.geometry) return;
      var name=pl.name||pl.formatted_address;
      var addr=pl.formatted_address;
      paradas[i]={addr:name+' \u2014 '+addr,ll:{lat:pl.geometry.location.lat(),lng:pl.geometry.location.lng()}};
      calcRoute();
      postState({typeHint:'stopsChanged'});
    });
    inp.addEventListener('focus',function(){ focusPad=260; reportHeight(); });
    inp.addEventListener('blur',function(){ setTimeout(function(){ focusPad=0; reportHeight(); },300); });
    var btn=inp.parentNode&&inp.parentNode.querySelector('.btn-del');
    if(btn) btn.onclick=function(){ delStop(i); };
  }

  function addStop(prefill){
    var empty=paradas.findIndex(function(p){ return !p.ll; });
    if(prefill&&prefill.ll&&empty>=0){
      paradas[empty]={addr:prefill.addr||'',ll:prefill.ll};
      renderStops();
      calcRoute();
      postState();
      return empty;
    }
    paradas.push({addr:(prefill&&prefill.addr)||'',ll:(prefill&&prefill.ll)||null});
    renderStops();
    if(prefill&&prefill.ll) calcRoute();
    postState();
    return paradas.length-1;
  }

  function delStop(idx){
    paradas.splice(idx,1);
    if(!paradas.length) paradas.push({addr:'',ll:null});
    renderStops();
    calcRoute();
    postState();
  }

  function setOrigin(addr, ll){
    if(ll&&typeof ll.lat==='number'&&typeof ll.lng==='number') originLL={lat:ll.lat,lng:ll.lng};
    if(addr) originAddr=addr;
    var inp=document.getElementById('inp-origen');
    if(inp&&addr) inp.value=addr;
    if(originMarker) originMarker.setPosition(originLL);
    if(gmap) gmap.panTo(originLL);
    if(ll&&!addr&&geocoder){
      geocoder.geocode({location:originLL},function(res,st){
        if(st==='OK'&&res&&res[0]){
          originAddr=res[0].formatted_address;
          if(inp) inp.value=originAddr;
          postState({typeHint:'originChanged'});
        }
      });
    }
    calcRoute();
    postState({typeHint:'originChanged'});
  }

  function useGPS(){
    if(!navigator.geolocation){ post({type:'error',message:'GPS no disponible'}); return; }
    bootMsg('Obteniendo ubicación…');
    navigator.geolocation.getCurrentPosition(function(pos){
      bootMsg('');
      setOrigin('', {lat:pos.coords.latitude,lng:pos.coords.longitude});
    },function(){
      bootMsg('');
      post({type:'error',message:'No se pudo obtener ubicación'});
    },{enableHighAccuracy:true,timeout:12000});
  }

  function calcRoute(){
    var valid=paradas.filter(function(p){ return p.ll; });
    if(!originLL||!valid.length||!dirSvc){
      routeKm=0; routeDur=''; routeSec=0;
      markers.forEach(function(m){ if(m&&m.setMap) m.setMap(null); });
      markers=[];
      return;
    }
    markers.forEach(function(m){ if(m&&m.setMap) m.setMap(null); });
    markers=[];
    dirSvc.route({
      origin:originLL,
      destination:valid[valid.length-1].ll,
      waypoints:valid.slice(0,-1).map(function(p){ return {location:p.ll,stopover:true}; }),
      travelMode:google.maps.TravelMode.DRIVING,
      provideRouteAlternatives:true
    },function(result,status){
      if(status!=='OK'){
        post({type:'error',message:'No se pudo calcular la ruta'});
        return;
      }
      var sorted=result.routes.slice().sort(function(a,b){
        var da=a.legs.reduce(function(s,l){ return s+l.distance.value; },0);
        var db=b.legs.reduce(function(s,l){ return s+l.distance.value; },0);
        return da-db;
      });
      var best=sorted[0];
      dirRen.setDirections({routes:[best],request:result.request});
      var totalM=0,totalS=0;
      best.legs.forEach(function(l){ totalM+=l.distance.value; totalS+=l.duration.value; });
      routeKm=Math.round(totalM/100)/10;
      routeSec=totalS;
      var hrs=Math.floor(totalS/3600), mins=Math.floor((totalS%3600)/60);
      routeDur=hrs>0?(hrs+'h '+mins+'min'):(mins+' min');
      var hint=document.getElementById('map-hint');
      if(hint) hint.style.opacity='0';
      valid.forEach(function(p,i){
        var m=new google.maps.Marker({
          position:p.ll,map:gmap,
          label:{text:String(i+1),color:'#2D3142',fontWeight:'bold',fontSize:'12px'},
          icon:{path:google.maps.SymbolPath.CIRCLE,scale:10,fillColor:'#E8FF00',fillOpacity:1,strokeColor:'#2D3142',strokeWeight:2}
        });
        markers.push(m);
      });
      var bounds=new google.maps.LatLngBounds();
      best.legs.forEach(function(l){ bounds.extend(l.start_location); bounds.extend(l.end_location); });
      gmap.fitBounds(bounds,{top:20,right:20,bottom:20,left:20});
      post({type:'route', km:routeKm, durationSec:routeSec, durationLabel:routeDur, origin:{addr:originAddr,ll:originLL}, stops:statePayload().stops});
      postState({typeHint:'route'});
    });
  }

  function initMap(){
    if(!mReady||!window.google||!google.maps){ setTimeout(initMap,200); return; }
    var el=document.getElementById('map');
    if(!el) return;
    gmap=new google.maps.Map(el,{
      center:MINECORE_LL,zoom:13,disableDefaultUI:true,zoomControl:true,
      styles:[{featureType:'poi',elementType:'labels',stylers:[{visibility:'off'}]}]
    });
    dirSvc=new google.maps.DirectionsService();
    dirRen=new google.maps.DirectionsRenderer({suppressMarkers:true,polylineOptions:{strokeColor:'#E8FF00',strokeWeight:4,strokeOpacity:.9}});
    dirRen.setMap(gmap);
    geocoder=new google.maps.Geocoder();
    originLL=MINECORE_LL;
    originMarker=new google.maps.Marker({
      position:MINECORE_LL,map:gmap,
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:'#1D9E75',fillOpacity:1,strokeColor:'#fff',strokeWeight:2}
    });
    var inpOrigen=document.getElementById('inp-origen');
    if(inpOrigen){
      var acO=new google.maps.places.Autocomplete(inpOrigen,{componentRestrictions:{country:'ec'},fields:['geometry','formatted_address']});
      acO.addListener('place_changed',function(){
        var p=acO.getPlace(); if(!p||!p.geometry) return;
        originLL={lat:p.geometry.location.lat(),lng:p.geometry.location.lng()};
        originAddr=p.formatted_address||inpOrigen.value||MINECORE_ADDR;
        originMarker.setPosition(originLL);
        gmap.panTo(originLL);
        calcRoute();
        postState({typeHint:'originChanged'});
      });
      inpOrigen.addEventListener('focus',function(){ focusPad=260; reportHeight(); });
      inpOrigen.addEventListener('blur',function(){ setTimeout(function(){ focusPad=0; reportHeight(); },300); });
    }
    gmap.addListener('click',function(e){
      var ll={lat:e.latLng.lat(),lng:e.latLng.lng()};
      var free=paradas.findIndex(function(p){ return !p.ll; });
      var idx=free>=0?free:Math.max(0,paradas.length-1);
      if(!paradas.length){ paradas.push({addr:'',ll:null}); idx=0; }
      paradas[idx]={addr:'',ll:ll};
      if(geocoder){
        geocoder.geocode({location:ll},function(res,st){
          if(st==='OK'&&res&&res[0]){
            var name=(res[0].address_components&&res[0].address_components[1]&&res[0].address_components[1].short_name)||res[0].formatted_address.split(',')[0];
            paradas[idx].addr=name+' \u2014 '+res[0].formatted_address;
            var inp=document.getElementById('pi-'+idx);
            if(inp) inp.value=name;
          }
          postState({typeHint:'stopsChanged'});
        });
      }
      calcRoute();
    });
    if(!paradas.length) addStop();
    else renderStops();
    bootMsg('');
    post({type:'ready', state:statePayload()});
    postState();
    reportHeight();
  }

  function handleCmd(data){
    var t=data.type||data.cmd||'';
    if(t==='ping'){ post({type:'ready', state:statePayload()}); return; }
    if(t==='init'){
      if(data.theme==='dark') document.documentElement.classList.add('theme-dark');
      if(data.origin) setOrigin(data.origin.addr, data.origin.ll);
      if(Array.isArray(data.stops)){
        paradas=data.stops.map(function(p){ return {addr:p.addr||'',ll:p.ll||null}; });
        if(!paradas.length) paradas=[{addr:'',ll:null}];
        renderStops();
        calcRoute();
        postState();
      }
      return;
    }
    if(t==='setOrigin'){ setOrigin(data.addr, data.ll); return; }
    if(t==='addStop'){ addStop({addr:data.addr||'',ll:data.ll||null}); return; }
    if(t==='removeStop'){ delStop(Number(data.index)||0); return; }
    if(t==='getRoute'){ calcRoute(); post({type:'route', km:routeKm, durationSec:routeSec, durationLabel:routeDur, origin:{addr:originAddr,ll:originLL}, stops:statePayload().stops}); return; }
    if(t==='useGPS'){ useGPS(); return; }
    if(t==='reset'){
      originLL=MINECORE_LL; originAddr=MINECORE_ADDR; paradas=[{addr:'',ll:null}];
      routeKm=0; routeDur=''; routeSec=0;
      var inp=document.getElementById('inp-origen');
      if(inp) inp.value=MINECORE_ADDR;
      if(originMarker) originMarker.setPosition(originLL);
      if(gmap) gmap.panTo(originLL);
      renderStops();
      postState();
      return;
    }
  }

  window.addEventListener('message',function(e){
    if(!e||!e.data) return;
    if(!isAllowed(e.origin)) return;
    var d=e.data;
    if(d.source&&d.source!=='mc-maps-parent') return;
    parentOrigin=originHost(e.origin);
    handleCmd(d);
  });

  document.getElementById('btn-add').onclick=function(){ addStop(); };
  document.getElementById('btn-gps').onclick=function(){ useGPS(); };

  window.mapsReady=function(){
    mReady=true;
    bootMsg('');
    initMap();
  };

  window.addEventListener('load',function(){
    if(window.ResizeObserver){
      try{ new ResizeObserver(function(){ reportHeight(); }).observe(document.body); }catch(e){}
    }
    setTimeout(function(){
      if(!mReady) bootMsg('El mapa tarda en cargar. Revisa la consola si sigue así.', true);
    },12000);
  });
})();
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCrhdC_dRakb4Wp0lN8ySjW1ipuFuYgtD8&libraries=places,geometry&callback=mapsReady" async defer></script>
</body>
</html>
