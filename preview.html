<div class="pv-wrap">
<div class="pv-note">
  <b>PREVIEW v201</b> — shell nativo Caja/Rutas (sin PIN). Google Maps es el mapa primario; OSM solo si Google falla.<br>
  Producción: hard-refresh <code>https://portal.minecore.ec/?v=201</code>
</div>
<div id="caja-screen" class="on"></div>
</div>
<script>
window.getProfile=function(){return {nombre:'Esteban Ferlito',rol:'admin',modulos:['caja+']};};
window.getUserName=function(){return 'EFCH';};
window.getPin=function(){return '';};
window.mcHideNotifBar=function(){};
window.goHome=function(){ var t=document.getElementById('toast'); if(window.toast) toast('En portal esto vuelve al menú Admin'); };
(function(){
  var real=window.fetch.bind(window);
  function j(obj){ return Promise.resolve({ok:true, text:function(){ return Promise.resolve(JSON.stringify(obj)); }}); }
  var hoy=new Date();
  var ymd=hoy.toISOString().split('T')[0];
  var rutas=[
    {ID:'R-DEMO-1','Fecha Servicio':ymd,'Fecha Solicitud':ymd,Usuario:'OPM',Destino:'La Carolina — Quito',Estado:'Pendiente','Valor ($)':12.4,KM:31,Vehiculo:'Camioneta Poer',Motivo:'Entrega',Origen:'Minecore'},
    {ID:'R-DEMO-2','Fecha Servicio':ymd,Usuario:'EFCH',Destino:'Cumbayá — Quito',Estado:'Aprobada','Valor ($)':8.8,KM:22,Vehiculo:'Camioneta Nissan',Motivo:'Diligencia',Origen:'Minecore'},
    {ID:'R-DEMO-3','Fecha Servicio':ymd,Usuario:'MPL',Destino:'Valle de los Chillos',Estado:'Aprobada','Valor ($)':16,KM:40,Vehiculo:'Camioneta Mazda',Motivo:'Despacho',Origen:'Minecore'}
  ];
  window.fetch=function(url,opts){
    var u=String(url||'');
    if(u.indexOf('script.google.com')<0) return real(url,opts);
    var action='';
    try{ action=new URL(u,location.href).searchParams.get('action')||''; }catch(e){}
    if(!action && opts && opts.body){ try{ action=JSON.parse(opts.body).action||''; }catch(e2){} }
    if(action==='getConfig') return j({ok:true,config:{precio_km:0.40,corte_dia_inicio:26,corte_dia_fin:25}});
    if(action==='getUsuarios') return j({ok:true,usuarios:[
      {usuario:'EFCH',nombre:'Esteban Ferlito',rol:'admin',activo:'SI'},
      {usuario:'OPM',nombre:'Oswaldo Pena',rol:'chofer',activo:'SI'}
    ]});
    if(action==='getRutas'){
      try{
        var q=new URL(u,location.href).searchParams;
        var est=q.get('estado');
        var out=rutas;
        if(est) out=rutas.filter(function(r){ return r.Estado===est; });
        return j({ok:true,rutas:out});
      }catch(e){ return j({ok:true,rutas:rutas}); }
    }
    if(action==='getBalanceCaja') return j({ok:true,balances:[
      {usuario:'EFCH',nombre:'Esteban Ferlito',entregado:200,aprobado:80,pendiente:20,disponible:120},
      {usuario:'OPM',nombre:'Oswaldo Pena',entregado:80,aprobado:40,pendiente:10,disponible:40}
    ]});
    if(action==='getGastos') return j({ok:true,gastos:[
      {ID:'G-1',Usuario:'OPM','Monto ($)':18.5,Estado:'Pendiente',Descripcion:'Combustible',Fecha:ymd}
    ]});
    if(action==='getEntregas') return j({ok:true,entregas:[]});
    return j({ok:true});
  };
})();
</script>
