    if(!esRezoom)despZoomN=1;
    var m=despModal('<div style="width:100%;max-width:920px;height:94%;display:flex;flex-direction:column;background:#0d1622;border:1px solid #1e3247;border-radius:12px;overflow:hidden">'+
      '<div class="cbz-card-row" style="justify-content:space-between;align-items:center;padding:10px 12px;flex:none;flex-wrap:wrap;gap:6px">'+
      '<div class="cbz-card-name" style="font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">📄 '+nombre+'</div>'+
      '<div style="display:flex;gap:8px;flex:none">'+
      '<button class="chip" onclick="Inv.despZoom(-1)">🔍−</button>'+
      '<button class="chip" onclick="Inv.despZoom(1)">🔍+</button>'+
      '<a class="chip" style="text-decoration:none" href="'+archivo+'" download>⬇</a>'+
      '<a class="chip" style="text-decoration:none" href="'+archivo+'" target="_blank">↗</a>'+
      '<button class="chip" onclick="Inv.despCerrar()">✕ Cerrar</button></div></div>'+
      '<div id="pdf-hint" style="background:#12233a;color:#9fc3e8;font-size:11px;padding:6px 12px;flex:none">👆 Toca cualquier <b style="color:#f0c040">código resaltado</b> del documento y te mostramos el producto y su stock al instante.</div>'+
      '<div id="pdf-vis" style="flex:1;overflow:auto;background:#3a3f46;padding:10px 0;-webkit-overflow-scrolling:touch"><div class="cbz-loading" style="color:#fff">Cargando documento...</div></div></div>');
    var listoAlgo=false, caido=false;
    function aIframe(motivo){
      if(caido)return;caido=true;
      var cont=document.getElementById('pdf-vis');
      if(!cont)return;
      cont.innerHTML='<iframe src="'+archivo+'" style="border:0;width:100%;height:100%;background:#fff"></iframe>';
      var hb=document.getElementById('pdf-hint');
      if(hb)hb.innerHTML='📄 Visor simple ('+motivo+'): los códigos no son tocables en este documento. Usa ⬇ o ↗ si no se ve.';
    }
    // Watchdog: si en 12s no se pintó ninguna página, cae al visor simple
    setTimeout(function(){if(!listoAlgo)aIframe('tardó demasiado');},12000);
    cargarPdfjs().then(function(){
      return window.pdfjsLib.getDocument({url:archivo}).promise;
    }).then(function(pdf){
      var cont=document.getElementById('pdf-vis');
      if(!cont||caido)return;
      despPdfActual=pdf;if(!esRezoom)despMaxPag=Math.min(pdf.numPages,15);else despMaxPag=Math.min(pdf.numPages,despMaxPag);
      cont.innerHTML='';
      var ancho=Math.max(Math.min(cont.clientWidth-16,880),280)*despZoomN;
      function pinta(n){
        if(caido)return;
        var maxPag=despMaxPag;
        if(n>maxPag){
          if(!listoAlgo){aIframe('no se pudo pintar');return;}
          if(pdf.numPages>maxPag)cont.insertAdjacentHTML('beforeend','<div id="pdf-mas" style="color:#fff;text-align:center;padding:12px">Mostrando '+maxPag+' de '+pdf.numPages+' páginas. '+
            '<button class="chip" onclick="Inv.despMas()">⬇ Cargar 15 más (sin salir)</button></div>');
          return;
        }
        pdf.getPage(n).then(function(page){
          var vp0=page.getViewport({scale:1});
          var esc=ancho/vp0.width;
          var vp=page.getViewport({scale:esc});
          var dpr=Math.min(window.devicePixelRatio||1,2);
          var wrap=document.createElement('div');
          wrap.style.cssText='position:relative;margin:0 auto 12px;width:'+vp.width+'px;height:'+vp.height+'px;background:#2c3138;box-shadow:0 2px 10px rgba(0,0,0,.4)';
          var cv=document.createElement('canvas');
          cv.width=Math.floor(vp.width*dpr);cv.height=Math.floor(vp.height*dpr);
          cv.style.cssText='width:'+vp.width+'px;height:'+vp.height+'px;display:block';
          wrap.appendChild(cv);
          cont.appendChild(wrap);
          var ctx=cv.getContext('2d');
          ctx.scale(dpr,dpr);
          page.render({canvasContext:ctx,viewport:vp}).promise.then(function(){
            wrap.style.background='#fff';
            listoAlgo=true;
            return page.getTextContent().then(function(tc){
              // 1) Agrupar fragmentos de texto por renglón (misma altura y misma línea base)
              var lineas={};
              tc.items.forEach(function(it){

                if(!str)return;

                if(Math.abs(tr[1])>0.01||Math.abs(tr[2])>0.01)return; // texto rotado: fuera
                var fh=Math.hypot(tr[2],tr[3])||Math.abs(tr[3]);
                if(fh<4)return;
                var x=tr[4], yBase=tr[5];
                var wTot=(it.width||0)*vp.scale;
                var key=Math.round(yBase*2)/2;
                (lineas[key]=lineas[key]||[]).push({x:x,w:wTot,str:str,fh:fh,yBase:yBase});
              });
              // 2) Por renglón: ordenar, unir con mapa de posición por carácter y separar columnas lejanas
              Object.keys(lineas).forEach(function(k){
                var frs=lineas[k].sort(function(a,b){return a.x-b.x;});
                var chars=[], texto='';
                for(var f=0;f<frs.length;f++){
                  var it=frs[f], n=it.str.length, cw=n?it.w/n:0;
                  if(f>0){
                    var prev=frs[f-1], gap=it.x-(prev.x+prev.w);
                    var cwRef=Math.max(cw,(prev.str.length?prev.w/prev.str.length:0),3);
                    if(gap>cwRef*1.6){texto+='\u0001';chars.push(null);} // otra columna: corta la unión
                  }
                  for(var c=0;c<n;c++){texto+=it.str[c];chars.push({x:it.x+cw*c,w:cw,fh:it.fh,yBase:it.yBase});}
                }
                var re=/\d{9,14}/g,mm;
                while((mm=re.exec(texto))){
                  var c0=chars[mm.index], c1=chars[mm.index+mm[0].length-1];

                  var fh=c0.fh, yTop=c0.yBase-fh;

        }).catch(function(eP){console.error('getPage '+n,eP);pinta(n+1);});
      }
      despPintaRef=pinta;
      pinta(1);
    }).catch(function(eDoc){

     Safari, al "Guardar como PDF", vuelve a cargar el documento; con blob: eso daba PDF en blanco y
     reiniciaba la app. Con el iframe el contenido vive en el DOM y se imprime tal cual se ve. */
  var prev=document.getElementById('mc-planilla-ov');if(prev)prev.remove();
  var ov=document.createElement('div');ov.id='mc-planilla-ov';
  ov.style.cssText='position:fixed;inset:0;z-index:1000;background:#0b0f14;display:flex;flex-direction:column';

    '<button class="chip" id="mc-pl-tab" title="Abrir en una pestaña aparte (por ejemplo para compartir en iPhone)">↗ Abrir en pestaña</button>'+
    '<button class="chip" id="mc-pl-close">✖ Cerrar</button>';
  var fr=document.createElement('iframe');
  fr.style.cssText='flex:1;width:100%;border:0;background:#f4f4f4';
  fr.setAttribute('title','Planilla de cotización');
  fr.srcdoc=html;
  ov.appendChild(bar);ov.appendChild(fr);document.body.appendChild(ov);
  document.body.style.overflow='hidden';
  function cerrar(){try{ov.remove();}catch(e){}document.body.style.overflow='';}
  bar.querySelector('#mc-pl-close').onclick=cerrar;
  bar.querySelector('#mc-pl-print').onclick=function(){
    var prevTitle=document.title;
    var restored=false;
    function restoreTitle(){
      if(restored)return;restored=true;
      try{document.title=prevTitle;}catch(e){}
      try{window.removeEventListener('afterprint',restoreTitle);}catch(e){}
    }
    try{
      document.title=_plTitle;
      try{if(fr.contentDocument)fr.contentDocument.title=_plTitle;}catch(e){}
      window.addEventListener('afterprint',restoreTitle);
      setTimeout(restoreTitle,2500);
      fr.contentWindow.focus();
      fr.contentWindow.print();
    }catch(e){
      restoreTitle();
      alert('No se pudo abrir el diálogo de impresión: '+e.message);
    }
  };
  bar.querySelector('#mc-pl-tab').onclick=function(){
    var prevTitle=document.title;
    try{document.title=_plTitle;}catch(e){}
    var blob=new Blob([html],{type:'text/html'});var url=URL.createObjectURL(blob);
    var w=window.open(url,'_blank');if(!w)alert('El navegador bloqueó la ventana. Permite ventanas emergentes para la app.');
    setTimeout(function(){try{document.title=prevTitle;}catch(e){}},1500);
  };

  function czPintaCliDd(){
    var dd=document.getElementById('cz-cli-dd');
    if(!dd)return;
    var list=czClientes||MCWarm.getClientes()||[];
    if(list.length)czClientes=list;
    var q=czNorm(czCliQ||((document.getElementById('cz-cli')||{}).value||''));

  function czRender(){
    var box=document.getElementById('cz-res');
    if(!box)return;
    czHydrateFromWarm();
    if(!prodCat||!prodCat.length){
      var st=MCWarm.status();
      if(st.productosErr&&!st.productosLoading){
        box.innerHTML='<div class="cbz-error">No se pudo cargar el catálogo. '+czEsc(st.productosErr)+'</div>'+
          '<div class="cbz-card-row" style="margin-top:8px"><button class="cbz-btn" onclick="Cot.czRetryCat()">↻ Reintentar catálogo</button></div>';
        return;
      }
      box.innerHTML='<div class="cbz-loading">Cargando catálogo...</div>';
      return;
    }
    var toks=czQ.toLowerCase().split(/\s+/).filter(String);
    var hayFiltro=czCat||czLin||czDesc||czMm;
    if(!toks.length&&!hayFiltro){
      if(czDestino==='det'){
        box.innerHTML='<div class="cbz-muted" style="font-size:12px;padding:8px 2px">Busca arriba o elige una categoría — '+prodCat.length+' productos en catálogo.</div>';
        return;
      }
      var preview=prodCat.slice(0,24);
      var head='<div class="cbz-muted" style="font-size:12px;padding:4px 2px 8px">Catálogo listo · '+prodCat.length+' productos'+(MCWarm.status().productosLoading?' · actualizando…':'')+' — busca o elige una categoría.</div>';
      box.innerHTML=head+preview.map(czCardHtml).join('');
      return;
    }
    var res=[];
    for(var i=0;i<prodCat.length&&res.length<30;i++){
      var p=prodCat[i];
      if(czCat&&p.categoria!==czCat)continue;
      if(czLin&&!czHayEn(p,czLin))continue;
      if(czDesc&&!czHayEn(p,czDesc))continue;
      if(czMm&&!czHayEn(p,czMm+' MM'))continue;
      var H=(p.sku+' '+p.nombre+' '+p.codigo).toLowerCase();
      var ok=true;
      for(var t=0;t<toks.length;t++){if(H.indexOf(toks[t])<0){ok=false;break;}}
      if(ok)res.push(p);
    }
    if(!res.length){box.innerHTML='<div class="cbz-muted" style="padding:8px 2px">Sin resultados para "'+czEsc(czQ)+'".</div>';return;}
    box.innerHTML=res.map(czCardHtml).join('');

  /* ---------- v131: arrastrar para reordenar (pointer events: mouse y táctil) ---------- */
  var drag=null;
  function dragStart(ev,i){
    if(!esLineaEditable())return;
    activaEdicion();
    ev.preventDefault();
    var card=ev.target.closest('.cot-linea');if(!card)return;
    drag={from:i,card:card,target:null,pos:''};
    card.classList.add('dragging');
    try{ev.target.setPointerCapture(ev.pointerId);}catch(e){}
    var mv=function(e){
      if(!drag)return;
      e.preventDefault();
      var y=e.clientY;
      if(y<70)window.scrollBy(0,-12);else if(y>window.innerHeight-70)window.scrollBy(0,12);
      var cards=document.querySelectorAll('.cot-linea');var best=null,pos='';
      for(var k=0;k<cards.length;k++){
        var c=cards[k];if(c===drag.card)continue;
        var r=c.getBoundingClientRect();
        if(y>=r.top&&y<=r.bottom){best=c;pos=(y<r.top+r.height/2)?'before':'after';break;}
      }
      if(drag.target&&drag.target!==best){drag.target.classList.remove('drop-before','drop-after');}
      if(best){best.classList.remove('drop-before','drop-after');best.classList.add(pos==='before'?'drop-before':'drop-after');}
      drag.target=best;drag.pos=pos;
    };
    var up=function(e){
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
      if(!drag)return;
      var d=drag;drag=null;
      d.card.classList.remove('dragging');
      if(d.target){
        d.target.classList.remove('drop-before','drop-after');
        var to=parseInt(d.target.getAttribute('data-idx'),10);
        var from=d.from;
        var item=det.lineas.splice(from,1)[0];
        if(from<to)to--;
        if(d.pos==='after')to++;
        if(to<0)to=0;if(to>det.lineas.length)to=det.lineas.length;
        det.lineas.splice(to,0,item);
        renderDet();
        if(to!==from)persistItems(false);
      }
    };
    document.addEventListener('pointermove',mv,{passive:false});
    document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  }

      if(!res.ok){el.innerHTML='<div class="cbz-error">'+res.error+'</div>';return;}
      data=res;vistaE='cartera';detalle=null;q='';render();
    }).catch(function(e){el.innerHTML='<div class="cbz-error">'+MCerr(e)+'</div>';});
  }
  function render(){
    var el=document.getElementById('edc-screen');
    el.innerHTML='<div class="cbz-muted" style="margin-bottom:6px">'+data.empresa+'</div>'+
      '<div id="edc-kpis"></div>'+
      '<div class="cbz-card-row" style="margin-bottom:6px">'+
      '<input class="cbz-search" placeholder="🔍 Buscar orden, factura, fecha, monto..." value="'+q.replace(/"/g,'&quot;')+'" oninput="Edc.setQ(this.value)">'+
      '</div>'+
      '<div id="edc-tabs"></div>'+
      '<div id="edc-list"></div>';
    renderListE();
  }
  function pasaE(o){
    if(vistaE==='cartera'&&!(o.facturada&&o.saldo>0.005))return false;
    if(vistaE==='hist'&&!o.facturada)return false;
    if(vistaE==='pend'&&o.facturada)return false;
    if(q){
      var b=(o.ov+' '+o.factura+' '+o.fecha+' '+o.vence+' '+o.estado+' '+o.total+' '+o.saldo+' '+o.invStatus).toLowerCase();
      var toks=q.toLowerCase().split(/\s+/).filter(String);
      for(var i=0;i<toks.length;i++){if(b.indexOf(toks[i])<0)return false;}
    }
    return true;
  }
  function renderListE(){
    var tabs=document.getElementById('edc-tabs');
    if(tabs)tabs.innerHTML='<div class="cbz-card-row" style="margin-bottom:10px">'+
      '<button class="chip '+(vistaE==='cartera'?'on':'')+'" onclick="Edc.setV(\'cartera\')">💳 Cartera actual</button>'+
      '<button class="chip '+(vistaE==='hist'?'on':'')+'" onclick="Edc.setV(\'hist\')">📜 Historial facturado</button>'+
      '<button class="chip '+(vistaE==='pend'?'on':'')+'" onclick="Edc.setV(\'pend\')">⏳ Pendientes sin facturar</button>'+
      '<button class="chip" onclick="Edc.toggleOrden()">'+(ordenDesc?'↓ Más recientes primero':'↑ Más antiguas primero')+'</button>'+
      '</div>';
    var rows=data.ordenes.filter(pasaE);
    rows.sort(function(a,b){
      var fa=a.fecha||'', fb=b.fecha||'';
      return ordenDesc ? (fa<fb?1:-1) : (fa<fb?-1:1);
    });
    // KPIs dinámicos sobre lo filtrado
    var kbox=document.getElementById('edc-kpis');
    if(kbox){
      // Resumen SOLO en la cartera (lo que deben hoy). En historial y pendientes,
      // los totales se los calculan ellos: la app no les hace la tarea.
      if(vistaE!=='cartera'){
        kbox.innerHTML='';
      } else {
        var c=0,ve=0,vi=0;
        rows.forEach(function(o){c+=o.saldo;if(o.estado==='vencida')ve+=o.saldo;else vi+=o.saldo;});
        kbox.innerHTML='<div class="cbz-kpis" style="margin-bottom:12px">'+
          '<div class="cbz-kpi"><span class="cbz-kpi-num">'+fmt(c)+'</span><span class="cbz-kpi-lbl">Cartera facturada</span></div>'+
          '<div class="cbz-kpi"><span class="cbz-kpi-num cbz-red">'+fmt(ve)+'</span><span class="cbz-kpi-lbl">Vencido</span></div>'+
          '<div class="cbz-kpi"><span class="cbz-kpi-num" style="color:#6fd68f">'+fmt(vi)+'</span><span class="cbz-kpi-lbl">Vigente</span></div>'+
          '</div>';
      }
    }
    var box=document.getElementById('edc-list');
    if(!box)return;
    if(!rows.length){
      box.innerHTML='<div class="cbz-muted" style="padding:14px;text-align:center">'+
        (q?'Sin resultados para "'+q+'"':
         vistaE==='cartera'?'No tienes facturas pendientes 🎉':
         vistaE==='pend'?'No tienes órdenes pendientes de facturar.':'Sin facturas registradas.')+'</div>';
      return;
    }
    box.innerHTML=rows.map(function(o){
      var tag=o.estado==='pagada'?'<span class="tagx tf">PAGADA</span>':
        o.estado==='vencida'?'<span class="tagx tn">VENCIDA'+(o.diasMora?' '+o.diasMora+'d':'')+'</span>':
        o.estado==='vigente'?'<span class="tagx" style="background:#3a3a1c;color:#f0c040">VIGENTE</span>':
        '<span class="tagx" style="background:#1c3a4a;color:#5cc8ff">⏳ SIN FACTURAR</span>';
      var open=detalle&&detalle.ov===o.ov;
      var c='<div class="cbz-card" style="padding:10px 12px">'+
        '<div class="cbz-card-row" style="justify-content:space-between;align-items:flex-start;cursor:pointer" onclick="Edc.abrir(\''+o.ov.replace(/'/g,'')+'\')">'+
        '<div style="flex:1;min-width:0"><div class="pname">'+(open?'▾ ':'')+o.ov+(o.factura?' · Fact. '+o.factura:'')+'</div>'+
        '<div class="pmeta">'+o.fecha+(o.vence&&o.estado!=='pendiente'?' · Vence: '+o.vence:'')+(o.estado==='pagada'&&o.fechaPago?' · Pagada: '+o.fechaPago:'')+(o.estado==='pendiente'&&o.invStatus?' · '+o.invStatus:'')+'</div></div>'+
        '<div style="text-align:right;flex:none">'+tag+'<div class="pname" style="margin-top:4px">'+fmt(o.total)+'</div>'+
        (o.facturada&&o.saldo>0.005?'<div class="pmeta" style="color:#f0c040">Saldo: '+fmt(o.saldo)+'</div>':'')+'</div></div>';
      if(open){
        c+='<div class="odetail">';
        if(detalle.cargando)c+='<div class="cbz-loading">Cargando detalle...</div>';
        else if(detalle.error)c+='<div class="cbz-error">'+detalle.error+'</div>';
        else{
          if(detalle.lines&&detalle.lines.length){
            c+=detalle.lines.map(function(l){
              return '<div class="cbz-fact-row" style="align-items:center;gap:8px">'+
                (l.img?'<img src="'+l.img+'" class="pimg" style="width:34px;height:34px" loading="lazy" onerror="this.style.display=\'none\'">':'')+
                '<span class="cbz-fact-id" style="flex:1;min-width:0">'+l.producto+(l.sku?'<div class="pmeta">SKU: '+l.sku+'</div>':'')+'</span>'+
                '<span class="cbz-muted" style="text-align:right">'+fmtQty(l.cantidad)+' × '+fmt(l.precio)+(l.desc?' (−'+l.desc+')':'')+'<br><b>'+fmt(l.subtotal)+'</b></span></div>';
            }).join('');
          } else c+='<div class="cbz-muted">Sin detalle disponible.</div>';
          if(detalle.resumen){
            var rs=detalle.resumen;
            c+='<div class="cbz-card-row" style="justify-content:flex-end;margin-top:8px;border-top:1px solid #26313f;padding-top:8px">'+
              '<div style="text-align:right" class="cbz-muted">Subtotal: <b>'+fmt(rs.subtotal)+'</b> · IVA: <b>'+fmt(rs.iva)+'</b> · Total: <b style="color:#fff">'+fmt(rs.total)+'</b><br>'+
              'Pagado: <b style="color:#6fd68f">'+fmt(rs.pagado)+'</b>'+(rs.saldo>0.005?' · Por pagar: <b style="color:#f0c040">'+fmt(rs.saldo)+'</b>':' · <b style="color:#6fd68f">✅ Sin saldo pendiente</b>')+'</div></div>';
          }
        }
        c+='</div>';
      }
      return c+'</div>';
    }).join('');
  }
  function setQ(v){q=v;renderListE();}
  function setV(v){vistaE=v;detalle=null;renderListE();}
  function toggleOrden(){ordenDesc=!ordenDesc;renderListE();}
  function abrir(ov){
    if(detalle&&detalle.ov===ov){detalle=null;renderListE();return;}
    detalle={ov:ov,cargando:true};renderListE();
    api({action:'miOrden',ov:ov}).then(function(res){
      if(!detalle||detalle.ov!==ov)return;
      detalle=res.ok?{ov:ov,lines:res.lines||[],resumen:res.resumen||null}:{ov:ov,error:res.error||'No se pudo cargar'};
      renderListE();
    }).catch(function(){if(detalle&&detalle.ov===ov){detalle={ov:ov,error:'Sin conexión.'};renderListE();}});
  }
  function solicitar(btn){
    if(btn){btn.disabled=true;btn.textContent='Enviando...';}
    api({action:'solicitarEdc'}).then(function(res){
      var m=document.getElementById('edc-sol-msg');
      if(btn){btn.disabled=false;btn.textContent='📨 Solicitar autorización';}
      if(m)m.innerHTML=res.ok?'<div style="color:#6fd68f">✅ '+res.mensaje+'</div>':'<div class="cbz-error">'+(res.error||'No se pudo enviar')+'</div>';
    }).catch(function(){
      if(btn){btn.disabled=false;btn.textContent='📨 Solicitar autorización';}
      var m=document.getElementById('edc-sol-msg');if(m)m.innerHTML='<div class="cbz-error">Sin conexión.</div>';
    });
  }
  return {init:init,setV:setV,setQ:setQ,abrir:abrir,solicitar:solicitar,toggleOrden:toggleOrden};
})();

/* ===================== MI EQUIPO (cliente máster: invita y administra) ===================== */
var MInv = (function(){
  var equipo=[], pm=[];
  function api(p){
    p.user=getUserName();p.pin=getPin();
    return MCpost(p);
  }
  var NOMBRES={inventario:'Inventario',cotizaciones:'Cotizaciones',estadocuenta:'Estado de cuenta',consignacion:'Consignación y alquiler'};
  function propios(){
    var p=getProfile();
    var seen={};
    return (p.modulos||[]).map(function(m){return m.replace(/\+$/,'');})
      .filter(function(m){if(seen[m])return false;seen[m]=1;return true;});
  }
  function init(){
    var el=document.getElementById('minv-screen');
    el.innerHTML='<div class="cbz-loading">Cargando tu equipo...</div>';
    api({action:'teamList'}).then(function(res){
      if(!res.ok){el.innerHTML='<div class="cbz-error">'+res.error+'</div>';return;}
      equipo=res.equipo||[];
      pm=res.misModulos&&res.misModulos.length?res.misModulos:propios();
      var checks=pm.map(function(m){
        return '<label class="cbz-esc" style="margin-right:14px"><input type="checkbox" id="mi-mod-'+m+'" checked> '+(NOMBRES[m]||m)+'</label>';
      }).join('');
      el.innerHTML='<div class="cbz-card"><div class="cbz-card-name">👥 Invitar a alguien de '+(res.empresa||'tu organización')+'</div>'+
        '<div class="cbz-muted" style="margin:6px 0 10px">Elige qué puede ver. La persona creará su propio usuario y PIN con el link (un solo uso).</div>'+
        '<div class="cbz-card-row" style="flex-wrap:wrap">'+checks+'</div>'+
        '<div class="cbz-card-row" style="margin-top:10px"><button class="cbz-btn" onclick="MInv.crear()">Crear link de invitación</button></div>'+
        '<div id="mi-result" style="margin-top:10px"></div></div>'+
        '<div id="mi-equipo"></div>';
      renderEquipo();
    }).catch(function(e){el.innerHTML='<div class="cbz-error">'+MCerr(e)+'</div>';});
  }

  function renderEquipo(){
    var box=document.getElementById('mi-equipo');
    if(!box)return;
    var h='<div class="cbz-card" style="margin-top:14px"><div class="cbz-card-name">🧑‍🤝‍🧑 Tu equipo</div>';
    if(!equipo.length)h+='<div class="cbz-muted" style="padding:10px">Aún no has invitado a nadie.</div>';
    h+=equipo.map(function(u,i){
      var toks=(u.modulos||'').split(',').map(function(x){return x.trim().replace(/\+$/,'');});
      var editable=!u.esYo&&!u.master;
      var c='<div class="cbz-card" style="padding:10px 12px;margin-top:8px'+(u.activo?'':';opacity:.6')+'">'+
        '<div class="cbz-card-row" style="justify-content:space-between"><div class="cbz-card-name">'+u.nombre+
        (u.esYo?' <span class="tagx tf">TÚ</span>':'')+
        (u.master?' <span class="tagx" style="background:#3a2c1c;color:#f0c040">MÁSTER</span>':'')+
        (u.activo?'':' <span class="tagx tn">INACTIVO</span>')+'</div></div>';
      if(editable){
        c+='<div class="cbz-card-row" style="flex-wrap:wrap;margin-top:6px">'+
          pm.map(function(m){
            return '<label class="cbz-esc" style="margin-right:12px"><input type="checkbox" id="t-'+i+'-'+m+'" '+(toks.indexOf(m)>=0?'checked':'')+'> '+(NOMBRES[m]||m)+'</label>';
          }).join('')+
          '<label class="cbz-esc" style="margin-right:12px"><input type="checkbox" id="t-'+i+'-activo" '+(u.activo?'checked':'')+'> Activo</label>'+
          '</div><div class="cbz-card-row" style="margin-top:6px">'+
          '<button class="cbz-btn-sec" onclick="MInv.guardar('+i+',this)">Guardar</button>'+
          '<button class="cbz-btn-sec cbz-danger" onclick="MInv.eliminar('+i+')">Eliminar</button></div>';
      } else if(!u.esYo){
        c+='<div class="cbz-muted" style="margin-top:4px">A los usuarios máster los administra Minecore.</div>';
      }
      return c+'</div>';
    }).join('');
    box.innerHTML=h+'</div>';
  }
  function guardar(i,btn){
    var u=equipo[i];
    var sel=pm.filter(function(m){var c=document.getElementById('t-'+i+'-'+m);return c&&c.checked;}).join(',');
    var act=document.getElementById('t-'+i+'-activo').checked;
    if(btn)btn.disabled=true;
    api({action:'teamSave',nombre:u.nombre,modulos:sel,activo:act}).then(function(res){
      if(btn)btn.disabled=false;
      if(!res.ok){alert('Error: '+res.error);return;}
      init();
    }).catch(function(){if(btn)btn.disabled=false;alert('Sin conexión.');});
  }
  function eliminar(i){
    var u=equipo[i];
    if(!confirm('¿Eliminar a '+u.nombre+' de tu organización? No podrá volver a entrar.'))return;
    api({action:'teamDelete',nombre:u.nombre}).then(function(res){
      if(!res.ok){alert('Error: '+res.error);return;}
      init();
    }).catch(function(e){alert(MCerr(e)+'.');});
  }
  function crear(){
    var sel=pm.filter(function(m){var c=document.getElementById('mi-mod-'+m);return c&&c.checked;}).join(',');
    if(!sel){alert('Elige al menos un módulo.');return;}
    api({action:'createInvite',rol:'cliente',modulos:sel}).then(function(res){
      var box=document.getElementById('mi-result');
      if(!res.ok){box.innerHTML='<div class="cbz-error">'+res.error+'</div>';return;}
      var link=location.origin+location.pathname+'?invite='+res.token;
      box.innerHTML='<div class="cbz-muted" style="word-break:break-all;background:#0e1622;border-radius:8px;padding:10px">'+link+'</div>'+
        '<button class="cbz-btn-sec" style="margin-top:8px" onclick="MInv.copiar(this)" data-link="'+link+'">📋 Copiar link</button>';
    }).catch(function(e){alert(MCerr(e)+'.');});
  }
  function copiar(btn){
    var link=btn.getAttribute('data-link');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(function(){btn.textContent='✅ Copiado';});
    } else { prompt('Copia el link:',link); }
  }
  return {init:init,crear:crear,copiar:copiar,guardar:guardar,eliminar:eliminar};
})();

/* ===================== VINCULACIÓN DE ORGANIZACIÓN (cliente) ===================== */
var Vinc = (function(){
  function api(p){
    p.user=getUserName();p.pin=getPin();
    return MCpost(p);
  }
  function marcarVinculada(emp){
    try{
      var pr=JSON.parse(localStorage.getItem('mc_profile')||'{}');
      pr.vinculada=true;if(emp)pr.empresa=emp;
      localStorage.setItem('mc_profile',JSON.stringify(pr));
    }catch(e){}
    renderHome();
  }
  function run(){
    api({action:'matchMiEmpresa'}).then(function(res){
      if(!res.ok){alert(res.error||'No se pudo buscar.');return;}
      if(res.vinculada){alert('Tu organización ya está vinculada. ✅');marcarVinculada();return;}
      var cand=res.candidatos||[];
      if(!cand.length){alert('No encontramos una coincidencia con "'+(getProfile().empresa||'')+'". Escríbenos a Minecore y te vinculamos manualmente.');return;}
      var msg='¿Cuál es tu organización?\n\n'+cand.map(function(c,i){return (i+1)+') '+c;}).join('\n')+'\n\nEscribe el número (o Cancelar):';
      var sel=prompt(msg,'1');
      if(sel===null)return;
      var idx=parseInt(sel,10)-1;
      if(!(idx>=0&&idx<cand.length)){alert('Opción inválida.');return;}
      api({action:'confirmarMiEmpresa',empresa:cand[idx]}).then(function(r2){
        if(!r2.ok){alert(r2.error||'No se pudo confirmar.');return;}
        alert('✅ '+r2.mensaje);
        marcarVinculada(r2.empresa);
      }).catch(function(e){alert(MCerr(e)+'.');});
    }).catch(function(e){alert(MCerr(e)+'.');});
  }
  return {run:run};
})();

      '<label class="ulabel" style="margin-top:14px">🕶 Copia oculta (BCC) — invisible para el cliente</label>'+
      '<div class="cbz-muted" style="font-size:11px;margin:0 0 4px">Uno o varios correos separados por coma — p. ej. tú y Oscar, para que ambos vean lo que salió</div>'+
      '<input class="uinput" id="mc-bcc" placeholder="tucorreo@..., oscarvalle@minecore.ec" value="'+(cfg.bccEmail||'').replace(/"/g,'&quot;')+'">'+
      '<div class="cbz-card-row" style="gap:8px;margin-top:16px;flex-wrap:wrap">'+

      '3. En el Gmail de <b>'+cfg.cuentaScript+'</b>: ⚙ → Cuentas → "Enviar como" → agregar cada remitente que uses → el código llega al buzón de destino → verificar.<br>'+
      '4. Volver aquí: escribir los remitentes, tu BCC, Guardar (los semáforos deben ponerse ✅) y Enviar prueba.</div></div>';

  function guardar(){

      senderCobranza:(document.getElementById('mc-cob')||{}).value||'',

      alert(res.alerta?('💾 Guardado.\n\n'+res.alerta):'💾 Configuración guardada. El motor de correos ya la usa desde ahora.');
      init();
    }).catch(function(err){alert('Falla técnica al guardar: '+(err&&err.message?err.message:err));});
  }
  function probar(){
    var API_T0=Date.now();
    api({action:'testMailConfig'}).then(function(res){
      if(!res.ok){alert('No se pudo enviar: '+res.error);return;}
      alert('📨 Correo de prueba enviado a '+res.enviado+'.\nRevisa DE QUÉ remitente llegó — esa es la verificación real.');
    }).catch(function(err){
      alert('Falla técnica ('+Math.round((Date.now()-API_T0)/1000)+'s): '+(err&&err.message?err.message:err)+'\n\nSi menciona JSON o token, el servidor devolvió un error interno — screenshot de esto por favor.');
    });
  }
  return {init:init,guardar:guardar,probar:probar};
})();

          '<div class="cbz-card-name">'+(ab?'▾ ':'▸ ')+'🏢 '+(r[iEmp]||'(sin nombre)')+'</div>'+
          ((r[iCred]||'').toUpperCase()==='SI'?'<span style="color:#f0c040;font-weight:bold;font-size:11px">💳 PIDE CRÉDITO</span>':'')+'</div>'+
          '<div class="cbz-card-row cbz-muted" style="font-size:11px;justify-content:space-between;cursor:pointer" onclick="Kyc.tog('+ix+')">'+
          '<span>RUC: '+(r[iRuc]||'—')+'</span><span>'+(r[iFec]||'')+'</span></div>';
        if(ab){
          h2+=data.headers.map(function(hd,ci){
            var v=r[ci];
            if(!v||ci===iEmp||ci===iRuc||ci===iFec)return '';
            return '<div class="cbz-fact-row" style="gap:8px;margin-top:5px;align-items:flex-start">'+
              '<span class="cbz-muted" style="font-size:10.5px;min-width:170px;flex:none">'+hd+'</span>'+
              '<span style="font-size:12.5px;white-space:pre-line;word-break:break-word">'+String(v).replace(/</g,'&lt;')+'</span></div>';
          }).join('');

        return h2+'</div>';
      }).join('');
