<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#0b1219}body{background:#0b1219;color:#dce6f0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;min-height:100vh}
#shell{max-width:640px;margin:0 auto;padding:16px}
/* ===== Modo escritorio ===== */
@media(min-width:1024px){
  #shell{max-width:1120px;padding:22px 28px}
  .mods{grid-template-columns:repeat(3,1fr);gap:10px}
  .mod{padding:12px 14px}
  .mod h3{font-size:14px}
  .cbz-card{padding:16px 18px}
  input.uinput,select.uinput{font-size:14px}
  /* listas largas a dos columnas donde son tarjetas independientes */
  #inv-list,#kyc-body,#consig-body .cbz-lista2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  #inv-list>.cbz-card,#kyc-body>.cbz-card{margin:0}
  /* el detalle/planilla y el cotizador respiran a ancho completo */
  #cz-desp{max-width:100%}
}
@media(min-width:1500px){
  #shell{max-width:1280px}
  .mods{grid-template-columns:repeat(4,1fr)}
}
.topbar{display:flex;align-items:center;gap:8px;padding:6px 0 14px;flex-wrap:nowrap}
.topbar .dot{width:10px;height:10px;border-radius:50%;background:#2e9e5b;flex:none}
.topbar h1{font-size:17px;letter-spacing:1px;flex:1}
#title:empty{display:none}
.topbar button{background:#1c2a3a;border:1px solid #26405c;color:#fff;border-radius:999px;width:38px;height:38px;padding:0;font-size:15px;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center}
.topbar button .lbl{display:none}
.topbar #whoami{flex:none}
@media(min-width:560px){.topbar button{width:auto;padding:0 14px;font-size:12px;border-radius:10px}.topbar button .lbl{display:inline;margin-left:6px}}
#login{position:fixed;inset:0;background:#fff;text-align:center;padding:12vh 24px 40px;box-sizing:border-box;overflow:auto}
#login .box{max-width:380px;margin:0 auto}
#login h1{font-size:22px;margin-bottom:4px;letter-spacing:2px;color:#0b1219}
#login p{color:#5a6a7a;font-size:12px;margin-bottom:22px}
.pinmask{-webkit-text-security:disc;text-security:disc}
#pin{width:100%;background:#f2f5f8;border:1px solid #ccd6e0;border-radius:10px;color:#0b1219;font-size:22px;text-align:center;letter-spacing:8px;padding:12px}
#login button{width:100%;margin-top:12px;background:#1e4976;border:none;color:#fff;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
#login .err{color:#ff6b6b;font-size:12px;margin-top:10px;min-height:16px}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mod{background:#0f1720;border:1px solid #223142;border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;min-height:0;overflow:hidden}
.mod:active{background:#131f2c}
.mod .mod-head{display:flex;align-items:center;gap:8px;min-width:0}
.mod .ico{font-size:20px;flex:none;line-height:1}
.mod h3{font-size:13px;margin:0;flex:1;min-width:0;line-height:1.25}
.mod p{font-size:10px;opacity:.6;line-height:1.3;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mod.soon{opacity:.45;cursor:default}
.mod .tag{display:inline-block;margin-top:6px;font-size:10px;background:#1c2a3a;border-radius:10px;padding:2px 8px}
.mod.dragging{opacity:.7;outline:2px solid #f0c040;outline-offset:1px;z-index:5}
#home.home-edit .mod{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
#home.home-edit .mod.dragging{cursor:grabbing}
#home-edit-bar{display:none;align-items:center;gap:8px;margin:0 0 8px;flex-wrap:wrap}
#home-edit-bar button{background:#1c2a3a;border:1px solid #26405c;color:#fff;border-radius:10px;padding:7px 12px;font-size:12px;cursor:pointer}
#home-edit-bar #resetVistaBtn{display:none;opacity:.85;font-size:11px;padding:6px 10px}
#notif-bar{display:none;background:#0f1720;border:1px solid #f0c040;border-radius:14px;padding:14px 16px;margin:0 0 12px;width:100%;box-sizing:border-box}
#notif-bar.on{display:block}
/* Notifs are home-landing only — never inside Caja/Rutas or any other module */
body.mc-mod-open #notif-bar,body.mc-mod-open #notif-bar.on{display:none!important}
#notif-bar h3{font-size:14px;margin:0 0 6px}
#mc-update-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:10000;background:#3a2a0a;border-bottom:2px solid #f0c040;padding:14px 16px;margin:0;color:#ffe9a8;box-sizing:border-box;max-width:100%}
#mc-update-banner.on{display:block}
#mc-update-banner .mc-upd-inner{max-width:640px;margin:0 auto}
@media(min-width:1024px){#mc-update-banner .mc-upd-inner{max-width:1120px}}
@media(min-width:1500px){#mc-update-banner .mc-upd-inner{max-width:1280px}}
#mc-update-banner .mc-upd-title{font-weight:800;font-size:14px;margin-bottom:6px;color:#fff}
#mc-update-banner .mc-upd-body{font-size:13px;line-height:1.45;margin-bottom:10px;opacity:.95}
#mc-update-banner a.mc-upd-btn{display:inline-block;background:#f0c040;color:#0b1219;font-weight:800;font-size:13px;padding:10px 14px;border-radius:10px;text-decoration:none}
#mc-update-banner .mc-upd-hint{font-size:11px;opacity:.75;margin-top:8px}

.fbar{margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{background:#0f1720;border:1px solid #223142;border-radius:20px;color:#dce6f0;padding:7px 14px;font-size:12px;cursor:pointer}
.chip.on{background:#1e4976;border-color:#1e4976;font-weight:700}
.dates{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dates input{background:#0f1720;border:1px solid #223142;border-radius:8px;color:#dce6f0;padding:7px;font-size:12px}
.big{background:#0f1720;border:1px solid #223142;border-radius:14px;padding:16px;margin-bottom:12px}
.big .lbl{font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:1px}
.big .num{font-size:30px;font-weight:800;margin-top:2px}
.big .sub{font-size:12px;opacity:.75;margin-top:4px}
.big-est{border-color:#1e4976;background:#0d1a28}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mini{background:#0f1720;border:1px solid #223142;border-radius:12px;padding:12px}
.mini .lbl{font-size:10px;opacity:.6;text-transform:uppercase}
.mini .num{font-size:20px;font-weight:700;margin-top:2px}

/* Landing ejecutivo v182 */
#landing-screen{display:none;margin-bottom:14px}
#landing-screen.on{display:block}
.land-sec{font-size:11px;opacity:.55;text-transform:uppercase;letter-spacing:1px;margin:12px 0 6px}
.land-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.land-kpi{background:#0f1720;border:1px solid #223142;border-radius:12px;padding:10px 12px}
.land-kpi .lbl{font-size:10px;opacity:.6;text-transform:uppercase}
.land-kpi .num{font-size:18px;font-weight:800;margin-top:2px;line-height:1.15}
.land-kpi .sub{font-size:10px;opacity:.7;margin-top:3px}
.land-delta{font-size:11px;margin-top:2px}
.land-delta.up{color:#6fd68f}.land-delta.down{color:#e07a7a}.land-delta.flat{color:#8fa3b8}
.land-card{background:#0f1720;border:1px solid #223142;border-radius:12px;padding:12px;margin-bottom:10px}
.land-card h4{margin:0 0 6px;font-size:13px}
.land-toprow{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:4px 0;border-top:1px solid #1a2530}
.land-toprow:first-of-type{border-top:none}
.land-mods-label{font-size:12px;font-weight:700;letter-spacing:.5px;margin:16px 0 8px;color:#c3ccd6;display:flex;align-items:center;gap:8px}
.land-mods-label::after{content:'';flex:1;height:1px;background:#223142}
.dash-hub{padding:4px 0 12px}
.dash-hub .cbz-btn{margin-top:8px}
.liq-cta .liq-primary{opacity:1;cursor:pointer}
.liq-cta .liq-primary[disabled]{opacity:.55;cursor:not-allowed}
.liq-cta .liq-note{font-size:11px;opacity:.65;margin-top:8px;line-height:1.35}
#liq-screen{display:none}
.liq-mod{padding:4px 0 16px}
.liq-mod .liq-search{width:100%;background:#0b1219;border:1px solid #26405c;border-radius:8px;color:#e8eef5;font-size:13px;padding:10px 12px;margin:8px 0 10px;box-sizing:border-box}
.liq-client-list{display:flex;flex-direction:column;gap:6px;max-height:min(58vh,480px);overflow:auto;padding-right:2px}
.liq-client-row{background:#0f1720;border:1px solid #223142;border-radius:10px;padding:11px 12px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.liq-client-row:hover,.liq-client-row:focus{border-color:#3a6a9a;outline:none}
.liq-client-row .chev{opacity:.45;font-size:12px}
.liq-linkbox{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.liq-linkbox input.liq-url{width:100%;background:#0b1219;border:1px solid #26405c;border-radius:8px;color:#e8eef5;font-size:12px;padding:8px 10px;box-sizing:border-box}
.liq-btns{display:flex;gap:8px;flex-wrap:wrap}
.liq-btns .cbz-btn{margin:0}
.liq-note{font-size:11px;opacity:.65;margin-top:10px;line-height:1.35}
.mc-ai-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px 18px;min-height:220px}
.mc-ai-logo{font-size:13px;font-weight:800;letter-spacing:1.2px;color:#5cc8ff;margin-bottom:14px}
.mc-ai-drill{width:120px;height:140px;margin:0 auto 12px;display:block}
.mc-ai-drill svg{display:block;width:120px;height:140px}
.mc-ai-drill-assemb{transform-box:fill-box;transform-origin:center;animation:mcAiDrill 0.85s ease-in-out infinite}
.mc-ai-bit{transform-box:fill-box;transform-origin:center;animation:mcAiBitSpin 0.12s linear infinite}
.mc-ai-rock{opacity:0;transform-box:fill-box;transform-origin:center}
.mc-ai-rock1{animation:mcAiRockFly 0.55s ease-out infinite}
.mc-ai-rock2{animation:mcAiRockFly 0.5s ease-out .07s infinite}
.mc-ai-rock3{animation:mcAiRockFly 0.6s ease-out .14s infinite}
.mc-ai-rock4{animation:mcAiRockFly 0.48s ease-out .21s infinite}
.mc-ai-rock5{animation:mcAiRockFly 0.58s ease-out .28s infinite}
.mc-ai-rock6{animation:mcAiRockFly 0.52s ease-out .35s infinite}
.mc-ai-rock7{animation:mcAiRockFly 0.62s ease-out .1s infinite}
.mc-ai-rock8{animation:mcAiRockFly 0.45s ease-out .18s infinite}
.mc-ai-spark{opacity:0}
.mc-ai-spark1{animation:mcAiSpark 0.38s ease-out infinite}
.mc-ai-spark2{animation:mcAiSpark 0.42s ease-out .12s infinite}
.mc-ai-spark3{animation:mcAiSpark 0.36s ease-out .22s infinite}
.mc-ai-msg{font-size:13px;line-height:1.45;color:#c3ccd6;max-width:320px}
.mc-ai-sub{font-size:12px;line-height:1.4;color:#8a97a8;max-width:320px;margin-top:10px}
.mc-ai-tip{font-size:11px;line-height:1.35;color:#6d7a8a;max-width:320px;margin-top:14px;min-height:2.8em;opacity:.9}
@keyframes mcAiBitSpin{to{transform:rotate(360deg)}}
@keyframes mcAiDrill{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
@keyframes mcAiRockFly{0%{transform:translate(0,0) rotate(0deg);opacity:0}12%{opacity:1}100%{transform:translate(var(--dx,0),var(--dy,-40px)) rotate(var(--rot,140deg));opacity:0}}
@keyframes mcAiSpark{0%{transform:scale(1);opacity:0}18%{opacity:1}100%{transform:scale(.25) translate(var(--sx,0),var(--sy,-10px));opacity:0}}
#dash-kpi{margin-bottom:12px}
.dash-hist-label{font-size:12px;font-weight:700;letter-spacing:.5px;margin:14px 0 8px;color:#c3ccd6}

.toprow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #1a2735}
.toprow:last-child{border-bottom:none}
.topn{background:#1e4976;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.topname{flex:1;font-size:13px}
.topval{font-size:12px;opacity:.8}
.fbar2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.olist{display:flex;flex-direction:column;gap:8px}
.orow{background:#0f1720;border:1px solid #223142;border-radius:12px;padding:11px;cursor:pointer}
.orow-top{display:flex;justify-content:space-between;font-size:13px}
.odate{opacity:.6;font-size:11px}
.orow-mid{font-size:12px;opacity:.85;margin:3px 0}
.orow-bot{display:flex;justify-content:space-between;align-items:center}
.tagx{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700}
.tf{background:#12313d;color:#5cc8ff}.tn{background:#4a3a10;color:#f0c040}.tq{background:#2a2a3a;color:#b0a8e8}
.oval{font-size:12px;font-weight:700}
.omoney{display:flex;flex-direction:column;align-items:flex-end}

.ocobrar-p{color:#ff6b6b}

.uti{color:#6fd68f}
.pdesc{color:#f0c040}
.ores{margin-top:10px;margin-left:auto;max-width:240px;font-size:12px}
.ores div{display:flex;justify-content:space-between;padding:2px 0}

.ores-util{color:#6fd68f;font-weight:700;margin-top:2px}

.pline{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #141f2b}

.pimg{width:42px;height:42px;border-radius:8px;object-fit:cover;background:#1a2735;flex:none}

.pinfo{flex:1;min-width:0}

function b64uToBuf(s){

var API_URL = 'https://script.google.com/macros/s/AKfycbyfoS1EX0V9YdqN35jiJ7CDMkxpkX5Gd0XQZJxQAxTiM76vjAoVXyEam2Vzo_WNihZQ/exec';
/* v129: errores honestos — distingue "sin red" de "el servidor respondió algo que no es JSON" (páginas de error de Google, timeouts) */
function MCjson(r){return r.text().then(function(t){try{return JSON.parse(t);}catch(e){var s2=String(t||'').replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi,' ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,180);if(/no se pudo abrir el archivo|Drive|Google Drive|tiempo máximo|exceeded maximum execution/i.test(s2))s2='Google no pudo atender la solicitud en este momento (error temporal de Apps Script/Drive)';throw new Error('HTTP '+r.status+' — '+(s2||'respuesta vacía'));}});}
function MCerr(e){var m2=(e&&e.message)?String(e.message):'';if(m2==='TIMEOUT')return 'El servidor tardó demasiado en responder (probablemente inFlow está lento o caído). Intenta de nuevo en un momento.';if(!m2||/Failed to fetch|Load failed|NetworkError|network|abort/i.test(m2))return 'Sin conexión.';return 'Error del servidor: '+m2;}
/* v132: reintentos. Google a veces contesta con una página HTML ("Drive: no se pudo abrir el archivo", HTTP 404/500)
   ANTES de ejecutar el script — en ese caso el script no corrió y reintentar es seguro para cualquier acción.
   Si falló la red (sin respuesta), solo se reintentan las lecturas (una escritura podría haberse ejecutado). */
/* v140: a veces Google convierte el POST en un GET (redirección) y contesta con la "tarjeta de presentación"
   del API ({ok:true, service, version}) en vez de ejecutar la acción. Se detecta y se reintenta; para acciones
   que crean documentos (no repetibles sin riesgo de duplicar) se avisa en lugar de reintentar. */
var MC_NO_REPETIR=/^(crearCotInflow|crearSolicitudInterna|convertirCotOrden|enviarCarrito|sendNow|generarActa|redeemInvite|kycSubmit|editarCotCreada|editarOrdenInflow|saveVendor|saveStockTransfer|savePurchaseOrder|cancelPurchaseOrder|approvePurchaseOrder|crearRuta|crearGasto|crearEntrega|savePhoto|cerrarCorte)$/;
function MCesDoGet(res){return !!(res&&res.ok===true&&res.service==='Minecore Admin API'&&res.version&&Object.keys(res).length<=3);}
function MCpost(p){
  p=p||{};
  var timeoutMs=75000; // v145: tope por defecto
  var maxRetry=3;
  if(p._timeout)timeoutMs=p._timeout;
  if(p._retries!=null)maxRetry=p._retries;
  var clean={};
  for(var k in p){if(Object.prototype.hasOwnProperty.call(p,k)&&String(k).charAt(0)!=='_')clean[k]=p[k];}
  var body=JSON.stringify(clean);
  var accion=String(clean.action||'');
  var lectura=/^(get|list|mi|ping|syncNow)/.test(accion);
  function go(){
    var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
    var timer=ctl?setTimeout(function(){try{ctl.abort();}catch(e){}},timeoutMs):null;
    return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body,signal:ctl?ctl.signal:undefined})
      .then(function(r){if(timer)clearTimeout(timer);return r;},function(e){if(timer)clearTimeout(timer);if(e&&e.name==='AbortError')throw new Error('TIMEOUT');throw e;})
      .then(MCjson).then(function(res){
    if(MCesDoGet(res)){var e2=new Error('DOGET');e2.doget=true;throw e2;}
    return res;});}
  function esPaginaGoogle(e){return !!(e&&e.message&&/^HTTP \d+/.test(e.message));}
  function intento(n){
    return go().catch(function(e){
      if(e&&e.doget){
        if(MC_NO_REPETIR.test(accion))throw new Error('Google devolvió una respuesta vacía para "'+accion+'". Verifica en la app/inFlow si la acción se aplicó antes de repetirla.');
        if(n>=maxRetry)throw new Error('Google respondió sin ejecutar la acción "'+accion+'" ('+(maxRetry+1)+' intentos). Reintenta en unos segundos.');
        return new Promise(function(ok){setTimeout(ok,[700,1500,3000][n]||3000);}).then(function(){return intento(n+1);});
      }
      var puede=esPaginaGoogle(e)||(lectura&&!esPaginaGoogle(e));
      if(n>=maxRetry||!puede)throw e;
      var espera=[900,1800,3200][n]||3200;
      return new Promise(function(ok){setTimeout(ok,espera);}).then(function(){return intento(n+1);});
    });
  }
  return intento(0);}
function MCbodegaDefault(bs){bs=bs||[];for(var i=0;i<bs.length;i++)if(/principal/i.test(bs[i]))return bs[i];return bs[0]||'';}
/* v202: precarga en segundo plano de clientes + catálogo para el Cotizador.

    (arr||[]).forEach(function(x){
      var n=String(nameOf(x)||'').trim();
      if(!n)return;
      var k=n.toLowerCase().replace(/\s+/g,' ');

    });
    out.sort(function(a,b){try{return a.localeCompare(b,'es',{sensitivity:'base'});}catch(e){return a<b?-1:a>b?1:0;}});
    return out;

  function slimItems(res){

    return (res.items||[]).map(function(it){
      return {
        sku:it.sku,nombre:it.nombre,productId:it.productId||'',precio:it.precio||0,img:it.img||'',
        stock:(bDef&&it.stockPor)?MCstockDe(it,bDef):(it.stock||0),
        stockTotal:it.stockTotal!==undefined?it.stockTotal:(it.stock||0),

        codigo:it.codigo||'',categoria:it.categoria||''
      };

/* v166: iOS Safari ignora a.download en blob: y nombra el archivo con el <title> ("Minecore Admin").
   Preferir Web Share API (Guardar en Archivos) en móvil; si no, título temporal + a.download. */
function mcSanitizeFilename(name){
  name=String(name==null?'':name).trim();
  if(!name)return 'documento.pdf';
  /* v170: solo ilegales \ / : * ? " < > | — conservar espacios y acentos ES (ÁÉÍÓÚÑ) */
  name=name.replace(/[\\\/:\*\?"<>\|]/g,' ').replace(/[\u0000-\u001f]/g,'').replace(/ +/g,' ').trim();
  if(!/\.[A-Za-z0-9]{2,5}$/.test(name))name+='.pdf';
  return name;
}
/* Preferir siempre res.filename del API (v116). Fallback Spanish si hace falta. tipoHint: 'PICK LIST' etc. */
function mcPdfFilename(apiFilename, hint, tipoHint){
  if(apiFilename)return mcSanitizeFilename(apiFilename);
  var src=String(hint||'');
  var m=src.match(/(MCOR-S[QO]-[\w-]+)/i);
  var num=m?m[1]:'';
  if(num){
    if(/^MCOR-SQ-/i.test(num))return mcSanitizeFilename('COTIZACIÓN '+num+'.pdf');
    if(/^MCOR-SO-/i.test(num)){
      var th=String(tipoHint||'').toUpperCase();
      if(th.indexOf('PICK')>=0)return mcSanitizeFilename('PICK LIST '+num+'.pdf');
      return mcSanitizeFilename('ORDEN DE VENTA '+num+'.pdf');
    }
  }
  if(hint)return mcSanitizeFilename(String(hint).replace(/\.pdf$/i,'')+'.pdf');
  return 'documento.pdf';
}
function mcDownloadViaAnchor_(blob, filename){
  var url=URL.createObjectURL(blob);
  var prevTitle=document.title;
  var base=String(filename||'documento').replace(/\.pdf$/i,'');
  try{document.title=base;}catch(e){}
  var a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){
    try{document.title=prevTitle;}catch(e){}
    try{URL.revokeObjectURL(url);}catch(e){}
  },1500);
}
function mcDownloadBlob(b64OrBlob, filename, mime){
  mime=mime||'application/pdf';
  filename=mcSanitizeFilename(filename);
  var blob;
  if(typeof Blob!=='undefined'&&b64OrBlob instanceof Blob){blob=b64OrBlob;}
  else{
    var bin=atob(String(b64OrBlob||''));
    var arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    blob=new Blob([arr],{type:mime});
  }
  var file=null;
  try{file=new File([blob],filename,{type:mime});}catch(e){file=null;}
  var can=false;
  try{can=!!(file&&navigator.canShare&&navigator.share&&navigator.canShare({files:[file]}));}catch(e){can=false;}
  if(can){
    return navigator.share({files:[file],title:filename}).catch(function(err){
      /* AbortError = el usuario canceló el Share Sheet: no forzar un segundo download con nombre malo. */
      if(err&&(err.name==='AbortError'||/abort/i.test(String(err.message||''))))return;
      mcDownloadViaAnchor_(blob,filename);
    });
  }
  mcDownloadViaAnchor_(blob,filename);
  return Promise.resolve();
}

      '<button class="cbz-btn" onclick="Cobranza.openChooser(' + idx + ')" ' + (c.activo && c.vencido > 0 ? '' : 'disabled') + '>Enviar ahora</button>' +
      waButtons(c, idx) +
      '</div>' +
      (actaOpen === idx ?
      '<div class="cbz-chooser" style="margin-top:8px"><div class="cbz-card-name" style="font-size:13px;margin-bottom:8px">📄 Acta transaccional — ' + c.cliente + '</div>' +
      '<div class="uform">' +
      '<div class="cbz-card-row"><input class="uinput" id="a-meses" type="number" placeholder="Plazo (meses)" value="24" style="max-width:140px">' +
      '<input class="uinput" id="a-tasa" type="number" step="0.5" placeholder="Tasa anual %" value="8" style="max-width:140px">' +
      '<select class="uinput" id="a-firmante" style="max-width:260px">' +
      '<option value="martin">Firma: Martín Pinto (Presidente)</option>' +
      '<option value="esteban">Firma: Esteban Ferlito (Gerente General)</option></select></div>' +
      '<input class="uinput" id="a-nombre" placeholder="Gerente general del cliente (si se conoce)">' +
      '<div class="cbz-card-row"><input class="uinput" id="a-cedula" placeholder="Cédula (si se conoce)" style="max-width:200px">' +
      '<input class="uinput" id="a-ciudad" placeholder="Ciudad de domicilio" style="max-width:200px">' +
      '<input class="uinput" id="a-ruc" placeholder="RUC del cliente" style="max-width:200px"></div>' +
      '<input class="uinput" id="a-email" type="email" placeholder="Email para citaciones (si se conoce)">' +
      '<div class="cbz-card-row">' +
      '<button class="cbz-btn-sec" onclick="Cobranza.actaGo(' + idx + ', true)">👁 Vista previa</button>' +
      '<button class="cbz-btn-sec" onclick="Cobranza.actaGo(' + idx + ', false)">⬇ Descargar</button>' +
      '<button class="cbz-btn" onclick="Cobranza.actaAprobar(' + idx + ')">✅ Aprobar acta</button>' +
      '<button class="cbz-btn-sec" onclick="Cobranza.actaForm(null)">Cancelar</button></div>' +
      '<div class="cbz-muted">Los campos vacíos salen con línea en blanco para llenar a mano.</div>' +
      '</div></div>' : '') +
      (chooser === idx ?
      '<div class="cbz-card-row cbz-chooser">' +
      '<span class="cbz-muted">Mensaje:</span>' +
      '<button class="cbz-btn-sec" onclick="Cobranza.doSend(' + idx + ', 0)">Automático</button>' +
      '<button class="cbz-btn-sec" onclick="Cobranza.doSend(' + idx + ', 1)">N1 Amable</button>' +
      '<button class="cbz-btn-sec" onclick="Cobranza.doSend(' + idx + ', 2)">N2 Firme</button>' +
      '<button class="cbz-btn-sec" onclick="Cobranza.doSend(' + idx + ', 3)">N3 Urgente</button>' +
      '<button class="cbz-btn-sec cbz-danger" onclick="Cobranza.doSend(' + idx + ', 4)">N4 Final</button>' +
      '<button class="cbz-btn-sec cbz-danger" onclick="Cobranza.doSend(' + idx + ', 5)">N5 Legal</button>' +
      '<button class="cbz-btn-sec" onclick="Cobranza.closeChooser()">Cancelar</button>' +
      '</div>' : '') +
      '</div>';
  }

  function setVista(v){vista=v;render();}
  function setQ(v){q=v;renderList();}
  function setFMora(v){fMora=v;render();}
  function irConfig(idx){vista='config';q=clientes[idx].cliente;render();}
  function expandDash(idx){expanded['d'+idx]=!expanded['d'+idx];renderList();}
  function statement(idx){
    var c=clientes[idx];
    api({action:'getStatementPdf',cliente:c.cliente}).then(function(res){
      if(!res.ok){alert('Error: '+res.error);return;}
      return mcDownloadBlob(res.b64, res.filename||('Estado_de_cuenta_'+String(c.cliente||'cliente').replace(/[^A-Za-z0-9]+/g,'_')+'.pdf'));
    });
  }

  function countList(s) {
    if (!s) return 0;
    return s.split(',').map(function (x) { return x.trim(); }).filter(function (x) { return x; }).length;
  }
  function isOpen(idx, which) { return expanded[idx] && expanded[idx][which]; }
  function expand(idx, which) {
    if (!expanded[idx]) expanded[idx] = {};
    expanded[idx][which] = !expanded[idx][which];
    renderList();
  }
  function openChooser(idx) { chooser = idx; renderList(); }
  function closeChooser() { chooser = null; renderList(); }
  function doSend(idx, nivel) {
    var c = clientes[idx];
    var lbl = nivel === 0 ? 'automático' : 'N' + nivel;
    if (!confirm('¿Enviar mensaje ' + lbl + ' AHORA a ' + c.cliente + '?')) return;
    var esN5 = nivel === 5 || (nivel === 0 && c.nivelNum === 5);
    var conActa = true;
    if (esN5) {
      conActa = confirm('¿Adjuntar el acta transaccional' + (c.actaAprobada ? ' APROBADA del ' + c.actaAprobada : ' (modelo)') + '?\nAceptar = con acta · Cancelar = solo estado de cuenta');
    }
    chooser = null;
    api({ action: 'sendNow', cliente: c.cliente, nivel: nivel || undefined, conActa: conActa }).then(function (res) {
      alert(res.ok ? res.resultado : 'Error: ' + (res.error || res.resultado));
      init();
    });
  }

  function waChips(c, idx) {
    if (!c.whatsapp) return '<span class="cbz-muted">Sin WhatsApp</span>';
    return c.whatsapp.split(',').map(function (n) {
      n = n.trim();
      return n ? '<span class="cbz-chip">📱 ' + n +
        '<button class="cbz-chip-x" onclick="Cobranza.removeWa(' + idx + ',\'' + n + '\')">&times;</button></span>' : '';
    }).join('');
  }
  function waButtons(c, idx) {
    if (!c.whatsapp) return '';
    return c.whatsapp.split(',').map(function (n) {
      n = n.trim();
      if (!n) return '';
      return '<button class="cbz-btn cbz-btn-wa" onclick="Cobranza.sendWa(' + idx + ',\'' + n + '\')">WA \u2026' + n.slice(-4) + '</button>';
    }).join('');
  }

  /** ==== Acciones ==== */

  function toggle(idx, on) {
    clientes[idx].activo = on;
    api({ action: 'updateCxcClient', cliente: clientes[idx].cliente, campo: 'activo', valor: on ? 'SI' : 'NO' })
      .then(render);
  }

  function escala(idx, on) {
    clientes[idx].escalamiento = on;
    api({ action: 'updateCxcClient', cliente: clientes[idx].cliente, campo: 'escalamiento', valor: on ? 'SI' : 'NO' });
  }

  function freq(idx, delta) {
    var f = Math.max(1, clientes[idx].frecuencia + delta);
    clientes[idx].frecuencia = f;
    api({ action: 'updateCxcClient', cliente: clientes[idx].cliente, campo: 'frecuencia', valor: f })
      .then(render);
  }

  /** Enter o coma agrega el email; la coma se pone sola en el backend */
  function emailKey(ev, idx, input) {
    if (ev.key === 'Enter' || ev.key === ',') {
      ev.preventDefault();
      addEmail(idx, input);
    }
  }
  function emailBlur(idx, input) { if (input.value.trim()) addEmail(idx, input); }

  function addEmail(idx, input) {
    var e = input.value.replace(/,/g, '').trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { input.classList.add('cbz-input-bad'); return; }
    input.classList.remove('cbz-input-bad');
    var current = clientes[idx].emails ? clientes[idx].emails + ', ' + e : e;
    clientes[idx].emails = current;
    input.value = '';
    api({ action: 'updateCxcClient', cliente: clientes[idx].cliente, campo: 'emails', valor: current })
      .then(function (res) { if (res.ok) { clientes[idx].emails = res.valor; render(); } });
  }

  function removeEmail(idx, email) {
    var list = clientes[idx].emails.split(',').map(function (x) { return x.trim(); })
      .filter(function (x) { return x && x !== email; });
    var val = list.join(', ');
    clientes[idx].emails = val;
    api({ action: 'updateCxcClient', cliente: clientes[idx].cliente, campo: 'emails', valor: val })
      .then(render);
  }

  /** WhatsApp: números guardados por cliente */
  function waKey(ev, idx, input) {
    if (ev.key === 'Enter' || ev.key === ',') { ev.preventDefault(); addWa(idx, input); }
  }
  function waBlur(idx, input) { if (input.value.trim()) addWa(idx, input); }
  function addWa(idx, input) {
    var n = input.value.replace(/[^0-9]/g, '');
    if (n.length < 8) { input.classList.add('cbz-input-bad'); return; }
    input.classList.remove('cbz-input-bad');
    var current = clientes[idx].whatsapp ? clientes[idx].whatsapp + ', ' + n : n;
    clientes[idx].whatsapp = current;
    input.value = '';
    api({ action: 'updateCxcClient', cliente: clientes[idx].cliente, campo: 'whatsapp', valor: current })
      .then(function (res) { if (res.ok) { clientes[idx].whatsapp = res.valor; render(); } });
  }
  function removeWa(idx, num) {
    var list = clientes[idx].whatsapp.split(',').map(function (x) { return x.trim(); })
      .filter(function (x) { return x && x !== num; });
    var val = list.join(', ');
    clientes[idx].whatsapp = val;
    api({ action: 'updateCxcClient', cliente: clientes[idx].cliente, campo: 'whatsapp', valor: val })
      .then(render);
  }
  function legal(idx, on) {
    var c = clientes[idx];
    var msg = on ? '¿Marcar a ' + c.cliente + ' en PROCESO LEGAL? Sus recordatorios pasarán al nivel 5 (semanal).'
                 : '¿Quitar a ' + c.cliente + ' del proceso legal?';
    if (!confirm(msg)) { render(); return; }
    clientes[idx].procesoLegal = on;
    api({ action: 'updateCxcClient', cliente: c.cliente, campo: 'proceso', valor: on ? 'SI' : 'NO' })
      .then(render);
  }

  function actaForm(idx) {
    actaOpen = (actaOpen === idx) ? null : idx;
    renderList();
    if (actaOpen === null || idx === null) return;
    var c = clientes[idx];
    if (!c.actaAprobada) return;
    // pre-carga los datos del acta aprobada para editarla
    api({ action: 'getActaAprobada', cliente: c.cliente, conPdf: false }).then(function (res) {
      if (!res.ok || actaOpen !== idx) return;
      function set(id, v) { var el = document.getElementById(id); if (el && v !== undefined && v !== null && v !== '') el.value = v; }
      set('a-meses', res.meses); set('a-tasa', res.tasa); set('a-firmante', res.firmante);
      set('a-nombre', res.repNombre); set('a-cedula', res.repCedula);
      set('a-ciudad', res.repCiudad); set('a-ruc', res.clienteRuc); set('a-email', res.repEmail);
    });
  }
  function verActa(idx) {
    var c = clientes[idx];
    var w = window.open('', '_blank');
    api({ action: 'getActaAprobada', cliente: c.cliente }).then(function (res) {
      if (!res.ok) { if (w) w.close(); alert('Error: ' + res.error); return; }
      var bin = atob(res.b64), arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
      if (w) w.location = url; else window.open(url, '_blank');
    }).catch(function () { if (w) w.close(); alert('No se pudo abrir el acta.'); });
  }
  function actaAprobar(idx) {
    var c = clientes[idx];
    if (!confirm('¿Aprobar esta acta para ' + c.cliente + '? Quedará guardada y se adjuntará en los envíos de nivel 5.')) return;
    api({ action: 'aprobarActa', cliente: c.cliente,
      meses: document.getElementById('a-meses').value,
      tasa: document.getElementById('a-tasa').value,
      firmante: document.getElementById('a-firmante').value,
      repNombre: document.getElementById('a-nombre').value,
      repCedula: document.getElementById('a-cedula').value,
      repCiudad: document.getElementById('a-ciudad').value,
      clienteRuc: document.getElementById('a-ruc').value,
      repEmail: document.getElementById('a-email').value
    }).then(function (res) {
      if (!res.ok) { alert('Error: ' + res.error); return; }
      alert('Acta aprobada y guardada (' + res.meses + ' cuotas de ' + fmt(res.cuota) + ' al ' + res.tasa + '%). Se adjuntará en los envíos N5.');
      actaOpen = null;
      init();
    });
  }
  function actaGo(idx, preview) {
    var c = clientes[idx];
    var w = preview ? window.open('', '_blank') : null; // abrir antes del fetch (popup blockers)
    api({ action: 'generarActa', cliente: c.cliente,
      meses: document.getElementById('a-meses').value,
      tasa: document.getElementById('a-tasa').value,
      firmante: document.getElementById('a-firmante').value,
      repNombre: document.getElementById('a-nombre').value,
      repCedula: document.getElementById('a-cedula').value,
      repCiudad: document.getElementById('a-ciudad').value,
      clienteRuc: document.getElementById('a-ruc').value,
      repEmail: document.getElementById('a-email').value
    }).then(function (res) {
      if (!res.ok) { if (w) w.close(); alert('Error: ' + res.error); return; }
      var bin = atob(res.b64), arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      var blob = new Blob([arr], { type: 'application/pdf' });
      if (preview) {
        var url = URL.createObjectURL(blob);
        if (w) w.location = url; else window.open(url, '_blank');
      } else {
        return mcDownloadBlob(blob, res.filename||('Acta_'+String(c.cliente||'cliente').replace(/[^A-Za-z0-9]+/g,'_')+'.pdf')).then(function(){
          actaOpen = null; renderList();
          alert('Acta descargada: ' + res.meses + ' cuotas de ' + fmt(res.cuota) + ' al ' + res.tasa + '% sobre ' + fmt(res.monto) + '.');
        });
      }
    }).catch(function(){ if (w) w.close(); alert('Error de red generando el acta.'); });
  }



  function sendWa(idx, num) {
    var c = clientes[idx];
    var lvl = c.nivelNum || 1;
    var tpl = (waTemplate && waTemplate[lvl]) ||
      'Estimados {CLIENTE}, les saluda Minecore S.A.S. Mantienen valores vencidos por {VENCIDO} (mora {MORA} días). Estado de cuenta: {LINK} — Departamento de Cobranzas, Minecore S.A.S.';
    // Abre la ventana ANTES del fetch para que el navegador no la bloquee
    var w = window.open('', '_blank');
    api({ action: 'getStatementLink', cliente: c.cliente }).then(function (res) {
      var link = (res.ok && res.url) ? res.url : '';
      var msg = tpl.replace(/{CLIENTE}/g, c.cliente)
                   .replace(/{VENCIDO}/g, fmt(c.vencido))
                   .replace(/{MORA}/g, c.maxMora)
                   .replace(/{LINK}/g, link || '(estado de cuenta enviado por correo)');
      var url = 'https://wa.me/' + num + '?text=' + encodeURIComponent(msg);
      if (w) w.location = url; else window.open(url, '_blank');
    }).catch(function(){ if (w) w.close(); alert('No se pudo generar el link del estado de cuenta.'); });
  }


  return {
    init: init, toggle: toggle, escala: escala, freq: freq,
    emailKey: emailKey, emailBlur: emailBlur, removeEmail: removeEmail,
    expand: expand, openChooser: openChooser, closeChooser: closeChooser, doSend: doSend,
    waKey: waKey, waBlur: waBlur, removeWa: removeWa, sendWa: sendWa,
    setVista: setVista, setQ: setQ, setFMora: setFMora, irConfig: irConfig,
    expandDash: expandDash, statement: statement,
    legal: legal, actaForm: actaForm, actaGo: actaGo, actaAprobar: actaAprobar, verActa: verActa
  };
})();


/* ===================== DASHBOARD v2 ===================== */
var Dash = (function(){
  var agg=null, top=[], orders=[], filter='todas', openId=null, from='', to='';
  function fmt(n){n=parseFloat(n)||0;var p=n.toFixed(2).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return '$'+p.join('.');}
  function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  function preset(p){
    var now=new Date(), t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    var f=new Date(t);
    if(p==='hoy'){}
    else if(p==='semana'){f.setDate(t.getDate()-((t.getDay()+6)%7));}
    else if(p==='mes'){f=new Date(t.getFullYear(),t.getMonth(),1);}
    else if(p==='trimestre'){f=new Date(t.getFullYear(),Math.floor(t.getMonth()/3)*3,1);}
    else if(p==='ano'){f=new Date(t.getFullYear(),0,1);}
    from=iso(f); to=iso(t);
    document.getElementById('d-from').value=from;
    document.getElementById('d-to').value=to;
    load();
  }
  function applyCustom(){
    from=document.getElementById('d-from').value;
    to=document.getElementById('d-to').value;
    if(from&&to) load();
  }
  function init(){
    var el=document.getElementById('dash-screen');
    el.innerHTML='<div id="dash-kpi"><div class="cbz-loading">Cargando KPIs...</div></div>'+
      '<div class="dash-hist-label">Historial</div><div id="dash-hist"></div>';
    try{Landing.mount(document.getElementById('dash-kpi'));Landing.load();}catch(e){}
    openHistorial();
  }
  function openHistorial(){
    var wrap=document.getElementById('dash-hist');
    if(!wrap)return;
    wrap.style.display='block';
    wrap.innerHTML='<div class="fbar">'+
      '<div class="chips">'+
      chip('hoy','Hoy')+chip('semana','Semana')+chip('mes','Mes')+chip('trimestre','Trimestre')+chip('ano','Año')+
      '</div>'+
      '<div class="dates"><input type="date" id="d-from"> <span>→</span> <input type="date" id="d-to">'+
      '<button class="cbz-btn" onclick="Dash.applyCustom()">Aplicar</button></div></div>'+
      '<div id="dash-body"><div class="cbz-loading">Elige un período...</div></div>';
    preset('hoy');
  }
  function chip(id,lbl){return '<button class="chip" onclick="Dash.preset(\''+id+'\')">'+lbl+'</button>';}
  function mini(lbl,val){return '<div class="mini"><div class="lbl">'+lbl+'</div><div class="num">'+val+'</div></div>';}
  function load(){
    var body=document.getElementById('dash-body');
    body.innerHTML='<div class="cbz-loading">Cargando '+from+' → '+to+'...</div>';
    openId=null;
    MCpost({action:'getDashboard',fromDate:from,toDate:to,user:getUserName(),pin:getPin()})
    .then(function(res){
      if(!res.ok){body.innerHTML='<div class="cbz-error">Error del servidor: '+(res.error||'desconocido')+'</div>';return;}
      if(!res.agg){body.innerHTML='<div class="cbz-error">El AdminAPI desplegado es una versión antigua (sin agg). Pega AdminAPI_v3 y crea Nueva versión de la implementación.</div>';return;}
      agg=res.agg; top=res.topClientes||[]; orders=res.orders||[];
      try { render(); } catch(e){ body.innerHTML='<div class="cbz-error">Error pintando: '+e+'</div>'; }
    }).catch(function(e){body.innerHTML='<div class="cbz-error">Fallo de red: '+MCerr(e)+'</div>';});
  }
  function render(){
    var body=document.getElementById('dash-body');
    var mgF = agg.subtotalFact>0&&agg.utilFact!==undefined?Math.round(agg.utilFact/agg.subtotalFact*1000)/10:null;
    var mgN = agg.subtotalNoFact>0&&agg.utilNoFact!==undefined?Math.round(agg.utilNoFact/agg.subtotalNoFact*1000)/10:null;
    var h='<div class="big"><div class="lbl">Facturado por fecha de factura ('+from+' → '+to+')</div>'+
      '<div class="num">'+fmt(agg.subtotalFact||0)+'</div>'+
      '<div class="sub">+ IVA '+fmt(agg.ivaFact||0)+' · Total '+fmt(agg.totalFact||0)+' · '+agg.invoiced+' factura(s)</div>'+
      (mgF!==null?'<div class="sub uti">Utilidad bruta: <b>'+fmt(agg.utilFact)+'</b> · Margen '+mgF+'%</div>':'')+
      '</div>';
    h+='<div class="big"><div class="lbl">Por facturar / completar</div>'+
      '<div class="num">'+fmt(agg.subtotalNoFact||0)+'</div>'+
      '<div class="sub">+ IVA '+fmt(agg.ivaNoFact||0)+' · Total '+fmt(agg.totalNoFact||0)+' · '+(agg.ordenes-agg.invoiced)+' orden(es)</div>'+
      (mgN!==null?'<div class="sub uti">Utilidad bruta est.: <b>'+fmt(agg.utilNoFact)+'</b> · Margen '+mgN+'%</div>':'')+
      '</div>';
    h+='<div class="big big-est"><div class="lbl">Estimado del período (facturado + por facturar)</div>'+
      '<div class="num">'+fmt(agg.subtotal)+'</div>'+
      '<div class="sub">+ IVA '+fmt(agg.iva)+' · Total '+fmt(agg.total)+' · '+agg.ordenes+' órdenes</div></div>';
    h+='<div class="grid2">'+mini('Órdenes',agg.ordenes)+mini('Facturadas',agg.invoiced)+
       mini('Fulfilled',agg.fulfilled)+mini('Cotizaciones',agg.cotizaciones)+'</div>';
    if(top.length){
      h+='<div class="big"><div class="lbl">Top clientes del período (solo facturado)</div>';
      top.forEach(function(t,i){
        h+='<div class="toprow"><span class="topn">'+(i+1)+'</span><span class="topname">'+t.cliente+'</span>'+
           '<span class="topval">'+fmt(t.subtotal)+' · '+t.ordenes+' ord.</span></div>';
      });
      h+='</div>';
    }
    h+='<div class="fbar2">'+fchip('todas','Todas')+fchip('facturadas','Facturadas')+
       fchip('nofact','No facturadas')+fchip('cotiz','Cotizaciones')+'</div>';
    h+='<div class="olist">'+orders.filter(passFilter).map(orow).join('')+'</div>';
    body.innerHTML=h;
  }
  function passFilter(o){
    if(filter==='facturadas')return !o.cotizacion&&o.facturada;
    if(filter==='nofact')return !o.cotizacion&&!o.facturada;
    if(filter==='cotiz')return o.cotizacion;
    return true;
  }
  function fchip(id,lbl){return '<button class="chip '+(filter===id?'on':'')+'" onclick="Dash.setFilter(\''+id+'\')">'+lbl+'</button>';}
  function setFilter(f){filter=f;render();}
  function orow(o){
    var st=o.cotizacion?'<span class="tagx tq">COT</span>':
      (o.facturada?'<span class="tagx tf">FACT '+(o.factura||'')+'</span>':'<span class="tagx tn">SIN FACT</span>');
    var open=openId===o.id;
    var cobrar = o.cotizacion ? '' :
      (o.saldo>0 ? '<div class="ocobrar ocobrar-p">Por cobrar: '+fmt(o.saldo)+'</div>'
                 : '<div class="ocobrar ocobrar-0">Por cobrar: $0.00 ✓</div>');
    if(!o.cotizacion && o.utilidad!==null && o.utilidad!==undefined){
      var mg=o.subtotal>0?Math.round(o.utilidad/o.subtotal*1000)/10:0;
      cobrar+='<div class="outil">Utilidad: '+fmt(o.utilidad)+' · '+mg+'%</div>';
    }
    var invBadge='';
    if(!o.cotizacion && o.inv){
      var invLab=String(o.inv);
      var invPretty=invLab.charAt(0).toUpperCase()+invLab.slice(1);
      var invCol=invLab==='fulfilled'?'#6fd68f':(invLab==='started'?'#f0c040':'#8fa3b8');
      invBadge='<span class="tagx" style="border-color:'+invCol+';color:'+invCol+';font-size:10px">Inv: '+invPretty+'</span>';
    }
    return '<div class="orow" onclick="Dash.toggleOrder(\''+o.id+'\')">'+
      '<div class="orow-top"><b>'+o.ov+'</b><span class="odate">'+o.fecha+'</span></div>'+
      '<div class="orow-mid">'+o.cliente+'</div>'+
      '<div class="orow-bot">'+st+invBadge+
      '<span class="omoney"><span class="osub">'+fmt(o.subtotal)+'</span>'+
      '<span class="osmall">IVA '+fmt(o.iva)+' · Total '+fmt(o.total)+'</span></span></div>'+
      cobrar+
      (open?'<div class="odetail" id="det-'+o.id+'" onclick="event.stopPropagation()"><div class="cbz-loading">Cargando detalle...</div></div>':'')+
      '</div>';
  }
  function toggleOrder(id){
    if(!id){alert('Esta orden no tiene ID (corre syncAll con la v12 primero).');return;}
    openId = (openId===id)?null:id;
    render();
    if(openId){
      MCpost({action:'getOrderDetail',orderId:id,user:getUserName(),pin:getPin()}).then(function(res){
        var det=document.getElementById('det-'+id);
        if(!det)return;
        if(!res.ok){det.innerHTML='<div class="cbz-error">'+res.error+'</div>';return;}
        var dh=res.lines.map(function(l){
          return '<div class="pline">'+
            (l.img?'<img src="'+l.img+'" class="pimg" onerror="this.style.display=\'none\'">':'<div class="pimg pimg-ph">📦</div>')+
            '<div class="pinfo"><div class="pname">'+l.producto+'</div>'+
            '<div class="pmeta">SKU: '+(l.sku||'-')+' · Cant: '+l.cantidad+' · P.U: '+fmt(l.precio)+
            (l.desc?' · <span class="pdesc">Desc: '+l.desc+'</span>':'')+'</div></div>'+
            '<div class="psub">'+fmt(l.subtotal)+'</div></div>';
        }).join('')||'<div class="cbz-muted">Sin líneas</div>';
        if(res.resumen){
          dh+='<div class="ores">'+
            (res.resumen.descuento>0?'<div><span>Descuento aplicado</span><span class="ocobrar-p">-'+fmt(res.resumen.descuento)+'</span></div>':'')+
            '<div><span>Subtotal</span><span>'+fmt(res.resumen.subtotal)+'</span></div>'+
            '<div><span>IVA</span><span>'+fmt(res.resumen.iva)+'</span></div>'+
            '<div class="ores-tot"><span>TOTAL</span><span>'+fmt(res.resumen.total)+'</span></div>'+
            (res.resumen.utilidad!==null&&res.resumen.utilidad!==undefined?
              '<div class="ores-util"><span>Utilidad bruta</span><span>'+fmt(res.resumen.utilidad)+' · '+res.resumen.margen+'%</span></div>':'')+
            '</div>';
        }
        if(res.notas) dh+='<div class="onotas">📝 '+res.notas+'</div>';
        var isQuote=!!res.isQuote;
        var invSt=String(res.inventoryStatus||'');
        var isFulfilled=invSt==='Fulfilled';
        var invColor=isFulfilled?'#6fd68f':(invSt==='Started'?'#f0c040':'#8fa3b8');
        if(!isQuote){
          dh+='<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">'+
            '<span class="tagx" style="border-color:'+invColor+';color:'+invColor+'">Inv: '+(invSt||'—')+'</span>'+
            (res.isInvoiced?'<span class="cbz-muted" style="font-size:11px">También aplica al invoice de esta OV en inFlow</span>':'')+
            '</div>';
        }
        dh+='<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px">';
        dh+='<button class="cbz-btn" onclick="Dash.dlPdf(\''+id+'\')">⬇ Descargar PDF</button>';
        if(!isQuote){
          if(dashCanWrite()){
            if(isFulfilled){
              dh+='<button class="cbz-btn-sec" onclick="Dash.setFulfill(\''+id+'\',false)">Desmarcar fulfilled</button>';
            } else {
              dh+='<button class="cbz-btn" onclick="Dash.setFulfill(\''+id+'\',true)">Marcar fulfilled</button>';
            }
          }
          dh+='<button class="cbz-btn-sec" onclick="Dash.dlPickList(\''+id+'\')">⬇ Pick list</button>';
        }
        dh+='</div>';
        det.innerHTML=dh;
      }).catch(function(){});
    }
  }
  function dashCanWrite(){
    var p=getProfile();var ms=p.modulos||[];
    return p.rol==='admin'||ms.indexOf('dashboard+')>=0;
  }
  function orderHint(id){
    var hint='';
    for(var i=0;i<(orders||[]).length;i++){if(String(orders[i].id)===String(id)){hint=orders[i].ov||'';break;}}
    return hint;
  }
  function dlPdf(id){
    var hint=orderHint(id);
    MCpost({action:'getOrderPdf',orderId:id,user:getUserName(),pin:getPin()}).then(function(res){
      if(!res.ok){alert('Error: '+(res.error||'no se pudo generar el PDF'));return;}
      return mcDownloadBlob(res.b64, mcPdfFilename(res.filename, hint));
    }).catch(function(){alert('Fallo de red generando el PDF');});
  }
  function setFulfill(id, fulfilled){
    if(!dashCanWrite()){alert('Sin permiso de escritura en Dashboard');return;}
    if(window._dashBusy)return;
    var msg=fulfilled
      ?'Esto descuenta stock en inFlow. ¿Continuar?'
      :'¿Desmarcar fulfilled en inFlow?';
    if(!confirm(msg))return;
    window._dashBusy=true;
    var det=document.getElementById('det-'+id);
    if(det){
      det.querySelectorAll('button').forEach(function(b){b.disabled=true;b.style.opacity='.5';});
      det.insertAdjacentHTML('afterbegin','<div class="cbz-muted" id="ff-'+id+'">Actualizando fulfillment…</div>');
    }
    MCpost({action:'setOrderFulfillment',orderId:id,fulfilled:!!fulfilled,user:getUserName(),pin:getPin()}).then(function(res){
      window._dashBusy=false;
      var tip=document.getElementById('ff-'+id); if(tip) tip.remove();
      if(!res.ok){
        if(det) det.querySelectorAll('button').forEach(function(b){b.disabled=false;b.style.opacity='';});
        alert('Error: '+(res.error||'no se pudo actualizar'));return;
      }
      for(var i=0;i<(orders||[]).length;i++){
        if(String(orders[i].id)===String(id)){
          orders[i].inv=String(res.inventoryStatus||'').toLowerCase();
          break;
        }
      }
      openId=null;
      toggleOrder(id);
    }).catch(function(){
      window._dashBusy=false;
      if(det) det.querySelectorAll('button').forEach(function(b){b.disabled=false;b.style.opacity='';});
      alert('Fallo de red actualizando fulfillment');
    });
  }
  function dlPickList(id){
    if(window._dashBusy)return;
    var hint=orderHint(id);
    var det=document.getElementById('det-'+id);
    window._dashBusy=true;
    if(det) det.querySelectorAll('button').forEach(function(b){b.disabled=true;b.style.opacity='.5';});
    MCpost({action:'getPickListPdf',orderId:id,user:getUserName(),pin:getPin()}).then(function(res){
      window._dashBusy=false;
      if(det) det.querySelectorAll('button').forEach(function(b){b.disabled=false;b.style.opacity='';});
      if(!res.ok){alert(res.error||'Pick list no disponible');return;}
      return mcDownloadBlob(res.b64, mcPdfFilename(res.filename, hint, 'PICK LIST'));
    }).catch(function(){
      window._dashBusy=false;
      if(det) det.querySelectorAll('button').forEach(function(b){b.disabled=false;b.style.opacity='';});
      alert('Fallo de red generando pick list');
    });
  }
  return {init:init,openHistorial:openHistorial,preset:preset,applyCustom:applyCustom,setFilter:setFilter,toggleOrder:toggleOrder,dlPdf:dlPdf,setFulfill:setFulfill,dlPickList:dlPickList};
})();


/* ===================== USUARIOS (solo admin) ===================== */
var Users = (function(){
  var lista = [], mods = [], modLabels = {}, editing = null, invites = [], clientes = [];
  var MOD_LABELS_FALLBACK={
    dashboard:'Dashboard',cobranza:'Cobranza',inventario:'Inventario',cotizaciones:'Cotizaciones',
    proveedores:'Proveedores',transfers:'Stock Transfers',caja:'Rutas y Caja Chica',
    estadocuenta:'Estado de cuenta',consignacion:'Consignación y alquiler'
  };
  function labelOf(m){return (modLabels&&modLabels[m])||MOD_LABELS_FALLBACK[m]||m;}
  function formatModsList(modStr){
    if(!modStr)return 'ninguno';
    return String(modStr).split(',').map(function(x){
      x=String(x||'').trim();if(!x)return '';
      var plus=x.slice(-1)==='+';
      var id=plus?x.slice(0,-1):x;
      var lab=labelOf(id);
      return plus?(lab+' (interactuar)'):lab;
    }).filter(String).join(', ')||'ninguno';
  }
  function api(p){
    p.user = getUserName(); p.pin = getPin();
    return MCpost(p);
  }
  function init(){
    var el=document.getElementById('users-screen');
    el.innerHTML='<div class="cbz-loading">Cargando usuarios...</div>';
    api({action:'listUsers'}).then(function(res){
      if(!res.ok){el.innerHTML='<div class="cbz-error">'+res.error+'</div>';return;}
      lista=res.usuarios; mods=res.modulosDisponibles||[]; modLabels=res.modulosLabels||{}; editing=null; render();
      api({action:'listInvites'}).then(function(r2){
        if(r2.ok){invites=r2.invitaciones;render();}
      }).catch(function(){});
      api({action:'getClientes'}).then(function(r3){
        if(r3.ok){clientes=r3.clientes;if(editing!==null)render();}
      }).catch(function(){});
    }).catch(function(e){el.innerHTML='<div class="cbz-error">'+MCerr(e)+'</div>';});
  }
  function render(){
    var el=document.getElementById('users-screen');
    var h='<div class="cbz-card-row" style="margin-bottom:12px">'+
      '<button class="cbz-btn" onclick="Users.nuevo()">+ Nuevo usuario</button>'+
      '<button class="cbz-btn-sec" onclick="Users.invitar()">🔗 Generar invitación</button></div>';
    function cardHtml(u,i){
      var isEd = editing===i;
      var card='<div class="cbz-card'+(u.activo?'':' cbz-card-off')+'">'+
        '<div class="cbz-card-top"><div class="cbz-card-name">'+u.nombre+
        (u.rol==='admin'?' <span class="tagx tf">ADMIN</span>':'')+
        (u.master?' <span class="tagx" style="background:#3a2c1c;color:#f0c040">MÁSTER</span>':'')+
        (u.rol==='cliente'&&!u.aprobado?(u.solicitud?' <span class="tagx tn">🔔 SOLICITÓ ACCESO '+u.solicitud+'</span>':' <span class="tagx tn">POR APROBAR</span>'):'')+
        (u.activo?'':' <span class="tagx tn">INACTIVO</span>')+'</div>'+
        '<div style="display:flex;gap:6px">'+
        '<button class="cbz-btn-sec" onclick="Users.preview(\''+String(u.nombre).replace(/'/g,"\\'")+'\')" title="Ver como este usuario">👁 Preview</button>'+
        '<button class="cbz-btn-sec" onclick="Users.edit('+i+')">'+(isEd?'Cerrar':'Editar')+'</button></div></div>'+
        '<div class="cbz-card-row cbz-muted">Módulos: '+formatModsList(u.modulos)+'</div>';
      if(isEd) card+=formHtml(u,false);
      return card+'</div>';
    }
    var internos=[], clientesU=[];
    lista.forEach(function(u,i){ (u.rol==='cliente'?clientesU:internos).push({u:u,i:i}); });
    h+='<div class="cbz-card-name" style="margin:6px 0">👷 Equipo Minecore ('+internos.length+')</div>';
    h+=internos.length?internos.map(function(x){return cardHtml(x.u,x.i);}).join(''):
      '<div class="cbz-muted" style="padding:8px">Sin usuarios internos.</div>';
    var orgs={};
    clientesU.forEach(function(x){
      var e=(x.u.empresa||'(sin empresa)');
      if(!orgs[e])orgs[e]=[];
      orgs[e].push(x);
    });
    h+='<div class="cbz-card-name" style="margin:16px 0 6px">🏢 Clientes del portal ('+clientesU.length+')</div>';
    var orgKeys=Object.keys(orgs).sort();
    if(!orgKeys.length)h+='<div class="cbz-muted" style="padding:8px">Sin usuarios de clientes.</div>';
    orgKeys.forEach(function(e){
      orgs[e].sort(function(a,b){return (b.u.master?1:0)-(a.u.master?1:0);}); // máster primero
      h+='<div class="cbz-muted" style="margin:8px 0 4px;font-weight:700;color:#9fc3e8">'+e+' · '+orgs[e].length+' usuario'+(orgs[e].length===1?'':'s')+'</div>';
      h+=orgs[e].map(function(x){return cardHtml(x.u,x.i);}).join('');
    });
    if(editing==='new') h='<div class="cbz-card">'+ '<div class="cbz-card-name">Nuevo usuario</div>'+formHtml({nombre:'',pin:'',rol:'usuario',modulos:'',activo:true,empresa:'',master:false},true)+'</div>'+h;
    if(editing==='invite') h=inviteFormHtml()+h;
    if(invites.length){
      h+='<div class="cbz-card" style="margin-top:14px"><div class="cbz-card-name" style="cursor:pointer" onclick="Users.togInvList()">'+(invListOpen?'▾':'▸')+' 🔗 Invitaciones enviadas ('+invites.length+')</div>'+(invListOpen?'':'</div>');
      if(invListOpen)h+=''+
        invites.map(function(v){
          var estado=v.usadoPor?'<span class="tagx tf">USADA por '+v.usadoPor+(v.fechaUso?' · '+v.fechaUso:'')+'</span>':'<span class="tagx" style="background:#3a3a1c;color:#f0c040">PENDIENTE</span>';
          return '<div class="cbz-fact-row" style="flex-wrap:wrap;gap:6px">'+
            '<span class="cbz-fact-id" style="min-width:0;flex:1">'+(v.fecha||'')+' · '+v.rol+(v.empresa?' · '+v.empresa:'')+
            '<div class="pmeta">Invitó: '+(v.creador||'—')+' · Módulos: '+(v.modulos||'—')+'</div></span>'+estado+'</div>';
        }).join('')+'</div>';
    }
    el.innerHTML=h;
  }
  function formHtml(u,isNew){
    var toks=(u.modulos||'').split(',').map(function(x){return x.trim();});
    var esCli=u.rol==='cliente';
    // grid interno: todos los modulos (ALL_MODULES) con label + Ver/Interactuar
    var gridInt=mods.map(function(m){
      var ver=toks.indexOf(m)>=0||toks.indexOf(m+'+')>=0;
      var act=toks.indexOf(m+'+')>=0;
      return '<div class="cbz-card-row" style="gap:14px"><b style="min-width:160px;font-size:12px">'+labelOf(m)+'</b>'+
        '<label class="cbz-esc"><input type="checkbox" id="f-mod-'+m+'" '+(ver?'checked':'')+'> Ver</label>'+
        '<label class="cbz-esc"><input type="checkbox" id="f-act-'+m+'" '+(act?'checked':'')+'> Interactuar</label></div>';
    }).join('')+
    '<div class="cbz-muted" style="font-size:11px;margin:4px 0">Ver = consultar · Interactuar = crear/editar (en Rutas y Caja Chica: rutas, gastos, fotos, etc.).</div>';
    // grid cliente: solo modulos del portal, siempre en Ver
    var CMODS=CMODS_REG.map(function(cm){return [cm[0],cm[1]+' '+cm[2]];});
    var gridCli=CMODS.map(function(cm){
      var on=toks.indexOf(cm[0])>=0||toks.indexOf(cm[0]+'+')>=0;
      return '<label class="cbz-esc" style="margin-right:14px"><input type="checkbox" id="f-cmod-'+cm[0]+'" '+(on?'checked':'')+'> '+cm[1]+'</label>';
    }).join('')+
    '<div class="cbz-muted" style="font-size:11px;margin:4px 0">Los clientes solo consultan; consignación y alquiler salen automáticos al aprobar la organización.</div>';
    return '<div class="uform">'+
      '<input class="uinput" id="f-nombre" placeholder="Nombre/iniciales" value="'+u.nombre+'" '+(isNew?'':'readonly')+'>'+
      '<input class="uinput" id="f-pin" placeholder="PIN (4-8 dígitos)" value="'+u.pin+'" inputmode="numeric" maxlength="8">'+
      '<select class="uinput" id="f-rol" onchange="Users.rolChanged()">'+
      '<option value="usuario"'+(u.rol!=='admin'&&!esCli?' selected':'')+'>👷 Usuario Minecore</option>'+
      '<option value="admin"'+(u.rol==='admin'?' selected':'')+'>👷 Administrador Minecore</option>'+
      '<option value="cliente"'+(esCli?' selected':'')+'>🏢 Cliente (portal)</option></select>'+
      '<div id="f-grid-int" style="display:'+(esCli?'none':'block')+'"><div class="cbz-card-row" style="flex-wrap:wrap">'+gridInt+'</div></div>'+
      '<div id="f-cli-wrap" style="display:'+(esCli?'block':'none')+'">'+
        '<div class="cbz-card-row" style="flex-wrap:wrap">'+gridCli+'</div>'+
        '<div class="cbz-card-row"><input class="uinput" id="f-emp" style="flex:1" placeholder="Empresa (lo que declaró el usuario)" value="'+String(u.empresa||'').replace(/"/g,'&quot;')+'">'+
        '<button class="cbz-btn-sec" onclick="Users.matchEmp()">🔎 Buscar coincidencia</button></div>'+
        '<div id="f-emp-sug"></div>'+
        (esCli&&u.empresa&&clientes.length&&clientes.indexOf(u.empresa)<0?'<div class="cbz-muted" style="color:#f0c040">⚠ "'+u.empresa+'" no coincide exacto con ningún cliente de inFlow — usa 🔎 y elige el correcto</div>':'')+
        '<label class="cbz-esc"><input type="checkbox" id="f-master" '+(u.master?'checked':'')+'> Máster de su organización (puede invitar y administrar a su equipo)</label>'+
        '<label class="cbz-esc"><input type="checkbox" id="f-aprobado" '+(u.aprobado?'checked':'')+'> ✅ Aprobado (habilita estado de cuenta y consignación de la organización)</label>'+
      '</div>'+
      '<label class="cbz-esc"><input type="checkbox" id="f-activo" '+(u.activo?'checked':'')+'> Activo</label>'+
      '<div class="cbz-card-row">'+
      '<button class="cbz-btn" onclick="Users.save('+(isNew?'true':'false')+')">Guardar</button>'+
      (isNew?'':'<button class="cbz-btn-sec cbz-danger" onclick="Users.borrar(\''+u.nombre+'\')">Eliminar</button>')+
      '</div></div>';
  }
  function rolChanged(){
    var esCli=document.getElementById('f-rol').value==='cliente';
    document.getElementById('f-grid-int').style.display=esCli?'none':'block';
    document.getElementById('f-cli-wrap').style.display=esCli?'block':'none';
  }

  function matchEmp(){
    var txt=(document.getElementById('f-emp').value||'').trim();
    var box=document.getElementById('f-emp-sug');
    if(!box)return;
    if(txt.length<3){box.innerHTML='<div class="cbz-muted">Escribe al menos 3 letras.</div>';return;}
    function norm(s){return String(s).toUpperCase().replace(/[ÁÉÍÓÚ]/g,function(c){return {'Á':'A','É':'E','Í':'I','Ó':'O','Ú':'U'}[c];}).replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
    var toks=norm(txt).split(' ').filter(function(t){return t.length>=3;});
    var cand=clientes.filter(function(c){var n=norm(c);return toks.every(function(t){return n.indexOf(t)>=0;});}).slice(0,3);
    box.innerHTML=cand.length?('<div class="cbz-card-row" style="flex-wrap:wrap">'+cand.map(function(c){
      return '<button class="chip" onclick="document.getElementById(\'f-emp\').value=this.getAttribute(\'data-c\')" data-c="'+c.replace(/"/g,'&quot;')+'">'+c+'</button>';
    }).join('')+'</div>'):'<div class="cbz-muted">Sin coincidencias en inFlow.</div>';
  }
  function nuevo(){editing='new';render();}
  function edit(i){editing=(editing===i)?null:i;render();}
  function save(isNew){
    var rol=document.getElementById('f-rol').value;
    var modsSel;
    if(rol==='cliente'){
      modsSel=CMODS_REG.map(function(cm){return cm[0];}).filter(function(m){
        var c=document.getElementById('f-cmod-'+m);return c&&c.checked;
      }).join(',');
    } else {
      modsSel=mods.map(function(m){
        var act=document.getElementById('f-act-'+m).checked;
        var ver=document.getElementById('f-mod-'+m).checked;
        return act?(m+'+'):(ver?m:'');
      }).filter(String).join(',');
    }
    var p={action:'saveUser',
      nombre:document.getElementById('f-nombre').value.trim(),
      userPin:document.getElementById('f-pin').value.trim(),
      rol:rol,
      modulos:modsSel,
      activo:document.getElementById('f-activo').checked};
    if(rol==='cliente'){
      p.empresa=document.getElementById('f-emp').value.trim();
      p.master=document.getElementById('f-master').checked;
      p.aprobado=document.getElementById('f-aprobado').checked;
    }
    api(p).then(function(res){
      alert(res.ok?('Usuario '+res.accion):('Error: '+res.error));
      if(res.ok) init();
    });
  }

  function borrar(nombre){
    if(!confirm('¿Eliminar al usuario '+nombre+'? Esta acción no se puede deshacer.'))return;
    api({action:'deleteUser',nombre:nombre}).then(function(res){
      alert(res.ok?'Usuario eliminado':'Error: '+res.error);
      if(res.ok) init();
    });
  }
  function invitar(){ editing='invite'; render(); }
  function inviteFormHtml(){
    var gridInt=mods.map(function(m){
      return '<div class="cbz-card-row" style="gap:14px"><b style="min-width:160px;font-size:12px">'+labelOf(m)+'</b>'+
        '<label class="cbz-esc"><input type="checkbox" id="i-mod-'+m+'"> Ver</label>'+
        '<label class="cbz-esc"><input type="checkbox" id="i-act-'+m+'"> Interactuar</label></div>';
    }).join('')+
    '<div class="cbz-muted" style="font-size:11px;margin:4px 0">Ver = consultar · Interactuar = crear/editar (en Rutas y Caja Chica: rutas, gastos, fotos, etc.).</div>';
    var CMODS=CMODS_REG.map(function(cm){return [cm[0],cm[1]+' '+cm[2]];});
    var gridCli=CMODS.map(function(cm){
      return '<label class="cbz-esc" style="margin-right:14px"><input type="checkbox" id="i-cmod-'+cm[0]+'" checked> '+cm[1]+'</label>';
    }).join('');
    return '<div class="cbz-card"><div class="cbz-card-name">🔗 Nueva invitación</div>'+
      '<div class="uform">'+
      '<select class="uinput" id="i-rol" onchange="Users.invRolChanged()">'+

/* ===================== INVENTARIO ===================== */
var Inv = (function(){
  var items=[], esAdmin=false, esCliente=false, puedeCot=false, cats=[], marcas=[];
  function rolCli(){try{return getProfile().rol==='cliente';}catch(e){return true;}}
  function enModoCot(){return !!(MC_cotPara&&!esCliente);}
  function bannerCotPara(){
    return '<div class="cbz-card" style="border-color:#5cc8ff;margin-bottom:8px"><div class="cbz-card-row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">'+
      '<div class="cbz-card-name">🧾 Cotizando para: <span style="color:#9fc3e8">'+MC_cotPara+'</span> · <span id="cp-count">'+cartCount()+'</span> en el carrito</div>'+
      '<div style="display:flex;gap:8px">'+
      '<button class="cbz-btn" id="cp-fin" onclick="Inv.finalizarCotPara()" '+(cartCount()>0?'':'style="opacity:.4"')+'>✅ Finalizar y revisar precios</button>'+
      '<button class="chip" onclick="cancelarCotPara()">✖</button></div></div></div>';
  }
  var BASE_PUB='https://estebanfch-cell.github.io/minecoreadminapp/';
  function absUrl(p){p=String(p||'');if(/^https?:/i.test(p))return p;return (location.protocol==='file:'?BASE_PUB:'')+p;}
  function fmtK(n){n=parseFloat(n)||0;if(Math.abs(n)>=1000000)return '$'+(n/1000000).toFixed(2)+'M';if(Math.abs(n)>=100000)return '$'+(n/1000).toFixed(1)+'K';return (function(){var p=n.toFixed(2).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return '$'+p.join('.');})();}
  var carrito={}, vistaCart='cart', enviadas=null;
  var despArr=null, despOpen={}, despProv=null, despCat=null;
  function cartKey(){return 'mc_carrito_'+(getUserName()||'').toLowerCase();}
  function cartLoad(){try{carrito=JSON.parse(localStorage.getItem(cartKey())||'{}');}catch(e){carrito={};}
    try{localStorage.removeItem('mc_carrito');}catch(e){}}
  function cartSave(){try{localStorage.setItem(cartKey(),JSON.stringify(carrito));}catch(e){}}
  function cartCount(){cartLoad();var n=0;for(var k in carrito)n+=carrito[k].cantidad;return n;}
  var q='', filtro='todos', cat='', marca='', abierto=null, vista='inv', reo=null;
  var fDesc='', fMm='';   // filtros finos de brocas (descarga y milimetraje)
  function fmt(n){n=parseFloat(n)||0;var p=n.toFixed(2).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return '$'+p.join('.');}
  function api(p){
    p.user=getUserName();p.pin=getPin();
    return MCpost(p);
  }
  function init(v){
    vista=v||'inv';
    cartLoad();
    var el=document.getElementById('inv-screen');
    if(vista==='miscot'){
      el.innerHTML='<div class="cbz-loading">Cargando cotizaciones...</div>';
      try{var pr=getProfile();esCliente=pr.rol==='cliente';esAdmin=pr.rol==='admin';}catch(e){}
      el.innerHTML=misCotHtml();
      enviadas=null;cargarEnviadas();
      return;
    }
    el.innerHTML='<div class="cbz-loading">Cargando inventario...</div>';
    api({action:'getInventario'}).then(function(res){
      if(!res.ok){el.innerHTML='<div class="cbz-error">'+res.error+'</div>';return;}
      items=res.items;esAdmin=res.esAdmin;esCliente=res.esCliente;
      bodegas=res.bodegas||[];if(!bodega)bodega=MCbodegaDefault(bodegas);aplicarBodega();
      var pmods=(getProfile().modulos||[]);
      puedeCot=esCliente||esAdmin||pmods.indexOf('cotizaciones')>=0||pmods.indexOf('cotizaciones+')>=0;
      cats=res.categorias||[];marcas=res.marcas||[];
      items.forEach(function(it){
        it._b=(it.nombre+' '+it.sku+' '+it.codigo+' '+it.categoria+' '+it.marca+' '+it.extra).toLowerCase();
      });
      render();
    }).catch(function(e){el.innerHTML='<div class="cbz-error">'+MCerr(e)+'</div>';});
  }
  var bodegas=[], bodega='';
  function aplicarBodega(){
    items.forEach(function(it){if(it.stockTotal===undefined)it.stockTotal=it.stock||0;it.stock=(bodega&&bodega!=='*'&&bodegas.length)?MCstockDe(it,bodega):it.stockTotal;});
  }
  function setBodega(v){bodega=v||'*';aplicarBodega();render();}
  function bodegaSelHtml(){
    if(!bodegas.length||esCliente)return '';
    return '<select class="uinput" style="max-width:220px;padding:8px" onchange="Inv.setBodega(this.value)">'+
      bodegas.map(function(b){return '<option value="'+b.replace(/"/g,'&quot;')+'"'+(bodega===b?' selected':'')+'>📦 '+b+'</option>';}).join('')+
      '<option value="*"'+(bodega==='*'?' selected':'')+'>Todas las bodegas (total)</option></select>';
  }
  function pasa(it){
    if(cat && it.categoria!==cat)return false;
    if(marca && it.marca!==marca)return false;
    if(filtro==='con'&&it.stock<=0)return false;
    if(filtro==='agotados'&&it.stock>0)return false;
    if(q){
      var toks=q.toLowerCase().split(/\s+/).filter(String);
      for(var i=0;i<toks.length;i++){if(it._b.indexOf(toks[i])<0)return false;}
    }
    if(esContextoBroca()){
      var N=' '+it.nombre.toUpperCase()+' ';
      if(fDesc&&!hayEn(it,fDesc))return false;
      if(fMm&&!hayEn(it,fMm+' MM'))return false;
      if(fLin&&!hayEn(it,fLin))return false;
    }
    return true;
  }
  function sel(id,opts,val,fn,ph){
    return '<select class="uinput" style="max-width:220px;padding:8px" onchange="'+fn+'(this.value)">'+
      '<option value="">'+ph+'</option>'+
      opts.map(function(c){return '<option value="'+c.replace(/"/g,'&quot;')+'"'+(val===c?' selected':'')+'>'+c+'</option>';}).join('')+
      '</select>';
  }
  function render(){
    var el=document.getElementById('inv-screen');
    var h='';
    h+='<div class="cbz-card-row" style="justify-content:flex-end;margin-bottom:8px">'+
      '<button class="chip '+(vista==='inv'?'on':'')+'" onclick="Inv.setVista(\'inv\')">📦 Inventario</button>'+
      ((esAdmin&&!rolCli())?'<button class="chip '+(vista==='reo'?'on':'')+'" onclick="Inv.setVista(\'reo\')">🔁 Reorden & Recomendaciones</button>':'')+
      '<button class="chip '+(vista==='desp'?'on':'')+'" onclick="Inv.setVista(\'desp\')">📄 Despieces</button>'+
      '<button class="chip '+(vista==='man'?'on':'')+'" onclick="Inv.setVista(\'man\')">📘 Manuales</button>'+
      '</div>';
    if(vista==='reo'){el.innerHTML=h+'<div id="reo-body"></div>';renderReo();return;}
    if(enModoCot())h=bannerCotPara()+h;
    if(vista==='desp'||vista==='man'){el.innerHTML=h+'<div id="desp-body"></div>';renderDesp();return;}
    if(vista==='miscot'){el.innerHTML=misCotHtml();if(enviadas===null)cargarEnviadas();return;}
    if(vista==='inv'&&!enModoCot())h=avisoCotListas()+h;
    if(vista==='cart'){el.innerHTML=h+cartHtml();return;}
    h+='<div id="inv-kpis"></div>'+
      '<div class="cbz-card-row" style="margin-bottom:6px">'+
      '<input class="cbz-search" placeholder="🔍 Nombre, SKU, código, serie, DL/WW, mm..." value="'+q.replace(/"/g,'&quot;')+'" oninput="Inv.setQ(this.value)">'+
      '</div>'+
      '<div class="cbz-card-row" style="margin-bottom:10px">'+
      bodegaSelHtml()+sel('cat',cats,cat,'Inv.setCat','Todas las categorías')+
      sel('marca',(esCliente?marcas.filter(function(m){return /BOYLES|FORDIA/i.test(m);}):marcas),marca,'Inv.setMarca','Todas las marcas')+
      chip('todos','Todos')+chip('con','Con stock')+chip('agotados','Agotados')+
      '</div>'+'<div id="inv-broca">'+brocaFiltersHtml()+'</div>'+'<div id="inv-list"></div>'+
      ((esCliente||(puedeCot&&cartCount()>0))?'<div id="cart-fab" class="cbz-btn" style="position:fixed;bottom:18px;right:16px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.45);cursor:pointer" onclick="Inv.verCarrito()">🛒 Carrito ('+cartCount()+')</div>':'');
    el.innerHTML=h;
    renderList();
  }
  function chip(id,lbl){return '<button class="chip '+(filtro===id?'on':'')+'" onclick="Inv.setF(\''+id+'\')">'+lbl+'</button>';}

  /** Contexto broca: la categoría o la búsqueda mencionan "broca" */
  function esContextoBroca(){
    return (cat&&cat.toLowerCase().indexOf('broca')>=0)||(q&&q.toLowerCase().indexOf('broca')>=0);
  }
  var DESCARGAS=['DL','DF','DWW'];
  var MMS_FIJOS=['13','16','20'];
  var LINEAS=['HQ','NQ','PQ','BQ','IEW'];
  var fLin='';
  function hayEn(it,tok){ // busca el token en TODAS las columnas del producto, con bordes de palabra
    var H=(String(it.nombre||'')+' '+String(it.codigo||'')+' '+String(it.categoria||'')+' '+String(it.marca||'')+' '+String(it.sku||'')).toUpperCase();
    return new RegExp('(^|[^A-Z0-9])'+tok.replace(/\s+/g,'\\s*')+'([^A-Z0-9]|$)').test(H);
  }
  function brocaFiltersHtml(){
    if(!esContextoBroca()){fDesc='';fMm='';fLin='';return '';}
    function grupo(lbl,val,ops,fn,todos){
      return '<span style="display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap">'+
        '<span class="cbz-muted" style="font-size:10px">'+lbl+'</span>'+
        '<button class="chip" style="padding:4px 9px;font-size:11px'+(val===''?';background:#2b4b6e':'')+'" onclick="Inv.'+fn+'(\'\')">'+todos+'</button>'+
        ops.map(function(o){return '<button class="chip" style="padding:4px 9px;font-size:11px'+(val===o?';background:#2b4b6e':'')+'" onclick="Inv.'+fn+'(\''+o+'\')">'+o+'</button>';}).join('')+
        '</span>';
    }
    return '<div class="cbz-card-row" style="margin-bottom:8px;gap:12px;flex-wrap:wrap;align-items:center;row-gap:6px">'+
      grupo('Línea',fLin,LINEAS,'setLin','Todas')+
      '<span style="opacity:.25">|</span>'+
      grupo('Descarga',fDesc,DESCARGAS,'setDesc','Todas')+
      '<span style="opacity:.25">|</span>'+
      grupo('mm',fMm,MMS_FIJOS,'setMm','Todos')+
      '</div>';
  }

  /** KPIs dinámicos: se recalculan sobre lo filtrado */
  function renderKpis(fil){
    var box=document.getElementById('inv-kpis');
    if(!box)return;
    if(esCliente||enModoCot()){box.innerHTML='';return;}
    var k={skus:0,unidades:0,agotados:0,vCosto:0,vPrecio:0,mSum:0,mN:0};
    fil.forEach(function(it){
      k.skus++;k.unidades+=it.stock;
      if(it.stock<=0)k.agotados++;
      if(esAdmin&&it.costo)k.vCosto+=it.stock*it.costo;
      if(it.precio)k.vPrecio+=it.stock*it.precio;
      if(esAdmin&&it.margenPct!==undefined){k.mSum+=it.margenPct;k.mN++;}
    });
    box.innerHTML='<div class="cbz-kpis" style="margin-bottom:12px">'+
      '<div class="cbz-kpi"><span class="cbz-kpi-num">'+k.skus+'</span><span class="cbz-kpi-lbl">SKUs</span></div>'+
      '<div class="cbz-kpi"><span class="cbz-kpi-num">'+Math.round(k.unidades*100)/100+'</span><span class="cbz-kpi-lbl">Unidades</span></div>'+
      '<div class="cbz-kpi"><span class="cbz-kpi-num cbz-red">'+k.agotados+'</span><span class="cbz-kpi-lbl">Agotados</span></div>'+
      ((esAdmin&&!rolCli())?'<div class="cbz-kpi" title="'+fmt(k.vCosto)+'"><span class="cbz-kpi-num">'+fmtK(k.vCosto)+'</span><span class="cbz-kpi-lbl">Valor a costo</span></div>':'')+
      ((!esCliente&&!rolCli())?'<div class="cbz-kpi" title="'+fmt(k.vPrecio)+'"><span class="cbz-kpi-num" style="color:#6fd68f">'+fmtK(k.vPrecio)+'</span><span class="cbz-kpi-lbl">Valor a precio</span></div>':'')+
      ((esAdmin&&!rolCli())&&k.mN?'<div class="cbz-kpi"><span class="cbz-kpi-num" style="color:#5cc8ff">'+Math.round(k.mSum/k.mN*10)/10+'%</span><span class="cbz-kpi-lbl">Margen prom.</span></div>':'')+
      '</div>';
  }
  function renderList(){
    var box=document.getElementById('inv-list');
    if(!box)return;
    var fil=items.filter(pasa);

    var MAX=150;
    var h=fil.slice(0,MAX).map(function(it,ix){

        '<div style="flex:1;min-width:0"><div class="pname">'+(open?'▾ ':'▸ ')+it.nombre+'</div>'+
        '<div class="pmeta">SKU: '+it.sku+(it.codigo?' · Cód: '+it.codigo:'')+'</div></div>'+

        (it.precio!==undefined&&it.precio?'<div class="pname" style="margin-top:4px">'+fmt(it.precio)+'</div>':'')+
        (puedeCot?(carrito[it.sku]?'<div style="margin-top:6px;display:flex;gap:4px;justify-content:flex-end;align-items:center" onclick="event.stopPropagation()">🛒<input type="number" min="1" inputmode="numeric" class="uinput" style="width:58px;max-width:58px;text-align:center;padding:5px" value="'+carrito[it.sku].cantidad+'" onchange="Inv.cartSet(\''+it.sku+'\',this.value)"><button class="chip" onclick="Inv.cartQty(\''+it.sku+'\',1)">＋</button></div>':'<div style="margin-top:6px"><button class="chip" onclick="event.stopPropagation();Inv.addCart(\''+it.sku+'\')">➕ Cotizar</button></div>'):'')+
        '</div></div>';
      if(open){
        card+='<div class="odetail">'+
          (it.img?'<div style="text-align:center;margin:6px 0"><img src="'+it.img+'" style="max-width:180px;max-height:150px;object-fit:contain;background:#fff;border-radius:8px;padding:6px;cursor:zoom-in" onclick="MCfoto(\''+it.img+'\',event)"></div>':'')+
          '<div class="pmeta">'+(it.categoria||'Sin categoría')+(it.marca?' · Marca: '+it.marca:'')+'</div>'+

          (esAdmin&&it.costo!==undefined?'<div class="pmeta" style="color:#5cc8ff">Costo: '+fmt(it.costo)+
            (it.margen!==undefined?' · Margen: '+fmt(it.margen)+' ('+it.margenPct+'%)':'')+'</div>':'')+
          '</div>';

      return card+'</div>';
    }).join('');
    if(fil.length>MAX) h+='<div class="cbz-muted" style="text-align:center;padding:10px">Mostrando '+MAX+' de '+fil.length+' — afina la búsqueda</div>';
    box.innerHTML=h||'<div class="cbz-muted" style="padding:16px;text-align:center">Sin resultados</div>';

  function abrir(sku){abierto=(abierto===sku)?null:sku;renderList();}

  /* ---------- Carrito de cotización (rol cliente) ---------- */
  function updateFab(){
    var f=document.getElementById('cart-fab');if(f)f.textContent='🛒 Carrito ('+cartCount()+')';
    var c=document.getElementById('cp-count');if(c)c.textContent=cartCount();
    var b=document.getElementById('cp-fin');if(b)b.style.opacity=cartCount()>0?'1':'.4';
    if(window.MC_onCartChange)try{MC_onCartChange();}catch(e){}
  }
  function addCart(sku){
    cartLoad(); // fuente única: el Cotizador también escribe en localStorage
    var it=null;for(var i=0;i<items.length;i++){if(items[i].sku===sku){it=items[i];break;}}
    if(!it)return;
    if(!carrito[sku])carrito[sku]={nombre:it.nombre,cantidad:0,img:it.img||''};
    if(!carrito[sku].img&&it.img)carrito[sku].img=it.img;
    carrito[sku].cantidad++;cartSave();updateFab();renderList();

  function enviarCarrito(){
    var keys=Object.keys(carrito);if(!keys.length)return;
    var pr={};try{pr=getProfile()||{};}catch(e){}
    var emp='';
    if(String(pr.rol||'')==='cliente'){
      emp=String(pr.empresa||'').trim();
      if(!emp){alert('Confirma tu organización antes de solicitar cotización (o contacta a Minecore).');return;}
    } else {
      var empEl=document.getElementById('cart-emp');
      emp=empEl?empEl.value.trim():'';
    }
    var conEl=document.getElementById('cart-con');
    var con=conEl?conEl.value.trim():'';
    if(!emp||!con){alert('Indica la empresa y un contacto para poder enviarte la cotización.');return;}
    var uk=(getUserName()||'').toLowerCase();
    try{localStorage.setItem('mc_empresa_'+uk,emp);localStorage.setItem('mc_contacto_'+uk,con);}catch(e){}

    var btn=window.event&&window.event.target;if(btn)btn.disabled=true;
    var comEl=document.getElementById('cart-com');
    api({action:'enviarCarrito',items:its,empresa:emp,contacto:con,comentario:comEl?comEl.value:''})
    .then(function(res){

      if(!res.ok){alert('Error: '+res.error);return;}

    }).catch(function(){if(btn)btn.disabled=false;alert('Sin conexión. Intenta de nuevo.');});

  function dl(b64,filename){
    var bin=atob(b64),arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    var a=document.createElement('a');

    a.download=filename;
    document.body.appendChild(a);a.click();a.remove();

  /* ---------- Visor PDF interactivo: códigos tocables sobre el documento ---------- */
  var pdfjsCargando=null;
  var despPdfActual=null,despZoomN=1,despMaxPag=15,despPintaRef=null,despVerArgs=null;
  function despZoom(dir){
    if(!despVerArgs)return;

    var i=niveles.indexOf(despZoomN);if(i<0)i=0;

  function cargarPdfjs(){
    if(window.pdfjsLib&&window.pdfjsLib.__mcListo)return Promise.resolve();
    if(pdfjsCargando)return pdfjsCargando;
    pdfjsCargando=new Promise(function(res,rej){
      var s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload=function(){
        var wurl='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        // El worker de otro origen suele ser bloqueado: lo bajamos como blob local
        fetch(wurl).then(function(r){return r.blob();}).then(function(b){
          window.pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(b);
          window.pdfjsLib.__mcListo=true;res();
        }).catch(function(){
          try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=wurl;}catch(e){}
          window.pdfjsLib.__mcListo=true;res();
        });
      };
      s.onerror=function(){rej(new Error('No se pudo cargar el motor PDF'));};
      document.head.appendChild(s);
    });
    return pdfjsCargando;
  }
  function despVer(archivo,nombre,esRezoom){
    archivo=absUrl(archivo);
