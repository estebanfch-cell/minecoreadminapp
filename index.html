        (q?'Sin resultados para "'+q+'"':
         vistaE==='cartera'?'No tienes facturas pendientes 🎉':
         vistaE==='pend'?'No tienes órdenes pendientes de facturar.':'Sin facturas registradas.')+'</div>';
      return;
    }
    box.innerHTML=rows.map(function(o){
      var tag=o.estado==='pagada'?'<span class="tagx tf">PAGADA</span>':
        o.estado==='vencida'?'<span class="tagx tn">VENCIDA'+(o.diasMora?' '+o.diasMora+'d':'')+'</span>':
        o.estado==='vigente'?'<span class="tagx" style="background:#3a3a1c;color:#f0c040">VIGENTE</span>':
        '<span class="tagx" style="background:#1c3a4a;color:#5cc8ff">⏳ SIN FACTURAR</span>';
      var open=detalle&&detalle.ov===o.ov;
      var c='<div class="cbz-card" style="padding:10px 12px">'+
        '<div class="cbz-card-row" style="justify-content:space-between;align-items:flex-start;cursor:pointer" onclick="Edc.abrir(\''+o.ov.replace(/'/g,'')+'\')">'+
        '<div style="flex:1;min-width:0"><div class="pname">'+(open?'▾ ':'')+o.ov+(o.factura?' · Fact. '+o.factura:'')+'</div>'+
        '<div class="pmeta">'+o.fecha+(o.vence&&o.estado!=='pendiente'?' · Vence: '+o.vence:'')+(o.estado==='pagada'&&o.fechaPago?' · Pagada: '+o.fechaPago:'')+(o.estado==='pendiente'&&o.invStatus?' · '+o.invStatus:'')+'</div></div>'+
        '<div style="text-align:right;flex:none">'+tag+'<div class="pname" style="margin-top:4px">'+fmt(o.total)+'</div>'+
        (o.facturada&&o.saldo>0.005?'<div class="pmeta" style="color:#f0c040">Saldo: '+fmt(o.saldo)+'</div>':'')+'</div></div>';
      if(open){
        c+='<div class="odetail">';
        if(detalle.cargando)c+='<div class="cbz-loading">Cargando detalle...</div>';
        else if(detalle.error)c+='<div class="cbz-error">'+detalle.error+'</div>';
        else{
          if(detalle.lines&&detalle.lines.length){
            c+=detalle.lines.map(function(l){
              return '<div class="cbz-fact-row" style="align-items:center;gap:8px">'+
                (l.img?'<img src="'+l.img+'" class="pimg" style="width:34px;height:34px" loading="lazy" onerror="this.style.display=\'none\'">':'')+
                '<span class="cbz-fact-id" style="flex:1;min-width:0">'+l.producto+(l.sku?'<div class="pmeta">SKU: '+l.sku+'</div>':'')+'</span>'+
                '<span class="cbz-muted" style="text-align:right">'+fmtQty(l.cantidad)+' × '+fmt(l.precio)+(l.desc?' (−'+l.desc+')':'')+'<br><b>'+fmt(l.subtotal)+'</b></span></div>';
            }).join('');
          } else c+='<div class="cbz-muted">Sin detalle disponible.</div>';
          if(detalle.resumen){
            var rs=detalle.resumen;
            c+='<div class="cbz-card-row" style="justify-content:flex-end;margin-top:8px;border-top:1px solid #26313f;padding-top:8px">'+
              '<div style="text-align:right" class="cbz-muted">Subtotal: <b>'+fmt(rs.subtotal)+'</b> · IVA: <b>'+fmt(rs.iva)+'</b> · Total: <b style="color:#fff">'+fmt(rs.total)+'</b><br>'+
              'Pagado: <b style="color:#6fd68f">'+fmt(rs.pagado)+'</b>'+(rs.saldo>0.005?' · Por pagar: <b style="color:#f0c040">'+fmt(rs.saldo)+'</b>':' · <b style="color:#6fd68f">✅ Sin saldo pendiente</b>')+'</div></div>';
          }
        }
        c+='</div>';
      }
      return c+'</div>';
    }).join('');
  }
  function setQ(v){q=v;renderListE();}
  function setV(v){vistaE=v;detalle=null;renderListE();}
  function toggleOrden(){ordenDesc=!ordenDesc;renderListE();}
  function abrir(ov){
    if(detalle&&detalle.ov===ov){detalle=null;renderListE();return;}
    detalle={ov:ov,cargando:true};renderListE();
    api({action:'miOrden',ov:ov}).then(function(res){
      if(!detalle||detalle.ov!==ov)return;
      detalle=res.ok?{ov:ov,lines:res.lines||[],resumen:res.resumen||null}:{ov:ov,error:res.error||'No se pudo cargar'};
      renderListE();
    }).catch(function(){if(detalle&&detalle.ov===ov){detalle={ov:ov,error:'Sin conexión.'};renderListE();}});
  }
  function solicitar(btn){
    if(btn){btn.disabled=true;btn.textContent='Enviando...';}
    api({action:'solicitarEdc'}).then(function(res){
      var m=document.getElementById('edc-sol-msg');
      if(btn){btn.disabled=false;btn.textContent='📨 Solicitar autorización';}
      if(m)m.innerHTML=res.ok?'<div style="color:#6fd68f">✅ '+res.mensaje+'</div>':'<div class="cbz-error">'+(res.error||'No se pudo enviar')+'</div>';
    }).catch(function(){
      if(btn){btn.disabled=false;btn.textContent='📨 Solicitar autorización';}
      var m=document.getElementById('edc-sol-msg');if(m)m.innerHTML='<div class="cbz-error">Sin conexión.</div>';
    });
  }
  return {init:init,setV:setV,setQ:setQ,abrir:abrir,solicitar:solicitar,toggleOrden:toggleOrden};
})();

/* ===================== MI EQUIPO (cliente máster: invita y administra) ===================== */
var MInv = (function(){
  var equipo=[], pm=[];
  function api(p){
    p.user=getUserName();p.pin=getPin();
    return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
      .then(function(r){return r.json();});
  }
  var NOMBRES={inventario:'Inventario',estadocuenta:'Estado de cuenta',consignacion:'Consignación y alquiler'};
  function propios(){
    var p=getProfile();
    var seen={};
    return (p.modulos||[]).map(function(m){return m.replace(/\+$/,'');})
      .filter(function(m){if(seen[m])return false;seen[m]=1;return true;});
  }
  function init(){
    var el=document.getElementById('minv-screen');
    el.innerHTML='<div class="cbz-loading">Cargando tu equipo...</div>';
    api({action:'teamList'}).then(function(res){
      if(!res.ok){el.innerHTML='<div class="cbz-error">'+res.error+'</div>';return;}
      equipo=res.equipo||[];
      pm=res.misModulos&&res.misModulos.length?res.misModulos:propios();
      var checks=pm.map(function(m){
        return '<label class="cbz-esc" style="margin-right:14px"><input type="checkbox" id="mi-mod-'+m+'" checked> '+(NOMBRES[m]||m)+'</label>';
      }).join('');
      el.innerHTML='<div class="cbz-card"><div class="cbz-card-name">👥 Invitar a alguien de '+(res.empresa||'tu organización')+'</div>'+
        '<div class="cbz-muted" style="margin:6px 0 10px">Elige qué puede ver. La persona creará su propio usuario y PIN con el link (un solo uso).</div>'+
        '<div class="cbz-card-row" style="flex-wrap:wrap">'+checks+'</div>'+
        '<div class="cbz-card-row" style="margin-top:10px"><button class="cbz-btn" onclick="MInv.crear()">Crear link de invitación</button></div>'+
        '<div id="mi-result" style="margin-top:10px"></div></div>'+
        '<div id="mi-equipo"></div>';
      renderEquipo();
    }).catch(function(){el.innerHTML='<div class="cbz-error">Sin conexión.</div>';});
  }

  function renderEquipo(){
    var box=document.getElementById('mi-equipo');
    if(!box)return;
    var h='<div class="cbz-card" style="margin-top:14px"><div class="cbz-card-name">🧑‍🤝‍🧑 Tu equipo</div>';
    if(!equipo.length)h+='<div class="cbz-muted" style="padding:10px">Aún no has invitado a nadie.</div>';
    h+=equipo.map(function(u,i){
      var toks=(u.modulos||'').split(',').map(function(x){return x.trim().replace(/\+$/,'');});
      var editable=!u.esYo&&!u.master;
      var c='<div class="cbz-card" style="padding:10px 12px;margin-top:8px'+(u.activo?'':';opacity:.6')+'">'+
        '<div class="cbz-card-row" style="justify-content:space-between"><div class="cbz-card-name">'+u.nombre+
        (u.esYo?' <span class="tagx tf">TÚ</span>':'')+
        (u.master?' <span class="tagx" style="background:#3a2c1c;color:#f0c040">MÁSTER</span>':'')+
        (u.activo?'':' <span class="tagx tn">INACTIVO</span>')+'</div></div>';
      if(editable){
        c+='<div class="cbz-card-row" style="flex-wrap:wrap;margin-top:6px">'+
          pm.map(function(m){
            return '<label class="cbz-esc" style="margin-right:12px"><input type="checkbox" id="t-'+i+'-'+m+'" '+(toks.indexOf(m)>=0?'checked':'')+'> '+(NOMBRES[m]||m)+'</label>';
          }).join('')+
          '<label class="cbz-esc" style="margin-right:12px"><input type="checkbox" id="t-'+i+'-activo" '+(u.activo?'checked':'')+'> Activo</label>'+
          '</div><div class="cbz-card-row" style="margin-top:6px">'+
          '<button class="cbz-btn-sec" onclick="MInv.guardar('+i+',this)">Guardar</button>'+
          '<button class="cbz-btn-sec cbz-danger" onclick="MInv.eliminar('+i+')">Eliminar</button></div>';
      } else if(!u.esYo){
        c+='<div class="cbz-muted" style="margin-top:4px">A los usuarios máster los administra Minecore.</div>';
      }
      return c+'</div>';
    }).join('');
    box.innerHTML=h+'</div>';
  }
  function guardar(i,btn){
    var u=equipo[i];
    var sel=pm.filter(function(m){var c=document.getElementById('t-'+i+'-'+m);return c&&c.checked;}).join(',');
    var act=document.getElementById('t-'+i+'-activo').checked;
    if(btn)btn.disabled=true;
    api({action:'teamSave',nombre:u.nombre,modulos:sel,activo:act}).then(function(res){
      if(btn)btn.disabled=false;
      if(!res.ok){alert('Error: '+res.error);return;}
      init();
    }).catch(function(){if(btn)btn.disabled=false;alert('Sin conexión.');});
  }
  function eliminar(i){
    var u=equipo[i];
    if(!confirm('¿Eliminar a '+u.nombre+' de tu organización? No podrá volver a entrar.'))return;
    api({action:'teamDelete',nombre:u.nombre}).then(function(res){
      if(!res.ok){alert('Error: '+res.error);return;}
      init();
    }).catch(function(){alert('Sin conexión.');});
  }
  function crear(){
    var sel=pm.filter(function(m){var c=document.getElementById('mi-mod-'+m);return c&&c.checked;}).join(',');
    if(!sel){alert('Elige al menos un módulo.');return;}
    api({action:'createInvite',rol:'cliente',modulos:sel}).then(function(res){
      var box=document.getElementById('mi-result');
      if(!res.ok){box.innerHTML='<div class="cbz-error">'+res.error+'</div>';return;}
      var link=location.origin+location.pathname+'?invite='+res.token;
      box.innerHTML='<div class="cbz-muted" style="word-break:break-all;background:#0e1622;border-radius:8px;padding:10px">'+link+'</div>'+
        '<button class="cbz-btn-sec" style="margin-top:8px" onclick="MInv.copiar(this)" data-link="'+link+'">📋 Copiar link</button>';
    }).catch(function(){alert('Sin conexión.');});
  }
  function copiar(btn){
    var link=btn.getAttribute('data-link');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(function(){btn.textContent='✅ Copiado';});
    } else { prompt('Copia el link:',link); }
  }
  return {init:init,crear:crear,copiar:copiar,guardar:guardar,eliminar:eliminar};
})();

/* ===================== VINCULACIÓN DE ORGANIZACIÓN (cliente) ===================== */
var Vinc = (function(){
  function api(p){
    p.user=getUserName();p.pin=getPin();
    return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
      .then(function(r){return r.json();});
  }
  function marcarVinculada(emp){
    try{
      var pr=JSON.parse(localStorage.getItem('mc_profile')||'{}');
      pr.vinculada=true;if(emp)pr.empresa=emp;
      localStorage.setItem('mc_profile',JSON.stringify(pr));
    }catch(e){}
    renderHome();
  }
  function run(){
    api({action:'matchMiEmpresa'}).then(function(res){
      if(!res.ok){alert(res.error||'No se pudo buscar.');return;}
      if(res.vinculada){alert('Tu organización ya está vinculada. ✅');marcarVinculada();return;}
      var cand=res.candidatos||[];
      if(!cand.length){alert('No encontramos una coincidencia con "'+(getProfile().empresa||'')+'". Escríbenos a Minecore y te vinculamos manualmente.');return;}
      var msg='¿Cuál es tu organización?\n\n'+cand.map(function(c,i){return (i+1)+') '+c;}).join('\n')+'\n\nEscribe el número (o Cancelar):';
      var sel=prompt(msg,'1');
      if(sel===null)return;
      var idx=parseInt(sel,10)-1;
      if(!(idx>=0&&idx<cand.length)){alert('Opción inválida.');return;}
      api({action:'confirmarMiEmpresa',empresa:cand[idx]}).then(function(r2){
        if(!r2.ok){alert(r2.error||'No se pudo confirmar.');return;}
        alert('✅ '+r2.mensaje);
        marcarVinculada(r2.empresa);
      }).catch(function(){alert('Sin conexión.');});
    }).catch(function(){alert('Sin conexión.');});
  }
  return {run:run};
})();

/* ===================== CONSIGNACIÓN Y ALQUILER (portal cliente) ===================== */
var Consig = (function(){
  var data=null, vistaC='consig', cliSel=0, abiertos={};
  var esClienteC=false;
  function pedirExt(key,item,acta){
    if(!confirm('¿Solicitar a Minecore la extensión de plazo (30 → 60 días) para:\n'+item+' · '+acta+'?'))return;
    api({action:'solicitarExtension',key:key,item:item,acta:acta}).then(function(res){
      if(!res.ok){alert(res.error);return;}
      alert('✔ Solicitud enviada. Minecore la revisará y te aparecerá el estado aquí mismo.');
      init();
    }).catch(function(){alert('Sin conexión.');});
  }
  function resolverExt(key,aprobar){
    if(!confirm((aprobar?'¿APROBAR':'¿RECHAZAR')+' la extensión de este lote?'))return;
    api({action:'resolverExtension',key:key,aprobar:aprobar}).then(function(res){
      if(!res.ok){alert(res.error);return;}
      init();
    }).catch(function(){alert('Sin conexión.');});
  }
  function api(p){
    p.user=getUserName();p.pin=getPin();
    return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
      .then(function(r){return r.json();});
  }
  function fmtQty(v){var n=parseFloat(v)||0;return n%1===0?String(Math.round(n)):n.toFixed(2);}
  function durTxt(d){
    var a=Math.floor(d/365), m=Math.floor((d%365)/30), dd=(d%365)%30;
    var p=[];
    if(a)p.push(a+' año'+(a===1?'':'s'));
    if(m)p.push(m+' mes'+(m===1?'':'es'));
    if(dd||!p.length)p.push(dd+' día'+(dd===1?'':'s'));
    return p.join(', ');
  }
  function semaforo(d,l1,l2,amb){
    if(amb==='alq')return '<span class="tagx" style="background:#1c3a4a;color:#5cc8ff">⏱ '+durTxt(d)+' en alquiler</span>';
    if(d>l2)return '<span class="tagx tn">'+d+' días — A FACTURAR</span>';
    if(d>l1)return '<span class="tagx" style="background:#3a3a1c;color:#f0c040">'+d+' días — requiere autorización</span>';
    return '<span class="tagx tf">'+d+' días</span>';
  }
  function alertaDe(it,l1,l2,amb){
    if(amb==='alq')return '<span class="tagx" style="background:#1c3a4a;color:#5cc8ff">⏱ '+durTxt(it.diasMax)+'</span>';
    if(it.diasMax>l2)return '<span class="tagx tn">🔴 A facturar</span>';
    if(it.diasMax>l1)return '<span class="tagx" style="background:#3a3a1c;color:#f0c040">🟡 Atención</span>';
    return '<span class="tagx tf">🟢 Al día</span>';
  }
  function init(){
    var el=document.getElementById('consig-screen');
    el.innerHTML='<div class="cbz-loading">Cargando tu consignación...</div>';
    api({action:'getConsignacion'}).then(function(res){
      if(!res.ok){el.innerHTML='<div class="cbz-error">'+res.error+'</div>';return;}
      data=res;cliSel=0;abiertos={};esClienteC=!res.admin;
      if(data.admin){vistaC='consig';}
      else{vistaC=data.consignacion.length||!data.alquiler.length?'consig':'alq';}
      render();
    }).catch(function(){el.innerHTML='<div class="cbz-error">Sin conexión.</div>';});
  }
  function itemCard(it,key,amb){
    var open=!!abiertos[key];
    var c='<div class="cbz-card" style="padding:10px 12px">'+
      '<div class="cbz-card-row" style="align-items:center;gap:8px;cursor:pointer" onclick="Consig.toggle(\''+key+'\')">'+
      (it.img?'<img src="'+it.img+'" class="pimg" loading="lazy" onerror="this.style.display=\'none\'">':'<div class="pimg pimg-ph">📦</div>')+
      '<div style="flex:1;min-width:0"><div class="pname">'+(open?'▾ ':'▸ ')+it.nombre+'</div>'+
      '<div class="pmeta">SKU: '+it.sku+' · En tu poder: <b>'+fmtQty(it.total)+' und.</b>'+(it.lotes.length>1?' · '+it.lotes.length+' actas':'')+'</div></div>'+
      '<div style="flex:none">'+alertaDe(it,data.limiteDias,data.limiteExtendido,amb)+'</div></div>';
    if(open){
      c+='<div class="odetail">'+it.lotes.map(function(l){
        var extra='';
        if(l.ext==='APROBADA'&&l.dias<=data.limiteExtendido){
          extra='<span style="color:#6fd68f;font-size:11px;font-weight:bold;white-space:nowrap">✅ AL DÍA · extensión</span>';
        } else if(l.ext==='SOLICITADA'){
          extra=esClienteC?'<span style="color:#5cc8ff;font-size:11px;white-space:nowrap">⏳ Extensión solicitada</span>'
            :'<span style="color:#5cc8ff;font-size:11px;white-space:nowrap">⏳ Solicitada</span> '+
             '<button class="cbz-btn" style="padding:5px 10px;font-size:11px" onclick="Consig.resolverExt(\''+String(l.key).replace(/'/g,'')+'\',true)">✅ Aprobar</button>'+
             '<button class="chip" style="font-size:11px" onclick="Consig.resolverExt(\''+String(l.key).replace(/'/g,'')+'\',false)">✖ Rechazar</button>';
        } else if(esClienteC&&l.dias>data.limiteDias&&l.dias<=data.limiteExtendido&&l.key){
          extra='<button class="chip" style="font-size:11px" onclick="Consig.pedirExt(\''+String(l.key).replace(/'/g,'')+'\',\''+String(it.nombre).replace(/'/g,'')+'\',\''+String(l.acta).replace(/'/g,'')+'\')">⏳ Solicitar extensión</button>';
        }
        return '<div class="cbz-fact-row" style="align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap">'+
          '<span class="cbz-fact-id" style="flex:1;min-width:0">'+l.acta+'<div class="pmeta">Entregado: '+(l.fecha||'—')+' · '+fmtQty(l.qty)+' und.</div></span>'+
          ((l.ext==='APROBADA'&&l.dias<=data.limiteExtendido)?'':semaforo(l.dias,data.limiteDias,data.limiteExtendido,amb))+extra+'</div>';
      }).join('')+'</div>';
    }
    return c+'</div>';
  }
  function kpisHtml(items,amb){
    var unidades=0,alerta=0,facturar=0,maxD=0;
    var porCat={};
    items.forEach(function(it){
      unidades+=it.total;
      porCat[it.categoria||'Sin categoría']=(porCat[it.categoria||'Sin categoría']||0)+it.total;
      if(it.diasMax>maxD)maxD=it.diasMax;
      if(it.diasMax>data.limiteExtendido)facturar++;
      else if(it.diasMax>data.limiteDias)alerta++;
    });
    var cats=Object.keys(porCat).sort().map(function(c){
      return '<span class="chip" style="cursor:default">'+c+': <b>'+fmtQty(porCat[c])+'</b></span>';
    }).join('');
    return '<div class="cbz-kpis" style="margin-bottom:8px">'+
      '<div class="cbz-kpi"><span class="cbz-kpi-num">'+items.length+'</span><span class="cbz-kpi-lbl">'+(amb==='alq'?'Equipos':'Productos')+'</span></div>'+
      '<div class="cbz-kpi"><span class="cbz-kpi-num">'+fmtQty(unidades)+'</span><span class="cbz-kpi-lbl">Unidades</span></div>'+
      (amb==='alq'
        ?'<div class="cbz-kpi"><span class="cbz-kpi-num" style="color:#5cc8ff;font-size:15px">'+(items.length?durTxt(maxD):'—')+'</span><span class="cbz-kpi-lbl">⏱ Más antiguo en alquiler</span></div>'
        :'<div class="cbz-kpi"><span class="cbz-kpi-num" style="color:#f0c040">'+alerta+'</span><span class="cbz-kpi-lbl">🟡 Requieren autorización</span></div>'+
         '<div class="cbz-kpi"><span class="cbz-kpi-num cbz-red">'+facturar+'</span><span class="cbz-kpi-lbl">🔴 A facturar</span></div>')+
      '</div>'+
      (cats?'<div class="cbz-card-row" style="flex-wrap:wrap;margin-bottom:10px">'+cats+'</div>':'');
  }
  function itemsActuales(){
    var cli=data.admin?data.clientes[cliSel]:data;
    if(vistaC==='consig')return cli.consignacion;
    var out=[];
    (cli.alquiler||[]).forEach(function(p){p.items.forEach(function(it){out.push(it);});});
    return out;
  }
  function render(){
    var extBanner='';
    if(data&&data.admin&&(data.extensiones||[]).length){
      extBanner='<div class="cbz-card" style="border-color:#f0c040"><div class="cbz-card-name">🔔 Extensiones solicitadas ('+data.extensiones.length+')</div>'+
        data.extensiones.map(function(x){

      '<button class="chip '+(vistaC==='alq'?'on':'')+'" onclick="Consig.setV(\'alq\')">📡 Alquiler ('+(cli.alquiler||[]).length+')</button>'+
      '<button class="chip" onclick="Consig.descargar()">⬇ Descargar reporte</button>'+
      '</div>';
    if(vistaC==='consig'){
      h+=cli.consignacion.length?cli.consignacion.map(function(it,i){return itemCard(it,'c'+i,'consig');}).join(''):

          p.items.map(function(it,i){return itemCard(it,'a'+pi+'-'+i,'alq');}).join('')+'</div>';
      }).join(''):'<div class="cbz-muted" style="padding:14px;text-align:center">Sin equipos en alquiler.</div>';

  function descargar(){
    var cli=data.admin?data.clientes[cliSel]:data;
    var nombreCli=data.admin?cli.cliente:data.empresa;
    function estadoDe(d,amb){if(amb==='alq')return durTxt(d)+' en alquiler';return d>data.limiteExtendido?'A FACTURAR':(d>data.limiteDias?'REQUIERE AUTORIZACIÓN':'AL DÍA');}
    function esc(v){v=String(v===undefined||v===null?'':v);return (v.indexOf(',')>=0||v.indexOf('"')>=0)?'"'+v.replace(/"/g,'""')+'"':v;}
    var filas=[['Tipo','Proyecto','Producto','SKU','Categoría','Acta','Fecha entrega','Cantidad','Días','Estado'].join(',')];
    cli.consignacion.forEach(function(it){
      it.lotes.forEach(function(l){
        filas.push([esc('Consignación'),'',esc(it.nombre),esc(it.sku),esc(it.categoria||''),esc(l.acta),l.fecha||'',l.qty,l.dias,estadoDe(l.dias,'consig')].join(','));
      });
    });
    (cli.alquiler||[]).forEach(function(p){
      p.items.forEach(function(it){
        it.lotes.forEach(function(l){
          filas.push([esc('Alquiler'),esc(p.proyecto),esc(it.nombre),esc(it.sku),esc(it.categoria||''),esc(l.acta),l.fecha||'',l.qty,l.dias,estadoDe(l.dias,'alq')].join(','));
        });
      });
    });
    var hoyS=new Date().toISOString().slice(0,10);
    var csv='\ufeff'+filas.join('\r\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download='Consignacion_'+nombreCli.replace(/[^A-Za-z0-9]+/g,'_')+'_'+hoyS+'.csv';
    document.body.appendChild(a);a.click();a.remove();
  }
  function toggle(k){abiertos[k]=!abiertos[k];render();}
  function setCli(i){cliSel=i;abiertos={};render();}
  function setV(v){vistaC=v;abiertos={};render();}
  return {init:init,setV:setV,setCli:setCli,toggle:toggle,descargar:descargar,pedirExt:pedirExt,resolverExt:resolverExt};
})();

/* ===================== APROBACIONES (admin) ===================== */
var Sols = (function(){
  var pend=[], clientes=[];
  function api(p){
    p.user=getUserName();p.pin=getPin();
    return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
      .then(function(r){return r.json();});
  }
  function norm(s){return String(s).toUpperCase().replace(/[ÁÉÍÓÚ]/g,function(c){return {'Á':'A','É':'E','Í':'I','Ó':'O','Ú':'U'}[c];}).replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
  function init(){
    var el=document.getElementById('sols-screen');
    el.innerHTML='<div class="cbz-loading">Cargando solicitudes...</div>';
    api({action:'listUsers'}).then(function(res){
      if(!res.ok){el.innerHTML='<div class="cbz-error">'+res.error+'</div>';return;}
      pend=res.usuarios.filter(function(u){return u.rol==='cliente'&&!u.aprobado&&(u.solicitud||u.master);});
      api({action:'getClientes'}).then(function(r2){clientes=r2.ok?r2.clientes:[];render();})
        .catch(function(){clientes=[];render();});
    }).catch(function(){el.innerHTML='<div class="cbz-error">Sin conexión.</div>';});
  }
  function sugerencias(txt){
    if(!txt||txt.length<3||!clientes.length)return [];
    var toks=norm(txt).split(' ').filter(function(t){return t.length>=3;});
    if(!toks.length)return [];
    return clientes.filter(function(c){var n=norm(c);return toks.every(function(t){return n.indexOf(t)>=0;});}).slice(0,3);
  }
  function render(){
    var el=document.getElementById('sols-screen');
    if(!pend.length){
      el.innerHTML='<div class="cbz-card" style="text-align:center;padding:24px"><div style="font-size:34px">✅</div>'+
        '<div class="cbz-card-name" style="margin:8px 0">Sin solicitudes pendientes</div>'+
        '<div class="cbz-muted">Cuando un usuario máster solicite acceso al estado de cuenta, aparecerá aquí.</div></div>';
      return;
    }
    el.innerHTML=pend.map(function(u,i){
      var sugs=sugerencias(u.empresa);
      var exacta=u.empresa&&clientes.indexOf(u.empresa)>=0;
      return '<div class="cbz-card">'+
        '<div class="cbz-card-top"><div class="cbz-card-name">'+u.nombre+
        (u.master?' <span class="tagx" style="background:#3a2c1c;color:#f0c040">MÁSTER</span>':'')+
        (u.solicitud?' <span class="tagx tn">🔔 '+u.solicitud+'</span>':'')+'</div></div>'+
        '<div class="cbz-muted" style="margin:4px 0">Empresa declarada: <b>'+(u.empresa||'(no indicó)')+'</b>'+(exacta?' ✅ coincide con inFlow':'')+'</div>'+
        '<div class="cbz-card-row"><input class="uinput" id="s-emp-'+i+'" style="flex:1" placeholder="Empresa a vincular (nombre exacto)" value="'+String(u.empresa||'').replace(/"/g,'&quot;')+'"></div>'+
        (sugs.length&&!exacta?'<div class="cbz-card-row" style="flex-wrap:wrap">'+sugs.map(function(c){
          return '<button class="chip" onclick="document.getElementById(\'s-emp-'+i+'\').value=this.getAttribute(\'data-c\')" data-c="'+c.replace(/"/g,'&quot;')+'">'+c+'</button>';
        }).join('')+'</div>':'')+
        '<div class="cbz-card-row" style="margin-top:8px">'+
        '<button class="cbz-btn" onclick="Sols.aprobar('+i+',this)">✅ Aprobar acceso</button></div>'+
        '</div>';
    }).join('');
  }
  function aprobar(i,btn){
    var u=pend[i];
    var emp=(document.getElementById('s-emp-'+i).value||'').trim();
    if(!emp){alert('Vincula primero la empresa (usa las sugerencias).');return;}
    if(clientes.length&&clientes.indexOf(emp)<0&&!confirm('"'+emp+'" no coincide exacto con ningún cliente de inFlow. ¿Aprobar de todos modos? El estado de cuenta saldrá vacío hasta que coincida.'))return;
    if(btn){btn.disabled=true;btn.textContent='Aprobando...';}
    api({action:'saveUser',nombre:u.nombre,userPin:u.pin,rol:u.rol,modulos:u.modulos,
      activo:u.activo,empresa:emp,master:u.master,aprobado:true})
    .then(function(res){
      if(!res.ok){if(btn){btn.disabled=false;btn.textContent='✅ Aprobar acceso';}alert('Error: '+res.error);return;}
      alert('Aprobado. '+u.nombre+' y su organización ya tienen acceso al estado de cuenta.');
      init();
    }).catch(function(){if(btn){btn.disabled=false;btn.textContent='✅ Aprobar acceso';}alert('Sin conexión.');});
  }
  return {init:init,aprobar:aprobar};
})();

function doLogin(){
  try{
  if(window._loginBusy)return;
  var usr = document.getElementById('usr').value.trim();
  var pin = document.getElementById('pin').value.trim();
  var err = document.getElementById('loginErr');
  window._loginBusy=true;
  err.style.color='#5a6a7a';
  err.textContent='Verificando...';
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'ping',user:usr,pin:pin})})
  .then(function(r){return r.json();}).then(function(res){
    window._loginBusy=false;
    err.style.color='';
    if(!res.ok){err.textContent=res.error||'Usuario o PIN incorrectos';return;}
    err.textContent='';
    // ¿Activar Face ID?
    if(webauthnAvailable()&&!bioEnabled()&&confirm('¿Activar Face ID / huella para entrar sin PIN en este dispositivo?')){
      try{
      var uid=new Uint8Array(16);crypto.getRandomValues(uid);
      navigator.credentials.create({publicKey:{
        challenge:crypto.getRandomValues(new Uint8Array(32)),
        rp:{name:'Minecore Admin',id:location.hostname},
        user:{id:uid,name:usr,displayName:usr},
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
        timeout:60000
      }}).then(function(cred){
        localStorage.setItem('mc_cred',bufToB64u(cred.rawId));
        localStorage.setItem('mc_bio','1');
        entrar(res,usr,pin,true);
      }).catch(function(){entrar(res,usr,pin,false);});
      }catch(e){entrar(res,usr,pin,false);}
    } else {
      entrar(res,usr,pin,bioEnabled());
    }
  }).catch(function(e){
    window._loginBusy=false;err.style.color='';
    err.textContent=(e&&e.message?'Error ('+(e.name||'')+'): '+e.message:'Sin conexión con el servidor.');
  });
  }catch(e){
    window._loginBusy=false;
    var er=document.getElementById('loginErr');
    if(er)er.textContent='Error ('+(e.name||'app')+'): '+(e.message||e);
  }
}
function doBioLogin(){
  if(window._bioBusy)return;           // candado: un solo Face ID a la vez
  var err=document.getElementById('loginErr');
  var credId=localStorage.getItem('mc_cred');
  var pin=getPin();
  var u=getUserName();
  if(!credId||!pin||!u){err.textContent='Face ID no configurado: entra con tu PIN.';return;}
  var credBuf;
  try{credBuf=b64uToBuf(credId);}
  catch(e){
    // credencial guardada corrupta: se elimina sola y queda el PIN
    try{localStorage.removeItem('mc_cred');localStorage.removeItem('mc_bio');}catch(e2){}
    document.getElementById('bioBtn').style.display='none';
    err.textContent='Face ID se reinició en este dispositivo: entra con tu PIN y actívalo de nuevo.';
    return;
  }
  window._bioBusy=true;
  err.style.color='#5a6a7a';
  err.textContent='🔒 Verificando Face ID...';
  navigator.credentials.get({publicKey:{
    challenge:crypto.getRandomValues(new Uint8Array(32)),
    allowCredentials:[{type:'public-key',id:credBuf}],
    userVerification:'required',
    timeout:60000
  }}).then(function(){
    // Cara verificada: entrada INMEDIATA con el perfil guardado; el servidor valida en segundo plano
    window._bioBusy=false;
    err.textContent='';
    var perfil=null;
    try{perfil=JSON.parse(localStorage.getItem('mc_profile')||'null');}catch(e){}
    if(perfil&&perfil.nombre){
      window._pinSesion=pin;
      document.getElementById('login').style.display='none';
      document.getElementById('shell').style.display='block';
      renderHome();
      // Revalidación en segundo plano (por si el PIN cambió o el usuario fue desactivado)
      fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'ping',user:u,pin:pin})})
      .then(function(r){return r.json();}).then(function(res){
        if(!res.ok){clearCreds();alert('Tu sesión ya no es válida. Ingresa de nuevo.');location.reload();}
        else{try{localStorage.setItem('mc_profile',JSON.stringify({nombre:res.user||u,rol:res.rol||'usuario',modulos:res.modulos||[],empresa:res.empresa||'',master:!!res.master,aprobado:!!res.aprobado,vinculada:res.vinculada!==false}));}catch(e){}}
      }).catch(function(){});
    } else {
      // sin perfil guardado: valida contra el servidor con aviso visible
      err.textContent='Conectando...';
      fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'ping',user:u,pin:pin})})
      .then(function(r){return r.json();}).then(function(res){
        err.textContent='';
        if(res.ok){entrar(res,u,pin,true);}
        else{err.style.color='';err.textContent='Sesión inválida: entra con tu PIN.';}
      }).catch(function(){err.style.color='';err.textContent='Sin conexión con el servidor.';});
    }
  }).catch(function(){
    window._bioBusy=false;
    err.textContent='';               // canceló Face ID: que use el PIN sin drama
  });
}
function doLogout(){
  if(!confirm('¿Cerrar tu sesion en este dispositivo? (Se desactivará también Face ID)'))return;
  clearCreds();
  location.reload();
}

function doRedeem(){
  var err=document.getElementById('invErr');
  var nombre=document.getElementById('inv-nombre').value.trim();
  var nombreCompleto=document.getElementById('inv-full').value.trim();
  var email=document.getElementById('inv-mail').value.trim();
  var telefono=document.getElementById('inv-tel').value.trim();
  var empresa=document.getElementById('inv-emp').value.trim();
  var pin=document.getElementById('inv-pin').value.replace(/[^0-9]/g,'');
  var pin2=document.getElementById('inv-pin2').value.replace(/[^0-9]/g,'');
  if(nombreCompleto.length<5){err.textContent='Escribe tu nombre completo.';return;}
  if(!nombre){err.textContent='Elige un nombre de usuario corto.';return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)){err.textContent='Escribe un correo válido.';return;}
  if(telefono.replace(/[^0-9]/g,'').length<7){err.textContent='Escribe un teléfono válido.';return;}
  if(pin.length<4||pin.length>8){err.textContent='El PIN debe tener de 4 a 8 dígitos.';return;}
  if(pin!==pin2){err.textContent='Los PIN no coinciden.';return;}
  var token=decodeURIComponent((location.search.match(/[?&]invite=([^&]+)/)||[])[1]||'');
  if(!token){err.textContent='Link de invitación inválido.';return;}
  var btn=window.event&&window.event.target;

  function go(){
    if(btn){btn.disabled=true;btn.textContent='Creando...';}
    fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'redeemInvite',token:token,nombre:nombre,userPin:pin,empresa:empresa,nombreCompleto:nombreCompleto,telefono:telefono,email:email})})
    .then(function(r){return r.json();})
    .then(function(res){
      if(btn){btn.disabled=false;btn.textContent='Crear mi usuario';}
      if(!res.ok){err.textContent=res.error||'No se pudo crear el usuario.';return;}
      alert(res.mensaje||'Usuario creado. Ya puedes ingresar con tu usuario y PIN.');
      location.href=location.origin+location.pathname;
    })
    .catch(function(){
      if(btn){btn.disabled=false;btn.textContent='Crear mi usuario';}
      err.textContent='Sin conexión. Intenta de nuevo.';
    });
  }

  // ¿Ya eligió entre las candidatas? (segundo toque del botón)
  var sel=document.querySelector('input[name="empCand"]:checked');
  if(sel){
    if(sel.value!=='__otra__'){empresa=sel.value;document.getElementById('inv-emp').value=empresa;}
    err.textContent='';
    return go();
  }
  if(!empresa||window._empChecked===empresa){err.textContent='';return go();}

  // Best match: si hay UNA coincidencia clara, se usa sola; si hay empate, se pregunta
  if(btn){btn.disabled=true;btn.textContent='Verificando...';}
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'matchEmpresa',token:token,empresa:empresa})})
  .then(function(r){return r.json();})
  .then(function(res){
    if(btn){btn.disabled=false;btn.textContent='Crear mi usuario';}
    var cand=(res&&res.ok&&res.candidatos)||[];
    if(cand.length===1){
      empresa=cand[0];document.getElementById('inv-emp').value=empresa;
      err.textContent='';return go();
    }
    if(cand.length>=2){
      err.innerHTML='<div style="text-align:left;color:#0b1219;font-size:13px;margin-top:4px"><b>¿Cuál es tu empresa?</b>'+
        cand.map(function(c,i){return '<label style="display:block;margin:5px 0"><input type="radio" name="empCand" value="'+c.replace(/"/g,'&quot;')+'"'+(i===0?' checked':'')+'> '+c+'</label>';}).join('')+
        '<label style="display:block;margin:5px 0"><input type="radio" name="empCand" value="__otra__"> Otra / dejar como lo escribí</label>'+
        '<div style="color:#5a6a7a;font-size:11px">Elige una y vuelve a tocar "Crear mi usuario".</div></div>';
      return;
    }
    window._empChecked=empresa; // sin coincidencias: sigue tal cual (queda por aprobar)
    err.textContent='';go();
  })
  .catch(function(){
    if(btn){btn.disabled=false;btn.textContent='Crear mi usuario';}
    window._empChecked=empresa;err.textContent='';go();
  });
}
