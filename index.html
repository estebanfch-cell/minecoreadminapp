<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#0b1219}body{background:#0b1219;color:#dce6f0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;min-height:100vh}
#shell{max-width:640px;margin:0 auto;padding:16px}
.topbar{display:flex;align-items:center;gap:8px;padding:6px 0 14px;flex-wrap:nowrap}
.topbar .dot{width:10px;height:10px;border-radius:50%;background:#2e9e5b;flex:none}
.topbar h1{font-size:17px;letter-spacing:1px;flex:1}
#title:empty{display:none}
.topbar button{background:#1c2a3a;border:1px solid #26405c;color:#fff;border-radius:999px;width:38px;height:38px;padding:0;font-size:15px;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center}
.topbar button .lbl{display:none}
.topbar #whoami{flex:none}
@media(min-width:560px){.topbar button{width:auto;padding:0 14px;font-size:12px;border-radius:10px}.topbar button .lbl{display:inline;margin-left:6px}}
#login{position:fixed;inset:0;background:#fff;text-align:center;padding:12vh 24px 40px;box-sizing:border-box;overflow:auto}
#login .box{max-width:380px;margin:0 auto}
#login h1{font-size:22px;margin-bottom:4px;letter-spacing:2px;color:#0b1219}
#login p{color:#5a6a7a;font-size:12px;margin-bottom:22px}
.pinmask{-webkit-text-security:disc;text-security:disc}
#pin{width:100%;background:#f2f5f8;border:1px solid #ccd6e0;border-radius:10px;color:#0b1219;font-size:22px;text-align:center;letter-spacing:8px;padding:12px}
#login button{width:100%;margin-top:12px;background:#1e4976;border:none;color:#fff;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
#login .err{color:#ff6b6b;font-size:12px;margin-top:10px;min-height:16px}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mod{background:#0f1720;border:1px solid #223142;border-radius:14px;padding:18px 14px;cursor:pointer;text-align:left}
.mod:active{background:#131f2c}
.mod .ico{font-size:26px}
.mod h3{font-size:14px;margin:8px 0 3px}
.mod p{font-size:11px;opacity:.6;line-height:1.35}
.mod.soon{opacity:.45;cursor:default}
.mod .tag{display:inline-block;margin-top:6px;font-size:10px;background:#1c2a3a;border-radius:10px;padding:2px 8px}

.fbar{margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{background:#0f1720;border:1px solid #223142;border-radius:20px;color:#dce6f0;padding:7px 14px;font-size:12px;cursor:pointer}
.chip.on{background:#1e4976;border-color:#1e4976;font-weight:700}
.dates{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dates input{background:#0f1720;border:1px solid #223142;border-radius:8px;color:#dce6f0;padding:7px;font-size:12px}
.big{background:#0f1720;border:1px solid #223142;border-radius:14px;padding:16px;margin-bottom:12px}
.big .lbl{font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:1px}
.big .num{font-size:30px;font-weight:800;margin-top:2px}
.big .sub{font-size:12px;opacity:.75;margin-top:4px}
.big-est{border-color:#1e4976;background:#0d1a28}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mini{background:#0f1720;border:1px solid #223142;border-radius:12px;padding:12px}
.mini .lbl{font-size:10px;opacity:.6;text-transform:uppercase}
.mini .num{font-size:20px;font-weight:700;margin-top:2px}
.toprow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #1a2735}
.toprow:last-child{border-bottom:none}
.topn{background:#1e4976;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.topname{flex:1;font-size:13px}
.topval{font-size:12px;opacity:.8}
.fbar2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.olist{display:flex;flex-direction:column;gap:8px}
.orow{background:#0f1720;border:1px solid #223142;border-radius:12px;padding:11px;cursor:pointer}
.orow-top{display:flex;justify-content:space-between;font-size:13px}
.odate{opacity:.6;font-size:11px}
.orow-mid{font-size:12px;opacity:.85;margin:3px 0}
.orow-bot{display:flex;justify-content:space-between;align-items:center}
.tagx{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700}
.tf{background:#12313d;color:#5cc8ff}.tn{background:#4a3a10;color:#f0c040}.tq{background:#2a2a3a;color:#b0a8e8}
.oval{font-size:12px;font-weight:700}
.omoney{display:flex;flex-direction:column;align-items:flex-end}
.osub{font-size:15px;font-weight:800}
.osmall{font-size:10px;opacity:.65}
.ocobrar{margin-top:6px;font-size:11px;font-weight:700}
.ocobrar-p{color:#ff6b6b}
.ocobrar-0{color:#6fd68f}
.outil{margin-top:2px;font-size:11px;font-weight:700;color:#5cc8ff}
.uti{color:#6fd68f}
.pdesc{color:#f0c040}
.ores{margin-top:10px;margin-left:auto;max-width:240px;font-size:12px}
.ores div{display:flex;justify-content:space-between;padding:2px 0}
.ores-tot{font-weight:800;border-top:1px solid #2e4257;margin-top:4px;padding-top:4px!important;font-size:13px}
.ores-util{color:#6fd68f;font-weight:700;margin-top:2px}
.onotas{margin-top:8px;font-size:11px;background:#101c29;border-left:3px solid #1e4976;padding:8px;border-radius:6px}
.odetail{margin-top:10px;border-top:1px solid #1a2735;padding-top:8px;cursor:default}
.pline{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #141f2b}
.pline:last-child{border-bottom:none}
.pimg{width:42px;height:42px;border-radius:8px;object-fit:cover;background:#1a2735;flex:none}
.pimg-ph{display:flex;align-items:center;justify-content:center;font-size:18px}
.pinfo{flex:1;min-width:0}
.pname{font-size:12px;font-weight:600}
.pmeta{font-size:10px;opacity:.65;margin-top:2px}
.psub{font-size:12px;font-weight:700;flex:none}

.cbz-header h2{margin:0 0 10px}

.cbz-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#223142;border:1px solid #223142;border-radius:12px;overflow:hidden}
@media(min-width:640px){.cbz-kpis{grid-template-columns:repeat(6,1fr)}}
.cbz-kpi{background:#111a24;padding:10px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.cbz-kpi-num{font-size:15px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cbz-kpi-lbl{font-size:9.5px;opacity:.65;text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.cbz-red{color:#ff5252}
.cbz-muted{opacity:.6;font-size:12px}
.cbz-card{background:#0f1720;border:1px solid #223142;border-radius:12px;padding:12px;margin-bottom:10px}
.cbz-card-off{opacity:.55}
.cbz-card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cbz-card-name{font-weight:700;font-size:14px}
.cbz-card-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.cbz-badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600}
.cbz-n1{background:#2c3e1e;color:#a5d66f}.cbz-n2{background:#4a3a10;color:#f0c040}
.cbz-n3{background:#4a2410;color:#ff9d5c}.cbz-n4{background:#4a1010;color:#ff6b6b}
.cbz-ok{background:#12313d;color:#5cc8ff}
.cbz-badge-lvl{background:#1c2a3a;color:#9fc3e8}
.cbz-money{font-size:12px}
.cbz-chip{background:#1c2a3a;border-radius:16px;padding:3px 8px;font-size:11px;display:inline-flex;align-items:center;gap:4px}
.cbz-chip-x{background:none;border:none;color:#ff8080;cursor:pointer;font-size:13px;padding:0}
.cbz-email-input{background:#0b1219;border:1px dashed #2e4257;border-radius:16px;color:#dce6f0;font-size:11px;padding:4px 10px;width:150px}
.cbz-input-bad{border-color:#ff5252}
.cbz-btn{background:#1e4976;border:none;color:#fff;border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer}
.cbz-btn:disabled{opacity:.4;cursor:default}
.cbz-btn-wa{background:#1e7648}
.cbz-btn-mini{background:#1c2a3a;border:none;color:#fff;border-radius:6px;width:24px;height:24px;cursor:pointer}
.cbz-freq{font-size:12px;display:inline-flex;align-items:center;gap:6px}
.cbz-esc{font-size:12px;display:inline-flex;align-items:center;gap:4px}
.cbz-switch{position:relative;width:42px;height:22px;display:inline-block}
.cbz-switch input{opacity:0;width:0;height:0}
.cbz-slider{position:absolute;inset:0;background:#2a3a4c;border-radius:22px;cursor:pointer;transition:.2s}
.cbz-slider:before{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.2s}
.cbz-switch input:checked + .cbz-slider{background:#2e9e5b}
.cbz-switch input:checked + .cbz-slider:before{transform:translateX(20px)}
.cbz-loading,.cbz-error{padding:20px;text-align:center;opacity:.8}
.cbz-btn-sec{background:#1c2a3a;border:1px solid #2e4257;color:#dce6f0;border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer}
.cbz-danger{border-color:#7a2020;color:#ff8080}
.cbz-chooser{background:#0b141d;border-radius:10px;padding:8px}
.cbz-search{flex:1;min-width:160px;background:#0f1720;border:1px solid #223142;border-radius:20px;color:#dce6f0;font-size:13px;padding:9px 14px}
.cbz-fact-list{margin-top:8px;border-top:1px solid #1a2735;padding-top:6px}
.cbz-fact-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid #141f2b;font-size:11.5px}
.cbz-fact-row:last-child{border-bottom:none}
.cbz-fact-id{font-weight:700;min-width:150px}
.cbz-fact-saldo{font-weight:800;margin-left:auto}
.cbz-fact-est{font-size:11px}
.cbz-fact-head{font-size:11px;font-weight:800;letter-spacing:.5px;margin:8px 0 2px}
.uform{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.uinput{background:#0b1219;border:1px solid #2e4257;border-radius:8px;color:#dce6f0;padding:9px;font-size:13px;width:100%}

</style>

<body>
<div id="invite" style="display:none;max-width:360px;margin:0 auto;text-align:center;padding:14vh 24px 40px;background:#fff;min-height:100vh;box-sizing:border-box">

  <input id="inv-tel" type="tel" placeholder="Teléfono" style="width:100%;background:#f2f5f8;border:1px solid #ccd6e0;border-radius:10px;color:#0b1219;font-size:15px;padding:12px;margin-bottom:10px;text-align:center">
  <input id="inv-emp" placeholder="Empresa u organización" style="width:100%;background:#f2f5f8;border:1px solid #ccd6e0;border-radius:10px;color:#0b1219;font-size:15px;padding:12px;margin-bottom:10px;text-align:center">
  <input id="inv-pin" type="text" class="pinmask" autocomplete="one-time-code" name="inv_pin_nosave" inputmode="numeric" maxlength="8" placeholder="Elige tu PIN (4-8 dígitos)" style="width:100%;background:#f2f5f8;border:1px solid #ccd6e0;border-radius:10px;color:#0b1219;font-size:15px;padding:12px;margin-bottom:10px;text-align:center">
  <input id="inv-pin2" type="text" class="pinmask" autocomplete="one-time-code" name="inv_pin2_nosave" inputmode="numeric" maxlength="8" placeholder="Repite tu PIN" style="width:100%;background:#f2f5f8;border:1px solid #ccd6e0;border-radius:10px;color:#0b1219;font-size:15px;padding:12px;text-align:center">
  <button onclick="doRedeem()" style="width:100%;margin-top:12px;background:#1e4976;border:none;color:#fff;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer">Crear mi usuario</button>
  <div id="invErr" style="color:#c62828;font-size:12px;margin-top:10px;min-height:16px"></div>
</div>

       style="width:320px;max-width:92%;display:block;margin:0 auto 26px;"

         style="width:100%;background:#f2f5f8;border:1px solid #ccd6e0;border-radius:10px;color:#0b1219;font-size:16px;text-align:center;padding:12px;margin-bottom:10px"
         onkeydown="if(event.key==='Enter')document.getElementById('pin').focus()">

</div></div>

<script>
window.onerror=function(msg,src,line,col){
  try{
    var er=document.getElementById('loginErr');
    if(er){er.textContent='⚠ '+msg+' [línea '+line+':'+col+']';}
  }catch(e){}
};
window.addEventListener&&window.addEventListener('unhandledrejection',function(ev){
  try{

function b64uToBuf(s){
  s=String(s||'').replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4)s+='=';           // padding que Safari exige
  var bin=atob(s);
  var a=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return a.buffer;
}
function bufToB64u(b){var a=new Uint8Array(b),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function webauthnAvailable(){try{if(location.protocol==='file:'||!location.hostname)return false;}catch(e){}return !!(window.PublicKeyCredential&&navigator.credentials);}

  function setVista(v){vista=v;render();}

  function expandDash(idx){expanded['d'+idx]=!expanded['d'+idx];renderList();}
  function statement(idx){
    var c=clientes[idx];
    api({action:'getStatementPdf',cliente:c.cliente}).then(function(res){
      if(!res.ok){alert('Error: '+res.error);return;}
      var bin=atob(res.b64),arr=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
      var blob=new Blob([arr],{type:'application/pdf'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download=res.filename;
      document.body.appendChild(a);a.click();a.remove();
    });
  }

  function countList(s) {
    if (!s) return 0;
    return s.split(',').map(function (x) { return x.trim(); }).filter(function (x) { return x; }).length;
  }
  function isOpen(idx, which) { return expanded[idx] && expanded[idx][which]; }
  function expand(idx, which) {
    if (!expanded[idx]) expanded[idx] = {};
    expanded[idx][which] = !expanded[idx][which];

    var c = clientes[idx];

    if (!confirm('¿Enviar mensaje ' + lbl + ' AHORA a ' + c.cliente + '?')) return;
    var esN5 = nivel === 5 || (nivel === 0 && c.nivelNum === 5);
    var conActa = true;
    if (esN5) {
      conActa = confirm('¿Adjuntar el acta transaccional' + (c.actaAprobada ? ' APROBADA del ' + c.actaAprobada : ' (modelo)') + '?\nAceptar = con acta · Cancelar = solo estado de cuenta');
    }
    chooser = null;
    api({ action: 'sendNow', cliente: c.cliente, nivel: nivel || undefined, conActa: conActa }).then(function (res) {
      alert(res.ok ? res.resultado : 'Error: ' + (res.error || res.resultado));

  /** ==== Acciones ==== */

  function toggle(idx, on) {
    clientes[idx].activo = on;

      .then(render);

  function escala(idx, on) {
    clientes[idx].escalamiento = on;
    api({ action: 'updateCxcClient', cliente: clientes[idx].cliente, campo: 'escalamiento', valor: on ? 'SI' : 'NO' });
  }

  function freq(idx, delta) {
    var f = Math.max(1, clientes[idx].frecuencia + delta);
    clientes[idx].frecuencia = f;
    api({ action: 'updateCxcClient', cliente: clientes[idx].cliente, campo: 'frecuencia', valor: f })
      .then(render);

  /** Enter o coma agrega el email; la coma se pone sola en el backend */
  function emailKey(ev, idx, input) {
    if (ev.key === 'Enter' || ev.key === ',') {
      ev.preventDefault();
      addEmail(idx, input);
    }
  }
  function emailBlur(idx, input) { if (input.value.trim()) addEmail(idx, input); }

  function addEmail(idx, input) {
    var e = input.value.replace(/,/g, '').trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { input.classList.add('cbz-input-bad'); return; }
    input.classList.remove('cbz-input-bad');
    var current = clientes[idx].emails ? clientes[idx].emails + ', ' + e : e;
    clientes[idx].emails = current;
    input.value = '';
    api({ action: 'updateCxcClient', cliente: clientes[idx].cliente, campo: 'emails', valor: current })
      .then(function (res) { if (res.ok) { clientes[idx].emails = res.valor; render(); } });
  }

  function removeEmail(idx, email) {
    var list = clientes[idx].emails.split(',').map(function (x) { return x.trim(); })
      .filter(function (x) { return x && x !== email; });
    var val = list.join(', ');
    clientes[idx].emails = val;
    api({ action: 'updateCxcClient', cliente: clientes[idx].cliente, campo: 'emails', valor: val })
      .then(render);
  }

  /** WhatsApp: números guardados por cliente */
  function waKey(ev, idx, input) {
    if (ev.key === 'Enter' || ev.key === ',') { ev.preventDefault(); addWa(idx, input); }
  }
  function waBlur(idx, input) { if (input.value.trim()) addWa(idx, input); }
  function addWa(idx, input) {
    var n = input.value.replace(/[^0-9]/g, '');
    if (n.length < 8) { input.classList.add('cbz-input-bad'); return; }
    input.classList.remove('cbz-input-bad');
    var current = clientes[idx].whatsapp ? clientes[idx].whatsapp + ', ' + n : n;
    clientes[idx].whatsapp = current;
    input.value = '';
    api({ action: 'updateCxcClient', cliente: clientes[idx].cliente, campo: 'whatsapp', valor: current })
      .then(function (res) { if (res.ok) { clientes[idx].whatsapp = res.valor; render(); } });
  }
  function removeWa(idx, num) {
    var list = clientes[idx].whatsapp.split(',').map(function (x) { return x.trim(); })
      .filter(function (x) { return x && x !== num; });
    var val = list.join(', ');
    clientes[idx].whatsapp = val;
    api({ action: 'updateCxcClient', cliente: clientes[idx].cliente, campo: 'whatsapp', valor: val })
      .then(render);
  }
  function legal(idx, on) {
    var c = clientes[idx];
    var msg = on ? '¿Marcar a ' + c.cliente + ' en PROCESO LEGAL? Sus recordatorios pasarán al nivel 5 (semanal).'
                 : '¿Quitar a ' + c.cliente + ' del proceso legal?';
    if (!confirm(msg)) { render(); return; }
    clientes[idx].procesoLegal = on;
    api({ action: 'updateCxcClient', cliente: c.cliente, campo: 'proceso', valor: on ? 'SI' : 'NO' })
      .then(render);
  }

  function actaForm(idx) {
    actaOpen = (actaOpen === idx) ? null : idx;
    renderList();
    if (actaOpen === null || idx === null) return;
    var c = clientes[idx];
    if (!c.actaAprobada) return;
    // pre-carga los datos del acta aprobada para editarla
    api({ action: 'getActaAprobada', cliente: c.cliente, conPdf: false }).then(function (res) {
      if (!res.ok || actaOpen !== idx) return;
      function set(id, v) { var el = document.getElementById(id); if (el && v !== undefined && v !== null && v !== '') el.value = v; }
      set('a-meses', res.meses); set('a-tasa', res.tasa); set('a-firmante', res.firmante);
      set('a-nombre', res.repNombre); set('a-cedula', res.repCedula);
      set('a-ciudad', res.repCiudad); set('a-ruc', res.clienteRuc); set('a-email', res.repEmail);
    });
  }
  function verActa(idx) {
    var c = clientes[idx];
    var w = window.open('', '_blank');
    api({ action: 'getActaAprobada', cliente: c.cliente }).then(function (res) {
      if (!res.ok) { if (w) w.close(); alert('Error: ' + res.error); return; }
      var bin = atob(res.b64), arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
      if (w) w.location = url; else window.open(url, '_blank');
    }).catch(function () { if (w) w.close(); alert('No se pudo abrir el acta.'); });
  }
  function actaAprobar(idx) {
    var c = clientes[idx];
    if (!confirm('¿Aprobar esta acta para ' + c.cliente + '? Quedará guardada y se adjuntará en los envíos de nivel 5.')) return;
    api({ action: 'aprobarActa', cliente: c.cliente,
      meses: document.getElementById('a-meses').value,
      tasa: document.getElementById('a-tasa').value,
      firmante: document.getElementById('a-firmante').value,
      repNombre: document.getElementById('a-nombre').value,
      repCedula: document.getElementById('a-cedula').value,
      repCiudad: document.getElementById('a-ciudad').value,
      clienteRuc: document.getElementById('a-ruc').value,
      repEmail: document.getElementById('a-email').value
    }).then(function (res) {
      if (!res.ok) { alert('Error: ' + res.error); return; }
      alert('Acta aprobada y guardada (' + res.meses + ' cuotas de ' + fmt(res.cuota) + ' al ' + res.tasa + '%). Se adjuntará en los envíos N5.');
      actaOpen = null;
      init();
    });
  }
  function actaGo(idx, preview) {
    var c = clientes[idx];
    var w = preview ? window.open('', '_blank') : null; // abrir antes del fetch (popup blockers)
    api({ action: 'generarActa', cliente: c.cliente,
      meses: document.getElementById('a-meses').value,
      tasa: document.getElementById('a-tasa').value,
      firmante: document.getElementById('a-firmante').value,
      repNombre: document.getElementById('a-nombre').value,
      repCedula: document.getElementById('a-cedula').value,
      repCiudad: document.getElementById('a-ciudad').value,
      clienteRuc: document.getElementById('a-ruc').value,
      repEmail: document.getElementById('a-email').value
    }).then(function (res) {
      if (!res.ok) { if (w) w.close(); alert('Error: ' + res.error); return; }
      var bin = atob(res.b64), arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      var blob = new Blob([arr], { type: 'application/pdf' });
      var url = URL.createObjectURL(blob);
      if (preview) {
        if (w) w.location = url; else window.open(url, '_blank');
      } else {
        var a = document.createElement('a');
        a.href = url; a.download = res.filename;
        document.body.appendChild(a); a.click(); a.remove();
        actaOpen = null; renderList();
        alert('Acta descargada: ' + res.meses + ' cuotas de ' + fmt(res.cuota) + ' al ' + res.tasa + '% sobre ' + fmt(res.monto) + '.');
      }
    }).catch(function(){ if (w) w.close(); alert('Error de red generando el acta.'); });
  }



  function sendWa(idx, num) {
    var c = clientes[idx];
    var lvl = c.nivelNum || 1;
    var tpl = (waTemplate && waTemplate[lvl]) ||
      'Estimados {CLIENTE}, les saluda Minecore S.A.S. Mantienen valores vencidos por {VENCIDO} (mora {MORA} días). Estado de cuenta: {LINK} — Departamento de Cobranzas, Minecore S.A.S.';
    // Abre la ventana ANTES del fetch para que el navegador no la bloquee
    var w = window.open('', '_blank');
    api({ action: 'getStatementLink', cliente: c.cliente }).then(function (res) {
      var link = (res.ok && res.url) ? res.url : '';
      var msg = tpl.replace(/{CLIENTE}/g, c.cliente)
                   .replace(/{VENCIDO}/g, fmt(c.vencido))
                   .replace(/{MORA}/g, c.maxMora)
                   .replace(/{LINK}/g, link || '(estado de cuenta enviado por correo)');
      var url = 'https://wa.me/' + num + '?text=' + encodeURIComponent(msg);
      if (w) w.location = url; else window.open(url, '_blank');
    }).catch(function(){ if (w) w.close(); alert('No se pudo generar el link del estado de cuenta.'); });
  }


  return {
    init: init, toggle: toggle, escala: escala, freq: freq,
    emailKey: emailKey, emailBlur: emailBlur, removeEmail: removeEmail,
    expand: expand, openChooser: openChooser, closeChooser: closeChooser, doSend: doSend,
    waKey: waKey, waBlur: waBlur, removeWa: removeWa, sendWa: sendWa,
    setVista: setVista, setQ: setQ, setFMora: setFMora, irConfig: irConfig,
    expandDash: expandDash, statement: statement,
    legal: legal, actaForm: actaForm, actaGo: actaGo, actaAprobar: actaAprobar, verActa: verActa
  };
})();


/* ===================== DASHBOARD v2 ===================== */
var Dash = (function(){
  var agg=null, top=[], orders=[], filter='todas', openId=null, from='', to='';
  function fmt(n){n=parseFloat(n)||0;var p=n.toFixed(2).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return '$'+p.join('.');}
  function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  function preset(p){
    var now=new Date(), t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    var f=new Date(t);
    if(p==='hoy'){}
    else if(p==='semana'){f.setDate(t.getDate()-((t.getDay()+6)%7));}
    else if(p==='mes'){f=new Date(t.getFullYear(),t.getMonth(),1);}
    else if(p==='trimestre'){f=new Date(t.getFullYear(),Math.floor(t.getMonth()/3)*3,1);}
    else if(p==='ano'){f=new Date(t.getFullYear(),0,1);}
    from=iso(f); to=iso(t);
    document.getElementById('d-from').value=from;
    document.getElementById('d-to').value=to;
    load();
  }
  function applyCustom(){
    from=document.getElementById('d-from').value;
    to=document.getElementById('d-to').value;
    if(from&&to) load();
  }
  function init(){
    var el=document.getElementById('dash-screen');
    el.innerHTML='<div class="fbar">'+
      '<div class="chips">'+
      chip('hoy','Hoy')+chip('semana','Semana')+chip('mes','Mes')+chip('trimestre','Trimestre')+chip('ano','Año')+
      '</div>'+
      '<div class="dates"><input type="date" id="d-from"> <span>→</span> <input type="date" id="d-to">'+
      '<button class="cbz-btn" onclick="Dash.applyCustom()">Aplicar</button></div></div>'+
      '<div id="dash-body"><div class="cbz-loading">Elige un período...</div></div>';
    preset('hoy');
  }
  function chip(id,lbl){return '<button class="chip" onclick="Dash.preset(\''+id+'\')">'+lbl+'</button>';}
  function mini(lbl,val){return '<div class="mini"><div class="lbl">'+lbl+'</div><div class="num">'+val+'</div></div>';}
  function load(){
    var body=document.getElementById('dash-body');
    body.innerHTML='<div class="cbz-loading">Cargando '+from+' → '+to+'...</div>';
    openId=null;
    fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'getDashboard',fromDate:from,toDate:to,user:getUserName(),pin:getPin()})})
    .then(function(r){return r.text();}).then(function(txt){
      var res;
      try { res = JSON.parse(txt); }
      catch(e){ body.innerHTML='<div class="cbz-error">El servidor no respondió JSON (¿autorización o versión vieja?). Respuesta: '+txt.slice(0,120)+'</div>'; return; }
      if(!res.ok){body.innerHTML='<div class="cbz-error">Error del servidor: '+(res.error||'desconocido')+'</div>';return;}
      if(!res.agg){body.innerHTML='<div class="cbz-error">El AdminAPI desplegado es una versión antigua (sin agg). Pega AdminAPI_v3 y crea Nueva versión de la implementación.</div>';return;}
      agg=res.agg; top=res.topClientes||[]; orders=res.orders||[];
      try { render(); } catch(e){ body.innerHTML='<div class="cbz-error">Error pintando: '+e+'</div>'; }
    }).catch(function(e){body.innerHTML='<div class="cbz-error">Fallo de red: '+e+'</div>';});
  }
  function render(){
    var body=document.getElementById('dash-body');
    var mgF = agg.subtotalFact>0&&agg.utilFact!==undefined?Math.round(agg.utilFact/agg.subtotalFact*1000)/10:null;
    var mgN = agg.subtotalNoFact>0&&agg.utilNoFact!==undefined?Math.round(agg.utilNoFact/agg.subtotalNoFact*1000)/10:null;
    var h='<div class="big"><div class="lbl">Facturado por fecha de factura ('+from+' → '+to+')</div>'+
      '<div class="num">'+fmt(agg.subtotalFact||0)+'</div>'+
      '<div class="sub">+ IVA '+fmt(agg.ivaFact||0)+' · Total '+fmt(agg.totalFact||0)+' · '+agg.invoiced+' factura(s)</div>'+
      (mgF!==null?'<div class="sub uti">Utilidad bruta: <b>'+fmt(agg.utilFact)+'</b> · Margen '+mgF+'%</div>':'')+
      '</div>';
    h+='<div class="big"><div class="lbl">Por facturar / completar</div>'+
      '<div class="num">'+fmt(agg.subtotalNoFact||0)+'</div>'+
      '<div class="sub">+ IVA '+fmt(agg.ivaNoFact||0)+' · Total '+fmt(agg.totalNoFact||0)+' · '+(agg.ordenes-agg.invoiced)+' orden(es)</div>'+
      (mgN!==null?'<div class="sub uti">Utilidad bruta est.: <b>'+fmt(agg.utilNoFact)+'</b> · Margen '+mgN+'%</div>':'')+
      '</div>';
    h+='<div class="big big-est"><div class="lbl">Estimado del período (facturado + por facturar)</div>'+
      '<div class="num">'+fmt(agg.subtotal)+'</div>'+
      '<div class="sub">+ IVA '+fmt(agg.iva)+' · Total '+fmt(agg.total)+' · '+agg.ordenes+' órdenes</div></div>';
    h+='<div class="grid2">'+mini('Órdenes',agg.ordenes)+mini('Facturadas',agg.invoiced)+
       mini('Fulfilled',agg.fulfilled)+mini('Cotizaciones',agg.cotizaciones)+'</div>';
    if(top.length){
      h+='<div class="big"><div class="lbl">Top clientes del período (solo facturado)</div>';
      top.forEach(function(t,i){
        h+='<div class="toprow"><span class="topn">'+(i+1)+'</span><span class="topname">'+t.cliente+'</span>'+
           '<span class="topval">'+fmt(t.subtotal)+' · '+t.ordenes+' ord.</span></div>';
      });
      h+='</div>';
    }
    h+='<div class="fbar2">'+fchip('todas','Todas')+fchip('facturadas','Facturadas')+
       fchip('nofact','No facturadas')+fchip('cotiz','Cotizaciones')+'</div>';
    h+='<div class="olist">'+orders.filter(passFilter).map(orow).join('')+'</div>';
    body.innerHTML=h;
  }
  function passFilter(o){
    if(filter==='facturadas')return !o.cotizacion&&o.facturada;
    if(filter==='nofact')return !o.cotizacion&&!o.facturada;
    if(filter==='cotiz')return o.cotizacion;
    return true;
  }
  function fchip(id,lbl){return '<button class="chip '+(filter===id?'on':'')+'" onclick="Dash.setFilter(\''+id+'\')">'+lbl+'</button>';}
  function setFilter(f){filter=f;render();}
  function orow(o){
    var st=o.cotizacion?'<span class="tagx tq">COT</span>':
      (o.facturada?'<span class="tagx tf">FACT '+(o.factura||'')+'</span>':'<span class="tagx tn">SIN FACT</span>');
    var open=openId===o.id;
    var cobrar = o.cotizacion ? '' :
      (o.saldo>0 ? '<div class="ocobrar ocobrar-p">Por cobrar: '+fmt(o.saldo)+'</div>'
                 : '<div class="ocobrar ocobrar-0">Por cobrar: $0.00 ✓</div>');
    if(!o.cotizacion && o.utilidad!==null && o.utilidad!==undefined){
      var mg=o.subtotal>0?Math.round(o.utilidad/o.subtotal*1000)/10:0;
      cobrar+='<div class="outil">Utilidad: '+fmt(o.utilidad)+' · '+mg+'%</div>';
    }
    return '<div class="orow" onclick="Dash.toggleOrder(\''+o.id+'\')">'+
      '<div class="orow-top"><b>'+o.ov+'</b><span class="odate">'+o.fecha+'</span></div>'+
      '<div class="orow-mid">'+o.cliente+'</div>'+
      '<div class="orow-bot">'+st+
      '<span class="omoney"><span class="osub">'+fmt(o.subtotal)+'</span>'+
      '<span class="osmall">IVA '+fmt(o.iva)+' · Total '+fmt(o.total)+'</span></span></div>'+
      cobrar+
      (open?'<div class="odetail" id="det-'+o.id+'" onclick="event.stopPropagation()"><div class="cbz-loading">Cargando detalle...</div></div>':'')+
      '</div>';
  }
  function toggleOrder(id){
    if(!id){alert('Esta orden no tiene ID (corre syncAll con la v12 primero).');return;}
    openId = (openId===id)?null:id;
    render();
    if(openId){
      fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'getOrderDetail',orderId:id,user:getUserName(),pin:getPin()})})
      .then(function(r){return r.json();}).then(function(res){
        var det=document.getElementById('det-'+id);
        if(!det)return;
        if(!res.ok){det.innerHTML='<div class="cbz-error">'+res.error+'</div>';return;}
        var dh=res.lines.map(function(l){
          return '<div class="pline">'+
            (l.img?'<img src="'+l.img+'" class="pimg" onerror="this.style.display=\'none\'">':'<div class="pimg pimg-ph">📦</div>')+
            '<div class="pinfo"><div class="pname">'+l.producto+'</div>'+
            '<div class="pmeta">SKU: '+(l.sku||'-')+' · Cant: '+l.cantidad+' · P.U: '+fmt(l.precio)+
            (l.desc?' · <span class="pdesc">Desc: '+l.desc+'</span>':'')+'</div></div>'+
            '<div class="psub">'+fmt(l.subtotal)+'</div></div>';
        }).join('')||'<div class="cbz-muted">Sin líneas</div>';
        if(res.resumen){
          dh+='<div class="ores">'+
            (res.resumen.descuento>0?'<div><span>Descuento aplicado</span><span class="ocobrar-p">-'+fmt(res.resumen.descuento)+'</span></div>':'')+
            '<div><span>Subtotal</span><span>'+fmt(res.resumen.subtotal)+'</span></div>'+
            '<div><span>IVA</span><span>'+fmt(res.resumen.iva)+'</span></div>'+
            '<div class="ores-tot"><span>TOTAL</span><span>'+fmt(res.resumen.total)+'</span></div>'+
            (res.resumen.utilidad!==null&&res.resumen.utilidad!==undefined?
              '<div class="ores-util"><span>Utilidad bruta</span><span>'+fmt(res.resumen.utilidad)+' · '+res.resumen.margen+'%</span></div>':'')+
            '</div>';
        }
        if(res.notas) dh+='<div class="onotas">📝 '+res.notas+'</div>';
        dh+='<div style="margin-top:10px"><button class="cbz-btn" onclick="Dash.dlPdf(\''+id+'\')">⬇ Descargar PDF</button></div>';
        det.innerHTML=dh;
      }).catch(function(){});
    }
  }
  function dlPdf(id){
    fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'getOrderPdf',orderId:id,user:getUserName(),pin:getPin()})})
    .then(function(r){return r.json();}).then(function(res){
      if(!res.ok){alert('Error: '+(res.error||'no se pudo generar el PDF'));return;}
      var bin=atob(res.b64), arr=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
      var blob=new Blob([arr],{type:'application/pdf'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=res.filename||'orden.pdf';
      document.body.appendChild(a);a.click();a.remove();
    }).catch(function(){alert('Fallo de red generando el PDF');});
  }
  return {init:init,preset:preset,applyCustom:applyCustom,setFilter:setFilter,toggleOrder:toggleOrder,dlPdf:dlPdf};
})();


/* ===================== USUARIOS (solo admin) ===================== */
var Users = (function(){

    return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})

      }).catch(function(){});

      }).catch(function(){});

  function render(){

      '<button class="cbz-btn" onclick="Users.nuevo()">+ Nuevo usuario</button>'+
      '<button class="cbz-btn-sec" onclick="Users.invitar()">🔗 Generar invitación</button></div>';
    function cardHtml(u,i){
      var isEd = editing===i;
      var card='<div class="cbz-card'+(u.activo?'':' cbz-card-off')+'">'+
        '<div class="cbz-card-top"><div class="cbz-card-name">'+u.nombre+
        (u.rol==='admin'?' <span class="tagx tf">ADMIN</span>':'')+
        (u.master?' <span class="tagx" style="background:#3a2c1c;color:#f0c040">MÁSTER</span>':'')+
        (u.rol==='cliente'&&!u.aprobado?(u.solicitud?' <span class="tagx tn">🔔 SOLICITÓ ACCESO '+u.solicitud+'</span>':' <span class="tagx tn">POR APROBAR</span>'):'')+
        (u.activo?'':' <span class="tagx tn">INACTIVO</span>')+'</div>'+
        '<button class="cbz-btn-sec" onclick="Users.edit('+i+')">'+(isEd?'Cerrar':'Editar')+'</button></div>'+
        '<div class="cbz-card-row cbz-muted">Módulos: '+(u.modulos||'ninguno')+'</div>';
      if(isEd) card+=formHtml(u,false);
      return card+'</div>';
    }
    var internos=[], clientesU=[];
    lista.forEach(function(u,i){ (u.rol==='cliente'?clientesU:internos).push({u:u,i:i}); });
    h+='<div class="cbz-card-name" style="margin:6px 0">👷 Equipo Minecore ('+internos.length+')</div>';
    h+=internos.length?internos.map(function(x){return cardHtml(x.u,x.i);}).join(''):
      '<div class="cbz-muted" style="padding:8px">Sin usuarios internos.</div>';
    var orgs={};
    clientesU.forEach(function(x){

  /** KPIs dinámicos: se recalculan sobre lo filtrado */
  function renderKpis(fil){
    var box=document.getElementById('inv-kpis');
    if(!box)return;
    if(esCliente){box.innerHTML='';return;}
    var k={skus:0,unidades:0,agotados:0,vCosto:0,vPrecio:0,mSum:0,mN:0};
    fil.forEach(function(it){
      k.skus++;k.unidades+=it.stock;
      if(it.stock<=0)k.agotados++;
      if(esAdmin&&it.costo)k.vCosto+=it.stock*it.costo;
      if(it.precio)k.vPrecio+=it.stock*it.precio;
      if(esAdmin&&it.margenPct!==undefined){k.mSum+=it.margenPct;k.mN++;}
    });
    box.innerHTML='<div class="cbz-kpis" style="margin-bottom:12px">'+
      '<div class="cbz-kpi"><span class="cbz-kpi-num">'+k.skus+'</span><span class="cbz-kpi-lbl">SKUs</span></div>'+
      '<div class="cbz-kpi"><span class="cbz-kpi-num">'+Math.round(k.unidades*100)/100+'</span><span class="cbz-kpi-lbl">Unidades</span></div>'+
      '<div class="cbz-kpi"><span class="cbz-kpi-num cbz-red">'+k.agotados+'</span><span class="cbz-kpi-lbl">Agotados</span></div>'+
      ((esAdmin&&!rolCli())?'<div class="cbz-kpi" title="'+fmt(k.vCosto)+'"><span class="cbz-kpi-num">'+fmtK(k.vCosto)+'</span><span class="cbz-kpi-lbl">Valor a costo</span></div>':'')+
      ((!esCliente&&!rolCli())?'<div class="cbz-kpi" title="'+fmt(k.vPrecio)+'"><span class="cbz-kpi-num" style="color:#6fd68f">'+fmtK(k.vPrecio)+'</span><span class="cbz-kpi-lbl">Valor a precio</span></div>':'')+
      ((esAdmin&&!rolCli())&&k.mN?'<div class="cbz-kpi"><span class="cbz-kpi-num" style="color:#5cc8ff">'+Math.round(k.mSum/k.mN*10)/10+'%</span><span class="cbz-kpi-lbl">Margen prom.</span></div>':'')+
      '</div>';
  }

    var MAX=150;
    var h=fil.slice(0,MAX).map(function(it,ix){
      var st=it.stock<=0?'<span class="tagx tn">AGOTADO</span>':'<span class="tagx tf">'+it.stock+' und.</span>';
      var open=abierto===it.sku;
      var card='<div class="cbz-card" style="padding:10px 12px">'+
        '<div class="cbz-card-row" style="justify-content:space-between;align-items:flex-start;cursor:pointer" onclick="Inv.abrir(\''+it.sku+'\')">'+
        (it.img?'<img src="'+it.img+'" class="pimg" loading="lazy" onerror="this.style.display=\'none\'">':'<div class="pimg pimg-ph">📦</div>')+
        '<div style="flex:1;min-width:0"><div class="pname">'+(open?'▾ ':'')+it.nombre+'</div>'+
        '<div class="pmeta">SKU: '+it.sku+(it.codigo?' · Cód: '+it.codigo:'')+'</div></div>'+
        '<div style="text-align:right;flex:none">'+st+
        (it.precio!==undefined&&it.precio?'<div class="pname" style="margin-top:4px">'+fmt(it.precio)+'</div>':'')+
        (puedeCot?(carrito[it.sku]?'<div style="margin-top:6px;display:flex;gap:4px;justify-content:flex-end;align-items:center" onclick="event.stopPropagation()">🛒<input type="number" min="1" inputmode="numeric" class="uinput" style="width:58px;max-width:58px;text-align:center;padding:5px" value="'+carrito[it.sku].cantidad+'" onchange="Inv.cartSet(\''+it.sku+'\',this.value)"><button class="chip" onclick="Inv.cartQty(\''+it.sku+'\',1)">＋</button></div>':'<div style="margin-top:6px"><button class="chip" onclick="event.stopPropagation();Inv.addCart(\''+it.sku+'\')">➕ Cotizar</button></div>'):'')+
        '</div></div>';
      if(open){
        card+='<div class="odetail">'+
          '<div class="pmeta">'+(it.categoria||'Sin categoría')+(it.marca?' · Marca: '+it.marca:'')+'</div>'+
          (it.ubicaciones?'<div class="pmeta" style="color:#9fc3e8">📍 '+it.ubicaciones+'</div>':'<div class="pmeta">📍 Sin stock en bodegas</div>')+
          (it.extra?'<div class="pmeta">'+it.extra+'</div>':'')+
          (it.v365!==undefined?'<div class="pmeta" style="color:#f0c040">Rotación: '+(it.v90||0)+' (90d) · '+(it.v180||0)+' (180d) · '+(it.v365||0)+' (365d)'+(it.ultimaVenta?' · Últ. venta: '+it.ultimaVenta:'')+'</div>':'')+
          (esAdmin&&it.costo!==undefined?'<div class="pmeta" style="color:#5cc8ff">Costo: '+fmt(it.costo)+
            (it.margen!==undefined?' · Margen: '+fmt(it.margen)+' ('+it.margenPct+'%)':'')+'</div>':'')+
          '</div>';
      }
      return card+'</div>';
    }).join('');
    if(fil.length>MAX) h+='<div class="cbz-muted" style="text-align:center;padding:10px">Mostrando '+MAX+' de '+fil.length+' — afina la búsqueda</div>';
    box.innerHTML=h||'<div class="cbz-muted" style="padding:16px;text-align:center">Sin resultados</div>';
  }
  function abrir(sku){abierto=(abierto===sku)?null:sku;renderList();}

  /* ---------- Carrito de cotización (rol cliente) ---------- */
  function updateFab(){var f=document.getElementById('cart-fab');if(f)f.textContent='🛒 Carrito ('+cartCount()+')';}
  function addCart(sku){
    var it=null;for(var i=0;i<items.length;i++){if(items[i].sku===sku){it=items[i];break;}}
    if(!it)return;
    if(!carrito[sku])carrito[sku]={nombre:it.nombre,cantidad:0,img:it.img||''};
    if(!carrito[sku].img&&it.img)carrito[sku].img=it.img;
    carrito[sku].cantidad++;cartSave();updateFab();renderList();
  }
  function verCarrito(){setVista('cart');}
  function cartSet(sku,v){
    if(!carrito[sku])return;
    v=parseInt(v,10)||1;if(v<1)v=1;if(v>100000)v=100000;
    carrito[sku].cantidad=v;cartSave();updateFab();
    if(vista==='inv')renderList();
  }
  function cartQty(sku,d){
    if(!carrito[sku])return;
    carrito[sku].cantidad+=d;
    if(carrito[sku].cantidad<=0)delete carrito[sku];
    cartSave();updateFab();
    if(vista==='inv'){renderList();return;}
    var com=document.getElementById('cart-com');var comV=com?com.value:'';
    var emp=document.getElementById('cart-emp');var con=document.getElementById('cart-con');
    var uk2=(getUserName()||'').toLowerCase();
    try{if(emp)localStorage.setItem('mc_empresa_'+uk2,emp.value);if(con)localStorage.setItem('mc_contacto_'+uk2,con.value);}catch(e){}
    render();
    var c2=document.getElementById('cart-com');if(c2)c2.value=comV;
  }

    }).join('');
    h+='<div class="uform" style="margin-top:12px">';
    if(esCliente){
      h+='<input class="uinput" id="cart-emp" placeholder="Empresa" value="'+emp.replace(/"/g,'&quot;')+'">'+

      '<datalist id="cart-clis"></datalist>'+

      '<div class="cbz-muted">La solicitud cae al módulo Cotizaciones con estado NUEVA: ahí revisas precios y la creas en inFlow.</div>';

  function setVCart(v){vistaCart=v;render();}
  function vaciarCarrito(){
    if(!confirm('¿Vaciar todo el carrito?'))return;
    carrito={};cartSave();updateFab();render();
  }
  function cargarEnviadas(){
    api({action:'misCotizaciones'}).then(function(res){
      enviadas=res.ok?(res.solicitudes||[]):[];
      var box=document.getElementById('cart-sent');
      if(box)box.innerHTML=sentHtml();
    }).catch(function(){
      enviadas=[];
      var box=document.getElementById('cart-sent');
      if(box)box.innerHTML='<div class="cbz-error">Sin conexión.</div>';

  function fmtQty2(v){var n=parseFloat(v)||0;return n%1===0?String(Math.round(n)):n.toFixed(2);}
  function sentHtml(){
    if(!enviadas||!enviadas.length)return '<div class="cbz-muted" style="padding:14px">Aún no has enviado solicitudes de cotización.</div>';
    try{localStorage.setItem('mc_cot_vistas_'+(getUserName()||'').toLowerCase(),String(enviadas.filter(function(x){return x.estado==='CREADA';}).length));}catch(e){}
    return enviadas.map(function(s){
      var lista=(s.estado==='CREADA');
      var badge=lista?'<span style="color:#6fd68f;font-weight:bold;font-size:11px">✅ COTIZADA'+(s.inflowNum?' · '+s.inflowNum:'')+'</span>'
                     :'<span style="color:#f0c040;font-weight:bold;font-size:11px">⏳ EN PROCESO</span>';
      var filas=(s.items||[]).map(function(it){
        var precio=(lista&&it.precioFinal!==undefined)?'<span style="color:#9fc3e8;font-weight:bold">'+fmt(it.precioFinal)+'</span> <span class="cbz-muted">· '+fmt(it.subtotal)+'</span>':'';
        return '<div class="cbz-fact-row"><span class="cbz-fact-id" style="flex:1;min-width:0">'+it.nombre+'<div class="pmeta">SKU: '+it.sku+'</div></span>'+
          '<span class="cbz-muted" style="margin-right:8px">× '+fmtQty2(it.cantidad)+'</span>'+precio+'</div>';
      }).join('');

        '<div class="cbz-card-row" style="justify-content:space-between;align-items:center"><div class="pname">'+s.fecha+' · '+s.n+' producto'+(s.n===1?'':'s')+'</div>'+badge+'</div>'+

  var miscotOpen={};
  function misCotHtml(){
    if(enviadas===null)return '<div class="cbz-loading">Cargando tus cotizaciones...</div>';
    try{
      localStorage.setItem('mc_cot_vistas_'+(getUserName()||'').toLowerCase(),String(enviadas.filter(function(x){return x.estado==='CREADA'||x.estado==='APROBADA'||x.estado==='ORDEN';}).length));

      if(maxU)localStorage.setItem('mc_cot_upd_'+(getUserName()||'').toLowerCase(),maxU);
    }catch(e){}

      '<div class="cbz-card-name" style="margin:8px 0">Aún no tienes cotizaciones</div>'+
      '<div class="cbz-muted">Toca el botón de arriba, elige productos con ➕ Cotizar y envíanos tu solicitud.</div></div>';
    var proc=enviadas.filter(function(x){return x.estado!=='CREADA'&&x.estado!=='APROBADA'&&x.estado!=='ORDEN';});
    var listas=enviadas.filter(function(x){return x.estado==='CREADA'||x.estado==='APROBADA'||x.estado==='ORDEN';});
    if(listas.length)h+='<div class="cbz-card-name" style="margin:10px 0 6px">✅ Cotizaciones ('+listas.length+')</div>'+listas.map(cardSol).join('');

  function cardSol(so){

    else badge='<span style="color:#f0c040;font-weight:bold;font-size:11px">⏳ EN PROCESO</span>';
    var h2='<div class="cbz-card" style="'+(lista?'border-color:#2e5c3e':'')+'">'+
      '<div class="cbz-card-row" style="justify-content:space-between;align-items:center;cursor:pointer" onclick="Inv.miscotToggle('+ix+')">'+
      '<div class="cbz-card-name">'+(abierta?'▾ ':'▸ ')+'🧾 '+so.fecha+' · '+so.n+' producto'+(so.n===1?'':'s')+'</div>'+badge+'</div>';
    if(so.fechaActualizada)h2+='<div class="cbz-muted" style="font-size:10px">✏️ Actualizada: '+so.fechaActualizada+'</div>';

        return '<div class="cbz-fact-row" style="align-items:center;gap:8px">'+
          (it.img?'<img src="'+it.img+'" class="pimg" style="width:44px;height:44px;flex:none" loading="lazy" onerror="this.style.display=\'none\'">':'<div class="pimg pimg-ph" style="width:44px;height:44px;flex:none">📦</div>')+
          '<span class="cbz-fact-id" style="flex:1;min-width:0">'+it.nombre+'<div class="pmeta">SKU: '+it.sku+'</div></span>'+
          '<span class="cbz-muted">× '+fmtQty2(it.cantidad)+'</span>'+precio+'</div>';

  function enviarCarrito(){
    var keys=Object.keys(carrito);if(!keys.length)return;
    var emp=document.getElementById('cart-emp').value.trim();
    var con=document.getElementById('cart-con').value.trim();
    if(!emp||!con){alert('Indica la empresa y un contacto para poder enviarte la cotización.');return;}
    var uk=(getUserName()||'').toLowerCase();
    try{localStorage.setItem('mc_empresa_'+uk,emp);localStorage.setItem('mc_contacto_'+uk,con);}catch(e){}
    var its=keys.map(function(sku){return {sku:sku,nombre:carrito[sku].nombre,cantidad:carrito[sku].cantidad};});
    var btn=window.event&&window.event.target;if(btn)btn.disabled=true;
    api({action:'enviarCarrito',items:its,empresa:emp,contacto:con,comentario:document.getElementById('cart-com').value})
    .then(function(res){

  function dl(b64,filename){
    var bin=atob(b64),arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([arr],{type:'text/csv'}));
    a.download=filename;
    document.body.appendChild(a);a.click();a.remove();
  }

  var pdfjsCargando=null;
  var despPdfActual=null,despZoomN=1,despMaxPag=15,despPintaRef=null,despVerArgs=null;
  function despZoom(dir){
    if(!despVerArgs)return;
    var niveles=[1,1.4,1.9,2.6];
    var i=niveles.indexOf(despZoomN);if(i<0)i=0;
    i=Math.max(0,Math.min(niveles.length-1,i+dir));
    if(niveles[i]===despZoomN)return;

  function cargarPdfjs(){
    if(window.pdfjsLib&&window.pdfjsLib.__mcListo)return Promise.resolve();
    if(pdfjsCargando)return pdfjsCargando;
    pdfjsCargando=new Promise(function(res,rej){
      var s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload=function(){
        var wurl='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        // El worker de otro origen suele ser bloqueado: lo bajamos como blob local
        fetch(wurl).then(function(r){return r.blob();}).then(function(b){
          window.pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(b);
          window.pdfjsLib.__mcListo=true;res();
        }).catch(function(){
          try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=wurl;}catch(e){}
          window.pdfjsLib.__mcListo=true;res();
        });
      };
      s.onerror=function(){rej(new Error('No se pudo cargar el motor PDF'));};
      document.head.appendChild(s);
    });
    return pdfjsCargando;
  }
  function despVer(archivo,nombre,esRezoom){

    var listoAlgo=false, caido=false;
    function aIframe(motivo){
      if(caido)return;caido=true;

      if(!cont)return;

      despPdfActual=pdf;if(!esRezoom)despMaxPag=Math.min(pdf.numPages,15);else despMaxPag=Math.min(pdf.numPages,despMaxPag);

      function pinta(n){
        if(caido)return;
        var maxPag=despMaxPag;
        if(n>maxPag){
          if(!listoAlgo){aIframe('no se pudo pintar');return;}
          if(pdf.numPages>maxPag)cont.insertAdjacentHTML('beforeend','<div id="pdf-mas" style="color:#fff;text-align:center;padding:12px">Mostrando '+maxPag+' de '+pdf.numPages+' páginas. '+
            '<button class="chip" onclick="Inv.despMas()">⬇ Cargar 15 más (sin salir)</button></div>');

        pdf.getPage(n).then(function(page){
          var vp0=page.getViewport({scale:1});
          var esc=ancho/vp0.width;

          var wrap=document.createElement('div');

          var cv=document.createElement('canvas');

          wrap.appendChild(cv);

          ctx.scale(dpr,dpr);

            wrap.style.background='#fff';

                  (function(cod){hot.onclick=function(ev){ev.stopPropagation();Inv.despFichaPdf(cod);};})(mm[0]);

        }).catch(function(eP){console.error('getPage '+n,eP);pinta(n+1);});

  function cargarInflow(){

    api({action:'getInflowOrdenes',tipo:(cotTab==='io'?'orden':'quote')}).then(function(res){
      if(!res.ok){el().innerHTML=tabsHtml()+'<div class="cbz-error">'+res.error+'</div>';return;}
      ioLista=res.ordenes||[];renderInflowLista();
    }).catch(function(){el().innerHTML=tabsHtml()+'<div class="cbz-error">Sin conexión.</div>';});
  }
  function renderInflowLista(){
    var tit=cotTab==='io'?'📦 Órdenes de venta en inFlow':'🧾 Cotizaciones en inFlow';
    var h=tabsHtml()+'<div class="cbz-muted" style="margin-bottom:8px">'+tit+' — en vivo, las últimas '+ioLista.length+'. Toca una para verla o editarla.</div>';
    if(!ioLista.length)h+='<div class="cbz-card" style="text-align:center;padding:20px"><div class="cbz-muted">No hay documentos recientes de este tipo.</div></div>';
    h+=ioLista.map(function(o,ix){
      return '<div class="cbz-card" style="cursor:pointer" onclick="Cot.abrirInflow('+ix+')">'+
        '<div class="cbz-card-row" style="justify-content:space-between;align-items:center">'+
        '<div class="cbz-card-name">'+(o.isQuote?'🧾 ':'📦 ')+o.num+'</div>'+
        '<span class="cbz-card-name" style="color:#9fc3e8">'+fmt(o.total)+'</span></div>'+
        '<div class="cbz-card-row cbz-muted" style="font-size:11px;justify-content:space-between">'+
        '<span>'+o.cliente+'</span><span>'+o.fecha+' · '+o.lineas.length+' línea'+(o.lineas.length===1?'':'s')+'</span></div></div>';
    }).join('');
    el().innerHTML=h;
  }
  function abrirInflow(ix){ioDet=JSON.parse(JSON.stringify(ioLista[ix]));renderInflowDet();}
  function renderInflowDet(){
    var o=ioDet;
    var h=tabsHtml()+'<div class="cbz-card-row" style="margin-bottom:8px"><button class="chip" onclick="Cot.setTab(\''+cotTab+'\')">← Volver</button></div>';
    h+='<div class="cbz-card"><div class="cbz-card-row" style="justify-content:space-between;align-items:center">'+
      '<div class="cbz-card-name">'+(o.isQuote?'🧾 ':'📦 ')+o.num+'</div>'+
      '<span class="cbz-muted" style="font-size:11px">'+o.fecha+'</span></div>'+
      '<div class="cbz-muted" style="font-size:11px">🏢 '+o.cliente+' · Documento REAL de inFlow: lo que guardes aquí se guarda allá.</div></div>';
    var tot=0;
    o.lineas.forEach(function(l,i){
      var fin=Math.round((parseFloat(l.precio)||0)*(1-(parseFloat(l.descuento)||0)/100)*100)/100;
      tot+=fin*(parseInt(l.cantidad,10)||0);
      h+='<div class="cbz-card">'+
        '<div class="cbz-card-row" style="gap:8px;align-items:flex-start">'+
        (l.img?'<img src="'+l.img+'" class="pimg" style="width:40px;height:40px;flex:none" loading="lazy" onerror="this.style.display=\'none\'">':'')+
        '<div style="flex:1;min-width:0"><div class="cbz-card-name" style="font-size:13px">'+l.nombre+'</div>'+
        '<div class="cbz-muted" style="font-size:11px">'+(l.sku?'SKU: '+l.sku:'')+'</div></div>'+
        '<button class="chip" style="color:#e05c5c" onclick="Cot.ioQuitar('+i+')">🗑</button></div>'+
        '<div class="cbz-card-row" style="gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px">'+
        '<span class="cbz-muted" style="font-size:11px">Cant:</span>'+
        '<input type="number" min="1" class="uinput" style="width:62px;text-align:center;padding:6px" value="'+l.cantidad+'" onchange="Cot.ioSet('+i+',\'cantidad\',this.value)">'+
        '<span class="cbz-muted" style="font-size:11px">Precio:</span>'+
        '<input type="number" min="0" step="0.01" class="uinput" style="width:88px;text-align:center;padding:6px" value="'+(parseFloat(l.precio)||0).toFixed(2)+'" onchange="Cot.ioSet('+i+',\'precio\',this.value)">'+
        '<span class="cbz-muted" style="font-size:11px">Desc %:</span>'+
        '<input type="number" min="0" max="99" step="0.5" class="uinput" style="width:60px;text-align:center;padding:6px" value="'+(parseFloat(l.descuento)||0)+'" onchange="Cot.ioSet('+i+',\'descuento\',this.value)">'+
        '<span style="margin-left:auto">= <b>'+fmt(fin*l.cantidad)+'</b></span></div></div>';
    });
    h+='<div class="cbz-card"><div class="cbz-card-row" style="gap:8px;flex-wrap:wrap;align-items:center">'+
      '<input class="uinput" id="io-add" list="io-prods" placeholder="➕ Agregar producto: escribe SKU o nombre..." style="flex:1;min-width:200px;padding:8px">'+
      '<datalist id="io-prods"></datalist>'+
      '<button class="cbz-btn-sec" onclick="Cot.ioAgregar()">➕ Agregar</button></div></div>';
    h+='<div class="cbz-card"><div class="cbz-card-row" style="justify-content:space-between"><span class="cbz-card-name">Subtotal (sin IVA)</span><span class="cbz-card-name">'+fmt(tot)+'</span></div></div>';
    if(puedeEscribir())h+='<div class="cbz-card-row" style="gap:8px;margin-top:6px"><button class="cbz-btn" onclick="Cot.ioGuardar()">💾 Guardar cambios en inFlow</button></div>';
    el().innerHTML=h;
    cargarProdsDatalist();
  }
  function cargarProdsDatalist(){
    function pinta(){
      var dl=document.getElementById('io-prods');
      if(!dl||!prodCat)return;
      dl.innerHTML=prodCat.map(function(p){return '<option value="'+String(p.sku+' — '+p.nombre).slice(0,90).replace(/"/g,'&quot;')+'">';}).join('');
    }
    if(prodCat){pinta();return;}
    api({action:'getInventario'}).then(function(res){
      if(!res.ok)return;
      prodCat=(res.items||[]).map(function(it){return {sku:it.sku,nombre:it.nombre,productId:it.productId||'',precio:it.precio||0,img:it.img||''};});
      pinta();
    }).catch(function(){});
  }
  function ioSet(i,campo,v){
    if(campo==='cantidad'){var n=parseInt(v,10)||1;if(n<1)n=1;ioDet.lineas[i].cantidad=n;}
    else if(campo==='precio'){ioDet.lineas[i].precio=parseFloat(v)||0;}
    else{var d=parseFloat(v)||0;if(d<0)d=0;if(d>=100)d=99;ioDet.lineas[i].descuento=d;}
    renderInflowDet();
  }
  function ioQuitar(i){
    if(ioDet.lineas.length<=1){alert('La orden no puede quedar sin líneas.');return;}
    if(!confirm('¿Quitar "'+ioDet.lineas[i].nombre+'" de este documento?'))return;
    ioDet.lineas.splice(i,1);renderInflowDet();
  }
  function ioAgregar(){
    var v=(document.getElementById('io-add')||{}).value||'';
    var skuBuscado=v.split(' — ')[0].trim();
    if(!skuBuscado){alert('Escribe o elige un producto.');return;}
    var p=null;
    if(prodCat)for(var i=0;i<prodCat.length;i++){if(prodCat[i].sku===skuBuscado){p=prodCat[i];break;}}
    if(!p){alert('Producto no encontrado. Elige uno de la lista.');return;}
    if(!p.productId){alert('Este producto no tiene ID de inFlow.');return;}
    ioDet.lineas.push({lid:'',productId:p.productId,sku:p.sku,nombre:p.nombre,img:p.img,cantidad:1,precio:p.precio||0,descuento:0});
    renderInflowDet();
  }
  function ioGuardar(){
    if(!confirm('¿Guardar los cambios de '+ioDet.num+' DIRECTO en inFlow?'))return;
    el().innerHTML=tabsHtml()+'<div class="cbz-loading">Guardando en inFlow...</div>';
    api({action:'editarOrdenInflow',salesOrderId:ioDet.salesOrderId,
         lineas:ioDet.lineas.map(function(l){return {lid:l.lid,productId:l.productId,cantidad:l.cantidad,precio:l.precio,descuento:l.descuento};})
    }).then(function(res){
      if(!res.ok){alert('Error: '+res.error);renderInflowDet();return;}
      alert('✔ Guardado en inFlow.'+(res.aviso?'\n⚠ '+res.aviso:''));
      cargarInflow();
    }).catch(function(){alert('Sin conexión. Verifica en inFlow.');renderInflowDet();});
  }
  function vinculoHtml(){
    if(det.vinculo)return '<div class="cbz-muted" style="font-size:11px;margin-top:4px">🔗 Cliente inFlow: <b style="color:#9fc3e8">'+det.vinculo.nombre+'</b></div>';
    if(!det.candidatos.length)return '<div style="color:#f0c040;font-size:11px;margin-top:4px">⚠ Sin cliente de inFlow vinculado ni candidatos por nombre. Corre el sync o revisa el nombre de la empresa.</div>';
    return '<div style="margin-top:6px"><div style="color:#f0c040;font-size:11px">⚠ Confirma con qué cliente de inFlow se empareja esta empresa (una sola vez):</div>'+
      '<div class="cbz-card-row" style="gap:6px;margin-top:4px;flex-wrap:wrap">'+
      det.candidatos.map(function(cd,i){
        return '<button class="chip'+(cd.exacto?' on':'')+'" onclick="Cot.vincular('+i+')">'+(cd.exacto?'✔ ':'')+cd.nombre+'</button>';
      }).join('')+'</div></div>';
  }
  function vincular(i){
    var cd=det.candidatos[i];
    if(!confirm('¿Vincular "'+det.cot.empresa+'" con el cliente de inFlow "'+cd.nombre+'"? Quedará memorizado para todas sus cotizaciones.'))return;
    api({action:'vincularClienteCot',empresa:det.cot.empresa,customerId:cd.customerId,nombre:cd.nombre}).then(function(res){
      if(!res.ok){alert(res.error);return;}
      det.vinculo={customerId:cd.customerId,nombre:cd.nombre};renderDet();
    });
  }
  function setPrecio(i,v){det.lineas[i].precio=parseFloat(v)||0;renderDet();}
  function setCant(i,v){var n=parseInt(v,10)||1;if(n<1)n=1;det.lineas[i].cantidad=n;renderDet();}
  function payloadPrecios(){
    var pr={},ca={},ds={};
    det.lineas.forEach(function(l){pr[l.sku]=parseFloat(l.precio)||0;ca[l.sku]=parseInt(l.cantidad,10)||1;ds[l.sku]=parseFloat(l.descuento)||0;});
    return {precios:pr,cantidades:ca,descuentos:ds};
  }
  function guardar(){
    var p=payloadPrecios();
    api({action:'guardarCotizacion',id:det.cot.id,precios:p.precios,cantidades:p.cantidades,descuentos:p.descuentos}).then(function(res){
      if(!res.ok){alert(res.error);return;}
      det.cot.estado='EN REVISION';renderDet();
    });
  }
  function crear(){
    if(!det.vinculo){alert('Primero vincula la empresa con su cliente de inFlow (botones amarillos arriba).');return;}
    var lineas=det.lineas.filter(function(l){return l.productId;});
    if(!lineas.length){alert('Ninguna línea tiene producto de inFlow.');return;}
    var omitidas=det.lineas.length-lineas.length;
    var msg='¿Crear la cotización en inFlow para '+det.vinculo.nombre+' con '+lineas.length+' línea'+(lineas.length===1?'':'s')+'?'+
      (omitidas?'\n(Se omitirán '+omitidas+' línea(s) sin producto de inFlow.)':'');
    if(!confirm(msg))return;
    el().innerHTML='<div class="cbz-loading">Creando cotización en inFlow...</div>';
    var avisar=!!(document.getElementById('cot-avisar')&&document.getElementById('cot-avisar').checked);
    api({action:'crearCotInflow',id:det.cot.id,campos:det.campos||{},avisar:avisar,
         lineas:lineas.map(function(l){return {sku:l.sku,productId:l.productId,cantidad:l.cantidad,precio:l.precio,descuento:parseFloat(l.descuento)||0};})
    }).then(function(res){
      if(!res.ok){alert('Error: '+res.error);abrir(det.cot.id);return;}
      alert('✔ Cotización creada en inFlow: '+res.orderNumber+'\nCliente: '+res.cliente+(res.emailEnviado?'\n📧 Aviso con precios enviado a '+res.emailEnviado:'\n(Sin email a la mano: avísale al cliente por tu canal habitual)')+'\n\nYa puedes verla en inFlow o imprimir la planilla aquí.');
      abrir(det.cot.id);
    }).catch(function(){alert('Sin conexión. Verifica en inFlow si se creó antes de reintentar.');abrir(det.cot.id);});
  }
  function editarCreada(){editandoCreada=true;renderDet();}
  function cancelarEdicion(){editandoCreada=false;abrir(det.cot.id);}
  function guardarEdicion(){
    var lineas=det.lineas.filter(function(l){return l.productId;});
    if(!confirm('¿Guardar los cambios de '+det.cot.inflowNum+'?\nSe actualizará en inFlow.'))return;
    el().innerHTML='<div class="cbz-loading">Actualizando cotización...</div>';
    var avisar=!!(document.getElementById('cot-avisar')&&document.getElementById('cot-avisar').checked);
    api({action:'editarCotCreada',id:det.cot.id,avisar:avisar,
         lineas:lineas.map(function(l){return {sku:l.sku,productId:l.productId,cantidad:l.cantidad,precio:l.precio,descuento:parseFloat(l.descuento)||0};})
    }).then(function(res){
      editandoCreada=false;
      if(!res.ok){alert('Error: '+res.error);abrir(det.cot.id);return;}
      alert('✔ Cotización '+res.orderNumber+' actualizada en inFlow.'+(res.emailEnviado?'\n📧 Aviso enviado a '+res.emailEnviado:'\n(Sin email a la mano: avísale por tu canal habitual)'));
      abrir(det.cot.id);
    }).catch(function(){editandoCreada=false;alert('Sin conexión. Verifica en inFlow antes de reintentar.');abrir(det.cot.id);});
  }
  function convertirOV(){
    var msg=det.cot.estado==='APROBADA'?'¿Convertir la cotización '+det.cot.inflowNum+' en ORDEN DE VENTA en inFlow?'
      :'El cliente aún no ha aprobado esta cotización.\n¿Convertirla en ORDEN DE VENTA de todas formas?';
    if(!confirm(msg))return;
    el().innerHTML='<div class="cbz-loading">Convirtiendo en Orden de Venta...</div>';
    api({action:'convertirCotOrden',id:det.cot.id}).then(function(res){
      if(!res.ok){alert('Error: '+res.error);abrir(det.cot.id);return;}
      alert('📦 ¡Lista! Orden de Venta en inFlow: '+res.numOV+'\nYa puedes despachar.');
      abrir(det.cot.id);
    }).catch(function(){alert('Sin conexión. Verifica en inFlow.');abrir(det.cot.id);});
  }
  function filtrar(e2){filtroEmp=e2;renderLista();}
  function volver(){det=null;filtroEmp=filtroEmp;cargar();}
  /* ---------- Planilla de cotización: réplica del formato inFlow ---------- */
  function esc(s){return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function fMes(f){ // 'yyyy-MM-dd...' -> 'Jul 30, 2026' (mismo formato que inFlow)
    var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var s=String(f||'').slice(0,10).split('-');
    if(s.length<3)return String(f||'');
    return m[parseInt(s[1],10)-1]+' '+parseInt(s[2],10)+', '+s[0];
  }
  function pdf(){
    if(!det||!det.vinculo){alert('Falta el vínculo del cliente.');return;}
    api({action:'getClienteInflowData',customerId:det.vinculo.customerId}).then(function(res){
      var cli=(res.ok&&res.cliente)?res.cliente:{nombre:det.vinculo.nombre,ruc:'',direccion:'',contacto:'',telefono:'',email:'',terminos:''};
      abrePlanilla(cli);
    }).catch(function(){abrePlanilla({nombre:det.vinculo.nombre,ruc:'',direccion:'',contacto:'',telefono:'',email:'',terminos:''});});
  }
  function abrePlanilla(cli){
    var c=det.cot;
    var lineas=det.lineas.filter(function(l){return l.productId;});
    function pf(l){var d=parseFloat(l.descuento)||0;return Math.round((parseFloat(l.precio)||0)*(1-d/100)*100)/100;}
    var sub=0;lineas.forEach(function(l){sub+=pf(l)*(parseInt(l.cantidad,10)||0);});
    MCPlanillaCot({
      num:c.inflowNum,fecha:c.fechaCreada||c.fecha,
      cliente:cli,contacto:det.cot.contacto,
      lineas:lineas.map(function(l){return {nombre:l.nombre,codigo:l.codigo||'',sku:l.sku,categoria:l.categoria||'',cantidad:l.cantidad,precioLista:parseFloat(l.precio)||0,descuento:parseFloat(l.descuento)||0,precioFinal:pf(l),img:l.img||''};}),
      subtotal:Math.round(sub*100)/100
    });
  }
  return {init:init,abrir:abrir,volver:volver,setPrecio:setPrecio,setCant:setCant,setDesc:setDesc,
          guardar:guardar,crear:crear,vincular:vincular,pdf:pdf,
          filtrar:filtrar,editarCreada:editarCreada,cancelarEdicion:cancelarEdicion,guardarEdicion:guardarEdicion,
          togCampos:togCampos,setCampo:setCampo,convertirOV:convertirOV,
          setTab:setTab,nuevaCotizacion:nuevaCotizacion,pickGo:pickGo,
          abrirInflow:abrirInflow,ioSet:ioSet,ioQuitar:ioQuitar,ioAgregar:ioAgregar,ioGuardar:ioGuardar};
})();

/* ===================== ESTADO DE CUENTA (portal cliente) ===================== */
var Edc = (function(){
  var data=null, vistaE='cartera', detalle=null, q='', ordenDesc=true;
  function api(p){
    p.user=getUserName();p.pin=getPin();
    return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
      .then(function(r){return r.json();});
  }
  function fmt(n){n=parseFloat(n)||0;var p=n.toFixed(2).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return '$'+p.join('.');}
  function fmtQty(v){var n=parseFloat(v)||0;return n%1===0?String(Math.round(n)):n.toFixed(2);}
  function init(){
    var el=document.getElementById('edc-screen');
    var p=getProfile();
    if(p.rol==='cliente'&&!p.aprobado){
      el.innerHTML='<div class="cbz-card" style="text-align:center;padding:24px">'+
        '<div style="font-size:34px">🔒</div>'+
        '<div class="cbz-card-name" style="margin:8px 0">El estado de cuenta requiere autorización</div>'+
        (p.master
          ?'<div class="cbz-muted" style="margin-bottom:14px">Como usuario máster de '+(p.empresa||'tu organización')+', tú solicitas el acceso una sola vez. Al aprobarse, queda habilitado para toda tu organización.</div>'+
           '<button class="cbz-btn" onclick="Edc.solicitar(this)">📨 Solicitar autorización</button>'+
           '<div id="edc-sol-msg" style="margin-top:10px"></div>'
          :'<div class="cbz-muted">El acceso lo gestiona el usuario máster de tu organización con Minecore. Cuando esté aprobado, aquí verás la cartera y el historial.</div>')+
        '</div>';
      return;
    }
    el.innerHTML='<div class="cbz-loading">Cargando tu estado de cuenta...</div>';
    api({action:'getEstadoCuenta'}).then(function(res){
      if(!res.ok){el.innerHTML='<div class="cbz-error">'+res.error+'</div>';return;}
      data=res;vistaE='cartera';detalle=null;q='';render();
    }).catch(function(){el.innerHTML='<div class="cbz-error">Sin conexión.</div>';});
  }
  function render(){
    var el=document.getElementById('edc-screen');
    el.innerHTML='<div class="cbz-muted" style="margin-bottom:6px">'+data.empresa+'</div>'+
      '<div id="edc-kpis"></div>'+
      '<div class="cbz-card-row" style="margin-bottom:6px">'+
      '<input class="cbz-search" placeholder="🔍 Buscar orden, factura, fecha, monto..." value="'+q.replace(/"/g,'&quot;')+'" oninput="Edc.setQ(this.value)">'+
      '</div>'+
      '<div id="edc-tabs"></div>'+
      '<div id="edc-list"></div>';
    renderListE();
  }
  function pasaE(o){
    if(vistaE==='cartera'&&!(o.facturada&&o.saldo>0.005))return false;
    if(vistaE==='hist'&&!o.facturada)return false;
    if(vistaE==='pend'&&o.facturada)return false;
    if(q){
      var b=(o.ov+' '+o.factura+' '+o.fecha+' '+o.vence+' '+o.estado+' '+o.total+' '+o.saldo+' '+o.invStatus).toLowerCase();
      var toks=q.toLowerCase().split(/\s+/).filter(String);
      for(var i=0;i<toks.length;i++){if(b.indexOf(toks[i])<0)return false;}
    }
    return true;
  }
  function renderListE(){
    var tabs=document.getElementById('edc-tabs');
    if(tabs)tabs.innerHTML='<div class="cbz-card-row" style="margin-bottom:10px">'+
      '<button class="chip '+(vistaE==='cartera'?'on':'')+'" onclick="Edc.setV(\'cartera\')">💳 Cartera actual</button>'+
      '<button class="chip '+(vistaE==='hist'?'on':'')+'" onclick="Edc.setV(\'hist\')">📜 Historial facturado</button>'+
      '<button class="chip '+(vistaE==='pend'?'on':'')+'" onclick="Edc.setV(\'pend\')">⏳ Pendientes sin facturar</button>'+
      '<button class="chip" onclick="Edc.toggleOrden()">'+(ordenDesc?'↓ Más recientes primero':'↑ Más antiguas primero')+'</button>'+
      '</div>';
    var rows=data.ordenes.filter(pasaE);
    rows.sort(function(a,b){
      var fa=a.fecha||'', fb=b.fecha||'';
      return ordenDesc ? (fa<fb?1:-1) : (fa<fb?-1:1);
    });
    // KPIs dinámicos sobre lo filtrado
    var kbox=document.getElementById('edc-kpis');
    if(kbox){
      // Resumen SOLO en la cartera (lo que deben hoy). En historial y pendientes,
      // los totales se los calculan ellos: la app no les hace la tarea.
      if(vistaE!=='cartera'){
        kbox.innerHTML='';
      } else {
        var c=0,ve=0,vi=0;
        rows.forEach(function(o){c+=o.saldo;if(o.estado==='vencida')ve+=o.saldo;else vi+=o.saldo;});
        kbox.innerHTML='<div class="cbz-kpis" style="margin-bottom:12px">'+
          '<div class="cbz-kpi"><span class="cbz-kpi-num">'+fmt(c)+'</span><span class="cbz-kpi-lbl">Cartera facturada</span></div>'+
          '<div class="cbz-kpi"><span class="cbz-kpi-num cbz-red">'+fmt(ve)+'</span><span class="cbz-kpi-lbl">Vencido</span></div>'+
          '<div class="cbz-kpi"><span class="cbz-kpi-num" style="color:#6fd68f">'+fmt(vi)+'</span><span class="cbz-kpi-lbl">Vigente</span></div>'+
          '</div>';
      }
    }
    var box=document.getElementById('edc-list');
    if(!box)return;
    if(!rows.length){
