  var despPdfActual=null,despZoomN=1,despMaxPag=15,despPintaRef=null,despVerArgs=null;
  function despZoom(dir){
    if(!despVerArgs)return;
    var niveles=[1,1.4,1.9,2.6];
    var i=niveles.indexOf(despZoomN);if(i<0)i=0;
    i=Math.max(0,Math.min(niveles.length-1,i+dir));
    if(niveles[i]===despZoomN)return;
    despZoomN=niveles[i];
    despVer(despVerArgs[0],despVerArgs[1],true);
  }
  function despMas(){
    if(!despPdfActual||!despPintaRef)return;
    var desde=despMaxPag+1;
    despMaxPag=Math.min(despPdfActual.numPages,despMaxPag+15);
    var m=document.getElementById('pdf-mas');if(m)m.remove();
    despPintaRef(desde);
  }
  function cargarPdfjs(){
    if(window.pdfjsLib&&window.pdfjsLib.__mcListo)return Promise.resolve();
    if(pdfjsCargando)return pdfjsCargando;
    pdfjsCargando=new Promise(function(res,rej){
      var s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload=function(){
        var wurl='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        // El worker de otro origen suele ser bloqueado: lo bajamos como blob local
        fetch(wurl).then(function(r){return r.blob();}).then(function(b){
          window.pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(b);
          window.pdfjsLib.__mcListo=true;res();
        }).catch(function(){
          try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=wurl;}catch(e){}
          window.pdfjsLib.__mcListo=true;res();
        });
      };
      s.onerror=function(){rej(new Error('No se pudo cargar el motor PDF'));};
      document.head.appendChild(s);
    });
    return pdfjsCargando;
  }
  function despVer(archivo,nombre,esRezoom){
    archivo=absUrl(archivo);
    despVerArgs=[archivo,nombre];
    if(!esRezoom)despZoomN=1;
    var m=despModal('<div style="width:100%;max-width:920px;height:94%;display:flex;flex-direction:column;background:#0d1622;border:1px solid #1e3247;border-radius:12px;overflow:hidden">'+
      '<div class="cbz-card-row" style="justify-content:space-between;align-items:center;padding:10px 12px;flex:none;flex-wrap:wrap;gap:6px">'+
      '<div class="cbz-card-name" style="font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">📄 '+nombre+'</div>'+
      '<div style="display:flex;gap:8px;flex:none">'+
      '<button class="chip" onclick="Inv.despZoom(-1)">🔍−</button>'+
      '<button class="chip" onclick="Inv.despZoom(1)">🔍+</button>'+
      '<a class="chip" style="text-decoration:none" href="'+archivo+'" download>⬇</a>'+
      '<a class="chip" style="text-decoration:none" href="'+archivo+'" target="_blank">↗</a>'+
      '<button class="chip" onclick="Inv.despCerrar()">✕ Cerrar</button></div></div>'+
      '<div id="pdf-hint" style="background:#12233a;color:#9fc3e8;font-size:11px;padding:6px 12px;flex:none">👆 Toca cualquier <b style="color:#f0c040">código resaltado</b> del documento y te mostramos el producto y su stock al instante.</div>'+
      '<div id="pdf-vis" style="flex:1;overflow:auto;background:#3a3f46;padding:10px 0;-webkit-overflow-scrolling:touch"><div class="cbz-loading" style="color:#fff">Cargando documento...</div></div></div>');
    var listoAlgo=false, caido=false;
    function aIframe(motivo){
      if(caido)return;caido=true;
      var cont=document.getElementById('pdf-vis');
      if(!cont)return;
      cont.innerHTML='<iframe src="'+archivo+'" style="border:0;width:100%;height:100%;background:#fff"></iframe>';
      var hb=document.getElementById('pdf-hint');
      if(hb)hb.innerHTML='📄 Visor simple ('+motivo+'): los códigos no son tocables en este documento. Usa ⬇ o ↗ si no se ve.';
    }
    // Watchdog: si en 12s no se pintó ninguna página, cae al visor simple
    setTimeout(function(){if(!listoAlgo)aIframe('tardó demasiado');},12000);
    cargarPdfjs().then(function(){
      return window.pdfjsLib.getDocument({url:archivo}).promise;
    }).then(function(pdf){
      var cont=document.getElementById('pdf-vis');
      if(!cont||caido)return;
      despPdfActual=pdf;if(!esRezoom)despMaxPag=Math.min(pdf.numPages,15);else despMaxPag=Math.min(pdf.numPages,despMaxPag);
      cont.innerHTML='';
      var ancho=Math.max(Math.min(cont.clientWidth-16,880),280)*despZoomN;
      function pinta(n){
        if(caido)return;
        var maxPag=despMaxPag;
        if(n>maxPag){
          if(!listoAlgo){aIframe('no se pudo pintar');return;}
          if(pdf.numPages>maxPag)cont.insertAdjacentHTML('beforeend','<div id="pdf-mas" style="color:#fff;text-align:center;padding:12px">Mostrando '+maxPag+' de '+pdf.numPages+' páginas. '+
            '<button class="chip" onclick="Inv.despMas()">⬇ Cargar 15 más (sin salir)</button></div>');
          return;
        }
        pdf.getPage(n).then(function(page){
          var vp0=page.getViewport({scale:1});
          var esc=ancho/vp0.width;
          var vp=page.getViewport({scale:esc});
          var dpr=Math.min(window.devicePixelRatio||1,2);
          var wrap=document.createElement('div');
          wrap.style.cssText='position:relative;margin:0 auto 12px;width:'+vp.width+'px;height:'+vp.height+'px;background:#2c3138;box-shadow:0 2px 10px rgba(0,0,0,.4)';
          var cv=document.createElement('canvas');
          cv.width=Math.floor(vp.width*dpr);cv.height=Math.floor(vp.height*dpr);
          cv.style.cssText='width:'+vp.width+'px;height:'+vp.height+'px;display:block';
          wrap.appendChild(cv);
          cont.appendChild(wrap);
          var ctx=cv.getContext('2d');
          ctx.scale(dpr,dpr);
          page.render({canvasContext:ctx,viewport:vp}).promise.then(function(){
            wrap.style.background='#fff';
            listoAlgo=true;
            return page.getTextContent().then(function(tc){
              // 1) Agrupar fragmentos de texto por renglón (misma altura y misma línea base)
              var lineas={};
              tc.items.forEach(function(it){
                var str=String(it.str||'');
                if(!str)return;
                var tr=window.pdfjsLib.Util.transform(vp.transform,it.transform);
                if(Math.abs(tr[1])>0.01||Math.abs(tr[2])>0.01)return; // texto rotado: fuera
                var fh=Math.hypot(tr[2],tr[3])||Math.abs(tr[3]);
                if(fh<4)return;
                var x=tr[4], yBase=tr[5];
                var wTot=(it.width||0)*vp.scale;
                var key=Math.round(yBase*2)/2;
                (lineas[key]=lineas[key]||[]).push({x:x,w:wTot,str:str,fh:fh,yBase:yBase});
              });
              // 2) Por renglón: ordenar, unir con mapa de posición por carácter y separar columnas lejanas
              Object.keys(lineas).forEach(function(k){
                var frs=lineas[k].sort(function(a,b){return a.x-b.x;});
                var chars=[], texto='';
                for(var f=0;f<frs.length;f++){
                  var it=frs[f], n=it.str.length, cw=n?it.w/n:0;
                  if(f>0){
                    var prev=frs[f-1], gap=it.x-(prev.x+prev.w);
                    var cwRef=Math.max(cw,(prev.str.length?prev.w/prev.str.length:0),3);
                    if(gap>cwRef*1.6){texto+='\u0001';chars.push(null);} // otra columna: corta la unión
                  }
                  for(var c=0;c<n;c++){texto+=it.str[c];chars.push({x:it.x+cw*c,w:cw,fh:it.fh,yBase:it.yBase});}
                }
                var re=/\d{9,14}/g,mm;
                while((mm=re.exec(texto))){
                  var c0=chars[mm.index], c1=chars[mm.index+mm[0].length-1];
                  if(!c0||!c1)continue;
                  var fh=c0.fh, yTop=c0.yBase-fh;
                  var hot=document.createElement('div');
                  hot.style.cssText='position:absolute;left:'+(c0.x-1)+'px;top:'+yTop+'px;width:'+Math.max(c1.x+c1.w-c0.x+2,26)+'px;height:'+(fh*1.3)+'px;background:rgba(240,192,64,.16);border-bottom:2px solid rgba(240,192,64,.85);border-radius:2px;cursor:pointer';
                  (function(cod){hot.onclick=function(ev){ev.stopPropagation();Inv.despFichaPdf(cod);};})(mm[0]);
                  wrap.appendChild(hot);
                }
              });
            }).catch(function(){});
          }).then(function(){pinta(n+1);})
          .catch(function(eR){wrap.remove();console.error('render p'+n,eR);pinta(n+1);});
        }).catch(function(eP){console.error('getPage '+n,eP);pinta(n+1);});
      }
      despPintaRef=pinta;
      pinta(1);
    }).catch(function(eDoc){
      console.error('pdfjs doc',eDoc);
      aIframe(String(eDoc&&eDoc.message||'motor PDF no disponible').slice(0,60));
    });
  }
  function despFichaPdf(cod){
    // Normaliza el código impreso contra el catálogo de inFlow: exacto → sin prefijo 120 → sin prefijo 150
    var cands=[cod];
    if(cod.length>=12&&cod.indexOf('120')===0)cands.push(cod.slice(3));
    if(cod.length>=12&&cod.indexOf('150')===0)cands.push(cod.slice(3));

      var hay=false;
      for(var j=0;j<items.length;j++){if(String(items[j].codigo||'').trim()===cands[i]){hay=true;break;}}
      if(hay){elegido=cands[i];break;}
    }
    despFicha(elegido);
  }

  function esc(x){return String(x===undefined||x===null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function f2(n){var p=(parseFloat(n)||0).toFixed(2).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return '$'+p.join('.');}
  function fMes(f){var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];var p=String(f||'').slice(0,10).split('-');if(p.length<3)return String(f||'');return M[parseInt(p[1],10)-1]+' '+parseInt(p[2],10)+', '+p[0];}
  var base=(location.protocol==='file:')?'https://estebanfch-cell.github.io/minecoreadminapp/assets/cotizacion/':new URL('assets/cotizacion/',location.href).href;
  var cli=cfg.cliente||{};

  var hayFoto=lineas.some(function(l){return l.img;});
  var hayDesc=lineas.some(function(l){return (parseFloat(l.descuento)||0)>0;});
  var sub=cfg.subtotal||0, iva=Math.round(sub*0.15*100)/100, tot=Math.round((sub+iva)*100)/100;
  var filas=lineas.map(function(l,i){
    return '<tr'+(i%2?' class="alt"':'')+'><td class="num">'+(i+1)+'</td>'+
      (hayFoto?'<td class="foto">'+(l.img?'<img src="'+l.img+'" onerror="this.style.display=\'none\'">':'')+'</td>':'')+
      '<td><div class="pnom" contenteditable="true">'+esc(l.nombre)+'</div>'+
      (l.codigo?'<div class="pcod" contenteditable="true">'+esc(l.codigo)+'</div>':'')+
      '<div class="pcod psku" contenteditable="true">'+esc(l.sku)+'</div></td>'+
      '<td class="cat" contenteditable="true">'+esc(l.categoria)+'</td>'+
      '<td class="qty"><span class="chipq">'+l.cantidad+'</span></td>'+
      (hayDesc?'<td class="mon">'+f2(l.precioLista!==undefined?l.precioLista:l.precioFinal)+'</td><td class="mon" style="width:48px">'+(parseFloat(l.descuento)||0)+' %</td>':'<td class="mon">'+f2(l.precioFinal)+'</td>')+
      '<td class="mon">'+f2(l.cantidad*l.precioFinal)+'</td></tr>';

    var v=(document.getElementById('cz-cli')||{}).value||'';v=v.trim();
    if(!v){alert('Escribe o elige el cliente.');return;}

  }
  function czSetModo(m){czModo=m;renderCotizador();}
  function czCambiar(){if(Object.keys(czCart).length&&!confirm('¿Cambiar de cliente? El carrito actual se mantiene.'))return;czCliente=null;renderCotizador();}
  function czBuscar(v){czQ=v;czRender();}
  function czCats(){
    if(!prodCat)return [];
    if(!czCats._c){var st={};prodCat.forEach(function(p){if(p.categoria)st[p.categoria]=1;});czCats._c=Object.keys(st).sort();}
    return czCats._c;
  }
  function czSetCat(v){czCat=v;if(!czEsBroca()){czLin='';czDesc='';czMm='';}renderCotizador();}
  function czSetLin(v){czLin=v;renderCotizador();}
  function czSetDesc(v){czDesc=v;renderCotizador();}
  function czSetMm(v){czMm=v;renderCotizador();}
  function czEsBroca(){
    return (czCat&&czCat.toUpperCase().indexOf('BROCA')>=0)||(czQ&&czQ.toUpperCase().indexOf('BROCA')>=0);
  }
  function czHayEn(p,tok){
    var H=(p.sku+' '+p.nombre+' '+p.codigo+' '+(p.categoria||'')).toUpperCase();

    api({action:'getInventario'}).then(function(res){
      if(!res.ok)return;
      prodCat=(res.items||[]).map(function(it){return {sku:it.sku,nombre:it.nombre,productId:it.productId||'',precio:it.precio||0,img:it.img||'',stock:it.stock||0,codigo:it.codigo||'',categoria:it.categoria||''};});
      czCats._c=null;
      var sel=document.getElementById('cz-cat');
      if(sel&&sel.options.length<=1){
        czCats().forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});

  function czRender(){
    var box=document.getElementById('cz-res');
    if(!box)return;
    if(!prodCat){box.innerHTML='<div class="cbz-loading">Cargando catálogo...</div>';return;}
    var toks=czQ.toLowerCase().split(/\s+/).filter(String);
    var hayFiltro=czCat||czLin||czDesc||czMm;
    if(!toks.length&&!hayFiltro){box.innerHTML='<div class="cbz-muted" style="font-size:12px;padding:8px 2px">Busca arriba o elige una categoría — '+prodCat.length+' productos en catálogo.</div>';return;}
    var res=[];
    for(var i=0;i<prodCat.length&&res.length<30;i++){
      var p=prodCat[i];
      if(czCat&&p.categoria!==czCat)continue;
      if(czLin&&!czHayEn(p,czLin))continue;
      if(czDesc&&!czHayEn(p,czDesc))continue;
      if(czMm&&!czHayEn(p,czMm+' MM'))continue;
      var H=(p.sku+' '+p.nombre+' '+p.codigo).toLowerCase();
      var ok=true;
      for(var t=0;t<toks.length;t++){if(H.indexOf(toks[t])<0){ok=false;break;}}

        (en?'<div style="display:flex;align-items:center;gap:5px;flex:none">'+

    if(puedeEscribir())h+='<div class="cbz-card-row" style="gap:8px;margin-top:6px"><button class="cbz-btn" onclick="Cot.ioGuardar()">💾 Guardar cambios en inFlow</button></div>';
    el().innerHTML=h;
    cargarProdsDatalist();

  function cargarProdsDatalist(){
    if(prodCat){
      var dl=document.getElementById('io-prods');

      return;
    }
    cargarProdsFull();
  }
  function ioSet(i,campo,v){
    if(campo==='cantidad'){var n=parseInt(v,10)||1;if(n<1)n=1;ioDet.lineas[i].cantidad=n;}
    else if(campo==='precio'){ioDet.lineas[i].precio=parseFloat(v)||0;}
    else{var d=parseFloat(v)||0;if(d<0)d=0;if(d>=100)d=99;ioDet.lineas[i].descuento=d;}
    renderInflowDet();
  }
  function ioQuitar(i){
    if(ioDet.lineas.length<=1){alert('La orden no puede quedar sin líneas.');return;}
    if(!confirm('¿Quitar "'+ioDet.lineas[i].nombre+'" de este documento?'))return;
    ioDet.lineas.splice(i,1);renderInflowDet();
  }
  function ioAgregar(){
    var v=(document.getElementById('io-add')||{}).value||'';
    var skuBuscado=v.split(' — ')[0].trim();

    var p=null;
    if(prodCat)for(var i=0;i<prodCat.length;i++){if(prodCat[i].sku===skuBuscado){p=prodCat[i];break;}}
    if(!p){alert('Producto no encontrado. Elige uno de la lista.');return;}
    if(!p.productId){alert('Este producto no tiene ID de inFlow.');return;}
    ioDet.lineas.push({lid:'',productId:p.productId,sku:p.sku,nombre:p.nombre,img:p.img,cantidad:1,precio:p.precio||0,descuento:0});

  }
  function ioGuardar(){
    if(!confirm('¿Guardar los cambios de '+ioDet.num+' DIRECTO en inFlow?'))return;
    el().innerHTML=tabsHtml()+'<div class="cbz-loading">Guardando en inFlow...</div>';
    api({action:'editarOrdenInflow',salesOrderId:ioDet.salesOrderId,
         lineas:ioDet.lineas.map(function(l){return {lid:l.lid,productId:l.productId,cantidad:l.cantidad,precio:l.precio,descuento:l.descuento};})
    }).then(function(res){
      if(!res.ok){alert('Error: '+res.error);renderInflowDet();return;}
      alert('✔ Guardado en inFlow.'+(res.aviso?'\n⚠ '+res.aviso:''));
      cargarInflow();
    }).catch(function(){alert('Sin conexión. Verifica en inFlow.');renderInflowDet();});
  }
  function vinculoHtml(){
    if(det.vinculo)return '<div class="cbz-muted" style="font-size:11px;margin-top:4px">🔗 Cliente inFlow: <b style="color:#9fc3e8">'+det.vinculo.nombre+'</b></div>';
    if(!det.candidatos.length)return '<div style="color:#f0c040;font-size:11px;margin-top:4px">⚠ Sin cliente de inFlow vinculado ni candidatos por nombre. Corre el sync o revisa el nombre de la empresa.</div>';
    return '<div style="margin-top:6px"><div style="color:#f0c040;font-size:11px">⚠ Confirma con qué cliente de inFlow se empareja esta empresa (una sola vez):</div>'+
      '<div class="cbz-card-row" style="gap:6px;margin-top:4px;flex-wrap:wrap">'+
      det.candidatos.map(function(cd,i){
        return '<button class="chip'+(cd.exacto?' on':'')+'" onclick="Cot.vincular('+i+')">'+(cd.exacto?'✔ ':'')+cd.nombre+'</button>';
      }).join('')+'</div></div>';
  }
  function vincular(i){
    var cd=det.candidatos[i];
    if(!confirm('¿Vincular "'+det.cot.empresa+'" con el cliente de inFlow "'+cd.nombre+'"? Quedará memorizado para todas sus cotizaciones.'))return;
    api({action:'vincularClienteCot',empresa:det.cot.empresa,customerId:cd.customerId,nombre:cd.nombre}).then(function(res){
      if(!res.ok){alert(res.error);return;}
      det.vinculo={customerId:cd.customerId,nombre:cd.nombre};renderDet();
    });
  }
  function setPrecio(i,v){det.lineas[i].precio=parseFloat(v)||0;renderDet();}
  function setCant(i,v){var n=parseInt(v,10)||1;if(n<1)n=1;det.lineas[i].cantidad=n;renderDet();}
  function payloadPrecios(){
    var pr={},ca={},ds={};
    det.lineas.forEach(function(l){pr[l.sku]=parseFloat(l.precio)||0;ca[l.sku]=parseInt(l.cantidad,10)||1;ds[l.sku]=parseFloat(l.descuento)||0;});
    return {precios:pr,cantidades:ca,descuentos:ds};
  }
  function guardar(){
    var p=payloadPrecios();
    var btns=document.querySelectorAll('#cot-body .cbz-btn, #cot-body .cbz-btn-sec');
    api({action:'guardarCotizacion',id:det.cot.id,precios:p.precios,cantidades:p.cantidades,descuentos:p.descuentos}).then(function(res){
      if(!res.ok){alert('No se pudo guardar: '+res.error);return;}
      alert('💾 Borrador guardado.\nPrecios, cantidades y descuentos quedaron registrados — puedes retomarla cuando quieras desde Pre-cotizaciones.');
      volver();
    }).catch(function(){alert('Sin conexión: el borrador NO se guardó.');});
  }
  function crear(){
    if(!det.vinculo){alert('Primero vincula la empresa con su cliente de inFlow (botones amarillos arriba).');return;}
    var lineas=det.lineas.filter(function(l){return l.productId;});
    if(!lineas.length){alert('Ninguna línea tiene producto de inFlow.');return;}
    var omitidas=det.lineas.length-lineas.length;
    var msg='¿Crear la cotización en inFlow para '+det.vinculo.nombre+' con '+lineas.length+' línea'+(lineas.length===1?'':'s')+'?'+
      (omitidas?'\n(Se omitirán '+omitidas+' línea(s) sin producto de inFlow.)':'');
    if(!confirm(msg))return;
    el().innerHTML='<div class="cbz-loading">Creando cotización en inFlow...</div>';
    var avisar=!!(document.getElementById('cot-avisar')&&document.getElementById('cot-avisar').checked);
    api({action:'crearCotInflow',id:det.cot.id,campos:det.campos||{},avisar:avisar,
         lineas:lineas.map(function(l){return {sku:l.sku,productId:l.productId,cantidad:l.cantidad,precio:l.precio,descuento:parseFloat(l.descuento)||0};})
    }).then(function(res){
      if(!res.ok){alert('Error: '+res.error);abrir(det.cot.id);return;}
      alert('✔ Cotización creada en inFlow: '+res.orderNumber+'\nCliente: '+res.cliente+(res.emailEnviado?'\n📧 Aviso con precios enviado a '+res.emailEnviado:'\n(Sin email a la mano: avísale al cliente por tu canal habitual)')+'\n\nYa puedes verla en inFlow o imprimir la planilla aquí.');
      abrir(det.cot.id);
    }).catch(function(){alert('Sin conexión. Verifica en inFlow si se creó antes de reintentar.');abrir(det.cot.id);});
  }
  function borrarPre(id,estado){
    var msg='¿Borrar esta pre-cotización definitivamente?';
    if(estado==='CREADA'||estado==='APROBADA')msg='⚠ Esta cotización YA está en inFlow y el cliente la ve en su módulo.\nBorrarla aquí NO la borra de inFlow, pero el cliente dejará de verla en la app.\n\n¿Borrar de todas formas?';
    if(!confirm(msg))return;
    api({action:'borrarPreCot',id:id}).then(function(res){
      if(!res.ok){alert(res.error);return;}
      det=null;lista=null;cargar();
    }).catch(function(){alert('Sin conexión.');});
  }
  function editarCreada(){editandoCreada=true;renderDet();}
  function cancelarEdicion(){editandoCreada=false;abrir(det.cot.id);}
  function guardarEdicion(){
    var lineas=det.lineas.filter(function(l){return l.productId;});
    if(!confirm('¿Guardar los cambios de '+det.cot.inflowNum+'?\nSe actualizará en inFlow.'))return;
    el().innerHTML='<div class="cbz-loading">Actualizando cotización...</div>';
    var avisar=!!(document.getElementById('cot-avisar')&&document.getElementById('cot-avisar').checked);
    api({action:'editarCotCreada',id:det.cot.id,avisar:avisar,
         lineas:lineas.map(function(l){return {sku:l.sku,productId:l.productId,cantidad:l.cantidad,precio:l.precio,descuento:parseFloat(l.descuento)||0};})
    }).then(function(res){
      editandoCreada=false;
      if(!res.ok){alert('Error: '+res.error);abrir(det.cot.id);return;}
      alert('✔ Cotización '+res.orderNumber+' actualizada en inFlow.'+(res.emailEnviado?'\n📧 Aviso enviado a '+res.emailEnviado:'\n(Sin email a la mano: avísale por tu canal habitual)'));
      abrir(det.cot.id);
    }).catch(function(){editandoCreada=false;alert('Sin conexión. Verifica en inFlow antes de reintentar.');abrir(det.cot.id);});
  }
  function convertirOV(){
    var msg=det.cot.estado==='APROBADA'?'¿Convertir la cotización '+det.cot.inflowNum+' en ORDEN DE VENTA en inFlow?'
      :'El cliente aún no ha aprobado esta cotización.\n¿Convertirla en ORDEN DE VENTA de todas formas?';
    if(!confirm(msg))return;
    el().innerHTML='<div class="cbz-loading">Convirtiendo en Orden de Venta...</div>';
    api({action:'convertirCotOrden',id:det.cot.id}).then(function(res){
      if(!res.ok){alert('Error: '+res.error);abrir(det.cot.id);return;}
      alert('📦 ¡Lista! Orden de Venta en inFlow: '+res.numOV+'\nYa puedes despachar.');
      abrir(det.cot.id);
    }).catch(function(){alert('Sin conexión. Verifica en inFlow.');abrir(det.cot.id);});
  }
  function filtrar(e2){filtroEmp=e2;renderLista();}
  function volver(){det=null;cargar();}
  /* ---------- Planilla de cotización: réplica del formato inFlow ---------- */
  function esc(s){return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function fMes(f){ // 'yyyy-MM-dd...' -> 'Jul 30, 2026' (mismo formato que inFlow)
    var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var s=String(f||'').slice(0,10).split('-');
    if(s.length<3)return String(f||'');
    return m[parseInt(s[1],10)-1]+' '+parseInt(s[2],10)+', '+s[0];
  }
  function pdf(){
    if(!det||!det.vinculo){alert('Falta el vínculo del cliente.');return;}
    api({action:'getClienteInflowData',customerId:det.vinculo.customerId}).then(function(res){
      var cli=(res.ok&&res.cliente)?res.cliente:{nombre:det.vinculo.nombre,ruc:'',direccion:'',contacto:'',telefono:'',email:'',terminos:''};
      abrePlanilla(cli);
    }).catch(function(){abrePlanilla({nombre:det.vinculo.nombre,ruc:'',direccion:'',contacto:'',telefono:'',email:'',terminos:''});});
  }
  function abrePlanilla(cli){
    var c=det.cot;
    var lineas=det.lineas.filter(function(l){return l.productId;});
    function pf(l){var d=parseFloat(l.descuento)||0;return Math.round((parseFloat(l.precio)||0)*(1-d/100)*100)/100;}
    var sub=0;lineas.forEach(function(l){sub+=pf(l)*(parseInt(l.cantidad,10)||0);});
    MCPlanillaCot({
      num:c.inflowNum,fecha:c.fechaCreada||c.fecha,
      cliente:cli,contacto:det.cot.contacto,
      lineas:lineas.map(function(l){return {nombre:l.nombre,codigo:l.codigo||'',sku:l.sku,categoria:l.categoria||'',cantidad:l.cantidad,precioLista:parseFloat(l.precio)||0,descuento:parseFloat(l.descuento)||0,precioFinal:pf(l),img:l.img||''};}),
      subtotal:Math.round(sub*100)/100
    });
  }
  return {init:init,abrir:abrir,volver:volver,setPrecio:setPrecio,setCant:setCant,setDesc:setDesc,
          guardar:guardar,crear:crear,vincular:vincular,pdf:pdf,
          filtrar:filtrar,editarCreada:editarCreada,cancelarEdicion:cancelarEdicion,guardarEdicion:guardarEdicion,
          togCampos:togCampos,setCampo:setCampo,convertirOV:convertirOV,
          setTab:setTab,nuevaCotizacion:nuevaCotizacion,pickGo:pickGo,
          czElegir:czElegir,czCambiar:czCambiar,czBuscar:czBuscar,czMas:czMas,czMenos:czMenos,czQuitar:czQuitar,czFinalizar:czFinalizar,czSetCat:czSetCat,czSetLin:czSetLin,czSetDesc:czSetDesc,czSetMm:czSetMm,czSetModo:czSetModo,czSetQty:czSetQty,
          abrirInflow:abrirInflow,ioToggle:ioToggle,ioSet:ioSet,ioQuitar:ioQuitar,ioAgregar:ioAgregar,ioGuardar:ioGuardar,borrarPre:borrarPre};
})();

/* ===================== ESTADO DE CUENTA (portal cliente) ===================== */
var Edc = (function(){
  var data=null, vistaE='cartera', detalle=null, q='', ordenDesc=true;
  function api(p){
    p.user=getUserName();p.pin=getPin();

      .then(function(r){return r.json();});

  function fmt(n){n=parseFloat(n)||0;var p=n.toFixed(2).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return '$'+p.join('.');}

      '<div id="edc-list"></div>';

  function pasaE(o){
    if(vistaE==='cartera'&&!(o.facturada&&o.saldo>0.005))return false;
    if(vistaE==='hist'&&!o.facturada)return false;
    if(vistaE==='pend'&&o.facturada)return false;
    if(q){
      var b=(o.ov+' '+o.factura+' '+o.fecha+' '+o.vence+' '+o.estado+' '+o.total+' '+o.saldo+' '+o.invStatus).toLowerCase();
      var toks=q.toLowerCase().split(/\s+/).filter(String);
      for(var i=0;i<toks.length;i++){if(b.indexOf(toks[i])<0)return false;}
    }

    var tabs=document.getElementById('edc-tabs');

      '<button class="chip '+(vistaE==='cartera'?'on':'')+'" onclick="Edc.setV(\'cartera\')">💳 Cartera actual</button>'+

    // KPIs dinámicos sobre lo filtrado

          '<div class="cbz-kpi"><span class="cbz-kpi-num cbz-red">'+fmt(ve)+'</span><span class="cbz-kpi-lbl">Vencido</span></div>'+
          '<div class="cbz-kpi"><span class="cbz-kpi-num" style="color:#6fd68f">'+fmt(vi)+'</span><span class="cbz-kpi-lbl">Vigente</span></div>'+

      var open=detalle&&detalle.ov===o.ov;
      var c='<div class="cbz-card" style="padding:10px 12px">'+

        '<div style="flex:1;min-width:0"><div class="pname">'+(open?'▾ ':'')+o.ov+(o.factura?' · Fact. '+o.factura:'')+'</div>'+

      if(open){

/* ===================== MI EQUIPO (cliente máster: invita y administra) ===================== */
var MInv = (function(){

  function api(p){

    return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
      .then(function(r){return r.json();});
  }
  var NOMBRES={inventario:'Inventario',estadocuenta:'Estado de cuenta',consignacion:'Consignación y alquiler'};
  function propios(){
    var p=getProfile();
    var seen={};
    return (p.modulos||[]).map(function(m){return m.replace(/\+$/,'');})
      .filter(function(m){if(seen[m])return false;seen[m]=1;return true;});
  }
  function init(){
    var el=document.getElementById('minv-screen');
    el.innerHTML='<div class="cbz-loading">Cargando tu equipo...</div>';
    api({action:'teamList'}).then(function(res){

      equipo=res.equipo||[];
      pm=res.misModulos&&res.misModulos.length?res.misModulos:propios();
      var checks=pm.map(function(m){
        return '<label class="cbz-esc" style="margin-right:14px"><input type="checkbox" id="mi-mod-'+m+'" checked> '+(NOMBRES[m]||m)+'</label>';
      }).join('');
      el.innerHTML='<div class="cbz-card"><div class="cbz-card-name">👥 Invitar a alguien de '+(res.empresa||'tu organización')+'</div>'+
        '<div class="cbz-muted" style="margin:6px 0 10px">Elige qué puede ver. La persona creará su propio usuario y PIN con el link (un solo uso).</div>'+
        '<div class="cbz-card-row" style="flex-wrap:wrap">'+checks+'</div>'+
        '<div class="cbz-card-row" style="margin-top:10px"><button class="cbz-btn" onclick="MInv.crear()">Crear link de invitación</button></div>'+
        '<div id="mi-result" style="margin-top:10px"></div></div>'+
        '<div id="mi-equipo"></div>';
      renderEquipo();
    }).catch(function(){el.innerHTML='<div class="cbz-error">Sin conexión.</div>';});
  }

  function renderEquipo(){
    var box=document.getElementById('mi-equipo');
    if(!box)return;
    var h='<div class="cbz-card" style="margin-top:14px"><div class="cbz-card-name">🧑‍🤝‍🧑 Tu equipo</div>';
    if(!equipo.length)h+='<div class="cbz-muted" style="padding:10px">Aún no has invitado a nadie.</div>';
    h+=equipo.map(function(u,i){
      var toks=(u.modulos||'').split(',').map(function(x){return x.trim().replace(/\+$/,'');});
      var editable=!u.esYo&&!u.master;
      var c='<div class="cbz-card" style="padding:10px 12px;margin-top:8px'+(u.activo?'':';opacity:.6')+'">'+
        '<div class="cbz-card-row" style="justify-content:space-between"><div class="cbz-card-name">'+u.nombre+
        (u.esYo?' <span class="tagx tf">TÚ</span>':'')+
        (u.master?' <span class="tagx" style="background:#3a2c1c;color:#f0c040">MÁSTER</span>':'')+
        (u.activo?'':' <span class="tagx tn">INACTIVO</span>')+'</div></div>';
      if(editable){
        c+='<div class="cbz-card-row" style="flex-wrap:wrap;margin-top:6px">'+
          pm.map(function(m){
            return '<label class="cbz-esc" style="margin-right:12px"><input type="checkbox" id="t-'+i+'-'+m+'" '+(toks.indexOf(m)>=0?'checked':'')+'> '+(NOMBRES[m]||m)+'</label>';
          }).join('')+
          '<label class="cbz-esc" style="margin-right:12px"><input type="checkbox" id="t-'+i+'-activo" '+(u.activo?'checked':'')+'> Activo</label>'+
          '</div><div class="cbz-card-row" style="margin-top:6px">'+
          '<button class="cbz-btn-sec" onclick="MInv.guardar('+i+',this)">Guardar</button>'+
          '<button class="cbz-btn-sec cbz-danger" onclick="MInv.eliminar('+i+')">Eliminar</button></div>';
      } else if(!u.esYo){
        c+='<div class="cbz-muted" style="margin-top:4px">A los usuarios máster los administra Minecore.</div>';
      }
      return c+'</div>';
    }).join('');
    box.innerHTML=h+'</div>';
  }
  function guardar(i,btn){
    var u=equipo[i];
    var sel=pm.filter(function(m){var c=document.getElementById('t-'+i+'-'+m);return c&&c.checked;}).join(',');
    var act=document.getElementById('t-'+i+'-activo').checked;
    if(btn)btn.disabled=true;
    api({action:'teamSave',nombre:u.nombre,modulos:sel,activo:act}).then(function(res){
      if(btn)btn.disabled=false;
      if(!res.ok){alert('Error: '+res.error);return;}
      init();
    }).catch(function(){if(btn)btn.disabled=false;alert('Sin conexión.');});
  }
  function eliminar(i){
    var u=equipo[i];
    if(!confirm('¿Eliminar a '+u.nombre+' de tu organización? No podrá volver a entrar.'))return;
    api({action:'teamDelete',nombre:u.nombre}).then(function(res){
      if(!res.ok){alert('Error: '+res.error);return;}
      init();
    }).catch(function(){alert('Sin conexión.');});
  }
  function crear(){
    var sel=pm.filter(function(m){var c=document.getElementById('mi-mod-'+m);return c&&c.checked;}).join(',');
    if(!sel){alert('Elige al menos un módulo.');return;}
    api({action:'createInvite',rol:'cliente',modulos:sel}).then(function(res){
      var box=document.getElementById('mi-result');
      if(!res.ok){box.innerHTML='<div class="cbz-error">'+res.error+'</div>';return;}
      var link=location.origin+location.pathname+'?invite='+res.token;
      box.innerHTML='<div class="cbz-muted" style="word-break:break-all;background:#0e1622;border-radius:8px;padding:10px">'+link+'</div>'+
        '<button class="cbz-btn-sec" style="margin-top:8px" onclick="MInv.copiar(this)" data-link="'+link+'">📋 Copiar link</button>';
    }).catch(function(){alert('Sin conexión.');});
  }
  function copiar(btn){
    var link=btn.getAttribute('data-link');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(function(){btn.textContent='✅ Copiado';});
    } else { prompt('Copia el link:',link); }
  }
  return {init:init,crear:crear,copiar:copiar,guardar:guardar,eliminar:eliminar};
})();

/* ===================== VINCULACIÓN DE ORGANIZACIÓN (cliente) ===================== */
var Vinc = (function(){
  function api(p){
    p.user=getUserName();p.pin=getPin();
    return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
      .then(function(r){return r.json();});
  }
  function marcarVinculada(emp){
    try{
      var pr=JSON.parse(localStorage.getItem('mc_profile')||'{}');
      pr.vinculada=true;if(emp)pr.empresa=emp;
      localStorage.setItem('mc_profile',JSON.stringify(pr));
    }catch(e){}
    renderHome();
  }
  function run(){
    api({action:'matchMiEmpresa'}).then(function(res){
      if(!res.ok){alert(res.error||'No se pudo buscar.');return;}
      if(res.vinculada){alert('Tu organización ya está vinculada. ✅');marcarVinculada();return;}
      var cand=res.candidatos||[];
      if(!cand.length){alert('No encontramos una coincidencia con "'+(getProfile().empresa||'')+'". Escríbenos a Minecore y te vinculamos manualmente.');return;}
      var msg='¿Cuál es tu organización?\n\n'+cand.map(function(c,i){return (i+1)+') '+c;}).join('\n')+'\n\nEscribe el número (o Cancelar):';
      var sel=prompt(msg,'1');
      if(sel===null)return;
      var idx=parseInt(sel,10)-1;
      if(!(idx>=0&&idx<cand.length)){alert('Opción inválida.');return;}
      api({action:'confirmarMiEmpresa',empresa:cand[idx]}).then(function(r2){
        if(!r2.ok){alert(r2.error||'No se pudo confirmar.');return;}
        alert('✅ '+r2.mensaje);
        marcarVinculada(r2.empresa);
      }).catch(function(){alert('Sin conexión.');});
    }).catch(function(){alert('Sin conexión.');});
  }
  return {run:run};
})();

    }).catch(function(){alert('Sin conexión.');});
  }
  function resolverExt(key,aprobar){
    if(!confirm((aprobar?'¿APROBAR':'¿RECHAZAR')+' la extensión de este lote?'))return;
    api({action:'resolverExtension',key:key,aprobar:aprobar}).then(function(res){
      if(!res.ok){alert(res.error);return;}
      init();
    }).catch(function(){alert('Sin conexión.');});

  function api(p){
    p.user=getUserName();p.pin=getPin();
    return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
      .then(function(r){return r.json();});
  }
  function fmtQty(v){var n=parseFloat(v)||0;return n%1===0?String(Math.round(n)):n.toFixed(2);}
  function durTxt(d){
    var a=Math.floor(d/365), m=Math.floor((d%365)/30), dd=(d%365)%30;
    var p=[];
    if(a)p.push(a+' año'+(a===1?'':'s'));
    if(m)p.push(m+' mes'+(m===1?'':'es'));
    if(dd||!p.length)p.push(dd+' día'+(dd===1?'':'s'));
    return p.join(', ');
  }
  function semaforo(d,l1,l2,amb){
    if(amb==='alq')return '<span class="tagx" style="background:#1c3a4a;color:#5cc8ff">⏱ '+durTxt(d)+' en alquiler</span>';
    if(d>l2)return '<span class="tagx tn">'+d+' días — A FACTURAR</span>';
    if(d>l1)return '<span class="tagx" style="background:#3a3a1c;color:#f0c040">'+d+' días — requiere autorización</span>';
    return '<span class="tagx tf">'+d+' días</span>';
  }
  function alertaDe(it,l1,l2,amb){
    if(amb==='alq')return '<span class="tagx" style="background:#1c3a4a;color:#5cc8ff">⏱ '+durTxt(it.diasMax)+'</span>';
    if(it.diasMax>l2)return '<span class="tagx tn">🔴 A facturar</span>';
    if(it.diasMax>l1)return '<span class="tagx" style="background:#3a3a1c;color:#f0c040">🟡 Atención</span>';
    return '<span class="tagx tf">🟢 Al día</span>';
  }
  function init(){
    var el=document.getElementById('consig-screen');
    el.innerHTML='<div class="cbz-loading">Cargando tu consignación...</div>';
    api({action:'getConsignacion'}).then(function(res){
      if(!res.ok){el.innerHTML='<div class="cbz-error">'+res.error+'</div>';return;}
      data=res;cliSel=0;abiertos={};esClienteC=!res.admin;
      if(data.admin){vistaC='consig';}
      else{vistaC=data.consignacion.length||!data.alquiler.length?'consig':'alq';}
      render();
    }).catch(function(){el.innerHTML='<div class="cbz-error">Sin conexión.</div>';});
  }
  function itemCard(it,key,amb){

      '<div class="cbz-card-row" style="align-items:center;gap:8px;cursor:pointer" onclick="Consig.toggle(\''+key+'\')">'+

      '<div class="pmeta">SKU: '+it.sku+' · En tu poder: <b>'+fmtQty(it.total)+' und.</b>'+(it.lotes.length>1?' · '+it.lotes.length+' actas':'')+'</div></div>'+

             '<button class="cbz-btn" style="padding:5px 10px;font-size:11px" onclick="Consig.resolverExt(\''+String(l.key).replace(/'/g,'')+'\',true)">✅ Aprobar</button>'+
             '<button class="chip" style="font-size:11px" onclick="Consig.resolverExt(\''+String(l.key).replace(/'/g,'')+'\',false)">✖ Rechazar</button>';
        } else if(esClienteC&&l.dias>data.limiteDias&&l.dias<=data.limiteExtendido&&l.key){
          extra='<button class="chip" style="font-size:11px" onclick="Consig.pedirExt(\''+String(l.key).replace(/'/g,'')+'\',\''+String(it.nombre).replace(/'/g,'')+'\',\''+String(l.acta).replace(/'/g,'')+'\')">⏳ Solicitar extensión</button>';

          ((l.ext==='APROBADA'&&l.dias<=data.limiteExtendido)?'':semaforo(l.dias,data.limiteDias,data.limiteExtendido,amb))+extra+'</div>';
      }).join('')+'</div>';
    }
    return c+'</div>';
  }
  function kpisHtml(items,amb){
    var unidades=0,alerta=0,facturar=0,maxD=0;
    var porCat={};
    items.forEach(function(it){
      unidades+=it.total;
      porCat[it.categoria||'Sin categoría']=(porCat[it.categoria||'Sin categoría']||0)+it.total;
      if(it.diasMax>maxD)maxD=it.diasMax;
      if(it.diasMax>data.limiteExtendido)facturar++;
      else if(it.diasMax>data.limiteDias)alerta++;
    });
    var cats=Object.keys(porCat).sort().map(function(c){
      return '<span class="chip" style="cursor:default">'+c+': <b>'+fmtQty(porCat[c])+'</b></span>';
    }).join('');
    return '<div class="cbz-kpis" style="margin-bottom:8px">'+
      '<div class="cbz-kpi"><span class="cbz-kpi-num">'+items.length+'</span><span class="cbz-kpi-lbl">'+(amb==='alq'?'Equipos':'Productos')+'</span></div>'+
      '<div class="cbz-kpi"><span class="cbz-kpi-num">'+fmtQty(unidades)+'</span><span class="cbz-kpi-lbl">Unidades</span></div>'+
      (amb==='alq'
        ?'<div class="cbz-kpi"><span class="cbz-kpi-num" style="color:#5cc8ff;font-size:15px">'+(items.length?durTxt(maxD):'—')+'</span><span class="cbz-kpi-lbl">⏱ Más antiguo en alquiler</span></div>'
        :'<div class="cbz-kpi"><span class="cbz-kpi-num" style="color:#f0c040">'+alerta+'</span><span class="cbz-kpi-lbl">🟡 Requieren autorización</span></div>'+
         '<div class="cbz-kpi"><span class="cbz-kpi-num cbz-red">'+facturar+'</span><span class="cbz-kpi-lbl">🔴 A facturar</span></div>')+
      '</div>'+
      (cats?'<div class="cbz-card-row" style="flex-wrap:wrap;margin-bottom:10px">'+cats+'</div>':'');
  }
  function itemsActuales(){

    if(vistaC==='consig')return cli.consignacion;
    var out=[];
    (cli.alquiler||[]).forEach(function(p){p.items.forEach(function(it){out.push(it);});});

        data.extensiones.map(function(x){

            '<button class="cbz-btn" style="padding:6px 12px" onclick="Consig.resolverExt(\''+String(x.key).replace(/'/g,'')+'\',true)">✅ Aprobar</button>'+
            '<button class="chip" onclick="Consig.resolverExt(\''+String(x.key).replace(/'/g,'')+'\',false)">✖ Rechazar</button></div>';
        }).join('')+'</div>';
    }
    var el=document.getElementById('consig-screen');
    if(data.admin&&!data.clientes.length){
      el.innerHTML='<div class="cbz-card" style="text-align:center;padding:24px"><div style="font-size:34px">📭</div>'+
        '<div class="cbz-card-name" style="margin:8px 0">Sin movimientos de consignación ni alquiler</div>'+
        '<div class="cbz-muted">Revisa que el sync haya llenado Transfers y Stock_Ubicacion.</div></div>';
      return;
    }
    if(data.admin&&cliSel>=data.clientes.length)cliSel=0;
    var cli=data.admin?data.clientes[cliSel]:data;
    var h='';
    if(data.admin){
      h+='<div class="cbz-card-row" style="flex-wrap:wrap;margin-bottom:8px">'+
        data.clientes.map(function(c,i){
          return '<button class="chip '+(i===cliSel?'on':'')+'" onclick="Consig.setCli('+i+')">'+c.cliente+'</button>';
        }).join('')+'</div>';
    } else {
      h+='<div class="cbz-muted" style="margin-bottom:6px">'+data.empresa+'</div>';
    }
    h+=(vistaC==='consig'?'<div class="cbz-muted" style="font-size:11px;margin-bottom:8px">Plazo: '+data.limiteDias+' días · con autorización aprobada: '+data.limiteExtendido+' · pasado el plazo, se factura.</div>':'<div class="cbz-muted" style="font-size:11px;margin-bottom:8px">El alquiler se factura mensualmente — aquí ves cuánto tiempo lleva cada equipo.</div>')+
      kpisHtml(itemsActuales(),vistaC)+
      '<div class="cbz-card-row" style="margin-bottom:10px">'+
      '<button class="chip '+(vistaC==='consig'?'on':'')+'" onclick="Consig.setV(\'consig\')">📦 Consignación ('+cli.consignacion.length+')</button>'+
      '<button class="chip '+(vistaC==='alq'?'on':'')+'" onclick="Consig.setV(\'alq\')">📡 Alquiler ('+(cli.alquiler||[]).length+')</button>'+
      '<button class="chip" onclick="Consig.descargar()">⬇ Descargar reporte</button>'+
      '</div>';
    if(vistaC==='consig'){
      h+=cli.consignacion.length?cli.consignacion.map(function(it,i){return itemCard(it,'c'+i,'consig');}).join(''):
        '<div class="cbz-muted" style="padding:14px;text-align:center">Sin productos en consignación.</div>';
    } else {
      h+=(cli.alquiler||[]).length?cli.alquiler.map(function(p,pi){
        return '<div class="cbz-card"><div class="cbz-card-name">📍 '+p.proyecto+'</div>'+
          p.items.map(function(it,i){return itemCard(it,'a'+pi+'-'+i,'alq');}).join('')+'</div>';
      }).join(''):'<div class="cbz-muted" style="padding:14px;text-align:center">Sin equipos en alquiler.</div>';
    }
    el.innerHTML=extBanner+h;
  }
  function descargar(){
    var cli=data.admin?data.clientes[cliSel]:data;
    var nombreCli=data.admin?cli.cliente:data.empresa;
    function estadoDe(d,amb){if(amb==='alq')return durTxt(d)+' en alquiler';return d>data.limiteExtendido?'A FACTURAR':(d>data.limiteDias?'REQUIERE AUTORIZACIÓN':'AL DÍA');}
    function esc(v){v=String(v===undefined||v===null?'':v);return (v.indexOf(',')>=0||v.indexOf('"')>=0)?'"'+v.replace(/"/g,'""')+'"':v;}
    var filas=[['Tipo','Proyecto','Producto','SKU','Categoría','Acta','Fecha entrega','Cantidad','Días','Estado'].join(',')];
    cli.consignacion.forEach(function(it){
      it.lotes.forEach(function(l){
        filas.push([esc('Consignación'),'',esc(it.nombre),esc(it.sku),esc(it.categoria||''),esc(l.acta),l.fecha||'',l.qty,l.dias,estadoDe(l.dias,'consig')].join(','));
      });
    });
    (cli.alquiler||[]).forEach(function(p){
      p.items.forEach(function(it){
        it.lotes.forEach(function(l){
          filas.push([esc('Alquiler'),esc(p.proyecto),esc(it.nombre),esc(it.sku),esc(it.categoria||''),esc(l.acta),l.fecha||'',l.qty,l.dias,estadoDe(l.dias,'alq')].join(','));
        });
      });
    });
    var hoyS=new Date().toISOString().slice(0,10);
    var csv='\ufeff'+filas.join('\r\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download='Consignacion_'+nombreCli.replace(/[^A-Za-z0-9]+/g,'_')+'_'+hoyS+'.csv';
    document.body.appendChild(a);a.click();a.remove();
  }
  function toggle(k){abiertos[k]=!abiertos[k];render();}
  function setCli(i){cliSel=i;abiertos={};render();}
  function setV(v){vistaC=v;abiertos={};render();}
  return {init:init,setV:setV,setCli:setCli,toggle:toggle,descargar:descargar,pedirExt:pedirExt,resolverExt:resolverExt};
})();

/* ===================== APROBACIONES (admin) ===================== */
var Sols = (function(){
  var pend=[], clientes=[];
  function api(p){
    p.user=getUserName();p.pin=getPin();
    return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
      .then(function(r){return r.json();});
  }
  function norm(s){return String(s).toUpperCase().replace(/[ÁÉÍÓÚ]/g,function(c){return {'Á':'A','É':'E','Í':'I','Ó':'O','Ú':'U'}[c];}).replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
  function init(){
    var el=document.getElementById('sols-screen');
    el.innerHTML='<div class="cbz-loading">Cargando solicitudes...</div>';
    api({action:'listUsers'}).then(function(res){
      if(!res.ok){el.innerHTML='<div class="cbz-error">'+res.error+'</div>';return;}
      pend=res.usuarios.filter(function(u){return u.rol==='cliente'&&!u.aprobado&&(u.solicitud||u.master);});
      api({action:'getClientes'}).then(function(r2){clientes=r2.ok?r2.clientes:[];render();})
        .catch(function(){clientes=[];render();});
    }).catch(function(){el.innerHTML='<div class="cbz-error">Sin conexión.</div>';});
  }
  function sugerencias(txt){
    if(!txt||txt.length<3||!clientes.length)return [];
    var toks=norm(txt).split(' ').filter(function(t){return t.length>=3;});
    if(!toks.length)return [];
    return clientes.filter(function(c){var n=norm(c);return toks.every(function(t){return n.indexOf(t)>=0;});}).slice(0,3);
  }
  function render(){
    var el=document.getElementById('sols-screen');
    if(!pend.length){
      el.innerHTML='<div class="cbz-card" style="text-align:center;padding:24px"><div style="font-size:34px">✅</div>'+
        '<div class="cbz-card-name" style="margin:8px 0">Sin solicitudes pendientes</div>'+
        '<div class="cbz-muted">Cuando un usuario máster solicite acceso al estado de cuenta, aparecerá aquí.</div></div>';
      return;
    }
    el.innerHTML=pend.map(function(u,i){
      var sugs=sugerencias(u.empresa);
      var exacta=u.empresa&&clientes.indexOf(u.empresa)>=0;
      return '<div class="cbz-card">'+
        '<div class="cbz-card-top"><div class="cbz-card-name">'+u.nombre+
        (u.master?' <span class="tagx" style="background:#3a2c1c;color:#f0c040">MÁSTER</span>':'')+
        (u.solicitud?' <span class="tagx tn">🔔 '+u.solicitud+'</span>':'')+'</div></div>'+
        '<div class="cbz-muted" style="margin:4px 0">Empresa declarada: <b>'+(u.empresa||'(no indicó)')+'</b>'+(exacta?' ✅ coincide con inFlow':'')+'</div>'+
        '<div class="cbz-card-row"><input class="uinput" id="s-emp-'+i+'" style="flex:1" placeholder="Empresa a vincular (nombre exacto)" value="'+String(u.empresa||'').replace(/"/g,'&quot;')+'"></div>'+
        (sugs.length&&!exacta?'<div class="cbz-card-row" style="flex-wrap:wrap">'+sugs.map(function(c){
          return '<button class="chip" onclick="document.getElementById(\'s-emp-'+i+'\').value=this.getAttribute(\'data-c\')" data-c="'+c.replace(/"/g,'&quot;')+'">'+c+'</button>';
        }).join('')+'</div>':'')+
        '<div class="cbz-card-row" style="margin-top:8px">'+
        '<button class="cbz-btn" onclick="Sols.aprobar('+i+',this)">✅ Aprobar acceso</button></div>'+
        '</div>';
    }).join('');
  }
  function aprobar(i,btn){
    var u=pend[i];
    var emp=(document.getElementById('s-emp-'+i).value||'').trim();
    if(!emp){alert('Vincula primero la empresa (usa las sugerencias).');return;}
    if(clientes.length&&clientes.indexOf(emp)<0&&!confirm('"'+emp+'" no coincide exacto con ningún cliente de inFlow. ¿Aprobar de todos modos? El estado de cuenta saldrá vacío hasta que coincida.'))return;
    if(btn){btn.disabled=true;btn.textContent='Aprobando...';}
    api({action:'saveUser',nombre:u.nombre,userPin:u.pin,rol:u.rol,modulos:u.modulos,
      activo:u.activo,empresa:emp,master:u.master,aprobado:true})
    .then(function(res){
      if(!res.ok){if(btn){btn.disabled=false;btn.textContent='✅ Aprobar acceso';}alert('Error: '+res.error);return;}
      alert('Aprobado. '+u.nombre+' y su organización ya tienen acceso al estado de cuenta.');
      init();
    }).catch(function(){if(btn){btn.disabled=false;btn.textContent='✅ Aprobar acceso';}alert('Sin conexión.');});
  }
  return {init:init,aprobar:aprobar};
})();

        if(card)card.insertAdjacentHTML('beforeend','<span style="position:absolute;top:10px;right:12px;background:#e05c5c;color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px">🔔 '+(listas>vistas?(listas-vistas):'!')+'</span>');
      }
    }).catch(function(){});
  }
}

function prepararLogin(){
  var u=getUserName();
  if(u){
    document.getElementById('saludo').textContent='Hola, '+u;
    document.getElementById('saludo').style.display='block';
    document.getElementById('usr').style.display='none';
    document.getElementById('usr').value=u;
    document.getElementById('cambiarUsr').style.display='block';
    if(bioEnabled()&&webauthnAvailable()){
      document.getElementById('bioBtn').style.display='block';
      doBioLogin(); // intenta Face ID de una
    }
  }
}
function cambiarUsuario(){
  clearCreds();
  location.reload();
}
function entrar(res,usr,pin,recordarPin){
  try{
  try{localStorage.setItem('mc_user_name',res.user||usr);}catch(e){}
  if(recordarPin){try{localStorage.setItem('mc_pin',pin);}catch(e){}}
  try{localStorage.setItem('mc_profile',JSON.stringify({nombre:res.user||usr,rol:res.rol||'usuario',modulos:res.modulos||[],empresa:res.empresa||'',master:!!res.master,aprobado:!!res.aprobado,vinculada:res.vinculada!==false}));}catch(e){}
  window._pinSesion=pin;
  document.getElementById('login').style.display='none';
  document.getElementById('shell').style.display='block';
  renderHome();
  }catch(e){alert('Error al iniciar la app: '+(e&&e.message?e.message:e));}
}
function doLogin(){
  try{
  if(window._loginBusy)return;
  var usr = document.getElementById('usr').value.trim();
  var pin = document.getElementById('pin').value.trim();
  var err = document.getElementById('loginErr');
  window._loginBusy=true;
  err.style.color='#5a6a7a';
  err.textContent='Verificando...';
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'ping',user:usr,pin:pin})})
  .then(function(r){return r.json();}).then(function(res){
    window._loginBusy=false;
    err.style.color='';
    if(!res.ok){err.textContent=res.error||'Usuario o PIN incorrectos';return;}
    err.textContent='';
    // ¿Activar Face ID?
    if(webauthnAvailable()&&!bioEnabled()&&confirm('¿Activar Face ID / huella para entrar sin PIN en este dispositivo?')){
      try{
      var uid=new Uint8Array(16);crypto.getRandomValues(uid);
      navigator.credentials.create({publicKey:{
        challenge:crypto.getRandomValues(new Uint8Array(32)),
        rp:{name:'Minecore Admin',id:location.hostname},
        user:{id:uid,name:usr,displayName:usr},
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
        timeout:60000
      }}).then(function(cred){
        localStorage.setItem('mc_cred',bufToB64u(cred.rawId));
        localStorage.setItem('mc_bio','1');
        entrar(res,usr,pin,true);
      }).catch(function(){entrar(res,usr,pin,false);});
      }catch(e){entrar(res,usr,pin,false);}
    } else {
      entrar(res,usr,pin,bioEnabled());
    }
  }).catch(function(e){
    window._loginBusy=false;err.style.color='';
    err.textContent=(e&&e.message?'Error ('+(e.name||'')+'): '+e.message:'Sin conexión con el servidor.');
  });
  }catch(e){
    window._loginBusy=false;
    var er=document.getElementById('loginErr');
    if(er)er.textContent='Error ('+(e.name||'app')+'): '+(e.message||e);
  }
}
function doBioLogin(){
  if(window._bioBusy)return;           // candado: un solo Face ID a la vez
  var err=document.getElementById('loginErr');
  var credId=localStorage.getItem('mc_cred');
  var pin=getPin();
  var u=getUserName();
  if(!credId||!pin||!u){err.textContent='Face ID no configurado: entra con tu PIN.';return;}
  var credBuf;
  try{credBuf=b64uToBuf(credId);}
  catch(e){
    // credencial guardada corrupta: se elimina sola y queda el PIN
    try{localStorage.removeItem('mc_cred');localStorage.removeItem('mc_bio');}catch(e2){}
    document.getElementById('bioBtn').style.display='none';
    err.textContent='Face ID se reinició en este dispositivo: entra con tu PIN y actívalo de nuevo.';
    return;
  }
  window._bioBusy=true;
  err.style.color='#5a6a7a';
  err.textContent='🔒 Verificando Face ID...';
  navigator.credentials.get({publicKey:{
    challenge:crypto.getRandomValues(new Uint8Array(32)),
    allowCredentials:[{type:'public-key',id:credBuf}],
    userVerification:'required',
    timeout:60000
  }}).then(function(){
    // Cara verificada: entrada INMEDIATA con el perfil guardado; el servidor valida en segundo plano
    window._bioBusy=false;
    err.textContent='';
    var perfil=null;
    try{perfil=JSON.parse(localStorage.getItem('mc_profile')||'null');}catch(e){}
    if(perfil&&perfil.nombre){
      window._pinSesion=pin;
      document.getElementById('login').style.display='none';
      document.getElementById('shell').style.display='block';
      renderHome();
      // Revalidación en segundo plano (por si el PIN cambió o el usuario fue desactivado)
      fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'ping',user:u,pin:pin})})
      .then(function(r){return r.json();}).then(function(res){
        if(!res.ok){clearCreds();alert('Tu sesión ya no es válida. Ingresa de nuevo.');location.reload();}
        else{try{localStorage.setItem('mc_profile',JSON.stringify({nombre:res.user||u,rol:res.rol||'usuario',modulos:res.modulos||[],empresa:res.empresa||'',master:!!res.master,aprobado:!!res.aprobado,vinculada:res.vinculada!==false}));}catch(e){}}
      }).catch(function(){});
    } else {
      // sin perfil guardado: valida contra el servidor con aviso visible
      err.textContent='Conectando...';
      fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'ping',user:u,pin:pin})})
      .then(function(r){return r.json();}).then(function(res){
        err.textContent='';
        if(res.ok){entrar(res,u,pin,true);}
        else{err.style.color='';err.textContent='Sesión inválida: entra con tu PIN.';}
      }).catch(function(){err.style.color='';err.textContent='Sin conexión con el servidor.';});
    }
  }).catch(function(){
    window._bioBusy=false;
    err.textContent='';               // canceló Face ID: que use el PIN sin drama
  });
}
function doLogout(){
  if(!confirm('¿Cerrar tu sesion en este dispositivo? (Se desactivará también Face ID)'))return;
  clearCreds();
  location.reload();
}

function doRedeem(){
  var err=document.getElementById('invErr');
  var nombre=document.getElementById('inv-nombre').value.trim();
  var nombreCompleto=document.getElementById('inv-full').value.trim();
  var email=document.getElementById('inv-mail').value.trim();
  var telefono=document.getElementById('inv-tel').value.trim();
  var empresa=document.getElementById('inv-emp').value.trim();
  var pin=document.getElementById('inv-pin').value.replace(/[^0-9]/g,'');
  var pin2=document.getElementById('inv-pin2').value.replace(/[^0-9]/g,'');
  if(nombreCompleto.length<5){err.textContent='Escribe tu nombre completo.';return;}
  if(!nombre){err.textContent='Elige un nombre de usuario corto.';return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)){err.textContent='Escribe un correo válido.';return;}
  if(telefono.replace(/[^0-9]/g,'').length<7){err.textContent='Escribe un teléfono válido.';return;}
  if(pin.length<4||pin.length>8){err.textContent='El PIN debe tener de 4 a 8 dígitos.';return;}
  if(pin!==pin2){err.textContent='Los PIN no coinciden.';return;}
  var token=decodeURIComponent((location.search.match(/[?&]invite=([^&]+)/)||[])[1]||'');
  if(!token){err.textContent='Link de invitación inválido.';return;}
  var btn=window.event&&window.event.target;

  function go(){
    if(btn){btn.disabled=true;btn.textContent='Creando...';}
    fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'redeemInvite',token:token,nombre:nombre,userPin:pin,empresa:empresa,nombreCompleto:nombreCompleto,telefono:telefono,email:email})})
    .then(function(r){return r.json();})
    .then(function(res){
      if(btn){btn.disabled=false;btn.textContent='Crear mi usuario';}
      if(!res.ok){err.textContent=res.error||'No se pudo crear el usuario.';return;}
      alert(res.mensaje||'Usuario creado. Ya puedes ingresar con tu usuario y PIN.');
      location.href=location.origin+location.pathname;
    })
    .catch(function(){
      if(btn){btn.disabled=false;btn.textContent='Crear mi usuario';}
      err.textContent='Sin conexión. Intenta de nuevo.';
    });
  }

  // ¿Ya eligió entre las candidatas? (segundo toque del botón)
  var sel=document.querySelector('input[name="empCand"]:checked');
  if(sel){
    if(sel.value!=='__otra__'){empresa=sel.value;document.getElementById('inv-emp').value=empresa;}
    err.textContent='';
    return go();
  }
  if(!empresa||window._empChecked===empresa){err.textContent='';return go();}

  // Best match: si hay UNA coincidencia clara, se usa sola; si hay empate, se pregunta
  if(btn){btn.disabled=true;btn.textContent='Verificando...';}
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'matchEmpresa',token:token,empresa:empresa})})
  .then(function(r){return r.json();})
  .then(function(res){
    if(btn){btn.disabled=false;btn.textContent='Crear mi usuario';}
    var cand=(res&&res.ok&&res.candidatos)||[];
    if(cand.length===1){
      empresa=cand[0];document.getElementById('inv-emp').value=empresa;
      err.textContent='';return go();
    }
    if(cand.length>=2){
      err.innerHTML='<div style="text-align:left;color:#0b1219;font-size:13px;margin-top:4px"><b>¿Cuál es tu empresa?</b>'+
        cand.map(function(c,i){return '<label style="display:block;margin:5px 0"><input type="radio" name="empCand" value="'+c.replace(/"/g,'&quot;')+'"'+(i===0?' checked':'')+'> '+c+'</label>';}).join('')+
        '<label style="display:block;margin:5px 0"><input type="radio" name="empCand" value="__otra__"> Otra / dejar como lo escribí</label>'+
        '<div style="color:#5a6a7a;font-size:11px">Elige una y vuelve a tocar "Crear mi usuario".</div></div>';
      return;
    }
    window._empChecked=empresa; // sin coincidencias: sigue tal cual (queda por aprobar)
    err.textContent='';go();
  })
  .catch(function(){
    if(btn){btn.disabled=false;btn.textContent='Crear mi usuario';}
    window._empChecked=empresa;err.textContent='';go();
  });
}
