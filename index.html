  function tog(ix){abierto[ix]=!abierto[ix];render();}
  return {init:init,tog:tog};
})();

var Consig = (function(){
  var data=null, vistaC='consig', cliSel=0, abiertos={}, cliQ='';
  var esClienteC=false;
  function escH(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function normQ(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
  function pedirExt(key,item,acta){
    if(!confirm('¿Solicitar a Minecore la extensión de plazo (30 → 60 días) para:\n'+item+' · '+acta+'?'))return;
    api({action:'solicitarExtension',key:key,item:item,acta:acta}).then(function(res){
      if(!res.ok){alert(res.error);return;}
      alert('✔ Solicitud enviada. Minecore la revisará y te aparecerá el estado aquí mismo.');
      init();
    }).catch(function(e){alert(MCerr(e)+'.');});
  }
  function resolverExt(key,aprobar){
    if(!confirm((aprobar?'¿APROBAR':'¿RECHAZAR')+' la extensión de este lote?'))return;
    api({action:'resolverExtension',key:key,aprobar:aprobar}).then(function(res){
      if(!res.ok){alert(res.error);return;}
      init();
    }).catch(function(e){alert(MCerr(e)+'.');});
  }
  function api(p){
    p.user=getUserName();p.pin=getPin();
    return MCpost(p);
  }
  function fmtQty(v){var n=parseFloat(v)||0;return n%1===0?String(Math.round(n)):n.toFixed(2);}
  function durTxt(d){
    var a=Math.floor(d/365), m=Math.floor((d%365)/30), dd=(d%365)%30;
    var p=[];
    if(a)p.push(a+' año'+(a===1?'':'s'));
    if(m)p.push(m+' mes'+(m===1?'':'es'));
    if(dd||!p.length)p.push(dd+' día'+(dd===1?'':'s'));
    return p.join(', ');
  }
  /** Semáforo: rojo=por facturar, tomate=atención, verde=al día */
  function nivelDe(d,l1,l2){
    if(d>l2)return 'red';
    if(d>l1)return 'tom';
    return 'ok';
  }
  function tagSem(txt,nivel){
    var st=nivel==='red'?'background:#3a1c1c;color:#e05c5c'
      :(nivel==='tom'?'background:#3a2518;color:#ff6347'
      :'background:#123a28;color:#3ecf8e');
    return '<span class="tagx" style="'+st+'">'+txt+'</span>';
  }
  function colorNivel(n){
    return n==='red'?'#e05c5c':(n==='tom'?'#ff6347':'#3ecf8e');
  }
  function semaforo(d,l1,l2,amb){
    var n=nivelDe(d,l1,l2);
    if(amb==='alq'){
      if(n==='red')return tagSem('⏱ '+durTxt(d)+' — A facturar',n);
      if(n==='tom')return tagSem('⏱ '+durTxt(d)+' — Atención',n);
      return tagSem('⏱ '+durTxt(d)+' — Al día',n);
    }
    if(n==='red')return tagSem(d+' días — A FACTURAR',n);
    if(n==='tom')return tagSem(d+' días — Atención',n);
    return tagSem(d+' días — Al día',n);
  }
  function alertaDe(it,l1,l2,amb){
    var n=nivelDe(it.diasMax,l1,l2);
    if(amb==='alq'){
      if(n==='red')return tagSem('🔴 '+durTxt(it.diasMax),n);
      if(n==='tom')return tagSem('🟠 '+durTxt(it.diasMax),n);
      return tagSem('🟢 '+durTxt(it.diasMax),n);
    }
    if(n==='red')return tagSem('🔴 A facturar',n);
    if(n==='tom')return tagSem('🟠 Atención',n);
    return tagSem('🟢 Al día',n);
  }
  function init(){
    var el=document.getElementById('consig-screen');
    el.innerHTML='<div class="cbz-loading">Cargando tu consignación...</div>';
    api({action:'getConsignacion'}).then(function(res){
      if(!res.ok){el.innerHTML='<div class="cbz-error">'+res.error+'</div>';return;}
      data=res;cliSel=0;abiertos={};cliQ='';esClienteC=!res.admin;
      if(data.admin){vistaC='consig';}
      else{vistaC=data.consignacion.length||!data.alquiler.length?'consig':'alq';}
      render();
    }).catch(function(e){el.innerHTML='<div class="cbz-error">'+MCerr(e)+'</div>';});
  }
  function itemCard(it,key,amb){
    var open=!!abiertos[key];
    var c='<div class="cbz-card" style="padding:10px 12px">'+
      '<div class="cbz-card-row" style="align-items:center;gap:8px;cursor:pointer" onclick="Consig.toggle(\''+key+'\')">'+
      (it.img?'<img src="'+it.img+'" class="pimg" loading="lazy" onerror="this.style.display=\'none\'">':'<div class="pimg pimg-ph">📦</div>')+
      '<div style="flex:1;min-width:0"><div class="pname">'+(open?'▾ ':'▸ ')+it.nombre+'</div>'+
      '<div class="pmeta">SKU: '+it.sku+' · En tu poder: <b>'+fmtQty(it.total)+' und.</b>'+(it.lotes.length>1?' · '+it.lotes.length+' actas':'')+'</div></div>'+
      '<div style="flex:none">'+alertaDe(it,data.limiteDias,data.limiteExtendido,amb)+'</div></div>';
    if(open){
      c+='<div class="odetail">'+it.lotes.map(function(l){
        var extra='';
        if(l.ext==='APROBADA'&&l.dias<=data.limiteExtendido){
          extra='<span style="color:#3ecf8e;font-size:11px;font-weight:bold;white-space:nowrap">✅ AL DÍA · extensión</span>';
        } else if(l.ext==='SOLICITADA'){
          extra=esClienteC?'<span style="color:#5cc8ff;font-size:11px;white-space:nowrap">⏳ Extensión solicitada</span>'
            :'<span style="color:#5cc8ff;font-size:11px;white-space:nowrap">⏳ Solicitada</span> '+
             '<button class="cbz-btn" style="padding:5px 10px;font-size:11px" onclick="Consig.resolverExt(\''+String(l.key).replace(/'/g,'')+'\',true)">✅ Aprobar</button>'+
             '<button class="chip" style="font-size:11px" onclick="Consig.resolverExt(\''+String(l.key).replace(/'/g,'')+'\',false)">✖ Rechazar</button>';
        } else if(esClienteC&&l.dias>data.limiteDias&&l.dias<=data.limiteExtendido&&l.key){
          extra='<button class="chip" style="font-size:11px" onclick="Consig.pedirExt(\''+String(l.key).replace(/'/g,'')+'\',\''+String(it.nombre).replace(/'/g,'')+'\',\''+String(l.acta).replace(/'/g,'')+'\')">⏳ Solicitar extensión</button>';
        }
        return '<div class="cbz-fact-row" style="align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap">'+
          '<span class="cbz-fact-id" style="flex:1;min-width:0">'+l.acta+'<div class="pmeta">Entregado: '+(l.fecha||'—')+' · '+fmtQty(l.qty)+' und.</div></span>'+
          ((l.ext==='APROBADA'&&l.dias<=data.limiteExtendido)?'':semaforo(l.dias,data.limiteDias,data.limiteExtendido,amb))+extra+'</div>';
      }).join('')+'</div>';
    }
    return c+'</div>';
  }
  function kpisHtml(items,amb){
    var unidades=0,alerta=0,facturar=0,maxD=0;
    var porCat={};
    items.forEach(function(it){
      unidades+=it.total;
      porCat[it.categoria||'Sin categoría']=(porCat[it.categoria||'Sin categoría']||0)+it.total;
      if(it.diasMax>maxD)maxD=it.diasMax;
      if(it.diasMax>data.limiteExtendido)facturar++;
      else if(it.diasMax>data.limiteDias)alerta++;
    });
    var cats=Object.keys(porCat).sort().map(function(c){
      return '<span class="chip" style="cursor:default">'+c+': <b>'+fmtQty(porCat[c])+'</b></span>';
    }).join('');
    var nMax=nivelDe(maxD,data.limiteDias,data.limiteExtendido);
    return '<div class="cbz-kpis" style="margin-bottom:8px">'+
      '<div class="cbz-kpi"><span class="cbz-kpi-num">'+items.length+'</span><span class="cbz-kpi-lbl">'+(amb==='alq'?'Equipos':'Productos')+'</span></div>'+
      '<div class="cbz-kpi"><span class="cbz-kpi-num">'+fmtQty(unidades)+'</span><span class="cbz-kpi-lbl">Unidades</span></div>'+
      '<div class="cbz-kpi"><span class="cbz-kpi-num" style="color:#ff6347">'+alerta+'</span><span class="cbz-kpi-lbl">🟠 Atención</span></div>'+
      '<div class="cbz-kpi"><span class="cbz-kpi-num" style="color:#e05c5c">'+facturar+'</span><span class="cbz-kpi-lbl">🔴 A facturar</span></div>'+
      (amb==='alq'
        ?'<div class="cbz-kpi"><span class="cbz-kpi-num" style="color:'+colorNivel(nMax)+';font-size:13px">'+(items.length?durTxt(maxD):'—')+'</span><span class="cbz-kpi-lbl">⏱ Más antiguo</span></div>'
        :'<div class="cbz-kpi"><span class="cbz-kpi-num" style="color:#3ecf8e">'+(items.length-alerta-facturar)+'</span><span class="cbz-kpi-lbl">🟢 Al día</span></div>')+
      '</div>'+
      (cats?'<div class="cbz-card-row" style="flex-wrap:wrap;margin-bottom:10px">'+cats+'</div>':'');
  }
  function itemsActuales(){
    var cli=data.admin?data.clientes[cliSel]:data;
    if(vistaC==='consig')return cli.consignacion;
    var out=[];
    (cli.alquiler||[]).forEach(function(p){p.items.forEach(function(it){out.push(it);});});
    return out;
  }
  function cliOptionsHtml(){
    var qn=normQ(cliQ);
    var html=data.clientes.map(function(c,i){
      if(qn && normQ(c.cliente).indexOf(qn)<0) return '';
      return '<option value="'+i+'"'+(i===cliSel?' selected':'')+'>'+escH(c.cliente)+'</option>';
    }).join('');
    if(html.indexOf('value="'+cliSel+'"')<0 && data.clientes[cliSel]){
      html='<option value="'+cliSel+'" selected>'+escH(data.clientes[cliSel].cliente)+'</option>'+html;
    }
    return html || ('<option value="'+cliSel+'">'+(data.clientes[cliSel]?escH(data.clientes[cliSel].cliente):'—')+'</option>');
  }
  /** Buscador + <select> compacto (1 fila). filterCli actualiza solo el select para no perder foco en iPhone. */
  function clientPickerHtml(){
    if(!data.admin) return '<div class="cbz-muted" style="margin-bottom:6px">'+escH(data.empresa)+'</div>';
    return '<div class="cbz-card-row" style="gap:6px;align-items:center;margin-bottom:8px;flex-wrap:nowrap">'+
      '<input class="cbz-search" id="consig-cli-q" type="search" inputmode="search" enterkeyhint="search" '+
      'placeholder="🔍 Buscar cliente…" value="'+escH(cliQ)+'" '+
      'oninput="Consig.filterCli(this.value)" style="flex:1;min-width:0;margin:0">'+
      '<select id="consig-cli-sel" onchange="Consig.setCli(+this.value)" '+
      'aria-label="Cliente seleccionado" '+
      'style="flex:1.15;min-width:0;max-width:58%;background:#0f1720;border:1px solid #223142;border-radius:20px;color:#dce6f0;font-size:13px;padding:9px 10px;-webkit-appearance:menulist;appearance:menulist">'+
      cliOptionsHtml()+
      '</select></div>';
  }
  function filterCli(q){
    cliQ=q;
    var sel=document.getElementById('consig-cli-sel');
    if(!sel||!data||!data.admin){render();return;}
    sel.innerHTML=cliOptionsHtml();
  }
  function render(){
    var extBanner='';
    if(data&&data.admin&&(data.extensiones||[]).length){
      extBanner='<div class="cbz-card" style="border-color:#ff6347"><div class="cbz-card-name">🔔 Extensiones solicitadas ('+data.extensiones.length+')</div>'+
        data.extensiones.map(function(x){
          return '<div class="cbz-fact-row" style="align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px">'+
            '<span class="cbz-fact-id" style="flex:1;min-width:0">'+x.empresa+' · '+x.item+'<div class="pmeta">'+x.acta+' · pidió '+x.por+' · '+x.fecha+'</div></span>'+
            '<button class="cbz-btn" style="padding:6px 12px" onclick="Consig.resolverExt(\''+String(x.key).replace(/'/g,'')+'\',true)">✅ Aprobar</button>'+
            '<button class="chip" onclick="Consig.resolverExt(\''+String(x.key).replace(/'/g,'')+'\',false)">✖ Rechazar</button></div>';
        }).join('')+'</div>';
    }
    var el=document.getElementById('consig-screen');
    if(data.admin&&!data.clientes.length){
      el.innerHTML='<div class="cbz-card" style="text-align:center;padding:24px"><div style="font-size:34px">📭</div>'+
        '<div class="cbz-card-name" style="margin:8px 0">Sin movimientos de consignación ni alquiler</div>'+
        '<div class="cbz-muted">Revisa que el sync haya llenado Transfers y Stock_Ubicacion.</div></div>';
      return;
    }
    if(data.admin&&cliSel>=data.clientes.length)cliSel=0;
    var cli=data.admin?data.clientes[cliSel]:data;
    var h=clientPickerHtml();
    h+=(vistaC==='consig'?'<div class="cbz-muted" style="font-size:11px;margin-bottom:8px">Plazo: '+data.limiteDias+' días · con autorización aprobada: '+data.limiteExtendido+' · pasado el plazo, se factura.</div>':'<div class="cbz-muted" style="font-size:11px;margin-bottom:8px">El alquiler se factura mensualmente — aquí ves cuánto tiempo lleva cada equipo (mismo semáforo: verde / tomate / rojo).</div>')+
      kpisHtml(itemsActuales(),vistaC)+
      '<div class="cbz-card-row" style="margin-bottom:10px">'+
      '<button class="chip '+(vistaC==='consig'?'on':'')+'" onclick="Consig.setV(\'consig\')">📦 Consignación ('+cli.consignacion.length+')</button>'+
      '<button class="chip '+(vistaC==='alq'?'on':'')+'" onclick="Consig.setV(\'alq\')">📡 Alquiler ('+(cli.alquiler||[]).length+')</button>'+
      '<button class="chip" onclick="Consig.descargar()">⬇ Descargar PDF</button>'+
      '</div>';
    if(vistaC==='consig'){
      h+=cli.consignacion.length?cli.consignacion.map(function(it,i){return itemCard(it,'c'+i,'consig');}).join(''):
        '<div class="cbz-muted" style="padding:14px;text-align:center">Sin productos en consignación.</div>';
    } else {
      h+=(cli.alquiler||[]).length?cli.alquiler.map(function(p,pi){
        return '<div class="cbz-card"><div class="cbz-card-name">📍 '+p.proyecto+'</div>'+
          p.items.map(function(it,i){return itemCard(it,'a'+pi+'-'+i,'alq');}).join('')+'</div>';
      }).join(''):'<div class="cbz-muted" style="padding:14px;text-align:center">Sin equipos en alquiler.</div>';
    }
    el.innerHTML=extBanner+h;
  }
  function descargar(){
    if(!data){alert('Aún no hay datos de consignación');return;}
    var cli=data.admin?data.clientes[cliSel]:data;
    var nombreCli=data.admin?cli.cliente:data.empresa;
    api({action:'getConsignacionPdf',cliente:nombreCli,vista:'ambos'}).then(function(res){
      if(!res.ok){alert(res.error||'No se pudo generar el PDF');return;}
      if(!res.b64){alert('El servidor no devolvió el PDF (sin datos). Reintenta o avisa a soporte.');return;}
      var hoyS=(function(){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Guayaquil'}).format(new Date());}catch(e){return new Date().toISOString().slice(0,10);}})();
      var safeCli=String(nombreCli||'Cliente').replace(/[\\\/:\*\?"<>\|]/g,' ').replace(/ +/g,' ').trim()||'Cliente';
      var fn=mcPdfFilename(res.filename, 'CONSIGNACIÓN Y ALQUILER - '+safeCli+' '+hoyS+'.pdf');
      return mcDownloadBlob(res.b64, fn);
    }).catch(function(e){alert(MCerr(e)+'.');});
  }
  function toggle(k){abiertos[k]=!abiertos[k];render();}
  function setCli(i){cliSel=i;abiertos={};render();}
  function setV(v){vistaC=v;abiertos={};render();}
  return {init:init,setV:setV,setCli:setCli,filterCli:filterCli,toggle:toggle,descargar:descargar,pedirExt:pedirExt,resolverExt:resolverExt};

})();

/* ===================== APROBACIONES (admin) ===================== */
var Sols = (function(){
  var pend=[], clientes=[];
  function api(p){
    p.user=getUserName();p.pin=getPin();
    return MCpost(p);
  }
  function norm(s){return String(s).toUpperCase().replace(/[ÁÉÍÓÚ]/g,function(c){return {'Á':'A','É':'E','Í':'I','Ó':'O','Ú':'U'}[c];}).replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
  function init(){
    var el=document.getElementById('sols-screen');
    el.innerHTML='<div class="cbz-loading">Cargando solicitudes...</div>';
    api({action:'listUsers'}).then(function(res){
      if(!res.ok){el.innerHTML='<div class="cbz-error">'+res.error+'</div>';return;}
      pend=res.usuarios.filter(function(u){return u.rol==='cliente'&&!u.aprobado&&(u.solicitud||u.master);});
      api({action:'getClientes'}).then(function(r2){clientes=r2.ok?r2.clientes:[];render();})
        .catch(function(){clientes=[];render();});
    }).catch(function(e){el.innerHTML='<div class="cbz-error">'+MCerr(e)+'</div>';});
  }
  function sugerencias(txt){
    if(!txt||txt.length<3||!clientes.length)return [];
    var toks=norm(txt).split(' ').filter(function(t){return t.length>=3;});
    if(!toks.length)return [];
    return clientes.filter(function(c){var n=norm(c);return toks.every(function(t){return n.indexOf(t)>=0;});}).slice(0,3);
  }
  function render(){
    var el=document.getElementById('sols-screen');
    if(!pend.length){
      el.innerHTML='<div class="cbz-card" style="text-align:center;padding:24px"><div style="font-size:34px">✅</div>'+
        '<div class="cbz-card-name" style="margin:8px 0">Sin solicitudes pendientes</div>'+
        '<div class="cbz-muted">Cuando un usuario máster solicite acceso al estado de cuenta, aparecerá aquí.</div></div>';
      return;
    }
    el.innerHTML=pend.map(function(u,i){
      var sugs=sugerencias(u.empresa);
      var exacta=u.empresa&&clientes.indexOf(u.empresa)>=0;
      return '<div class="cbz-card">'+
        '<div class="cbz-card-top"><div class="cbz-card-name">'+u.nombre+
        (u.master?' <span class="tagx" style="background:#3a2c1c;color:#f0c040">MÁSTER</span>':'')+
        (u.solicitud?' <span class="tagx tn">🔔 '+u.solicitud+'</span>':'')+'</div></div>'+
        '<div class="cbz-muted" style="margin:4px 0">Empresa declarada: <b>'+(u.empresa||'(no indicó)')+'</b>'+(exacta?' ✅ coincide con inFlow':'')+'</div>'+
        '<div class="cbz-card-row"><input class="uinput" id="s-emp-'+i+'" style="flex:1" placeholder="Empresa a vincular (nombre exacto)" value="'+String(u.empresa||'').replace(/"/g,'&quot;')+'"></div>'+
        (sugs.length&&!exacta?'<div class="cbz-card-row" style="flex-wrap:wrap">'+sugs.map(function(c){
          return '<button class="chip" onclick="document.getElementById(\'s-emp-'+i+'\').value=this.getAttribute(\'data-c\')" data-c="'+c.replace(/"/g,'&quot;')+'">'+c+'</button>';
        }).join('')+'</div>':'')+
        '<div class="cbz-card-row" style="margin-top:8px">'+
        '<button class="cbz-btn" onclick="Sols.aprobar('+i+',this)">✅ Aprobar acceso</button></div>'+
        '</div>';
    }).join('');
  }
  function aprobar(i,btn){
    var u=pend[i];
    var emp=(document.getElementById('s-emp-'+i).value||'').trim();
    if(!emp){alert('Vincula primero la empresa (usa las sugerencias).');return;}
    if(clientes.length&&clientes.indexOf(emp)<0&&!confirm('"'+emp+'" no coincide exacto con ningún cliente de inFlow. ¿Aprobar de todos modos? El estado de cuenta saldrá vacío hasta que coincida.'))return;
    if(btn){btn.disabled=true;btn.textContent='Aprobando...';}
    api({action:'saveUser',nombre:u.nombre,userPin:u.pin,rol:u.rol,modulos:u.modulos,
      activo:u.activo,empresa:emp,master:u.master,aprobado:true})
    .then(function(res){
      if(!res.ok){if(btn){btn.disabled=false;btn.textContent='✅ Aprobar acceso';}alert('Error: '+res.error);return;}
      alert('Aprobado. '+u.nombre+' y su organización ya tienen acceso al estado de cuenta.');
      init();
    }).catch(function(){if(btn){btn.disabled=false;btn.textContent='✅ Aprobar acceso';}alert('Sin conexión.');});
  }
  return {init:init,aprobar:aprobar};
})();


/* ===================== PROVEEDORES + ÓRDENES DE COMPRA (espejo inFlow) ===================== */
var Prov = (function(){
  var tab='vendors'; // vendors | ocs
  var lista=[], q='', vista='list', cur=null, saving=false;
  var ocLista=[], ocQ='', ocVista='list', ocCur=null, ocSaving=false;
  var vendorsCache=[], invCache=null, locs=[];
  function api(p){p.user=getUserName();p.pin=getPin();return MCpost(p);}
  function esc(s){return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function el(){return document.getElementById('prov-screen');}
  function money(n){var x=parseFloat(n);if(isNaN(x))return esc(n||'—');return x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function tabsHtml(){
    return '<div class="cbz-card-row" style="margin-bottom:12px;flex-wrap:wrap;gap:6px">'+
      '<button class="chip" style="'+(tab==='vendors'?'background:#1e4976;color:#fff':'')+'" onclick="Prov.setTab(\'vendors\')">🏭 Proveedores</button>'+
      '<button class="chip" style="'+(tab==='ocs'?'background:#1e4976;color:#fff':'')+'" onclick="Prov.setTab(\'ocs\')">🛒 Órdenes de compra</button></div>';
  }
  function setTab(t){
    tab=t||'vendors';
    if(tab==='vendors'){vista='list';cur=null;cargarVendors();}
    else {ocVista='list';ocCur=null;cargarOCs();}
  }
  function init(){tab='vendors';vista='list';cur=null;q='';ocVista='list';ocCur=null;ocQ='';cargarVendors();}

  /* ---------- Proveedores (existente) ---------- */
  function cargarVendors(){
    el().innerHTML=tabsHtml()+'<div class="cbz-loading">Cargando proveedores...</div>';
    api({action:'listVendors',q:q||undefined}).then(function(res){
      if(!res.ok){el().innerHTML=tabsHtml()+'<div class="cbz-error">'+esc(res.error)+'</div>';return;}
      lista=res.vendors||[];
      vendorsCache=lista.slice();
      if(vista==='list') renderVendorList(); else renderVendorForm();
    }).catch(function(e){el().innerHTML=tabsHtml()+'<div class="cbz-error">'+esc(MCerr(e))+'</div>';});
  }
  function setQ(v){q=v||'';}
  function buscar(){vista='list';cargarVendors();}
  function nuevo(){
    cur={vendorId:'',name:'',contactName:'',email:'',phone:'',website:'',isActive:true,remarks:'',discount:'',leadTimeDays:'',defaultPaymentMethod:''};
    vista='form';renderVendorForm();
  }
  function abrir(id){
    el().innerHTML=tabsHtml()+'<div class="cbz-loading">Cargando...</div>';
    api({action:'getVendor',vendorId:id}).then(function(res){
      if(!res.ok){alert(res.error||'Error');vista='list';renderVendorList();return;}
      cur=res.vendor;vista='form';renderVendorForm();
    }).catch(function(e){alert(MCerr(e));});
  }
  function volver(){vista='list';renderVendorList();}
  function renderVendorList(){
    var h=tabsHtml()+'<div class="cbz-card-row" style="margin-bottom:10px;flex-wrap:wrap">'+
      '<input class="uinput" id="prov-q" placeholder="Buscar proveedor..." value="'+esc(q)+'" style="flex:1;min-width:160px" onkeydown="if(event.key===\'Enter\')Prov.buscar()">'+
      '<button class="chip" onclick="Prov.setQ(document.getElementById(\'prov-q\').value);Prov.buscar()">🔎 Buscar</button>'+
      '<button class="cbz-btn" onclick="Prov.nuevo()">＋ Nuevo</button>'+
      '<button class="chip" onclick="Prov.cargar()">⟳</button></div>';
    if(!lista.length){
      h+='<div class="cbz-card" style="text-align:center;padding:24px"><div style="font-size:34px">🏭</div>'+
        '<div class="cbz-card-name" style="margin:8px 0">Sin proveedores</div>'+
        '<div class="cbz-muted">Crea el primero o ajusta la búsqueda.</div></div>';
    } else {
      h+=lista.map(function(v){
        return '<div class="cbz-card" style="cursor:pointer" onclick="Prov.abrir(\''+esc(v.vendorId)+'\')">'+
          '<div class="cbz-card-top"><div class="cbz-card-name">'+esc(v.name)+'</div>'+
          (v.isActive?'<span class="tagx tf">Activo</span>':'<span class="tagx tn">Inactivo</span>')+'</div>'+
          '<div class="pmeta">'+(esc(v.contactName)||'—')+(v.email?' · '+esc(v.email):'')+(v.phone?' · '+esc(v.phone):'')+'</div></div>';
      }).join('');
    }
    el().innerHTML=h;
  }
  function renderVendorForm(){
    var v=cur||{};
    var h=tabsHtml()+'<div class="cbz-card-row" style="margin-bottom:8px">'+
      '<button class="chip" onclick="Prov.volver()">← Lista</button>'+
      '<span class="cbz-muted">'+(v.vendorId?'Editar':'Nuevo proveedor')+'</span></div>'+
      '<div class="cbz-card"><div class="uform">'+
      '<input class="uinput" id="pv-name" placeholder="Nombre *" value="'+esc(v.name)+'">'+
      '<input class="uinput" id="pv-contact" placeholder="Contacto" value="'+esc(v.contactName)+'">'+
      '<input class="uinput" id="pv-email" placeholder="Email" value="'+esc(v.email)+'">'+
      '<input class="uinput" id="pv-phone" placeholder="Teléfono" value="'+esc(v.phone)+'">'+
      '<input class="uinput" id="pv-web" placeholder="Website" value="'+esc(v.website)+'">'+
      '<div class="cbz-card-row">'+
      '<input class="uinput" id="pv-disc" placeholder="Descuento %" value="'+esc(v.discount)+'" style="max-width:120px">'+
      '<input class="uinput" id="pv-lead" placeholder="Lead time (días)" value="'+(v.leadTimeDays!=null?esc(v.leadTimeDays):'')+'" style="max-width:140px" inputmode="numeric">'+
      '<input class="uinput" id="pv-pay" placeholder="Método de pago" value="'+esc(v.defaultPaymentMethod)+'"></div>'+
      '<textarea class="uinput" id="pv-rem" placeholder="Observaciones" rows="3">'+esc(v.remarks)+'</textarea>'+
      '<label class="cbz-esc"><input type="checkbox" id="pv-act" '+(v.isActive!==false?'checked':'')+'> Activo</label>'+
      '<div class="cbz-card-row"><button class="cbz-btn" id="pv-save" onclick="Prov.guardar()">Guardar en inFlow</button></div>'+
      '</div></div>';
    el().innerHTML=h;
  }
  function guardar(){
    if(saving)return;
    var name=(document.getElementById('pv-name').value||'').trim();
    if(!name){alert('El nombre es obligatorio');return;}
    var payload={
      action:'saveVendor',
      vendorId:cur&&cur.vendorId||'',
      name:name,
      contactName:(document.getElementById('pv-contact').value||'').trim(),
      email:(document.getElementById('pv-email').value||'').trim(),
      phone:(document.getElementById('pv-phone').value||'').trim(),
      website:(document.getElementById('pv-web').value||'').trim(),
      discount:(document.getElementById('pv-disc').value||'').trim(),
      leadTimeDays:(document.getElementById('pv-lead').value||'').trim(),
      defaultPaymentMethod:(document.getElementById('pv-pay').value||'').trim(),
      remarks:(document.getElementById('pv-rem').value||'').trim(),
      isActive:!!document.getElementById('pv-act').checked
    };
    saving=true;
    var btn=document.getElementById('pv-save');
    if(btn){btn.disabled=true;btn.textContent='Guardando...';}
    api(payload).then(function(res){
      saving=false;
      if(!res.ok){if(btn){btn.disabled=false;btn.textContent='Guardar en inFlow';}alert(res.error||'Error');return;}
      alert(res.created?'Proveedor creado en inFlow.':'Proveedor actualizado.');
      vista='list';q='';cargarVendors();
    }).catch(function(e){
      saving=false;
      if(btn){btn.disabled=false;btn.textContent='Guardar en inFlow';}
      alert(MCerr(e));
    });
  }
  function cargar(){if(tab==='ocs')cargarOCs();else cargarVendors();}

  /* ---------- Órdenes de compra ---------- */
  function ensureVendors(cb){
    if(vendorsCache.length){cb();return;}
    api({action:'listVendors'}).then(function(res){
      vendorsCache=res.ok?(res.vendors||[]):[];
      cb();
    }).catch(function(){vendorsCache=[];cb();});
  }
  function ensureLocs(cb){
    if(locs.length){cb();return;}
    api({action:'listLocations'}).then(function(res){
      locs=res.ok?(res.locations||[]).filter(function(l){return l.isActive!==false;}):[];
      cb();
    }).catch(function(){locs=[];cb();});
  }
  function loadInvSuggest(cb){
    if(invCache){cb();return;}
    api({action:'getInventario'}).then(function(res){
      invCache=res.ok?(res.items||[]):[];
      cb();
    }).catch(function(){invCache=[];cb();});
  }
  function setOcQ(v){ocQ=v||'';}
  function buscarOC(){ocVista='list';cargarOCs();}
  function cargarOCs(){
    el().innerHTML=tabsHtml()+'<div class="cbz-loading">Cargando órdenes de compra...</div>';
    api({action:'listPurchaseOrders',q:ocQ||undefined}).then(function(res){
      if(!res.ok){el().innerHTML=tabsHtml()+'<div class="cbz-error">'+esc(res.error)+'</div>';return;}
      ocLista=res.purchaseOrders||[];
      if(ocVista==='list') renderOcList(); else renderOcForm();
    }).catch(function(e){el().innerHTML=tabsHtml()+'<div class="cbz-error">'+esc(MCerr(e))+'</div>';});
  }
  function statusTags(po){
    var tags=[];
    if(po.isCancelled) tags.push('<span class="tagx tn">Cancelada</span>');
    else if(po.isCompleted) tags.push('<span class="tagx tf">Completada</span>');
    if(po.isQuote) tags.push('<span class="tagx">Cotización</span>');
    if(po.inventoryStatus) tags.push('<span class="tagx">Inv: '+esc(po.inventoryStatus)+'</span>');
    if(po.paymentStatus) tags.push('<span class="tagx">Pago: '+esc(po.paymentStatus)+'</span>');
    return tags.join(' ');
  }
  function renderOcList(){
    var h=tabsHtml()+'<div class="cbz-card-row" style="margin-bottom:10px;flex-wrap:wrap">'+
      '<input class="uinput" id="oc-q" placeholder="Buscar OC / proveedor..." value="'+esc(ocQ)+'" style="flex:1;min-width:160px" onkeydown="if(event.key===\'Enter\')Prov.buscarOC()">'+
      '<button class="chip" onclick="Prov.setOcQ(document.getElementById(\'oc-q\').value);Prov.buscarOC()">🔎 Buscar</button>'+
      '<button class="cbz-btn" onclick="Prov.nuevaOC()">＋ Nueva OC</button>'+
      '<button class="chip" onclick="Prov.cargarOCs()">⟳</button></div>';
    if(!ocLista.length){
      h+='<div class="cbz-card" style="text-align:center;padding:24px"><div style="font-size:34px">🛒</div>'+
        '<div class="cbz-card-name" style="margin:8px 0">Sin órdenes de compra</div>'+
        '<div class="cbz-muted">Crea la primera o ajusta la búsqueda.</div></div>';
    } else {
      h+=ocLista.map(function(po){
        return '<div class="cbz-card" style="cursor:pointer" onclick="Prov.abrirOC(\''+esc(po.purchaseOrderId)+'\')">'+
          '<div class="cbz-card-top"><div class="cbz-card-name">'+(esc(po.orderNumber)||'(sin número)')+'</div>'+
          statusTags(po)+'</div>'+
          '<div class="pmeta">'+(esc(po.orderDate)||'—')+' · '+esc(po.vendorName||'?')+
          ' · Total '+money(po.total)+' · Saldo '+money(po.balance)+
          ' · '+(po.linesCount||0)+' líneas</div></div>';
      }).join('');
    }
    el().innerHTML=h;
  }
  function vendorOpts(sel){
    return '<option value="">— Proveedor * —</option>'+vendorsCache.map(function(v){
      return '<option value="'+esc(v.vendorId)+'"'+(sel===v.vendorId?' selected':'')+'>'+esc(v.name)+'</option>';
    }).join('');
  }
  function locOpts(sel){
    return '<option value="">— Bodega (opc.) —</option>'+locs.map(function(l){
      return '<option value="'+esc(l.locationId)+'"'+(sel===l.locationId?' selected':'')+'>'+esc(l.name)+'</option>';
    }).join('');
  }
  function nuevaOC(){
    ensureVendors(function(){
      ensureLocs(function(){
        ocCur={purchaseOrderId:'',vendorId:'',orderDate:new Date().toISOString().slice(0,10),
          requestShipDate:'',orderRemarks:'',locationId:'',paymentTermsId:'',isQuote:false,
          lines:[{productId:'',quantity:1,unitPrice:'',description:''}]};
        ocVista='form';renderOcForm();
      });
    });
  }
  function abrirOC(id){
    el().innerHTML=tabsHtml()+'<div class="cbz-loading">Cargando OC...</div>';
    ensureVendors(function(){
      ensureLocs(function(){
        api({action:'getPurchaseOrder',purchaseOrderId:id}).then(function(res){
          if(!res.ok){alert(res.error||'Error');ocVista='list';renderOcList();return;}
          ocCur=res.purchaseOrder;
          if(!ocCur.lines||!ocCur.lines.length)ocCur.lines=[{productId:'',quantity:1,unitPrice:'',description:''}];
          ocVista='form';renderOcForm();
        }).catch(function(e){alert(MCerr(e));});
      });
    });
  }
  function volverOC(){ocVista='list';renderOcList();}
  function ocLineRow(ln,i){
    return '<div class="cbz-card" style="padding:10px" id="ol-'+i+'">'+
      '<div class="cbz-card-row" style="flex-wrap:wrap">'+
      '<input class="uinput" id="ol-pid-'+i+'" placeholder="productId (UUID) o SKU" value="'+esc(ln.productId)+'" style="flex:2;min-width:160px" list="ol-prod-dl">'+
      '<input class="uinput" id="ol-qty-'+i+'" type="number" min="0.0001" step="any" placeholder="Cant." value="'+esc(ln.quantity)+'" style="max-width:90px">'+
      '<input class="uinput" id="ol-price-'+i+'" type="number" min="0" step="any" placeholder="P. unit." value="'+esc(ln.unitPrice)+'" style="max-width:110px">'+
      '<button class="chip" onclick="Prov.rmOcLine('+i+')" title="Quitar">✖</button></div>'+
      '<input class="uinput" id="ol-desc-'+i+'" placeholder="Descripción (opc.)" value="'+esc(ln.description||'')+'" style="margin-top:6px">'+
      '</div>';
  }
  function renderOcForm(){
    loadInvSuggest(function(){
      var po=ocCur||{};
      var dl='<datalist id="ol-prod-dl">'+(invCache||[]).slice(0,800).map(function(it){
        var pid=it.productId||it.id||'';
        if(!pid)return '';
        return '<option value="'+esc(pid)+'">'+esc((it.sku||'')+' — '+(it.nombre||it.name||''))+'</option>';
      }).join('')+'</datalist>';
      var h=tabsHtml()+'<div class="cbz-card-row" style="margin-bottom:8px;flex-wrap:wrap">'+
        '<button class="chip" onclick="Prov.volverOC()">← Lista OCs</button>'+
        '<span class="cbz-muted">'+(po.purchaseOrderId?(esc(po.orderNumber)||'Editar OC'):'Nueva orden de compra')+'</span>'+
        (po.purchaseOrderId?statusTags(po):'')+'</div>'+
        '<div class="cbz-card"><div class="uform">'+
        '<select class="uinput" id="oc-vendor">'+vendorOpts(po.vendorId)+'</select>'+
        '<div class="cbz-card-row" style="flex-wrap:wrap">'+
        '<input class="uinput" id="oc-date" type="date" value="'+esc(po.orderDate||'')+'" style="max-width:160px">'+
        '<input class="uinput" id="oc-ship" type="date" value="'+esc(po.requestShipDate||'')+'" style="max-width:160px" title="Fecha envío solicitada">'+
        '<select class="uinput" id="oc-loc" style="flex:1;min-width:140px">'+locOpts(po.locationId)+'</select></div>'+
        '<textarea class="uinput" id="oc-rem" placeholder="Observaciones / orderRemarks" rows="2">'+esc(po.orderRemarks||'')+'</textarea>'+
        '<label class="cbz-esc"><input type="checkbox" id="oc-quote" '+(po.isQuote?'checked':'')+'> Es cotización (isQuote)</label>'+
        (po.total||po.balance?'<div class="pmeta" style="margin:6px 0">Total '+money(po.total)+' · Saldo '+money(po.balance)+(po.paymentTermsName?' · '+esc(po.paymentTermsName):'')+'</div>':'')+
        '<div class="cbz-card-name" style="margin:10px 0 6px">Líneas</div>'+
        '<div id="oc-lines">'+(po.lines||[]).map(ocLineRow).join('')+'</div>'+
        '<div class="cbz-card-row" style="margin-top:8px;flex-wrap:wrap">'+
        '<button class="chip" onclick="Prov.addOcLine()">＋ Línea</button>'+
        '<button class="cbz-btn" id="oc-save" onclick="Prov.guardarOC()">Guardar en inFlow</button>'+
        (po.purchaseOrderId&&!po.isCancelled?'<button class="chip" id="oc-approve" onclick="Prov.aprobarOC()">✅ Aprobar</button>':'')+
        (po.purchaseOrderId&&!po.isCancelled?'<button class="chip" id="oc-cancel" onclick="Prov.cancelarOC()">✖ Cancelar</button>':'')+
        '</div>'+dl+
        '<div class="cbz-muted" style="font-size:11px;margin-top:8px">MVP: productId libre (UUID). Datalist sugiere SKU→id si hay inventario. Totales los calcula inFlow.</div>'+
        '</div></div>';
      el().innerHTML=h;
    });
  }
  function collectOcLines(){
    var out=[], i=0;
    while(document.getElementById('ol-pid-'+i)){
      var pid=(document.getElementById('ol-pid-'+i).value||'').trim();
      var qty=parseFloat(document.getElementById('ol-qty-'+i).value);
      var price=(document.getElementById('ol-price-'+i).value||'').trim();
      var desc=(document.getElementById('ol-desc-'+i).value||'').trim();
      var prev=(ocCur.lines&&ocCur.lines[i])||{};
      if(pid && invCache){
        var hit=null;
        for(var j=0;j<invCache.length;j++){
          var it=invCache[j];
          var id=String(it.productId||it.id||'');
          if(id===pid || String(it.sku||'')===pid){hit=id||pid;break;}
        }
        if(hit)pid=hit;
      }
      out.push({
        purchaseOrderLineId:prev.purchaseOrderLineId||'',
        productId:pid,
        quantity:qty,
        unitPrice:price,
        description:desc
      });
      i++;
    }
    return out;
  }
  function snapOcHeader(){
    ocCur.vendorId=document.getElementById('oc-vendor').value;
    ocCur.orderDate=document.getElementById('oc-date').value;
    ocCur.requestShipDate=document.getElementById('oc-ship').value;
    ocCur.locationId=document.getElementById('oc-loc').value;
    ocCur.orderRemarks=document.getElementById('oc-rem').value;
    ocCur.isQuote=document.getElementById('oc-quote').checked;
  }
  function addOcLine(){
    ocCur.lines=collectOcLines();
    ocCur.lines.push({productId:'',quantity:1,unitPrice:'',description:''});
    snapOcHeader();
    renderOcForm();
  }
  function rmOcLine(i){
    ocCur.lines=collectOcLines();
    ocCur.lines.splice(i,1);
    if(!ocCur.lines.length)ocCur.lines=[{productId:'',quantity:1,unitPrice:'',description:''}];
    snapOcHeader();
    renderOcForm();
  }
  function guardarOC(){
    if(ocSaving)return;
    var vendorId=document.getElementById('oc-vendor').value;
    if(!vendorId){alert('Elige un proveedor');return;}
    var lines=collectOcLines().filter(function(l){return l.productId&&l.quantity>0;});
    if(!lines.length){alert('Agrega al menos una línea con productId y cantidad');return;}
    var payload={
      action:'savePurchaseOrder',
      purchaseOrderId:ocCur&&ocCur.purchaseOrderId||'',
      vendorId:vendorId,
      orderDate:document.getElementById('oc-date').value||undefined,
      requestShipDate:document.getElementById('oc-ship').value||'',
      locationId:document.getElementById('oc-loc').value||'',
      orderRemarks:document.getElementById('oc-rem').value||'',
      isQuote:!!document.getElementById('oc-quote').checked,
      lines:lines
    };
    ocSaving=true;
    var btn=document.getElementById('oc-save');
    if(btn){btn.disabled=true;btn.textContent='Guardando...';}
    api(payload).then(function(res){
      ocSaving=false;
      if(!res.ok){if(btn){btn.disabled=false;btn.textContent='Guardar en inFlow';}alert(res.error||'Error');return;}
      alert(res.created?'OC creada en inFlow.':'OC actualizada.');
      ocVista='list';ocQ='';cargarOCs();
    }).catch(function(e){
      ocSaving=false;
      if(btn){btn.disabled=false;btn.textContent='Guardar en inFlow';}
      alert(MCerr(e));
    });
  }
  function cancelarOC(){
    if(!ocCur||!ocCur.purchaseOrderId)return;
    if(!confirm('¿Cancelar esta OC en inFlow (quick-cancel)?'))return;
    var btn=document.getElementById('oc-cancel');
    if(btn){btn.disabled=true;btn.textContent='Cancelando...';}
    api({action:'cancelPurchaseOrder',purchaseOrderId:ocCur.purchaseOrderId}).then(function(res){
      if(!res.ok){if(btn){btn.disabled=false;btn.textContent='✖ Cancelar';}alert(res.error||'Error');return;}
      alert('OC cancelada.');
      ocVista='list';cargarOCs();
    }).catch(function(e){if(btn){btn.disabled=false;btn.textContent='✖ Cancelar';}alert(MCerr(e));});
  }
  function aprobarOC(){
    if(!ocCur||!ocCur.purchaseOrderId)return;
    if(!confirm('¿Aprobar esta OC en inFlow (quick-approve)?'))return;
    var btn=document.getElementById('oc-approve');
    if(btn){btn.disabled=true;btn.textContent='Aprobando...';}
    api({action:'approvePurchaseOrder',purchaseOrderId:ocCur.purchaseOrderId}).then(function(res){
      if(!res.ok){if(btn){btn.disabled=false;btn.textContent='✅ Aprobar';}alert(res.error||'Error');return;}
      alert('OC aprobada.');
      abrirOC(ocCur.purchaseOrderId);
    }).catch(function(e){if(btn){btn.disabled=false;btn.textContent='✅ Aprobar';}alert(MCerr(e));});
  }

  return {
    init:init,cargar:cargar,buscar:buscar,setQ:setQ,nuevo:nuevo,abrir:abrir,volver:volver,guardar:guardar,
    setTab:setTab,cargarOCs:cargarOCs,buscarOC:buscarOC,setOcQ:setOcQ,nuevaOC:nuevaOC,abrirOC:abrirOC,
    volverOC:volverOC,addOcLine:addOcLine,rmOcLine:rmOcLine,guardarOC:guardarOC,cancelarOC:cancelarOC,aprobarOC:aprobarOC
  };
})();

/* ===================== STOCK TRANSFERS (espejo inFlow) ===================== */
var Transf = (function(){
  var lista=[], locs=[], vista='list', cur=null, saving=false, invCache=null;
  function api(p){p.user=getUserName();p.pin=getPin();return MCpost(p);}
  function esc(s){return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function el(){return document.getElementById('transf-screen');}
  function init(){vista='list';cur=null;cargar();}
  function ensureLocs(cb){
    if(locs.length){cb();return;}
    api({action:'listLocations'}).then(function(res){
      locs=res.ok?(res.locations||[]).filter(function(l){return l.isActive!==false;}):[];
      cb();
    }).catch(function(){locs=[];cb();});
  }
  function cargar(){
    el().innerHTML='<div class="cbz-loading">Cargando transfers...</div>';
    ensureLocs(function(){
      api({action:'listStockTransfers'}).then(function(res){
        if(!res.ok){el().innerHTML='<div class="cbz-error">'+esc(res.error)+'</div>';return;}
        lista=res.transfers||[];
        if(vista==='list') renderList(); else renderForm();
      }).catch(function(e){el().innerHTML='<div class="cbz-error">'+esc(MCerr(e))+'</div>';});
    });
  }
  function locOpts(sel){
    return '<option value="">— Bodega —</option>'+locs.map(function(l){
      return '<option value="'+esc(l.locationId)+'"'+(sel===l.locationId?' selected':'')+'>'+esc(l.name)+'</option>';
    }).join('');
  }
  function nuevo(){
    ensureLocs(function(){
      cur={stockTransferId:'',fromLocationId:'',toLocationId:'',transferDate:new Date().toISOString().slice(0,10),
        status:'Open',remarks:'',isCancelled:false,lines:[{productId:'',quantity:1,fromSublocation:'',toSublocation:''}],cliente:''};
      vista='form';renderForm();
    });
  }
  function abrir(id){
    el().innerHTML='<div class="cbz-loading">Cargando...</div>';
    ensureLocs(function(){
      api({action:'getStockTransfer',stockTransferId:id}).then(function(res){
        if(!res.ok){alert(res.error||'Error');vista='list';renderList();return;}
        cur=res.transfer;
        if(!cur.lines||!cur.lines.length)cur.lines=[{productId:'',quantity:1}];
        var cf=cur.customFields||{};
        cur.cliente=cf.custom1||'';
        vista='form';renderForm();
      }).catch(function(e){alert(MCerr(e));});
    });
  }
  function volver(){vista='list';renderList();}
  function renderList(){
    var h='<div class="cbz-card-row" style="margin-bottom:10px;flex-wrap:wrap">'+
      '<button class="cbz-btn" onclick="Transf.nuevo()">＋ Nuevo transfer</button>'+
      '<button class="chip" onclick="Transf.cargar()">⟳</button>'+
      '<span class="cbz-muted">'+(lista.length||0)+' recientes</span></div>';
    if(!lista.length){
      h+='<div class="cbz-card" style="text-align:center;padding:24px"><div style="font-size:34px">🔁</div>'+
        '<div class="cbz-card-name" style="margin:8px 0">Sin transfers</div></div>';
    } else {
      h+=lista.map(function(t){
        return '<div class="cbz-card" style="cursor:pointer" onclick="Transf.abrir(\''+esc(t.stockTransferId)+'\')">'+
          '<div class="cbz-card-top"><div class="cbz-card-name">'+(esc(t.transferNumber)||'(sin número)')+'</div>'+
          '<span class="tagx">'+(t.isCancelled?'Cancelado':esc(t.status||'—'))+'</span></div>'+
          '<div class="pmeta">'+(esc(t.transferDate)||'—')+' · '+esc(t.fromLocationName||'?')+' → '+esc(t.toLocationName||'?')+
          ' · '+(t.linesCount||0)+' líneas · qty '+(t.qtyTotal||0)+'</div>'+
          (t.remarks?'<div class="cbz-muted" style="font-size:11px;margin-top:4px">'+esc(t.remarks).slice(0,120)+'</div>':'')+
          '</div>';
      }).join('');
    }
    el().innerHTML=h;
  }
  function lineRow(ln,i){
    return '<div class="cbz-card" style="padding:10px" id="tl-'+i+'">'+
      '<div class="cbz-card-row" style="flex-wrap:wrap">'+
      '<input class="uinput" id="tl-pid-'+i+'" placeholder="productId (UUID) o SKU" value="'+esc(ln.productId)+'" style="flex:2;min-width:160px" list="tl-prod-dl">'+
      '<input class="uinput" id="tl-qty-'+i+'" type="number" min="0.0001" step="any" placeholder="Cant." value="'+esc(ln.quantity)+'" style="max-width:100px">'+
      '<button class="chip" onclick="Transf.rmLine('+i+')" title="Quitar">✖</button></div>'+
      '<div class="cbz-card-row" style="margin-top:6px">'+
      '<input class="uinput" id="tl-fs-'+i+'" placeholder="Subloc origen" value="'+esc(ln.fromSublocation||'')+'" style="max-width:160px">'+
      '<input class="uinput" id="tl-ts-'+i+'" placeholder="Subloc destino" value="'+esc(ln.toSublocation||'')+'" style="max-width:160px">'+
      '</div></div>';
  }
  function loadInvSuggest(cb){
    if(invCache){cb();return;}
    api({action:'getInventario'}).then(function(res){
      invCache=res.ok?(res.items||[]):[];
      cb();
    }).catch(function(){invCache=[];cb();});
  }
  function renderForm(){
    loadInvSuggest(function(){
      var t=cur||{};
      var dl='<datalist id="tl-prod-dl">'+(invCache||[]).slice(0,800).map(function(it){
        var pid=it.productId||it.id||'';
        if(!pid)return '';
        return '<option value="'+esc(pid)+'">'+esc((it.sku||'')+' — '+(it.nombre||it.name||''))+'</option>';
      }).join('')+'</datalist>';
      var h='<div class="cbz-card-row" style="margin-bottom:8px">'+
        '<button class="chip" onclick="Transf.volver()">← Lista</button>'+
        '<span class="cbz-muted">'+(t.stockTransferId?(esc(t.transferNumber)||'Editar'):'Nuevo transfer')+'</span></div>'+
        '<div class="cbz-card"><div class="uform">'+
        '<div class="cbz-card-row" style="flex-wrap:wrap">'+
        '<select class="uinput" id="tf-from" style="flex:1;min-width:140px">'+locOpts(t.fromLocationId)+'</select>'+
        '<span style="align-self:center">→</span>'+
        '<select class="uinput" id="tf-to" style="flex:1;min-width:140px">'+locOpts(t.toLocationId)+'</select></div>'+
        '<div class="cbz-card-row" style="flex-wrap:wrap">'+
        '<input class="uinput" id="tf-date" type="date" value="'+esc(t.transferDate||'')+'" style="max-width:160px">'+
        '<select class="uinput" id="tf-status" style="max-width:160px">'+
        ['Open','InTransit','Completed'].map(function(s){return '<option'+(t.status===s?' selected':'')+'>'+s+'</option>';}).join('')+
        '</select>'+
        '<input class="uinput" id="tf-cli" placeholder="Cliente (custom)" value="'+esc(t.cliente||'')+'" style="flex:1;min-width:120px"></div>'+
        '<textarea class="uinput" id="tf-rem" placeholder="Observaciones" rows="2">'+esc(t.remarks||'')+'</textarea>'+
        '<label class="cbz-esc"><input type="checkbox" id="tf-cancel" '+(t.isCancelled?'checked':'')+'> Cancelado</label>'+
        '<div class="cbz-card-name" style="margin:10px 0 6px">Líneas</div>'+
        '<div id="tf-lines">'+(t.lines||[]).map(lineRow).join('')+'</div>'+
        '<div class="cbz-card-row" style="margin-top:8px">'+
        '<button class="chip" onclick="Transf.addLine()">＋ Línea</button>'+
        '<button class="cbz-btn" id="tf-save" onclick="Transf.guardar()">Guardar en inFlow</button></div>'+
        dl+
        '<div class="cbz-muted" style="font-size:11px;margin-top:8px">MVP: productId libre (UUID). Si cargó inventario, el datalist sugiere SKU→id.</div>'+
        '</div></div>';
      el().innerHTML=h;
    });
  }
  function collectLines(){
    var out=[], i=0;
    while(document.getElementById('tl-pid-'+i)){
      var pid=(document.getElementById('tl-pid-'+i).value||'').trim();
      var qty=parseFloat(document.getElementById('tl-qty-'+i).value);
      var fs=(document.getElementById('tl-fs-'+i).value||'').trim();
      var ts=(document.getElementById('tl-ts-'+i).value||'').trim();
      var prev=(cur.lines&&cur.lines[i])||{};
      // si escribieron SKU, resolver a productId desde cache
      if(pid && invCache){
        var hit=null;
        for(var j=0;j<invCache.length;j++){
          var it=invCache[j];
          var id=String(it.productId||it.id||'');
          if(id===pid || String(it.sku||'')===pid){hit=id||pid;break;}
        }
        if(hit)pid=hit;
      }
      out.push({
        stockTransferLineId:prev.stockTransferLineId||'',
        productId:pid,
        quantity:qty,
        fromSublocation:fs,
        toSublocation:ts
      });
      i++;
    }
    return out;
  }
  function addLine(){
    cur.lines=collectLines();
    cur.lines.push({productId:'',quantity:1,fromSublocation:'',toSublocation:''});
    // preserve header fields
    cur.fromLocationId=document.getElementById('tf-from').value;
    cur.toLocationId=document.getElementById('tf-to').value;
    cur.transferDate=document.getElementById('tf-date').value;
    cur.status=document.getElementById('tf-status').value;
    cur.remarks=document.getElementById('tf-rem').value;
    cur.cliente=document.getElementById('tf-cli').value;
    cur.isCancelled=document.getElementById('tf-cancel').checked;
    renderForm();
  }
  function rmLine(i){
    cur.lines=collectLines();
    cur.lines.splice(i,1);
    if(!cur.lines.length)cur.lines=[{productId:'',quantity:1}];
    cur.fromLocationId=document.getElementById('tf-from').value;
    cur.toLocationId=document.getElementById('tf-to').value;
    cur.transferDate=document.getElementById('tf-date').value;
    cur.status=document.getElementById('tf-status').value;
    cur.remarks=document.getElementById('tf-rem').value;
    cur.cliente=document.getElementById('tf-cli').value;
    cur.isCancelled=document.getElementById('tf-cancel').checked;
    renderForm();
  }
  function guardar(){
    if(saving)return;
    var fromId=document.getElementById('tf-from').value;
    var toId=document.getElementById('tf-to').value;
    if(!fromId||!toId){alert('Elige bodega origen y destino');return;}
    if(fromId===toId){alert('Origen y destino deben ser distintos');return;}
    var lines=collectLines().filter(function(l){return l.productId&&l.quantity>0;});
    if(!lines.length){alert('Agrega al menos una línea con productId y cantidad');return;}
    var payload={
      action:'saveStockTransfer',
      stockTransferId:cur&&cur.stockTransferId||'',
      fromLocationId:fromId,
      toLocationId:toId,
      transferDate:document.getElementById('tf-date').value||undefined,
      status:document.getElementById('tf-status').value,
      remarks:document.getElementById('tf-rem').value||'',
      isCancelled:!!document.getElementById('tf-cancel').checked,
      cliente:(document.getElementById('tf-cli').value||'').trim(),
      lines:lines
    };
    saving=true;
    var btn=document.getElementById('tf-save');
    if(btn){btn.disabled=true;btn.textContent='Guardando...';}
    api(payload).then(function(res){
      saving=false;
      if(!res.ok){if(btn){btn.disabled=false;btn.textContent='Guardar en inFlow';}alert(res.error||'Error');return;}
      alert(res.created?'Transfer creado en inFlow.':'Transfer actualizado.');
      vista='list';cargar();
    }).catch(function(e){
      saving=false;
      if(btn){btn.disabled=false;btn.textContent='Guardar en inFlow';}
      alert(MCerr(e));
    });
  }
  return {init:init,cargar:cargar,nuevo:nuevo,abrir:abrir,volver:volver,addLine:addLine,rmLine:rmLine,guardar:guardar};
})();

(function mcHomeDragInit(){
  var dragEl=null, moved=false, startX=0, startY=0;
  function tileFrom(el){
    if(!el||!el.closest)return null;
    return el.closest('#home.home-edit .mod[data-mod-id]');
  }
  document.addEventListener('pointerdown',function(e){
    if(!window._mcHomeEdit)return;
    var t=tileFrom(e.target);
    if(!t)return;
    dragEl=t; moved=false; startX=e.clientX; startY=e.clientY;
    try{t.setPointerCapture(e.pointerId);}catch(err){}
    t.classList.add('dragging');
    e.preventDefault();
  },{passive:false});
  document.addEventListener('pointermove',function(e){
    if(!dragEl||!window._mcHomeEdit)return;
    var dx=e.clientX-startX, dy=e.clientY-startY;
    if(!moved&&Math.abs(dx)+Math.abs(dy)<6)return;
    moved=true;
    var home=document.getElementById('home');
    if(!home)return;
    dragEl.style.visibility='hidden';
    var under=document.elementFromPoint(e.clientX,e.clientY);
    dragEl.style.visibility='';
    var target=under&&under.closest?under.closest('#home .mod[data-mod-id]'):null;
    if(target&&target!==dragEl&&target.parentNode===home){
      var rect=target.getBoundingClientRect();
      var before=(e.clientY<rect.top+rect.height/2)||(Math.abs(e.clientY-(rect.top+rect.height/2))<rect.height/3&&e.clientX<rect.left+rect.width/2);
      if(before){if(target.previousElementSibling!==dragEl)home.insertBefore(dragEl,target);}
      else{if(target.nextElementSibling!==dragEl)home.insertBefore(dragEl,target.nextElementSibling);}
    }
    e.preventDefault();
  },{passive:false});
  function endDrag(){
    if(!dragEl)return;
    dragEl.classList.remove('dragging');
    if(moved&&window._mcHomeEdit) mcSaveOrderFromDom();
    dragEl=null; moved=false;
  }
  document.addEventListener('pointerup',endDrag);
  document.addEventListener('pointercancel',endDrag);
})();

var Landing = (function(){
  var tab='hoy', custWin='l12m', data=null, mountEl=null;
  function fmt(n){n=parseFloat(n)||0;var p=n.toFixed(2).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return '$'+p.join('.');}
  function pct(f){if(f===null||f===undefined||isNaN(f))return 'n/d';return (Math.round(f*1000)/10).toFixed(1)+'%';}
  function pp(n){if(n===null||n===undefined||isNaN(n))return 'n/d';var s=n>0?'+':'';return s+(Math.round(n*10)/10).toFixed(1)+' pp';}
  function deltaCls(n){if(n===null||n===undefined||n===0)return 'flat';return n>0?'up':'down';}
  function deltaPctTxt(f){if(f===null||f===undefined)return 'n/d';var s=f>0?'+':'';return s+pct(f);}
  function kpi(lbl,num,sub){return '<div class="land-kpi"><div class="lbl">'+lbl+'</div><div class="num">'+num+'</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>';}
  function metricsBlock(m,title){
    if(!m)return '';
    return '<div class="land-sec">'+title+'</div><div class="land-kpis">'+
      kpi('Subtotal',fmt(m.subTotal),'Ticket '+fmt(m.aov))+
      kpi('IVA',fmt(m.iva),m.orders+' órdenes')+
      kpi('Total',fmt(m.total),m.customers+' clientes')+
      kpi('Margen',fmt(m.margin),pct(m.marginPct)+' · est.')+
      '</div>';
  }
  function compareBlock(block,label){
    if(!block||!block.current)return '';
    var d=block;

  function loadClientes(){
    loading=true; loadErr=''; clientes=[]; phase='list'; selected=null; lastUrl=''; paint();
    var finished=false;
    function finish(arr, err){
      if(finished)return;
      finished=true;
      loading=false;
      loadErr=err||'';
      applyNames(arr||[]);
      if(!clientes.length && !loadErr) loadErr='La lista vino vacía.';
      /* Solo repinta el cuerpo si el shell sigue en list; si no, paint completo */
      if(phase==='list' && document.getElementById('liq-list-body')) paintListBody();
      else if(phase==='list') paint();
    }
    var cached=(MCWarm.getClientes()||[]);
    if(cached.length){
      loading=false;
      applyNames(cached);
      if(phase==='list'&&document.getElementById('liq-list-body'))paintListBody();
    }
    var to=setTimeout(function(){
      if(!finished) finish(cached.length?cached:LIQ_PILOTO_FALLBACK.map(function(p){return p.name;}), cached.length?'':'Tardó demasiado; mostrando piloto. Reintentá para la lista completa.');
    }, 25000);
    MCWarm.loadClientes(false)
    .then(function(list){
      clearTimeout(to);
      if(list&&list.length){finish(list);return;}
      finish(cached.length?cached:LIQ_PILOTO_FALLBACK.map(function(p){return p.name;}), cached.length?'':'La lista vino vacía.');
    })
    .catch(function(e){
      clearTimeout(to);
      finish(cached.length?cached:LIQ_PILOTO_FALLBACK.map(function(p){return p.name;}), cached.length?'':((e&&e.message)||'Error de red'));
    });
  }
  function onSearch(v){ /* legacy no-op; input listener handles it */ q=v||''; paintListBody(); }
  function backToList(){clearAiTimers();phase='list';selected=null;lastUrl='';busy=false;paint();}
  function waitMin(ms){return new Promise(function(res){setTimeout(res,ms);});}
  function pickB64(b64){try{pick(decodeURIComponent(escape(atob(b64))));}catch(e){}}
  function pick(name){
    if(busy)return;
    name=String(name||'').trim();
    if(!name)return;
    busy=true; selected=name; phase='loading'; lastUrl=''; paint();
    startAiExtras();
    var t0=Date.now();
    var minMs=1500;
    function finishOk(token,url){
      clearAiTimers();
      lastUrl=url||urlFor(token);
      phase='ready'; busy=false; paint();
    }
    function finishErr(msg){
      clearAiTimers();
      lastUrl=msg||'No se pudo preparar el link para este cliente.';
      phase='error'; busy=false; paint();
    }
    function afterMin(fn){
      var left=Math.max(0, minMs-(Date.now()-t0));
      return waitMin(left).then(fn);
    }
    function mapErr(res,isTimeout){
      if(isTimeout) return 'La preparación está tardando más de lo esperado (cerca de 2–3 minutos). Podés volver e intentar de nuevo.';
      var err=(res&&res.error)?String(res.error):'';
      if(!err && res && res.message) err=String(res.message);
      if(!err) err='No se pudo preparar el link para este cliente.';
      if(/timeout|timed?\s*out|exceeded|deadline/i.test(err))
        return 'Se agotó el tiempo de espera. Minecore AI a veces tarda cerca de 2–3 minutos; volvé a intentar.';
      if(/v125|v124|action|permit|ADMIN|permission/i.test(err))
        return 'El servidor aún no tiene esta función. Pedí actualizar el Motor API (v125).';
      if(/network|fetch|Failed to fetch|conexión|connect/i.test(err))
        return 'No se pudo conectar. Revisá tu conexión e intentá de nuevo.';
      return err;
    }
    MCpost({action:'liqPrepareCliente',cliente:name,user:getUserName(),pin:getPin()})
    .then(function(res){
      if(res&&res.ok&&(res.token||res.url)){
        return afterMin(function(){finishOk(res.token,res.url);});
      }
      var tok=pilotoToken(name);
      if(tok) return afterMin(function(){finishOk(tok,urlFor(tok));});
      return afterMin(function(){finishErr(mapErr(res,false));});
    })
    .catch(function(e){
      var tok=pilotoToken(name);
      if(tok) return afterMin(function(){finishOk(tok,urlFor(tok));});
      var msg=mapErr({error:(e&&e.message)?e.message:String(e||'')}, /timeout|timed?\s*out/i.test(String(e&&e.message||e||'')));
      return afterMin(function(){finishErr(msg);});
    });
  }
  function copy(){
    if(!lastUrl){alert('No hay link todavía.');return;}
    function ok(){try{var b=document.querySelector('#liq-screen .liq-primary');if(b){var t=b.textContent;b.textContent='✓ Copiado';setTimeout(function(){b.textContent=t;},1200);}}catch(e){}}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(lastUrl).then(ok).catch(function(){fallback();ok();});
    } else {fallback();ok();}
  }
  function fallback(){
    var inp=document.getElementById('liq-url-input');
    if(inp){inp.focus();inp.select();try{document.execCommand('copy');}catch(e){}}
    else{prompt('Copia el link:',lastUrl);}
  }
  function open(){
    if(!lastUrl){alert('No hay link todavía.');return;}
    window.open(lastUrl,'_blank','noopener');
  }
  function reload(){loadClientes();}
  function init(){clearAiTimers();busy=false;phase='list';selected=null;lastUrl='';q='';loadClientes();}
  return {init:init,onSearch:onSearch,pick:pick,pickB64:pickB64,copy:copy,open:open,backToList:backToList,reload:reload};
})();

function entrar(res,usr,pin,recordarPin){
  try{
  try{localStorage.setItem('mc_user_name',res.user||usr);}catch(e){}

function doLogin(){
  try{
  if(window._loginBusy)return;
  var usr = document.getElementById('usr').value.trim();
  var pin = document.getElementById('pin').value.trim();
  var err = document.getElementById('loginErr');
  window._loginBusy=true;
  err.style.color='#5a6a7a';
  err.textContent='Verificando...';
  MCpost({action:'ping',user:usr,pin:pin}).then(function(res){
    window._loginBusy=false;
    err.style.color='';
    if(!res.ok){err.textContent=res.error||'Usuario o PIN incorrectos';return;}
    err.textContent='';
    // ¿Activar Face ID?
    if(webauthnAvailable()&&!bioEnabled()&&confirm('¿Activar Face ID / huella para entrar sin PIN en este dispositivo?')){
      try{
      var uid=new Uint8Array(16);crypto.getRandomValues(uid);
      navigator.credentials.create({publicKey:{
        challenge:crypto.getRandomValues(new Uint8Array(32)),
        rp:{name:'Minecore Admin',id:location.hostname},
        user:{id:uid,name:usr,displayName:usr},
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
        timeout:60000
      }}).then(function(cred){
        localStorage.setItem('mc_cred',bufToB64u(cred.rawId));
        localStorage.setItem('mc_bio','1');
        entrar(res,usr,pin,true);
      }).catch(function(){entrar(res,usr,pin,false);});
      }catch(e){entrar(res,usr,pin,false);}
    } else {
      entrar(res,usr,pin,bioEnabled());
    }
  }).catch(function(e){
    window._loginBusy=false;err.style.color='';
    err.textContent=MCerr(e);
  });
  }catch(e){
    window._loginBusy=false;
    var er=document.getElementById('loginErr');
    if(er)er.textContent='Error ('+(e.name||'app')+'): '+(e.message||e);
  }
}
function doBioLogin(){
  if(window._bioBusy)return;           // candado: un solo Face ID a la vez
  var err=document.getElementById('loginErr');
  var credId=localStorage.getItem('mc_cred');
  var pin=getPin();
  var u=getUserName();
  if(!credId||!pin||!u){err.textContent='Face ID no configurado: entra con tu PIN.';return;}
  var credBuf;
  try{credBuf=b64uToBuf(credId);}
  catch(e){
    // credencial guardada corrupta: se elimina sola y queda el PIN
    try{localStorage.removeItem('mc_cred');localStorage.removeItem('mc_bio');}catch(e2){}
    document.getElementById('bioBtn').style.display='none';
    err.textContent='Face ID se reinició en este dispositivo: entra con tu PIN y actívalo de nuevo.';
    return;
  }
  window._bioBusy=true;
  err.style.color='#5a6a7a';
  err.textContent='🔒 Verificando Face ID...';
  navigator.credentials.get({publicKey:{
    challenge:crypto.getRandomValues(new Uint8Array(32)),
    allowCredentials:[{type:'public-key',id:credBuf}],
    userVerification:'required',
    timeout:60000
  }}).then(function(){
    // Cara verificada: entrada INMEDIATA con el perfil guardado; el servidor valida en segundo plano
    window._bioBusy=false;
    err.textContent='';
    var perfil=null;
    try{perfil=JSON.parse(localStorage.getItem('mc_profile')||'null');}catch(e){}
    if(perfil&&perfil.nombre){
      window._pinSesion=pin;
      document.getElementById('login').style.display='none';
      document.getElementById('shell').style.display='block';
      renderHome();
      // Revalidación en segundo plano (por si el PIN cambió o el usuario fue desactivado)
      MCpost({action:'ping',user:u,pin:pin}).then(function(res){
        if(!res.ok){clearCreds();alert('Tu sesión ya no es válida. Ingresa de nuevo.');location.reload();}
        else{try{localStorage.setItem('mc_profile',JSON.stringify({nombre:res.user||u,rol:res.rol||'usuario',modulos:res.modulos||[],empresa:res.empresa||'',master:!!res.master,aprobado:!!res.aprobado,vinculada:res.vinculada!==false}));}catch(e){}}
      }).catch(function(){});
    } else {
      // sin perfil guardado: valida contra el servidor con aviso visible
      err.textContent='Conectando...';
      MCpost({action:'ping',user:u,pin:pin}).then(function(res){
        err.textContent='';
        if(res.ok){entrar(res,u,pin,true);}
        else{err.style.color='';err.textContent='Sesión inválida: entra con tu PIN.';}
      }).catch(function(){err.style.color='';err.textContent='Sin conexión con el servidor.';});
    }
  }).catch(function(){
    window._bioBusy=false;
    err.textContent='';               // canceló Face ID: que use el PIN sin drama
  });
}

  if(!confirm('¿Cerrar tu sesion en este dispositivo? (Se desactivará también Face ID)'))return;
  clearCreds();
  location.reload();
}

function doRedeem(){
  var err=document.getElementById('invErr');
  var nombre=document.getElementById('inv-nombre').value.trim();
  var nombreCompleto=document.getElementById('inv-full').value.trim();
  var email=document.getElementById('inv-mail').value.trim();
  var telefono=document.getElementById('inv-tel').value.trim();
  var cedula=(document.getElementById('inv-cedula')?document.getElementById('inv-cedula').value:'').replace(/[^0-9]/g,'');
  var empresa=document.getElementById('inv-emp').value.trim();
  var pin=document.getElementById('inv-pin').value.replace(/[^0-9]/g,'');
  var pin2=document.getElementById('inv-pin2').value.replace(/[^0-9]/g,'');
  if(nombreCompleto.length<5){err.textContent='Escribe tu nombre completo.';return;}
  if(!nombre){err.textContent='Elige un nombre de usuario corto.';return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)){err.textContent='Escribe un correo válido.';return;}
  if(telefono.replace(/[^0-9]/g,'').length<7){err.textContent='Escribe un teléfono válido.';return;}
  if(cedula.length<6||cedula.length>13){err.textContent='Escribe tu cédula (6 a 13 dígitos).';return;}
  if(pin.length<4||pin.length>8){err.textContent='El PIN debe tener de 4 a 8 dígitos.';return;}
  if(pin!==pin2){err.textContent='Los PIN no coinciden.';return;}
  var token=decodeURIComponent((location.search.match(/[?&]invite=([^&]+)/)||[])[1]||'');
  if(!token){err.textContent='Link de invitación inválido.';return;}
  var btn=window.event&&window.event.target;
  if(window._inviteLockedEmp){empresa=window._inviteLockedEmp;}

  function go(){
    if(btn){btn.disabled=true;btn.textContent='Creando...';}
    MCpost({action:'redeemInvite',token:token,nombre:nombre,userPin:pin,empresa:empresa,empresaConfirm:empresa,nombreCompleto:nombreCompleto,telefono:telefono,email:email,cedula:cedula})
    .then(function(res){
      if(btn){btn.disabled=false;btn.textContent='Crear mi usuario';}
      if(!res.ok){err.textContent=res.error||'No se pudo crear el usuario.';return;}
      alert(res.mensaje||'Usuario creado. Ya puedes ingresar con tu usuario y PIN.');
      location.href=location.origin+location.pathname;
    })
    .catch(function(){
      if(btn){btn.disabled=false;btn.textContent='Crear mi usuario';}
      err.textContent='Sin conexión. Intenta de nuevo.';
    });
  }

  // ¿Ya eligió entre las candidatas? (segundo toque del botón)
  var sel=document.querySelector('input[name="empCand"]:checked');
  if(sel){
    if(sel.value!=='__otra__'){empresa=sel.value;document.getElementById('inv-emp').value=empresa;}
    err.textContent='';
    return go();
  }
  if(!empresa||window._empChecked===empresa){err.textContent='';return go();}

  // Best match: si hay UNA coincidencia clara, se usa sola; si hay empate, se pregunta
  if(btn){btn.disabled=true;btn.textContent='Verificando...';}
  MCpost({action:'matchEmpresa',token:token,empresa:empresa})
  .then(function(res){
    if(btn){btn.disabled=false;btn.textContent='Crear mi usuario';}
    var cand=(res&&res.ok&&res.candidatos)||[];
    if(cand.length===1){
      empresa=cand[0];document.getElementById('inv-emp').value=empresa;
      err.textContent='';return go();
    }
    if(cand.length>=2){
      err.innerHTML='<div style="text-align:left;color:#0b1219;font-size:13px;margin-top:4px"><b>¿Cuál es tu empresa?</b>'+
        cand.map(function(c,i){return '<label style="display:block;margin:5px 0"><input type="radio" name="empCand" value="'+c.replace(/"/g,'&quot;')+'"'+(i===0?' checked':'')+'> '+c+'</label>';}).join('')+
        '<label style="display:block;margin:5px 0"><input type="radio" name="empCand" value="__otra__"> Otra / dejar como lo escribí</label>'+
        '<div style="color:#5a6a7a;font-size:11px">Elige una y vuelve a tocar "Crear mi usuario".</div></div>';
      return;
    }
    window._empChecked=empresa; // sin coincidencias: sigue tal cual (queda por aprobar)
    err.textContent='';go();
  })
  .catch(function(){
    if(btn){btn.disabled=false;btn.textContent='Crear mi usuario';}
    window._empChecked=empresa;err.textContent='';go();
  });
}

if(/[?&]invite=/.test(location.search)){
  document.documentElement.style.background='#fff';
  document.body.style.background='#fff';
  document.getElementById('login').style.display='none';
  document.getElementById('invite').style.display='block';
  (function(){
    var token=decodeURIComponent((location.search.match(/[?&]invite=([^&]+)/)||[])[1]||'');
    if(!token)return;
    var info=document.getElementById('inv-peek-info');
    MCpost({action:'invitePeek',token:token}).then(function(res){
      if(!res||!res.ok){
        if(info)info.textContent=(res&&res.error)||'Invitación no válida';
        return;
      }
      window._inviteLockedEmp=res.locked?res.empresa:'';
      if(info)info.textContent='Invitación '+(res.rol||'')+(res.modulos?' · módulos: '+res.modulos:'');
      var emp=document.getElementById('inv-emp');
      var lock=document.getElementById('inv-emp-locked');
      if(res.locked&&res.empresa){
        if(emp){emp.value=res.empresa;emp.style.display='none';}
        if(lock){lock.style.display='block';lock.textContent='Organización: '+res.empresa+' (fija)';}
      } else {
        if(emp)emp.style.display='block';
        if(lock)lock.style.display='none';
      }
    }).catch(function(){});
  })();
} else { prepararLogin(); }
try{ if(window._mcNeedRebookmark) mcShowUpdateBanner(); }catch(e){}
